[package]
name = "merman-render-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Shared geometry and resource contracts for Merman renderers."
documentation = "https://docs.rs/merman-render-core"
readme = "README.md"
keywords = ["mermaid", "diagrams", "svg", "layout", "geometry"]
categories = ["visualization"]

[package.metadata.merman-legal]
third-party-bundle = true

[features]
default = []
benchmark-stages = ["merman-model?/benchmark-stages"]
css-style = ["dep:cssparser", "dep:merman-markup", "dep:merman-model", "dep:serde_json", "dep:unicode-segmentation"]
error-diagram = ["root-svg", "text-layout"]
euclid-geometry = ["dep:euclid"]
graph-layout = ["dep:kurbo"]
html = ["svg-output", "merman-markup/html"]
icon-registry = ["resources", "dep:quick-xml", "dep:roxmltree", "dep:serde_json"]
icon-svg = ["icon-registry", "html", "svg-parse"]
route-paint = ["dep:kurbo"]
layout-cytoscape = ["resources", "dep:manatee"]
layout-dagre = ["resources", "dep:dugong"]
layout-elk = ["resources", "dep:merman-layout-elk"]
layout-shoal = ["route-paint", "dep:merman-layout-shoal"]
markdown-labels = ["html", "xhtml-labels", "dep:pulldown-cmark"]
math = [
    "math-labels", "dep:kurbo", "dep:quick-xml", "dep:roxmltree",
    "dep:ratex-font", "dep:ratex-layout", "dep:ratex-parser", "dep:ratex-svg", "dep:ratex-types",
    "ratex-svg/embed-fonts",
]
math-labels = ["html", "text-layout", "dep:sha2"]
paint-scene = ["css-style", "svg-output"]
resources = ["dep:merman-model", "dep:thiserror"]
resources-agentflow = ["resources", "merman-model/diagram-agentflow"]
resources-class = ["resources", "merman-model/diagram-class"]
resources-flowchart = ["resources", "merman-model/diagram-flowchart"]
resources-mindmap = ["resources", "merman-model/diagram-mindmap"]
resources-sequence = ["resources", "merman-model/diagram-sequence"]
resources-swimlane = ["resources", "merman-model/diagram-swimlane"]
resources-zenuml = ["resources", "merman-model/diagram-zenuml"]
root-svg = ["svg-output", "css-style"]
rough-svg = ["svg-output", "dep:roughr"]
shoal-bridge = ["graph-layout", "layout-shoal", "svg-output"]
svg-animation = ["svg-output", "dep:roxmltree", "dep:svgtypes"]
svg-bounds = []
svg-edge-parity = ["css-style", "svg-bounds", "svg-output", "dep:kurbo"]
svg-output = ["resources", "dep:memchr", "dep:merman-markup", "dep:ryu-js", "dep:serde_json", "merman-model/compat-json", "merman-model/html-entities"]
svg-parse = ["svg-output", "dep:quick-xml"]
svg-identity = ["svg-parse", "dep:cssparser"]
svg-safety = ["css-style", "html", "svg-parse", "dep:data-url"]
test-support = []
text-layout = ["css-style", "dep:thiserror", "dep:unicode-linebreak", "dep:unicode-width"]
theme-elevation = ["theme-svg", "dep:kurbo"]
theme-label-background = ["theme-svg", "dep:kurbo", "dep:svgtypes"]
theme-svg = ["svg-output", "dep:merman-theme-contract"]
xhtml-labels = ["svg-parse", "text-layout", "dep:roxmltree"]

[dependencies]
cssparser = { workspace = true, optional = true }
data-url = { workspace = true, optional = true }
dugong = { workspace = true, optional = true }
euclid = { workspace = true, optional = true }
kurbo = { workspace = true, optional = true }
memchr = { workspace = true, optional = true }
manatee = { workspace = true, optional = true }
merman-layout-elk = { workspace = true, optional = true }
merman-layout-shoal = { workspace = true, optional = true }
merman-markup = { workspace = true, features = ["color"], optional = true }
merman-model = { workspace = true, features = ["presentation-data"], optional = true }
merman-theme-contract = { workspace = true, optional = true }
pulldown-cmark = { workspace = true, optional = true }
quick-xml = { workspace = true, optional = true }
ratex-font = { workspace = true, optional = true }
ratex-layout = { workspace = true, optional = true }
ratex-parser = { workspace = true, optional = true }
ratex-svg = { workspace = true, optional = true }
ratex-types = { workspace = true, optional = true }
roxmltree = { workspace = true, optional = true }
roughr = { workspace = true, optional = true }
ryu-js = { workspace = true, optional = true }
serde.workspace = true
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
svgtypes = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
unicode-linebreak = { workspace = true, optional = true }
unicode-segmentation = { workspace = true, optional = true }
unicode-width = { workspace = true, optional = true }

[dev-dependencies]
merman-core = { workspace = true, features = ["diagram-flowchart", "diagram-zenuml", "presentation", "test-support"] }
roxmltree.workspace = true
