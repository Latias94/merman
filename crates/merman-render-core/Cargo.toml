[package]
name = "merman-render-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Shared geometry and resource contracts for Merman renderers."
readme = "README.md"

[package.metadata.merman-legal]
third-party-bundle = true

[features]
default = []
route-paint = ["dep:kurbo"]
layout-shoal = ["route-paint", "dep:merman-layout-shoal"]
resources = ["dep:merman-model", "dep:thiserror"]
resources-agentflow = ["resources", "merman-model/diagram-agentflow"]
resources-class = ["resources", "merman-model/diagram-class"]
resources-flowchart = ["resources", "merman-model/diagram-flowchart"]
resources-mindmap = ["resources", "merman-model/diagram-mindmap"]
resources-sequence = ["resources", "merman-model/diagram-sequence"]
resources-swimlane = ["resources", "merman-model/diagram-swimlane"]
resources-zenuml = ["resources", "merman-model/diagram-zenuml"]
test-support = []

[dependencies]
kurbo = { workspace = true, optional = true }
merman-layout-shoal = { workspace = true, optional = true }
merman-model = { workspace = true, features = ["presentation-data"], optional = true }
serde.workspace = true
thiserror = { workspace = true, optional = true }

[dev-dependencies]
merman-core = { workspace = true, features = ["diagram-flowchart", "diagram-zenuml", "presentation", "test-support"] }
