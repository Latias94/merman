[package]
name = "merman-lsp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Language server for Merman diagnostics and completion foundations."
documentation = "https://docs.rs/merman-lsp"
readme = "README.md"
keywords = ["mermaid", "lsp", "language-server", "completion", "diagnostics"]
categories = ["development-tools", "text-editors"]

[package.metadata.dist]
auto-includes = false
default-features = false
include = [
    "../../CHANGELOG.md",
    "../../LICENSE-APACHE",
    "../../LICENSE-MIT",
    "../../THIRD_PARTY_NOTICES.md",
    "../../THIRD_PARTY_LICENSES/",
    "README.md",
]
features = ["all-diagrams", "stdio"]

[package.metadata.merman]
artifact-profile-required = true
fixed-capabilities = ["analysis", "editor"]

[features]
# Diagram selection is independent of output formats and optional layout engines.
all-diagrams = [
    "diagram-agentflow",
    "diagram-architecture",
    "diagram-block",
    "diagram-c4",
    "diagram-class",
    "diagram-cynefin",
    "diagram-er",
    "diagram-event-modeling",
