[package]
name = "merman-lsp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Language server for Merman diagnostics and completion foundations."
documentation = "https://docs.rs/merman-lsp"
readme = "README.md"
keywords = ["mermaid", "lsp", "language-server", "completion", "diagnostics"]
categories = ["development-tools", "text-editors"]

[package.metadata.dist]
auto-includes = false
default-features = false
include = [
    "../../CHANGELOG.md",
    "../../LICENSE-APACHE",
    "../../LICENSE-MIT",
    "../../THIRD_PARTY_NOTICES.md",
    "../../THIRD_PARTY_LICENSES/",
    "README.md",
]
features = ["stdio"]

[package.metadata.merman]
artifact-profile-required = true
fixed-capabilities = ["analysis", "editor"]

[features]
default = []
stdio = [
    "dep:tracing-subscriber",
    "tokio/io-std",
    "tokio/io-util",
    "tokio/macros",
    "tokio/rt-multi-thread",
]

[[bin]]
name = "merman-lsp"
path = "src/main.rs"
required-features = ["stdio"]

[[test]]
name = "stdio_smoke"
path = "tests/stdio_smoke.rs"
required-features = ["stdio"]

[dependencies]
futures = { workspace = true, features = ["std"] }
tower-lsp-server.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
merman-analysis.workspace = true
merman-core.workspace = true
merman-editor-core.workspace = true
ropey.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tower = { version = "0.5.2", default-features = false }
tracing.workspace = true
tracing-subscriber = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "rt-multi-thread", "test-util"] }
tower = { version = "0.5.2", default-features = false, features = ["util"] }
