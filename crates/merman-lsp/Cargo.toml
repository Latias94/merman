[package]
name = "merman-lsp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Language server for Merman diagnostics and completion foundations."
documentation = "https://docs.rs/merman-lsp"
readme = "README.md"
keywords = ["mermaid", "lsp", "language-server", "completion", "diagnostics"]
categories = ["development-tools", "text-editors"]

[package.metadata.dist]
default-features = false
features = ["stdio"]

[package.metadata.merman]
artifact-profile-required = true

[features]
default = []
stdio = [
    "dep:tower",
    "dep:tracing-subscriber",
    "tokio/io-std",
    "tokio/io-util",
    "tokio/macros",
    "tokio/rt-multi-thread",
]
system-clock = [
    "merman-analysis/system-clock",
    "merman-core/system-clock",
    "merman-editor-core/system-clock",
]
system-timezone = [
    "merman-analysis/system-timezone",
    "merman-core/system-timezone",
    "merman-editor-core/system-timezone",
]
system-random = [
    "merman-analysis/system-random",
    "merman-core/system-random",
    "merman-editor-core/system-random",
]
system-timing = [
    "merman-analysis/system-timing",
    "merman-core/system-timing",
    "merman-editor-core/system-timing",
]

[[bin]]
name = "merman-lsp"
path = "src/main.rs"
required-features = ["stdio"]

[[test]]
name = "stdio_smoke"
path = "tests/stdio_smoke.rs"
required-features = ["stdio"]

[dependencies]
futures = { workspace = true, features = ["std"] }
tower-lsp-server.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
merman-analysis.workspace = true
merman-core.workspace = true
merman-editor-core.workspace = true
ropey.workspace = true
serde.workspace = true
serde_json.workspace = true
tower = { version = "0.5.2", default-features = false, optional = true }
tracing.workspace = true
tracing-subscriber = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "rt-multi-thread", "test-util"] }
tower = { version = "0.5.2", default-features = false, features = ["util"] }
