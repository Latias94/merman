stdio = [
    "dep:tracing-subscriber",
    "tokio/io-std",
    "tokio/io-util",
    "tokio/macros",
    "tokio/rt-multi-thread",
]

[[bin]]
name = "merman-lsp"
path = "src/main.rs"
required-features = ["stdio"]

[[test]]
name = "stdio_smoke"
path = "tests/stdio_smoke.rs"
required-features = ["stdio"]

[dependencies]
futures = { workspace = true, features = ["std"] }
tower-lsp-server.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
merman-analysis.workspace = true
merman-core.workspace = true
merman-editor-core.workspace = true
ropey.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tower = { version = "0.5.2", default-features = false }
tracing.workspace = true
tracing-subscriber = { workspace = true, optional = true }
tree-sitter = "=0.26.12"
tree-sitter-mermaid = { path = "../../distribution/tree-sitter-mermaid", version = "0.1.0" }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "rt-multi-thread", "test-util"] }
tower = { version = "0.5.2", default-features = false, features = ["util"] }
