[package]
name = "merman-uniffi"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "UniFFI bindings for merman headless Mermaid rendering."
documentation = "https://docs.rs/merman-uniffi"
readme = "README.md"
keywords = ["mermaid", "diagrams", "uniffi", "svg", "headless"]
categories = ["api-bindings", "visualization"]

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]

[package.metadata.merman]
artifact-profile-required = true

[[example]]
name = "generate_python_package"
required-features = ["binding-generation"]

[[example]]
name = "generate_swift_bindings"
required-features = ["binding-generation"]

[features]
# Diagram selection is independent of output formats and optional layout engines.
all-diagrams = [
    "diagram-architecture",
    "diagram-block",
    "diagram-c4",
    "diagram-class",
    "diagram-cynefin",
    "diagram-er",
    "diagram-event-modeling",
    "diagram-flowchart",
    "diagram-gantt",
    "diagram-git-graph",
    "diagram-info",
    "diagram-ishikawa",
    "diagram-journey",
    "diagram-kanban",
    "diagram-mindmap",
    "diagram-packet",
    "diagram-pie",
    "diagram-quadrant-chart",
    "diagram-radar",
    "diagram-railroad",
    "diagram-requirement",
    "diagram-sankey",
    "diagram-sequence",
    "diagram-state",
    "diagram-swimlane",
    "diagram-timeline",
    "diagram-tree-view",
    "diagram-treemap",
    "diagram-venn",
    "diagram-wardley",
    "diagram-xychart",
    "diagram-zenuml",
]
diagram-architecture = ["merman/diagram-architecture", "merman-bindings-core/diagram-architecture"]
diagram-block = ["merman/diagram-block", "merman-bindings-core/diagram-block"]
diagram-c4 = ["merman/diagram-c4", "merman-bindings-core/diagram-c4"]
diagram-class = ["merman/diagram-class", "merman-bindings-core/diagram-class"]
diagram-cynefin = ["merman/diagram-cynefin", "merman-bindings-core/diagram-cynefin"]
diagram-er = ["merman/diagram-er", "merman-bindings-core/diagram-er"]
diagram-event-modeling = [
    "merman/diagram-event-modeling",
    "merman-bindings-core/diagram-event-modeling",
]
diagram-flowchart = ["merman/diagram-flowchart", "merman-bindings-core/diagram-flowchart"]
diagram-gantt = ["merman/diagram-gantt", "merman-bindings-core/diagram-gantt"]
diagram-git-graph = ["merman/diagram-git-graph", "merman-bindings-core/diagram-git-graph"]
diagram-info = ["merman/diagram-info", "merman-bindings-core/diagram-info"]
diagram-ishikawa = ["merman/diagram-ishikawa", "merman-bindings-core/diagram-ishikawa"]
diagram-journey = ["merman/diagram-journey", "merman-bindings-core/diagram-journey"]
diagram-kanban = ["merman/diagram-kanban", "merman-bindings-core/diagram-kanban"]
diagram-mindmap = ["merman/diagram-mindmap", "merman-bindings-core/diagram-mindmap"]
diagram-packet = ["merman/diagram-packet", "merman-bindings-core/diagram-packet"]
diagram-pie = ["merman/diagram-pie", "merman-bindings-core/diagram-pie"]
diagram-quadrant-chart = [
    "merman/diagram-quadrant-chart",
    "merman-bindings-core/diagram-quadrant-chart",
]
diagram-radar = ["merman/diagram-radar", "merman-bindings-core/diagram-radar"]
diagram-railroad = ["merman/diagram-railroad", "merman-bindings-core/diagram-railroad"]
diagram-requirement = ["merman/diagram-requirement", "merman-bindings-core/diagram-requirement"]
diagram-sankey = ["merman/diagram-sankey", "merman-bindings-core/diagram-sankey"]
diagram-sequence = ["merman/diagram-sequence", "merman-bindings-core/diagram-sequence"]
diagram-state = ["merman/diagram-state", "merman-bindings-core/diagram-state"]
diagram-swimlane = ["merman/diagram-swimlane", "merman-bindings-core/diagram-swimlane"]
diagram-timeline = ["merman/diagram-timeline", "merman-bindings-core/diagram-timeline"]
diagram-tree-view = ["merman/diagram-tree-view", "merman-bindings-core/diagram-tree-view"]
diagram-treemap = ["merman/diagram-treemap", "merman-bindings-core/diagram-treemap"]
diagram-venn = ["merman/diagram-venn", "merman-bindings-core/diagram-venn"]
diagram-wardley = ["merman/diagram-wardley", "merman-bindings-core/diagram-wardley"]
diagram-xychart = ["merman/diagram-xychart", "merman-bindings-core/diagram-xychart"]
diagram-zenuml = ["merman/diagram-zenuml", "merman-bindings-core/diagram-zenuml"]
default = []
native-runtime = ["merman-bindings-core/native-runtime"]
analysis = ["merman-bindings-core/analysis"]
ascii = ["merman-bindings-core/ascii"]
svg = ["merman-bindings-core/svg"]
png = ["svg", "merman-bindings-core/png"]
jpeg = ["svg", "merman-bindings-core/jpeg"]
pdf = ["svg", "merman-bindings-core/pdf"]
layout-cytoscape = ["svg", "merman-bindings-core/layout-cytoscape"]
layout-elk = ["svg", "merman-bindings-core/layout-elk"]
math = ["svg", "merman-bindings-core/math"]
binding-generation = ["uniffi/bindgen", "uniffi/cargo-metadata"]

[dependencies]
merman.workspace = true
merman-bindings-core.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uniffi = { workspace = true, default-features = false }

[dev-dependencies]
merman-ascii-test-contracts = { path = "../merman-ascii-test-contracts" }
tempfile = "3.27.0"
