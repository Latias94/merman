[package]
name = "merman-uniffi"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "UniFFI bindings for merman headless Mermaid rendering."
documentation = "https://docs.rs/merman-uniffi"
readme = "README.md"
keywords = ["mermaid", "diagrams", "uniffi", "svg", "headless"]
categories = ["api-bindings", "visualization"]

[lib]
crate-type = ["cdylib", "rlib"]

[[example]]
name = "generate_python_package"
required-features = ["bindgen-smoke"]

[features]
default = []
system-clock = ["merman-bindings-core/system-clock"]
system-timezone = ["merman-bindings-core/system-timezone"]
system-random = ["merman-bindings-core/system-random"]
system-timing = ["merman-bindings-core/system-timing"]
analysis = ["merman-bindings-core/analysis"]
ascii = ["merman-bindings-core/ascii"]
render = ["merman-bindings-core/render"]
layout-cytoscape = ["merman-bindings-core/layout-cytoscape"]
layout-elk = ["render", "merman-bindings-core/layout-elk"]
math = ["render", "merman-bindings-core/math"]
raster = ["merman-bindings-core/raster"]
bindgen-smoke = ["uniffi/bindgen"]

[dependencies]
merman-bindings-core.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uniffi.workspace = true

[dev-dependencies]
tempfile = "3.27.0"
