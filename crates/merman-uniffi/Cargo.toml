[package]
name = "merman-uniffi"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "UniFFI bindings for merman headless Mermaid rendering."
documentation = "https://docs.rs/merman-uniffi"
readme = "README.md"
keywords = ["mermaid", "diagrams", "uniffi", "svg", "headless"]
categories = ["api-bindings", "visualization"]

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]

[package.metadata.merman]
artifact-profile-required = true

[[example]]
name = "generate_python_package"
required-features = ["binding-generation"]

[[example]]
name = "generate_swift_bindings"
required-features = ["binding-generation"]

[features]
default = []
native-runtime = ["merman-bindings-core/native-runtime"]
analysis = ["merman-bindings-core/analysis"]
ascii = ["merman-bindings-core/ascii"]
svg = ["merman-bindings-core/svg"]
png = ["svg", "merman-bindings-core/png"]
jpeg = ["svg", "merman-bindings-core/jpeg"]
pdf = ["svg", "merman-bindings-core/pdf"]
layout-cytoscape = ["svg", "merman-bindings-core/layout-cytoscape"]
layout-elk = ["svg", "merman-bindings-core/layout-elk"]
math = ["svg", "merman-bindings-core/math"]
binding-generation = ["uniffi/bindgen", "uniffi/cargo-metadata"]

[dependencies]
merman.workspace = true
merman-bindings-core.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uniffi = { workspace = true, default-features = false }

[dev-dependencies]
merman-ascii-test-contracts = { path = "../merman-ascii-test-contracts" }
tempfile = "3.27.0"
