[package]
name = "merman-render-sequence"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Layout and SVG rendering for Merman's Sequence and ZenUML diagrams."
documentation = "https://docs.rs/merman-render-sequence"
readme = "README.md"
keywords = ["mermaid", "diagrams", "svg", "layout", "sequence"]
categories = ["visualization"]

[package.metadata.merman]
wasm-inputs = ["assets/zenuml"]

[package.metadata.merman-legal]
third-party-bundle = true

[features]
default = ["diagram-sequence"]
benchmark-stages = ["merman-model/benchmark-stages"]
diagram-sequence = [
    "merman-core/diagram-sequence",
    "merman-model/diagram-sequence",
    "merman-render-core/math-labels",
    "merman-render-core/resources-sequence",
    "merman-render-core/theme-svg",
]
diagram-zenuml = [
    "cssparser/fast_match_color",
    "dep:kurbo",
    "dep:pulldown-cmark",
    "merman-core/diagram-zenuml",
    "merman-model/diagram-zenuml",
    "merman-render-core/root-svg",
    "merman-render-core/text-layout",
    "merman-render-core/theme-elevation",
]
math = ["svg", "merman-render-core/math"]
native-compact = ["svg", "merman-markup/color", "merman-render-core/paint-scene"]
svg = [
    "dep:kurbo",
    "dep:merman-markup",
    "dep:ryu-js",
    "merman-render-core/root-svg",
    "merman-render-core/theme-elevation",
]

[dependencies]
cssparser.workspace = true
kurbo = { workspace = true, optional = true }
merman-markup = { workspace = true, features = ["url"], optional = true }
merman-model = { workspace = true, features = ["presentation-data"] }
merman-render-core.workspace = true
merman-theme-contract.workspace = true
pulldown-cmark = { workspace = true, optional = true }
rustc-hash.workspace = true
ryu-js = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
merman-core = { workspace = true, features = ["presentation"] }
merman-render-core = { workspace = true, features = ["test-support"] }
merman-theme-contract = { workspace = true, features = ["presets"] }
roxmltree.workspace = true
