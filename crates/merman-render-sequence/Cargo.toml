[package]
name = "merman-render-sequence"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Layout geometry and SVG drawing for Merman's Sequence renderer."
readme = "README.md"

[package.metadata.merman-legal]
third-party-bundle = true

[features]
benchmark-stages = ["merman-model/benchmark-stages"]
math = ["merman-render-core/math"]

[dependencies]
cssparser.workspace = true
merman-model = { workspace = true, features = ["diagram-sequence", "presentation-data"] }
merman-render-core = { workspace = true, features = ["math-labels", "resources-sequence", "theme-svg"] }
merman-theme-contract.workspace = true
rustc-hash.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
merman-core = { workspace = true, features = ["diagram-sequence", "presentation"] }
merman-render-core = { workspace = true, features = ["test-support"] }
