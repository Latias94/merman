[package]
name = "merman-theme-contract"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Versioned authoring and canonical JSON contracts for Merman themes."
documentation = "https://docs.rs/merman-theme-contract"
readme = "README.md"
keywords = ["mermaid", "themes", "json", "contracts"]
categories = ["encoding", "visualization"]

[features]
default = []

[package.metadata.merman]
wasm-inputs = ["assets/presets"]

[dependencies]
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
serde_json_canonicalizer.workspace = true
serde_path_to_error.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
merman-theme-authoring-fixtures = { path = "../merman-theme-authoring-fixtures" }
