[package]
name = "merman-analysis"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Diagnostics-first analysis contracts and source mapping for Merman."
documentation = "https://docs.rs/merman-analysis"
readme = "README.md"
keywords = ["mermaid", "diagnostics", "lint", "lsp", "parser"]
categories = ["parser-implementations", "development-tools"]

[package.metadata.merman]
artifact-profile-required = true
fixed-capabilities = ["analysis"]

[features]
default = []
system-clock = ["merman-core/system-clock"]
system-timezone = ["merman-core/system-timezone"]
system-random = ["merman-core/system-random"]
system-timing = ["merman-core/system-timing"]

[dependencies]
merman-core.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-saphyr = { workspace = true, features = ["serialize"] }
thiserror.workspace = true

[dev-dependencies]
merman-core = { workspace = true, features = ["test-support"] }
