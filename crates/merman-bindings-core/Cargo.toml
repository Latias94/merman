[package]
name = "merman-bindings-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Safe shared binding facade for merman native bindings."
documentation = "https://docs.rs/merman-bindings-core"
readme = "README.md"
keywords = ["mermaid", "diagrams", "bindings", "svg", "headless"]
categories = ["api-bindings", "visualization"]

[package.metadata.merman]
artifact-profile-required = true

[features]
default = []
native-runtime = [
    "merman/system-clock",
    "merman/system-timezone",
    "merman/system-random",
    "merman-analysis?/system-clock",
    "merman-analysis?/system-timezone",
    "merman-analysis?/system-random",
]
analysis = ["dep:merman-analysis"]
ascii = ["merman/ascii"]
svg = ["merman/svg"]
png = ["svg", "merman/png"]
jpeg = ["svg", "merman/jpeg"]
pdf = ["svg", "merman/pdf"]
layout-cytoscape = ["svg", "merman/layout-cytoscape"]
layout-elk = ["svg", "merman/layout-elk"]
math = ["svg", "merman/math"]

[dependencies]
merman-analysis = { workspace = true, optional = true }
merman.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }

[dev-dependencies]
criterion = "0.8.2"
roxmltree.workspace = true
sha2.workspace = true

[[bench]]
name = "request_overlay"
harness = false
required-features = ["analysis", "ascii", "svg"]

[[bench]]
name = "request_overlay_memory"
harness = false
required-features = ["analysis", "ascii", "svg"]
