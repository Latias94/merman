[package]
name = "merman-bindings-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Safe shared binding facade for merman native bindings."
documentation = "https://docs.rs/merman-bindings-core"
readme = "README.md"
keywords = ["mermaid", "diagrams", "bindings", "svg", "headless"]
categories = ["api-bindings", "visualization"]

[package.metadata.merman]
artifact-profile-required = true

[features]
# Diagram selection is independent of output formats and optional layout engines.
all-diagrams = [
    "diagram-agentflow",
    "diagram-architecture",
    "diagram-block",
    "diagram-c4",
    "diagram-class",
    "diagram-cynefin",
    "diagram-er",
    "diagram-event-modeling",
    "diagram-flowchart",
    "diagram-gantt",
    "diagram-git-graph",
    "diagram-info",
    "diagram-ishikawa",
    "diagram-journey",
    "diagram-kanban",
    "diagram-mindmap",
    "diagram-packet",
    "diagram-pie",
    "diagram-quadrant-chart",
    "diagram-radar",
    "diagram-railroad",
    "diagram-requirement",
    "diagram-sankey",
    "diagram-sequence",
    "diagram-state",
    "diagram-swimlane",
    "diagram-timeline",
    "diagram-tree-view",
    "diagram-treemap",
    "diagram-usecase",
    "diagram-venn",
    "diagram-wardley",
    "diagram-xychart",
    "diagram-zenuml",
]
diagram-architecture = ["merman-analysis?/diagram-architecture", "merman/diagram-architecture"]
diagram-block = ["merman-analysis?/diagram-block", "merman/diagram-block"]
diagram-c4 = ["merman-analysis?/diagram-c4", "merman/diagram-c4"]
diagram-class = ["merman-analysis?/diagram-class", "merman/diagram-class"]
diagram-cynefin = ["merman-analysis?/diagram-cynefin", "merman/diagram-cynefin"]
diagram-er = ["merman-analysis?/diagram-er", "merman/diagram-er"]
diagram-event-modeling = [
    "merman-analysis?/diagram-event-modeling",
    "merman/diagram-event-modeling",
]
diagram-agentflow = ["merman-analysis?/diagram-agentflow", "merman/diagram-agentflow"]
diagram-usecase = ["merman-analysis?/diagram-usecase", "merman/diagram-usecase"]
diagram-flowchart = ["merman-analysis?/diagram-flowchart", "merman/diagram-flowchart"]
diagram-gantt = ["merman-analysis?/diagram-gantt", "merman/diagram-gantt"]
diagram-git-graph = ["merman-analysis?/diagram-git-graph", "merman/diagram-git-graph"]
diagram-info = ["merman-analysis?/diagram-info", "merman/diagram-info"]
diagram-ishikawa = ["merman-analysis?/diagram-ishikawa", "merman/diagram-ishikawa"]
diagram-journey = ["merman-analysis?/diagram-journey", "merman/diagram-journey"]
diagram-kanban = ["merman-analysis?/diagram-kanban", "merman/diagram-kanban"]
diagram-mindmap = ["merman-analysis?/diagram-mindmap", "merman/diagram-mindmap"]
diagram-packet = ["merman-analysis?/diagram-packet", "merman/diagram-packet"]
diagram-pie = ["merman-analysis?/diagram-pie", "merman/diagram-pie"]
diagram-quadrant-chart = [
    "merman-analysis?/diagram-quadrant-chart",
    "merman/diagram-quadrant-chart",
]
diagram-radar = ["merman-analysis?/diagram-radar", "merman/diagram-radar"]
diagram-railroad = ["merman-analysis?/diagram-railroad", "merman/diagram-railroad"]
diagram-requirement = ["merman-analysis?/diagram-requirement", "merman/diagram-requirement"]
diagram-sankey = ["merman-analysis?/diagram-sankey", "merman/diagram-sankey"]
diagram-sequence = ["merman-analysis?/diagram-sequence", "merman/diagram-sequence"]
diagram-state = ["merman-analysis?/diagram-state", "merman/diagram-state"]
diagram-swimlane = ["merman-analysis?/diagram-swimlane", "merman/diagram-swimlane"]
diagram-timeline = ["merman-analysis?/diagram-timeline", "merman/diagram-timeline"]
diagram-tree-view = ["merman-analysis?/diagram-tree-view", "merman/diagram-tree-view"]
diagram-treemap = ["merman-analysis?/diagram-treemap", "merman/diagram-treemap"]
diagram-venn = ["merman-analysis?/diagram-venn", "merman/diagram-venn"]
diagram-wardley = ["merman-analysis?/diagram-wardley", "merman/diagram-wardley"]
diagram-xychart = ["merman-analysis?/diagram-xychart", "merman/diagram-xychart"]
diagram-zenuml = ["merman-analysis?/diagram-zenuml", "merman/diagram-zenuml"]
default = []
native-runtime = [
    "merman/system-clock",
    "merman/system-timezone",
    "merman/system-random",
    "merman-analysis?/system-clock",
    "merman-analysis?/system-timezone",
    "merman-analysis?/system-random",
]
analysis = ["dep:merman-analysis"]
ascii = ["merman/ascii"]
svg = ["dep:merman-theme-contract", "merman/svg"]
png = ["svg", "merman/png"]
jpeg = ["svg", "merman/jpeg"]
pdf = ["svg", "merman/pdf"]
layout-cytoscape = ["svg", "merman/layout-cytoscape"]
layout-elk = ["svg", "merman/layout-elk"]
math = ["svg", "merman/math"]

[dependencies]
merman-analysis = { workspace = true, optional = true }
merman.workspace = true
merman-theme-contract = { workspace = true, optional = true }
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order", "raw_value"] }

[dev-dependencies]
data-encoding.workspace = true
criterion = "0.8.2"
merman-ascii-test-contracts = { path = "../merman-ascii-test-contracts" }
merman-core.workspace = true
merman-render.workspace = true
merman-theme-authoring-fixtures = { path = "../merman-theme-authoring-fixtures" }
roxmltree.workspace = true
sha2.workspace = true

[[bench]]
name = "request_overlay"
harness = false
required-features = ["analysis", "ascii", "svg"]

[[bench]]
name = "request_overlay_memory"
harness = false
required-features = ["analysis", "ascii", "svg"]

[[bench]]
name = "theme_operations"
harness = false
required-features = ["svg"]
