[package]
name = "merman-bindings-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Safe shared binding facade for merman native bindings."
documentation = "https://docs.rs/merman-bindings-core"
readme = "README.md"
keywords = ["mermaid", "diagrams", "bindings", "svg", "headless"]
categories = ["api-bindings", "visualization"]

[features]
default = []
system-clock = ["merman/system-clock", "merman-analysis?/system-clock"]
system-timezone = ["merman/system-timezone", "merman-analysis?/system-timezone"]
system-random = ["merman/system-random", "merman-analysis?/system-random"]
system-timing = ["merman/system-timing", "merman-analysis?/system-timing"]
analysis = ["dep:merman-analysis"]
ascii = ["merman/ascii"]
render = ["merman/render"]
editor-language = ["analysis"]
cytoscape-layout = ["render", "merman/cytoscape-layout"]
elk-layout = ["render", "merman/elk-layout"]
ratex-math = ["render", "dep:merman-render", "merman-render/ratex-math"]
raster = ["merman/raster"]

[dependencies]
chrono.workspace = true
merman-analysis = { workspace = true, optional = true }
merman.workspace = true
merman-render = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
roxmltree.workspace = true
