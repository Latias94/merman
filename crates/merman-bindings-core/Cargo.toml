[package]
name = "merman-bindings-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Safe shared binding facade for merman native bindings."
documentation = "https://docs.rs/merman-bindings-core"
readme = "README.md"
keywords = ["mermaid", "diagrams", "bindings", "svg", "headless"]
categories = ["api-bindings", "visualization"]

[package.metadata.merman]
artifact-profile-required = true

[features]
default = []
system-clock = ["merman/system-clock", "merman-analysis?/system-clock"]
system-timezone = ["merman/system-timezone", "merman-analysis?/system-timezone"]
system-random = ["merman/system-random", "merman-analysis?/system-random"]
analysis = ["dep:merman-analysis"]
ascii = ["merman/ascii"]
svg = ["merman/svg"]
png = ["svg", "merman/png"]
jpeg = ["svg", "merman/jpeg"]
pdf = ["svg", "merman/pdf"]
layout-cytoscape = ["svg", "merman/layout-cytoscape"]
layout-elk = ["svg", "merman/layout-elk"]
math = ["svg", "merman/math"]

[dependencies]
chrono.workspace = true
merman-analysis = { workspace = true, optional = true }
merman.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
criterion = "0.8.2"
roxmltree.workspace = true

[[bench]]
name = "request_overlay"
harness = false
required-features = ["analysis", "ascii", "svg"]
