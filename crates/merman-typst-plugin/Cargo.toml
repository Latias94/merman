[package]
name = "merman-typst-plugin"
version.workspace = true
edition = "2021"
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Typst WebAssembly plugin bridge for merman SVG rendering."
documentation = "https://docs.rs/merman-typst-plugin"
readme = "README.md"
keywords = ["mermaid", "typst", "wasm", "svg", "plugin"]
categories = ["wasm", "visualization"]

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.merman]
artifact-profile-required = true

[features]
default = []
analysis = ["merman-bindings-core/analysis"]
svg = ["merman-bindings-core/svg"]
layout-cytoscape = ["svg", "merman-bindings-core/layout-cytoscape"]
layout-elk = ["svg", "merman-bindings-core/layout-elk"]

[dependencies]
merman-bindings-core.workspace = true
serde_json.workspace = true
wasm-minimal-protocol.workspace = true
