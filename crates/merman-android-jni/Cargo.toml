[package]
name = "merman-android-jni"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Internal Android JNI transport for merman."

[lib]
crate-type = ["cdylib"]

[package.metadata.merman]
artifact-profile-required = true

[features]
# Diagram selection is independent of output formats and optional layout engines.
all-diagrams = [
    "diagram-agentflow",
    "diagram-architecture",
    "diagram-block",
    "diagram-c4",
    "diagram-class",
    "diagram-cynefin",
    "diagram-er",
    "diagram-event-modeling",
    "diagram-flowchart",
    "diagram-gantt",
    "diagram-git-graph",
    "diagram-info",
    "diagram-ishikawa",
    "diagram-journey",
    "diagram-kanban",
    "diagram-mindmap",
    "diagram-packet",
    "diagram-pie",
    "diagram-quadrant-chart",
    "diagram-radar",
    "diagram-railroad",
    "diagram-requirement",
    "diagram-sankey",
    "diagram-sequence",
    "diagram-state",
    "diagram-swimlane",
    "diagram-timeline",
    "diagram-tree-view",
    "diagram-treemap",
    "diagram-usecase",
    "diagram-venn",
    "diagram-wardley",
    "diagram-xychart",
    "diagram-zenuml",
]
diagram-architecture = ["merman-bindings-core/diagram-architecture"]
diagram-block = ["merman-bindings-core/diagram-block"]
diagram-c4 = ["merman-bindings-core/diagram-c4"]
diagram-class = ["merman-bindings-core/diagram-class"]
diagram-cynefin = ["merman-bindings-core/diagram-cynefin"]
diagram-er = ["merman-bindings-core/diagram-er"]
diagram-event-modeling = ["merman-bindings-core/diagram-event-modeling"]
diagram-agentflow = ["merman-bindings-core/diagram-agentflow"]
diagram-usecase = ["merman-bindings-core/diagram-usecase"]
diagram-flowchart = ["merman-bindings-core/diagram-flowchart"]
diagram-gantt = ["merman-bindings-core/diagram-gantt"]
diagram-git-graph = ["merman-bindings-core/diagram-git-graph"]
diagram-info = ["merman-bindings-core/diagram-info"]
diagram-ishikawa = ["merman-bindings-core/diagram-ishikawa"]
diagram-journey = ["merman-bindings-core/diagram-journey"]
diagram-kanban = ["merman-bindings-core/diagram-kanban"]
diagram-mindmap = ["merman-bindings-core/diagram-mindmap"]
diagram-packet = ["merman-bindings-core/diagram-packet"]
diagram-pie = ["merman-bindings-core/diagram-pie"]
diagram-quadrant-chart = ["merman-bindings-core/diagram-quadrant-chart"]
diagram-radar = ["merman-bindings-core/diagram-radar"]
diagram-railroad = ["merman-bindings-core/diagram-railroad"]
diagram-requirement = ["merman-bindings-core/diagram-requirement"]
diagram-sankey = ["merman-bindings-core/diagram-sankey"]
diagram-sequence = ["merman-bindings-core/diagram-sequence"]
diagram-state = ["merman-bindings-core/diagram-state"]
diagram-swimlane = ["merman-bindings-core/diagram-swimlane"]
diagram-timeline = ["merman-bindings-core/diagram-timeline"]
diagram-tree-view = ["merman-bindings-core/diagram-tree-view"]
diagram-treemap = ["merman-bindings-core/diagram-treemap"]
diagram-venn = ["merman-bindings-core/diagram-venn"]
diagram-wardley = ["merman-bindings-core/diagram-wardley"]
diagram-xychart = ["merman-bindings-core/diagram-xychart"]
diagram-zenuml = ["merman-bindings-core/diagram-zenuml"]
default = []
native-runtime = ["merman-bindings-core/native-runtime"]
analysis = ["merman-bindings-core/analysis"]
ascii = ["merman-bindings-core/ascii"]
svg = ["merman-bindings-core/svg"]
png = ["svg", "merman-bindings-core/png"]
jpeg = ["svg", "merman-bindings-core/jpeg"]
pdf = ["svg", "merman-bindings-core/pdf"]
layout-cytoscape = ["svg", "merman-bindings-core/layout-cytoscape"]
layout-elk = ["svg", "merman-bindings-core/layout-elk"]
math = ["svg", "merman-bindings-core/math"]

[dependencies]
merman-bindings-core.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.22.4", default-features = false }
simd_cesu8 = "1.2.0"
