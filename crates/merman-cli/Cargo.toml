[package]
name = "merman-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "CLI to parse/layout/render Mermaid diagrams to SVG/PNG/JPG/PDF/ASCII/Unicode (headless)."
documentation = "https://docs.rs/merman-cli"
readme = "README.md"
keywords = ["mermaid", "diagrams", "svg", "cli", "headless"]
categories = ["command-line-utilities", "visualization"]
exclude = ["tests/**"]

[features]
default = ["math", "ascii", "layout-cytoscape", "layout-elk"]
ascii = ["merman/ascii"]
layout-cytoscape = ["merman/layout-cytoscape"]
layout-elk = ["merman/layout-elk"]
math = ["merman/math"]

[dependencies]
clap.workspace = true
clap_complete.workspace = true
chrono.workspace = true
merman = { workspace = true, features = ["system-clock", "system-timezone", "system-random", "system-timing", "raster"] }
merman-analysis.workspace = true
rayon.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
assert_cmd = "2.2.2"
tempfile = "3.27.0"
png.workspace = true
roxmltree.workspace = true
