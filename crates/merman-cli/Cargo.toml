[package]
name = "merman-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "CLI to parse/layout/render Mermaid diagrams to SVG/PNG/JPG/PDF/ASCII/Unicode (headless)."
documentation = "https://docs.rs/merman-cli"
readme = "README.md"
keywords = ["mermaid", "diagrams", "svg", "cli", "headless"]
categories = ["command-line-utilities", "visualization"]
exclude = ["tests/**"]

[package.metadata.dist]
default-features = false
features = [
    "analysis",
    "ascii",
    "icons",
    "jpeg",
    "layout-cytoscape",
    "layout-elk",
    "markdown",
    "math",
    "network-icons",
    "parallel-markdown",
    "pdf",
    "png",
    "shell-completions",
    "svg",
    "system-clock",
    "system-random",
    "system-timezone",
    "system-timing",
]

[package.metadata.merman]
artifact-profile-required = true

[features]
default = [
    "analysis",
    "ascii",
    "icons",
    "jpeg",
    "layout-cytoscape",
    "layout-elk",
    "markdown",
    "math",
    "network-icons",
    "parallel-markdown",
    "pdf",
    "png",
    "shell-completions",
    "svg",
    "system-clock",
    "system-random",
    "system-timezone",
    "system-timing",
]

# Public leaves describe observable CLI capabilities. Keep them additive: exact
# absence claims belong to a `default-features = false` artifact profile.
analysis = [
    "dep:atomic-write-file",
    "dep:merman-analysis",
    "dep:same-file",
    "dep:sha2",
    "dep:similar",
    "dep:windows-sys",
]
svg = ["dep:atomic-write-file", "dep:same-file", "dep:windows-sys", "merman/svg"]
ascii = ["dep:atomic-write-file", "dep:same-file", "dep:windows-sys", "merman/ascii"]
png = ["svg", "merman/png"]
jpeg = ["svg", "merman/jpeg"]
pdf = ["svg", "merman/pdf"]
layout-cytoscape = ["svg", "merman/layout-cytoscape"]
layout-elk = ["svg", "merman/layout-elk"]
math = ["svg", "merman/math"]
system-clock = ["merman/system-clock", "merman-analysis?/system-clock"]
system-timezone = ["merman/system-timezone", "merman-analysis?/system-timezone"]
system-random = ["merman/system-random", "merman-analysis?/system-random"]
system-timing = ["merman/system-timing", "merman-analysis?/system-timing"]

# Tool leaves own both their user-visible surface and their direct dependency.
icons = ["svg", "dep:url"]
markdown = ["svg", "dep:atomic-write-file", "dep:same-file", "dep:unicode-normalization"]
network-icons = ["icons", "dep:hickory-resolver", "dep:reqwest", "dep:tokio"]
parallel-markdown = ["markdown", "dep:rayon"]
shell-completions = ["dep:clap_complete"]


[dependencies]
atomic-write-file = { workspace = true, optional = true }
clap.workspace = true
clap_complete = { workspace = true, optional = true }
chrono.workspace = true
hickory-resolver = { workspace = true, optional = true }
merman = { workspace = true, default-features = false }
merman-analysis = { workspace = true, optional = true, default-features = false }
rayon = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
same-file = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
similar = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, optional = true, features = ["rt", "time"] }
url = { workspace = true, optional = true }
unicode-normalization = { workspace = true, optional = true }

[dev-dependencies]
assert_cmd = "2.2.2"
png.workspace = true
roxmltree.workspace = true
tempfile = "3.27.0"

[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, optional = true }

[[test]]
name = "cli_compat"
required-features = [
    "analysis",
    "svg",
    "ascii",
    "png",
    "jpeg",
    "pdf",
    "layout-cytoscape",
    "layout-elk",
    "math",
    "icons",
    "markdown",
    "network-icons",
    "parallel-markdown",
    "shell-completions",
]

[[test]]
name = "cli_contract"
required-features = [
    "analysis",
    "svg",
    "ascii",
    "png",
    "jpeg",
    "pdf",
    "layout-cytoscape",
    "layout-elk",
    "math",
    "icons",
    "markdown",
    "network-icons",
    "parallel-markdown",
    "shell-completions",
]

[[test]]
name = "process_contract"
required-features = [
    "analysis",
    "svg",
    "ascii",
    "png",
    "jpeg",
    "pdf",
    "layout-cytoscape",
    "layout-elk",
    "math",
    "icons",
    "markdown",
    "network-icons",
    "parallel-markdown",
    "shell-completions",
]

[[test]]
name = "resource_limits"
required-features = [
    "analysis",
    "svg",
    "png",
    "icons",
    "markdown",
    "network-icons",
    "parallel-markdown",
]

[[test]]
name = "output_integrity"
required-features = [
    "analysis",
    "svg",
    "icons",
    "markdown",
    "network-icons",
    "parallel-markdown",
]

[[test]]
name = "ascii_smoke"
required-features = ["ascii"]

[[test]]
name = "svg_smoke"
required-features = ["svg"]

[[test]]
name = "fix_cli"
required-features = ["analysis"]

[[test]]
name = "markdown_scanner"
required-features = ["markdown"]

[[test]]
name = "jpeg_smoke"
required-features = ["jpeg"]

[[test]]
name = "pdf_smoke"
required-features = ["pdf"]

[[test]]
name = "png_smoke"
required-features = ["png"]

[[test]]
name = "ratex_math"
required-features = ["math"]
