[package]
name = "merman-editor-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Protocol-neutral editor intelligence core for Merman."
documentation = "https://docs.rs/merman-editor-core"
readme = "README.md"
keywords = ["mermaid", "editor", "language-tools", "diagnostics"]
categories = ["development-tools", "text-editors"]

[package.metadata.merman]
artifact-profile-required = true
fixed-capabilities = ["analysis", "editor"]

[features]
# Diagram selection is independent of output formats and optional layout engines.
all-diagrams = [
    "diagram-agentflow",
    "diagram-architecture",
    "diagram-block",
    "diagram-c4",
    "diagram-class",
    "diagram-cynefin",
    "diagram-er",
    "diagram-event-modeling",
    "diagram-flowchart",
    "diagram-gantt",
    "diagram-git-graph",
    "diagram-info",
    "diagram-ishikawa",
    "diagram-journey",
    "diagram-kanban",
    "diagram-mindmap",
    "diagram-packet",
    "diagram-pie",
    "diagram-quadrant-chart",
    "diagram-radar",
    "diagram-railroad",
    "diagram-requirement",
    "diagram-sankey",
    "diagram-sequence",
    "diagram-state",
    "diagram-swimlane",
    "diagram-timeline",
    "diagram-tree-view",
    "diagram-treemap",
    "diagram-usecase",
    "diagram-venn",
    "diagram-wardley",
    "diagram-xychart",
    "diagram-zenuml",
]
diagram-architecture = ["merman-analysis/diagram-architecture", "merman-core/diagram-architecture"]
diagram-block = ["merman-analysis/diagram-block", "merman-core/diagram-block"]
diagram-c4 = ["merman-analysis/diagram-c4", "merman-core/diagram-c4"]
diagram-class = ["merman-analysis/diagram-class", "merman-core/diagram-class"]
diagram-cynefin = ["merman-analysis/diagram-cynefin", "merman-core/diagram-cynefin"]
diagram-er = ["merman-analysis/diagram-er", "merman-core/diagram-er"]
diagram-event-modeling = [
    "merman-analysis/diagram-event-modeling",
    "merman-core/diagram-event-modeling",
]
diagram-agentflow = ["merman-analysis/diagram-agentflow", "merman-core/diagram-agentflow"]
diagram-usecase = ["merman-analysis/diagram-usecase", "merman-core/diagram-usecase"]
diagram-flowchart = ["merman-analysis/diagram-flowchart", "merman-core/diagram-flowchart"]
diagram-gantt = ["merman-analysis/diagram-gantt", "merman-core/diagram-gantt"]
diagram-git-graph = ["merman-analysis/diagram-git-graph", "merman-core/diagram-git-graph"]
diagram-info = ["merman-analysis/diagram-info", "merman-core/diagram-info"]
diagram-ishikawa = ["merman-analysis/diagram-ishikawa", "merman-core/diagram-ishikawa"]
diagram-journey = ["merman-analysis/diagram-journey", "merman-core/diagram-journey"]
diagram-kanban = ["merman-analysis/diagram-kanban", "merman-core/diagram-kanban"]
diagram-mindmap = ["merman-analysis/diagram-mindmap", "merman-core/diagram-mindmap"]
diagram-packet = ["merman-analysis/diagram-packet", "merman-core/diagram-packet"]
diagram-pie = ["merman-analysis/diagram-pie", "merman-core/diagram-pie"]
diagram-quadrant-chart = [
    "merman-analysis/diagram-quadrant-chart",
    "merman-core/diagram-quadrant-chart",
]
diagram-radar = ["merman-analysis/diagram-radar", "merman-core/diagram-radar"]
diagram-railroad = ["merman-analysis/diagram-railroad", "merman-core/diagram-railroad"]
diagram-requirement = ["merman-analysis/diagram-requirement", "merman-core/diagram-requirement"]
diagram-sankey = ["merman-analysis/diagram-sankey", "merman-core/diagram-sankey"]
diagram-sequence = ["merman-analysis/diagram-sequence", "merman-core/diagram-sequence"]
diagram-state = ["merman-analysis/diagram-state", "merman-core/diagram-state"]
diagram-swimlane = ["merman-analysis/diagram-swimlane", "merman-core/diagram-swimlane"]
diagram-timeline = ["merman-analysis/diagram-timeline", "merman-core/diagram-timeline"]
diagram-tree-view = ["merman-analysis/diagram-tree-view", "merman-core/diagram-tree-view"]
diagram-treemap = ["merman-analysis/diagram-treemap", "merman-core/diagram-treemap"]
diagram-venn = ["merman-analysis/diagram-venn", "merman-core/diagram-venn"]
diagram-wardley = ["merman-analysis/diagram-wardley", "merman-core/diagram-wardley"]
diagram-xychart = ["merman-analysis/diagram-xychart", "merman-core/diagram-xychart"]
diagram-zenuml = ["merman-analysis/diagram-zenuml", "merman-core/diagram-zenuml"]
