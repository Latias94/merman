[package]
name = "merman-wasm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "WebAssembly bindings for merman browser rendering."
documentation = "https://docs.rs/merman-wasm"
readme = "README.md"
keywords = ["mermaid", "diagrams", "wasm", "svg", "headless"]
categories = ["wasm", "visualization"]

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.merman]
artifact-profile-required = true

[package.metadata.wasm-pack.profile.custom.wasm-bindgen]
omit-default-module-path = true

[features]
# Diagram selection is independent of output formats and optional layout engines.
all-diagrams = [
    "diagram-agentflow",
    "diagram-architecture",
    "diagram-block",
    "diagram-c4",
    "diagram-class",
    "diagram-cynefin",
    "diagram-er",
    "diagram-event-modeling",
    "diagram-flowchart",
    "diagram-gantt",
    "diagram-git-graph",
    "diagram-info",
    "diagram-ishikawa",
    "diagram-journey",
    "diagram-kanban",
    "diagram-mindmap",
    "diagram-packet",
    "diagram-pie",
    "diagram-quadrant-chart",
    "diagram-radar",
    "diagram-railroad",
    "diagram-requirement",
    "diagram-sankey",
