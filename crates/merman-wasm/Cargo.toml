[package]
name = "merman-wasm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "WebAssembly bindings for merman browser rendering."
documentation = "https://docs.rs/merman-wasm"
readme = "README.md"
keywords = ["mermaid", "diagrams", "wasm", "svg", "headless"]
categories = ["wasm", "visualization"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
analysis = ["merman-bindings-core/analysis"]
ascii = ["merman-bindings-core/ascii"]
render = ["merman-bindings-core/render"]
layout-cytoscape = ["merman-bindings-core/layout-cytoscape"]
layout-elk = ["merman-bindings-core/layout-elk"]
editor-language = [
  "analysis",
  "dep:merman-analysis",
  "dep:merman-editor-core",
  "merman-bindings-core/editor-language",
]
math = ["render", "merman-bindings-core/math"]

[dependencies]
console_error_panic_hook.workspace = true
js-sys.workspace = true
merman-analysis = { workspace = true, optional = true }
merman-bindings-core.workspace = true
merman-editor-core = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
serde-wasm-bindgen.workspace = true
wasm-bindgen.workspace = true
