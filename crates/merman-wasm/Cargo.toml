default = []
analysis = ["merman-bindings-core/analysis"]
ascii = ["merman-bindings-core/ascii"]
svg = ["dep:js-sys", "merman-bindings-core/svg"]
layout-cytoscape = ["svg", "merman-bindings-core/layout-cytoscape"]
layout-elk = ["svg", "merman-bindings-core/layout-elk"]
editor = [
    "analysis",
    "dep:merman-analysis",
    "dep:merman-editor-core",
]
math = ["svg", "merman-bindings-core/math"]

[dependencies]
console_error_panic_hook.workspace = true
merman-analysis = { workspace = true, optional = true }
merman-bindings-core.workspace = true
merman-core = { workspace = true, features = ["operation-deadlines"] }
merman-editor-core = { workspace = true, optional = true }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
serde-wasm-bindgen.workspace = true
wasm-bindgen.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true, optional = true }

[dev-dependencies]
merman-ascii-test-contracts = { path = "../merman-ascii-test-contracts" }
