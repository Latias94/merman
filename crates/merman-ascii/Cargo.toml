[package]
name = "merman-ascii"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Terminal-friendly ASCII and Unicode renderer for Mermaid typed models."
documentation = "https://docs.rs/merman-ascii"
readme = "README.md"
keywords = ["mermaid", "diagrams", "ascii", "unicode", "headless"]
categories = ["visualization", "command-line-utilities"]

[features]
default = []
system-clock = ["merman-core/system-clock"]
system-timezone = ["merman-core/system-timezone"]
system-random = ["merman-core/system-random"]
system-timing = ["merman-core/system-timing"]

[dependencies]
chrono.workspace = true
merman-core.workspace = true
thiserror.workspace = true
unicode-width.workspace = true
