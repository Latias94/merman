[package]
name = "xtask"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["contracts"]
contracts = []
render-parity = [
    "dep:merman-render",
    "merman/svg",
    "merman-bindings-core/export-resource-metadata",
    "merman-bindings-core/layout-cytoscape",
    "merman-bindings-core/layout-dagre",
    "merman-bindings-core/layout-elk",
    "merman-bindings-core/math",
    "merman-bindings-core/svg",
]
wasm-host = ["dep:wasmi"]

[dependencies]
base64.workspace = true
brotli.workspace = true
cssparser.workspace = true
flate2.workspace = true
fs2.workspace = true
futures = { workspace = true, features = ["executor"] }
merman = { path = "../merman", default-features = false, features = ["all-diagrams", "compat-json"] }
merman-analysis = { workspace = true, features = ["all-diagrams"] }
merman-bindings-core = { workspace = true, features = [
    "all-diagrams",
    "analysis",
    "ascii",
    "fixes",
    "native-runtime",
] }
merman-core = { path = "../merman-core", features = ["all-diagrams", "system-clock", "system-timezone", "presentation", "compat-json", "editor-facts"] }
merman-fixture-render-context = { path = "../merman-fixture-render-context" }
merman-render = { workspace = true, optional = true, features = [
    "all-diagrams",
    "layout-cytoscape",
    "layout-dagre",
    "layout-elk",
] }
merman-typst-plugin = { path = "../merman-typst-plugin", default-features = false, features = ["all-diagrams"] }
regex.workspace = true
roxmltree.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-saphyr = { workspace = true, features = ["deserialize", "serialize"] }
svgtypes.workspace = true
sha2.workspace = true
thiserror.workspace = true
tempfile = "3.27.0"
toml.workspace = true
wasmi = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }
