[package]
name = "merman-node-candidate"
version = "0.8.0-alpha.3"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT OR Apache-2.0"
description = "Private Node/SSG transport candidates for Merman admission testing."

[lib]
name = "merman_node"
crate-type = ["cdylib", "rlib"]

[features]
default = []
svg = ["merman-bindings-core/svg"]
layout-cytoscape = ["svg", "merman-bindings-core/layout-cytoscape"]
layout-elk = ["svg", "merman-bindings-core/layout-elk"]
math = ["svg", "merman-bindings-core/math"]
transport-napi = ["dep:napi", "dep:napi-derive"]
transport-wasm = ["dep:serde-wasm-bindgen", "dep:wasm-bindgen"]

[dependencies]
merman-bindings-core = { path = "../merman-bindings-core", default-features = false }
napi = { version = "=3.11.0", default-features = false, features = ["napi8", "dyn-symbols"], optional = true }
napi-derive = { version = "=3.6.0", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["preserve_order"] }
serde-wasm-bindgen = { version = "0.6.5", optional = true }
wasm-bindgen = { version = "0.2.126", optional = true }

[build-dependencies]
napi-build = "=2.3.2"

# Keep the candidate outside the root workspace until U14 has comparative evidence.
[workspace]
resolver = "2"
