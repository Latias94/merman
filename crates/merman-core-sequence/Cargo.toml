[package]
name = "merman-core-sequence"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Syntax and semantic model construction for Merman's sequence diagrams."
documentation = "https://docs.rs/merman-core-sequence"
readme = "README.md"
keywords = ["mermaid", "diagrams", "parser", "sequence"]
categories = ["parser-implementations", "visualization"]

[package.metadata.merman-legal]
third-party-bundle = true

[features]
default = ["diagram-sequence"]
diagram-sequence = ["dep:cssparser", "dep:indexmap", "dep:merman-core-preprocess", "dep:rustc-hash", "dep:serde", "dep:serde_json", "merman-model/diagram-sequence"]
diagram-zenuml = ["dep:indexmap", "dep:unicode-general-category", "merman-model/diagram-zenuml"]
editor-facts = []

[dependencies]
cssparser = { workspace = true, optional = true }
indexmap = { workspace = true, optional = true }
merman-core-preprocess = { workspace = true, optional = true }
merman-model.workspace = true
rustc-hash = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
unicode-general-category = { workspace = true, optional = true }

[dev-dependencies]
merman-model = { workspace = true, features = ["test-support"] }
