[package]
name = "merman-core-sequence"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Syntax and semantic model construction for Merman's sequence diagrams."
readme = "README.md"

[package.metadata.merman-legal]
third-party-bundle = true

[features]
default = []
editor-facts = []

[dependencies]
cssparser.workspace = true
indexmap.workspace = true
merman-core-preprocess.workspace = true
merman-model = { workspace = true, features = ["diagram-sequence"] }
rustc-hash.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
merman-model = { workspace = true, features = ["test-support"] }
