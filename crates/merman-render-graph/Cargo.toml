[package]
name = "merman-render-graph"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Geometry and SVG rendering primitives for Merman's graph families."
documentation = "https://docs.rs/merman-render-graph"
readme = "README.md"
keywords = ["mermaid", "diagrams", "svg", "graph"]
categories = ["visualization"]

[package.metadata.merman-legal]
third-party-bundle = true

[features]
default = []
diagram-er = [
    "dep:base64", "dep:indexmap", "dep:kurbo", "dep:merman-markup", "dep:merman-model",
    "dep:merman-render-core", "dep:merman-theme-contract", "dep:roxmltree", "dep:roughr",
    "dep:rustc-hash", "dep:ryu-js", "dep:serde_json", "merman-markup/html", "merman-model/diagram-er",
    "merman-render-core/css-style", "merman-render-core/graph-layout", "merman-render-core/markdown-labels",
    "merman-render-core/root-svg", "merman-render-core/rough-svg", "merman-render-core/svg-edge-parity",
    "merman-render-core/theme-svg",
]
diagram-git-graph = [
    "dep:cssparser", "dep:euclid", "dep:merman-model", "dep:merman-render-core",
    "dep:merman-theme-contract", "dep:serde", "dep:serde_json", "merman-model/diagram-git-graph",
    "merman-render-core/root-svg", "merman-render-core/svg-bounds", "merman-render-core/text-layout",
]
diagram-requirement = [
    "dep:base64", "dep:indexmap", "dep:merman-markup", "dep:merman-model", "dep:merman-render-core",
    "dep:merman-theme-contract", "dep:roughr", "dep:serde", "dep:serde_json", "merman-markup/html",
    "merman-model/diagram-requirement", "merman-render-core/graph-layout",
    "merman-render-core/markdown-labels", "merman-render-core/root-svg",
    "merman-render-core/rough-svg", "merman-render-core/svg-edge-parity",
]
diagram-state = [
    "dep:base64", "dep:cssparser", "dep:indexmap", "dep:kurbo", "dep:merman-markup",
    "dep:merman-model", "dep:merman-render-core",
    "dep:merman-theme-contract", "dep:roughr", "dep:rustc-hash", "dep:ryu-js", "dep:serde", "dep:serde_json",
    "merman-model/diagram-state", "merman-render-core/graph-layout", "merman-render-core/markdown-labels",
    "merman-render-core/root-svg", "merman-render-core/rough-svg", "merman-render-core/svg-edge-parity",
    "merman-render-core/theme-elevation", "merman-render-core/theme-label-background",
]
layout-shoal = ["dep:kurbo", "merman-render-core?/route-paint"]
layout-dagre = ["dep:dugong", "merman-render-core?/layout-dagre"]
layout-elk = ["dep:merman-layout-elk"]
benchmark-stages = ["merman-model?/benchmark-stages"]

[dependencies]
base64 = { workspace = true, optional = true }
cssparser = { workspace = true, optional = true }
dugong = { workspace = true, optional = true }
euclid = { workspace = true, optional = true }
indexmap = { workspace = true, optional = true }
kurbo = { workspace = true, optional = true }
merman-layout-elk = { workspace = true, optional = true }
merman-markup = { workspace = true, features = ["color"], optional = true }
merman-model = { workspace = true, features = ["presentation-data"], optional = true }
merman-render-core = { workspace = true, optional = true }
merman-theme-contract = { workspace = true, optional = true }
roxmltree = { workspace = true, optional = true }
roughr = { workspace = true, optional = true }
rustc-hash = { workspace = true, optional = true }
ryu-js = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
merman-model = { workspace = true, features = ["test-support"] }
merman-render-core = { workspace = true, features = ["test-support"] }
merman-theme-contract = { workspace = true, features = ["presets"] }
roxmltree.workspace = true
