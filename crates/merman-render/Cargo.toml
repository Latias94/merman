[package]
name = "merman-render"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Headless layout + SVG renderer for Mermaid (parity-focused; upstream SVG goldens)."
documentation = "https://docs.rs/merman-render"
readme = "README.md"
keywords = ["mermaid", "diagrams", "svg", "layout", "headless"]
categories = ["visualization"]
exclude = [
  "examples/*_debug_svg.rs",
  "examples/ratex_math_audit.rs",
  "tests/**",
]

[package.metadata.merman]
artifact-profile-required = true
fixed-capabilities = ["svg"]

[features]
# Diagram selection is independent of output formats and optional layout engines.
all-diagrams = [
    "diagram-agentflow",
    "diagram-architecture",
    "diagram-block",
    "diagram-c4",
    "diagram-class",
    "diagram-cynefin",
    "diagram-er",
    "diagram-event-modeling",
    "diagram-flowchart",
    "diagram-gantt",
    "diagram-git-graph",
    "diagram-info",
    "diagram-ishikawa",
    "diagram-journey",
    "diagram-kanban",
    "diagram-mindmap",
    "diagram-packet",
    "diagram-pie",
    "diagram-quadrant-chart",
    "diagram-radar",
    "diagram-railroad",
    "diagram-requirement",
    "diagram-sankey",
    "diagram-sequence",
    "diagram-state",
    "diagram-swimlane",
    "diagram-timeline",
    "diagram-tree-view",
    "diagram-treemap",
    "diagram-usecase",
    "diagram-venn",
    "diagram-wardley",
    "diagram-xychart",
    "diagram-zenuml",
]
diagram-architecture = ["merman-model/diagram-architecture", "dep:merman-render-graph", "merman-render-graph/diagram-architecture"]
diagram-block = ["merman-model/diagram-block", "dep:merman-render-structured", "merman-render-structured/diagram-block"]
diagram-c4 = ["merman-model/diagram-c4", "dep:merman-render-graph", "merman-render-graph/diagram-c4"]
diagram-class = ["merman-model/diagram-class", "dep:merman-render-graph", "merman-render-graph/diagram-class", "merman-render-core/resources-class", "markdown-labels", "dep:roughr", "merman-render-core/rough-svg", "dep:indexmap", "merman-render-core/graph-layout"]
diagram-cynefin = ["merman-model/diagram-cynefin", "dep:merman-render-structured", "merman-render-structured/diagram-cynefin"]
diagram-er = ["merman-model/diagram-er", "dep:merman-render-graph", "merman-render-graph/diagram-er", "markdown-labels", "dep:roughr", "merman-render-core/rough-svg", "dep:indexmap", "merman-render-core/graph-layout"]
diagram-event-modeling = ["merman-model/diagram-event-modeling", "dep:merman-render-structured", "merman-render-structured/diagram-event-modeling"]
diagram-agentflow = ["merman-model/diagram-agentflow", "merman-render-core/icon-svg", "merman-render-core/resources-agentflow", "merman-render-core/theme-elevation", "merman-render-core/theme-label-background", "dep:merman-render-flow", "merman-render-flow/diagram-agentflow", "dep:imagesize", "dep:ryu-js", "markdown-labels", "dep:roughr", "merman-render-core/rough-svg", "dep:indexmap", "merman-render-core/graph-layout"]
diagram-usecase = ["merman-model/diagram-usecase", "dep:merman-render-graph", "merman-render-graph/diagram-usecase", "merman-render-core/icon-svg", "merman-render-core/theme-elevation", "markdown-labels", "dep:roughr", "merman-render-core/rough-svg", "dep:indexmap", "merman-render-core/graph-layout"]
diagram-flowchart = ["merman-model/diagram-flowchart", "merman-render-core/icon-svg", "merman-render-core/resources-flowchart", "merman-render-core/theme-elevation", "merman-render-core/theme-label-background", "dep:merman-render-flow", "merman-render-flow/diagram-flowchart", "dep:imagesize", "dep:ryu-js", "markdown-labels", "dep:roughr", "merman-render-core/rough-svg", "dep:indexmap", "merman-render-core/graph-layout"]
diagram-gantt = ["merman-model/diagram-gantt", "dep:merman-render-structured", "merman-render-structured/diagram-gantt"]
diagram-git-graph = ["merman-model/diagram-git-graph", "dep:merman-render-graph", "merman-render-graph/diagram-git-graph"]
diagram-info = ["merman-model/diagram-info", "dep:merman-render-structured", "merman-render-structured/diagram-info"]
diagram-ishikawa = ["merman-model/diagram-ishikawa", "dep:merman-render-structured", "merman-render-structured/diagram-ishikawa"]
diagram-journey = ["merman-model/diagram-journey", "dep:merman-render-structured", "merman-render-structured/diagram-journey"]
diagram-kanban = ["merman-model/diagram-kanban", "dep:merman-render-structured", "merman-render-structured/diagram-kanban", "markdown-labels"]
diagram-mindmap = ["merman-model/diagram-mindmap", "dep:merman-render-graph", "merman-render-graph/diagram-mindmap", "merman-render-core/resources-mindmap", "markdown-labels", "dep:indexmap"]
diagram-packet = ["merman-model/diagram-packet", "dep:merman-render-structured", "merman-render-structured/diagram-packet"]
diagram-pie = ["merman-model/diagram-pie", "dep:merman-render-charts", "merman-render-charts/diagram-pie"]
diagram-quadrant-chart = ["merman-model/diagram-quadrant-chart", "dep:merman-render-charts", "merman-render-charts/diagram-quadrant-chart"]
diagram-radar = ["merman-model/diagram-radar", "dep:merman-render-charts", "merman-render-charts/diagram-radar"]
diagram-railroad = ["merman-model/diagram-railroad", "dep:merman-render-structured", "merman-render-structured/diagram-railroad"]
diagram-requirement = ["merman-model/diagram-requirement", "dep:merman-render-graph", "merman-render-graph/diagram-requirement", "markdown-labels", "dep:roughr", "merman-render-core/rough-svg", "dep:indexmap", "merman-render-core/graph-layout"]
diagram-sankey = ["merman-model/diagram-sankey", "dep:merman-render-charts", "merman-render-charts/diagram-sankey"]
diagram-sequence = ["merman-model/diagram-sequence", "dep:merman-render-sequence", "merman-render-sequence/diagram-sequence", "merman-render-sequence/svg"]
diagram-state = ["merman-model/diagram-state", "dep:merman-render-graph", "merman-render-graph/diagram-state", "markdown-labels", "dep:roughr", "dep:indexmap", "merman-render-core/graph-layout"]
diagram-swimlane = ["merman-model/diagram-swimlane", "merman-render-core/icon-svg", "merman-render-core/resources-swimlane", "merman-render-core/theme-elevation", "merman-render-core/theme-label-background", "dep:merman-render-flow", "merman-render-flow/diagram-swimlane", "dep:imagesize", "dep:ryu-js", "markdown-labels", "dep:roughr", "merman-render-core/rough-svg", "dep:indexmap", "merman-render-core/graph-layout"]
diagram-timeline = ["merman-model/diagram-timeline", "dep:merman-render-structured", "merman-render-structured/diagram-timeline"]
diagram-tree-view = ["merman-model/diagram-tree-view", "dep:merman-render-structured", "merman-render-structured/diagram-tree-view"]
diagram-treemap = ["merman-model/diagram-treemap", "dep:merman-render-charts", "merman-render-charts/diagram-treemap"]
diagram-venn = ["merman-model/diagram-venn", "dep:merman-render-charts", "merman-render-charts/diagram-venn"]
diagram-wardley = ["merman-model/diagram-wardley", "dep:merman-render-charts", "merman-render-charts/diagram-wardley"]
diagram-xychart = ["merman-model/diagram-xychart", "dep:merman-render-charts", "merman-render-charts/diagram-xychart"]
diagram-zenuml = ["merman-model/diagram-zenuml", "merman-render-core/resources-zenuml", "dep:merman-render-sequence", "merman-render-sequence/diagram-zenuml"]
default = []
markdown-labels = ["dep:pulldown-cmark", "merman-render-core/markdown-labels"]
native-compact = ["merman-render-core/paint-scene", "merman-render-sequence?/native-compact"]
system-clock = ["merman-model/system-clock"]
system-timezone = ["merman-model/system-timezone"]
system-random = ["merman-model/system-random"]
system-timing = ["merman-model/system-timing"]
benchmark-stages = ["merman-model/benchmark-stages", "merman-render-core/benchmark-stages", "merman-render-flow?/benchmark-stages", "merman-render-sequence?/benchmark-stages", "merman-render-graph?/benchmark-stages"]
layout-cytoscape = ["dep:manatee", "merman-render-core/layout-cytoscape", "merman-render-graph?/layout-cytoscape"]
layout-dagre = ["dep:dugong", "merman-render-core/layout-dagre", "merman-render-flow?/layout-dagre", "merman-render-graph?/layout-dagre"]
layout-elk = ["dep:merman-layout-elk", "merman-render-core/layout-elk", "merman-render-graph?/layout-elk"]
layout-shoal = ["dep:merman-layout-shoal", "merman-render-core/shoal-bridge", "merman-render-flow?/canonical-edge-paint", "merman-render-graph?/layout-shoal"]
math = ["merman-render-core/math", "merman-render-sequence?/math"]

[dependencies]
merman-markup = { workspace = true, features = ["html", "url", "color"] }
merman-model = { workspace = true, features = ["presentation-data", "compat-json", "html-entities"] }
merman-render-charts = { workspace = true, optional = true }
merman-render-core = { workspace = true, features = ["error-diagram", "euclid-geometry", "icon-registry", "math-labels", "root-svg", "svg-animation", "svg-bounds", "svg-edge-parity", "svg-identity", "svg-safety", "theme-svg", "xhtml-labels"] }
merman-render-flow = { workspace = true, optional = true }
merman-render-graph = { workspace = true, optional = true }
merman-render-sequence = { workspace = true, optional = true }
merman-render-structured = { workspace = true, optional = true }
cssparser.workspace = true
imagesize = { workspace = true, optional = true }
dugong = { workspace = true, optional = true }
euclid.workspace = true
indexmap = { workspace = true, features = ["serde"], optional = true }
kurbo.workspace = true
manatee = { workspace = true, optional = true }
merman-layout-elk = { workspace = true, optional = true }
merman-layout-shoal = { workspace = true, optional = true }
merman-theme-contract = { workspace = true, features = ["presets"] }
pulldown-cmark = { workspace = true, optional = true }
roxmltree.workspace = true
rustc-hash.workspace = true
quick-xml.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
svgtypes.workspace = true
thiserror.workspace = true
roughr = { workspace = true, default-features = false, optional = true }
ryu-js = { workspace = true, optional = true }

[dev-dependencies]
base64.workspace = true
data-encoding.workspace = true
# Browser geometry replays require the exact captured IEEE-754 values.
serde_json = { workspace = true, features = ["float_roundtrip"] }
futures = { workspace = true, features = ["executor"] }
merman-core = { workspace = true, features = ["all-diagrams", "presentation", "compat-json", "test-support"] }
merman-fixture-render-context = { path = "../merman-fixture-render-context" }
merman-render-core = { workspace = true, features = ["graph-layout", "route-paint", "test-support"] }
regex.workspace = true
