[package]
name = "merman-render-structured"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Layout and SVG emission for Merman's structured diagram families."
documentation = "https://docs.rs/merman-render-structured"
readme = "README.md"
keywords = ["mermaid", "diagrams", "svg", "layout"]
categories = ["visualization"]

[package.metadata.merman-legal]
third-party-bundle = true

[features]
default = []
diagram-cynefin = ["dep:cssparser", "dep:merman-model", "dep:merman-render-core", "dep:merman-theme-contract", "dep:ryu-js", "dep:serde", "dep:serde_json", "merman-model/diagram-cynefin", "merman-render-core/root-svg", "merman-render-core/text-layout"]
diagram-event-modeling = [
    "dep:merman-markup", "dep:merman-model", "dep:merman-render-core", "dep:merman-theme-contract",
    "dep:serde", "dep:serde_json", "merman-model/diagram-event-modeling", "merman-render-core/html",
    "merman-render-core/root-svg", "merman-render-core/text-layout",
]
diagram-gantt = ["dep:merman-model", "dep:merman-render-core", "dep:merman-theme-contract", "dep:serde", "dep:serde_json", "merman-model/diagram-gantt", "merman-render-core/root-svg", "merman-render-core/text-layout"]
diagram-info = ["dep:merman-model", "dep:merman-render-core", "dep:merman-theme-contract", "dep:serde", "merman-render-core/root-svg", "merman-render-core/theme-svg"]
diagram-ishikawa = ["dep:cssparser", "dep:merman-model", "dep:merman-render-core", "dep:merman-theme-contract", "dep:roughr", "dep:serde", "dep:serde_json", "merman-model/diagram-ishikawa", "merman-render-core/root-svg", "merman-render-core/rough-svg"]
diagram-journey = ["dep:merman-model", "dep:merman-render-core", "dep:merman-theme-contract", "dep:serde", "dep:serde_json", "merman-model/diagram-journey", "merman-render-core/root-svg", "merman-render-core/text-layout"]
diagram-packet = ["dep:merman-markup", "dep:merman-model", "dep:merman-render-core", "dep:merman-theme-contract", "dep:ryu-js", "dep:serde", "dep:serde_json", "merman-model/diagram-packet", "merman-render-core/root-svg"]
diagram-railroad = ["dep:merman-model", "dep:merman-render-core", "dep:merman-theme-contract", "dep:serde", "dep:serde_json", "merman-model/diagram-railroad", "merman-render-core/root-svg"]
diagram-timeline = ["dep:merman-model", "dep:merman-render-core", "dep:merman-theme-contract", "dep:serde", "dep:serde_json", "merman-model/diagram-timeline", "merman-render-core/root-svg"]
diagram-tree-view = ["dep:merman-model", "dep:merman-render-core", "dep:merman-theme-contract", "dep:serde", "dep:serde_json", "merman-model/diagram-tree-view", "merman-render-core/icon-svg", "merman-render-core/root-svg", "merman-render-core/text-layout"]

system-timezone = ["merman-model?/system-timezone"]

[dependencies]
cssparser = { workspace = true, optional = true }
merman-markup = { workspace = true, optional = true }
merman-model = { workspace = true, features = ["presentation-data"], optional = true }
merman-render-core = { workspace = true, features = ["css-style", "svg-output"], optional = true }
merman-theme-contract = { workspace = true, optional = true }
roughr = { workspace = true, optional = true }
ryu-js = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
merman-render-core = { workspace = true, features = ["text-layout"] }
merman-theme-contract = { workspace = true, features = ["presets"] }
roxmltree.workspace = true
svgtypes.workspace = true
