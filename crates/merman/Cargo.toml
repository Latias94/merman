[package]
name = "merman"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Parity-focused, headless Rust implementation of Mermaid for parsing, layout, and rendering."
documentation = "https://docs.rs/merman"
readme = "../../README.md"
keywords = ["mermaid", "diagrams", "svg", "parser", "headless"]
categories = ["parser-implementations", "visualization"]
exclude = [
    "tests/mindmap_br_variants_031.rs",
    "tests/resvg_safe_fixture_smoke.rs",
    "tests/zed_mermaid_issue_fixtures.rs",
    "tests/zed_pr_57644_corpus.rs",
]

[package.metadata.docs.rs]
features = [
    "svg",
    "analysis",
    "editor",
    "ascii",
    "png",
    "jpeg",
    "pdf",
    "layout-cytoscape",
    "layout-elk",
    "math",
    "system-clock",
    "system-timezone",
    "system-random",
    "system-timing",
]

[package.metadata.merman]
artifact-profile-required = true

[features]
# The facade is the ergonomic Rust entry point. Low-level implementation crates stay
# default-empty; this product default intentionally provides a complete deterministic SVG path.
default = ["complete-svg"]
system-clock = ["merman-core/system-clock", "merman-render?/system-clock"]
system-timezone = ["merman-core/system-timezone", "merman-render?/system-timezone"]
system-random = ["merman-core/system-random", "merman-render?/system-random"]
system-timing = ["merman-core/system-timing", "merman-render?/system-timing"]
svg = ["dep:merman-render", "dep:serde_json", "dep:thiserror"]
analysis = ["dep:merman-analysis"]
editor = ["analysis", "dep:merman-editor-core"]
ascii = ["dep:merman-ascii", "dep:thiserror"]
layout-cytoscape = ["svg", "merman-render/layout-cytoscape"]
layout-elk = ["svg", "merman-render/layout-elk"]
math = ["svg", "merman-render/math"]
png = ["svg", "dep:merman-export", "merman-export/png"]
jpeg = ["svg", "dep:merman-export", "merman-export/jpeg"]
pdf = ["svg", "dep:merman-export", "merman-export/pdf"]
complete-svg = [
    "svg",
    "layout-cytoscape",
    "layout-elk",
    "math",
]

[dependencies]
merman-core.workspace = true
merman-analysis = { workspace = true, optional = true }
merman-ascii = { workspace = true, optional = true }
merman-editor-core = { workspace = true, optional = true }
merman-export = { workspace = true, optional = true }
merman-render = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

[dev-dependencies]
base64.workspace = true
criterion = "0.8.2"
merman-fixture-render-context = { path = "../merman-fixture-render-context" }
png.workspace = true
roxmltree.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[[test]]
name = "prepared_render"
required-features = ["svg"]

[[test]]
name = "feature_surface_smoke"
required-features = ["analysis", "editor"]

[[test]]
name = "runtime_determinism"
required-features = [
    "svg",
    "system-clock",
    "system-timezone",
    "system-random",
    "system-timing",
]

[[test]]
name = "mermaid_11_16_corpus"
required-features = ["layout-elk"]

