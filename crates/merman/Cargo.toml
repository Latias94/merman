[package]
name = "merman"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Parity-focused, headless Rust implementation of Mermaid for parsing, layout, and rendering."
documentation = "https://docs.rs/merman"
readme = "../../README.md"
keywords = ["mermaid", "diagrams", "svg", "parser", "headless"]
categories = ["parser-implementations", "visualization"]
exclude = [
    "tests/mindmap_br_variants_031.rs",
    "tests/resvg_safe_fixture_smoke.rs",
    "tests/zed_mermaid_issue_fixtures.rs",
    "tests/zed_pr_57644_corpus.rs",
]

[package.metadata.docs.rs]
features = ["render", "ascii", "raster", "math"]

[features]
default = ["system-clock", "system-timezone", "system-random", "system-timing"]
system-clock = ["merman-core/system-clock", "merman-ascii?/system-clock", "merman-render?/system-clock"]
system-timezone = ["merman-core/system-timezone", "merman-ascii?/system-timezone", "merman-render?/system-timezone"]
system-random = ["merman-core/system-random", "merman-ascii?/system-random", "merman-render?/system-random"]
system-timing = ["merman-core/system-timing", "merman-ascii?/system-timing", "merman-render?/system-timing"]
render = ["dep:merman-render", "dep:serde_json", "dep:thiserror"]
ascii = ["dep:merman-ascii", "dep:thiserror"]
layout-cytoscape = ["render", "merman-render/layout-cytoscape"]
layout-elk = ["render", "merman-render/layout-elk"]
math = ["render", "merman-render/math"]
raster = [
    "render",
    "dep:image",
    "dep:resvg",
    "dep:usvg",
    "dep:tiny-skia",
    "dep:krilla",
    "dep:krilla-svg",
    "dep:data-url",
    "dep:quick-xml",
]

[dependencies]
chrono.workspace = true
merman-core.workspace = true
merman-ascii = { workspace = true, optional = true }
merman-render = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
image = { workspace = true, optional = true }
resvg = { workspace = true, optional = true }
usvg = { workspace = true, optional = true }
tiny-skia = { workspace = true, optional = true }
krilla = { workspace = true, optional = true }
krilla-svg = { workspace = true, optional = true }
data-url = { workspace = true, optional = true }
quick-xml = { workspace = true, optional = true }

[dev-dependencies]
base64.workspace = true
criterion = "0.8.2"
merman-fixture-render-context = { path = "../merman-fixture-render-context" }
png.workspace = true
roxmltree.workspace = true
serde.workspace = true
serde_json.workspace = true

[[test]]
name = "prepared_render"
required-features = ["render"]

[[test]]
name = "runtime_determinism"
required-features = [
    "render",
    "system-clock",
    "system-timezone",
    "system-random",
    "system-timing",
]

[[test]]
name = "mermaid_11_16_corpus"
required-features = ["layout-elk"]

[[bench]]
name = "pipeline"
harness = false
required-features = ["render"]

[[bench]]
name = "flowchart_stress"
harness = false
required-features = ["render"]

[[bench]]
