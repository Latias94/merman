[package]
name = "merman-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Mermaid parser + semantic model (headless; parity-focused)."
documentation = "https://docs.rs/merman-core"
readme = "README.md"
keywords = ["mermaid", "diagrams", "parser", "ast"]
categories = ["parser-implementations", "visualization"]

[features]
# Mermaid language parsing, configuration, sanitization, detection, and family facts are the
# unconditional core contract. Features only describe ambient host capabilities.
default = ["host"]
host = ["host-clock", "host-random", "host-timing"]
host-clock = ["chrono/clock", "chrono/wasmbind", "dep:jiff", "dep:sha2"]
host-random = ["dep:uuid", "uuid/js", "uuid/v4"]
host-timing = ["dep:web-time"]

[dependencies]
euclid.workspace = true
htmlize.workspace = true
indexmap.workspace = true
lalrpop-util.workspace = true
serde.workspace = true
serde_json.workspace = true
granit-parser.workspace = true
json5.workspace = true
thiserror.workspace = true
unicode-general-category.workspace = true
lol_html.workspace = true
url.workspace = true
uuid = { workspace = true, optional = true }
chrono.workspace = true
jiff = { workspace = true, optional = true }
ryu-js.workspace = true
rustc-hash.workspace = true
sha2 = { workspace = true, optional = true }
web-time = { workspace = true, optional = true }

[dev-dependencies]
futures.workspace = true
merman-fixture-render-context = { path = "../merman-fixture-render-context" }
regex.workspace = true
