[package]
name = "merman-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Mermaid parser + semantic model (headless; parity-focused)."
documentation = "https://docs.rs/merman-core"
readme = "README.md"
keywords = ["mermaid", "diagrams", "parser", "ast"]
categories = ["parser-implementations", "visualization"]

[package.metadata.merman]
artifact-profile-required = true

[features]
presentation = ["merman-markup/color", "merman-model/presentation-data"]
editor-facts = ["granit-parser/comments"]
compat-json = ["presentation"]
terminal-text = ["merman-model/terminal-text"]
# Diagram selection is independent of output formats and optional layout engines.
all-diagrams = [
    "diagram-agentflow",
    "diagram-architecture",
    "diagram-block",
    "diagram-c4",
    "diagram-class",
    "diagram-cynefin",
    "diagram-er",
    "diagram-event-modeling",
    "diagram-flowchart",
    "diagram-gantt",
    "diagram-git-graph",
    "diagram-info",
    "diagram-ishikawa",
    "diagram-journey",
    "diagram-kanban",
    "diagram-mindmap",
    "diagram-packet",
    "diagram-pie",
    "diagram-quadrant-chart",
    "diagram-radar",
    "diagram-railroad",
    "diagram-requirement",
    "diagram-sankey",
    "diagram-sequence",
    "diagram-state",
    "diagram-swimlane",
    "diagram-timeline",
    "diagram-tree-view",
    "diagram-treemap",
    "diagram-usecase",
    "diagram-venn",
    "diagram-wardley",
    "diagram-xychart",
    "diagram-zenuml",
]
diagram-architecture = ["merman-model/diagram-architecture"]
diagram-block = ["merman-model/diagram-block", "dep:indexmap"]
diagram-c4 = ["merman-model/diagram-c4"]
diagram-class = ["merman-model/diagram-class", "dep:lalrpop-util", "dep:indexmap"]
diagram-cynefin = ["merman-model/diagram-cynefin"]
diagram-er = ["merman-model/diagram-er", "dep:lalrpop-util", "dep:indexmap"]
diagram-event-modeling = ["merman-model/diagram-event-modeling"]
diagram-agentflow = ["merman-model/diagram-agentflow", "dep:rustc-hash", "dep:indexmap"]
diagram-usecase = ["merman-model/diagram-usecase", "dep:indexmap"]
diagram-flowchart = ["merman-model/diagram-flowchart", "dep:lalrpop-util", "dep:rustc-hash", "dep:indexmap"]
diagram-gantt = ["merman-model/diagram-gantt"]
diagram-git-graph = ["merman-model/diagram-git-graph"]
diagram-info = ["merman-model/diagram-info"]
diagram-ishikawa = ["merman-model/diagram-ishikawa"]
diagram-journey = ["merman-model/diagram-journey"]
diagram-kanban = ["merman-model/diagram-kanban"]
diagram-mindmap = ["merman-model/diagram-mindmap"]
diagram-packet = ["merman-model/diagram-packet"]
diagram-pie = ["merman-model/diagram-pie"]
diagram-quadrant-chart = ["merman-model/diagram-quadrant-chart"]
diagram-radar = ["merman-model/diagram-radar"]
diagram-railroad = ["merman-model/diagram-railroad"]
diagram-requirement = ["merman-model/diagram-requirement"]
diagram-sankey = ["merman-model/diagram-sankey"]
diagram-sequence = ["merman-model/diagram-sequence", "dep:lalrpop-util", "dep:rustc-hash"]
diagram-state = ["merman-model/diagram-state", "dep:lalrpop-util", "dep:indexmap"]
diagram-swimlane = ["merman-model/diagram-swimlane", "dep:lalrpop-util", "dep:rustc-hash", "dep:indexmap"]
diagram-timeline = ["merman-model/diagram-timeline"]
diagram-tree-view = ["merman-model/diagram-tree-view"]
diagram-treemap = ["merman-model/diagram-treemap"]
diagram-venn = ["merman-model/diagram-venn"]
diagram-wardley = ["merman-model/diagram-wardley", "dep:indexmap"]
diagram-xychart = ["merman-model/diagram-xychart"]
diagram-zenuml = ["merman-model/diagram-zenuml", "dep:unicode-general-category", "dep:indexmap"]
# Configuration, sanitization, detection, and family identity remain unconditional.
# Parsers and typed models are selected independently from explicit system adapters.
default = []
operation-deadlines = ["merman-model/operation-deadlines"]
test-support = ["merman-model/test-support"]
system-clock = ["merman-model/system-clock"]
system-timezone = ["merman-model/system-timezone"]
system-random = ["merman-model/system-random"]
system-timing = ["merman-model/system-timing"]

[dependencies]
merman-markup = { workspace = true, features = ["html", "url"] }
merman-model = { workspace = true, features = ["html-entities"] }
cssparser.workspace = true
indexmap = { workspace = true, features = ["serde"], optional = true }
lalrpop-util = { workspace = true, optional = true }
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }
granit-parser.workspace = true
json5.workspace = true
thiserror.workspace = true
unicode-general-category = { workspace = true, optional = true }
rustc-hash = { workspace = true, optional = true }

[dev-dependencies]
merman-model = { workspace = true, features = ["test-support"] }
futures = { workspace = true, features = ["executor"] }
merman-fixture-render-context = { path = "../merman-fixture-render-context" }
regex.workspace = true
