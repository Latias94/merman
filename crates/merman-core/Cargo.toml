[package]
name = "merman-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Mermaid parser + semantic model (headless; parity-focused)."
documentation = "https://docs.rs/merman-core"
readme = "README.md"
keywords = ["mermaid", "diagrams", "parser", "ast"]
categories = ["parser-implementations", "visualization"]

[package.metadata.merman]
artifact-profile-required = true

[features]
# Mermaid language parsing, configuration, sanitization, detection, and family facts are the
# unconditional core contract. Features only admit explicit system adapters.
default = []
operation-deadlines = ["dep:web-time"]
test-support = []
system-clock = []
system-timezone = [
    "dep:jiff",
    "dep:sha2",
    "jiff/std",
    "jiff/tz-system",
    "jiff/tz-fat",
    "jiff/tzdb-bundle-platform",
    "jiff/tzdb-zoneinfo",
    "jiff/tzdb-concatenated",
    "jiff/perf-inline",
]
system-random = ["dep:getrandom", "getrandom/std"]
system-timing = ["dep:web-time"]

[dependencies]
euclid.workspace = true
htmlize.workspace = true
indexmap = { workspace = true, features = ["serde"] }
lalrpop-util.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
granit-parser.workspace = true
json5.workspace = true
thiserror.workspace = true
unicode-general-category.workspace = true
lol_html.workspace = true
url.workspace = true
jiff = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
ryu-js.workspace = true
rustc-hash.workspace = true
sha2 = { workspace = true, optional = true }
web-time = { workspace = true, optional = true }

[dev-dependencies]
futures = { workspace = true, features = ["executor"] }
merman-fixture-render-context = { path = "../merman-fixture-render-context" }
regex.workspace = true
