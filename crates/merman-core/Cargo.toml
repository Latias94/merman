[package]
name = "merman-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Mermaid parser + semantic model (headless; parity-focused)."
documentation = "https://docs.rs/merman-core"
readme = "README.md"
keywords = ["mermaid", "diagrams", "parser", "ast"]
categories = ["parser-implementations", "visualization"]

[package.metadata.merman]
artifact-profile-required = true

[features]
presentation = ["merman-markup/color", "merman-model/presentation-data", "merman-core-flow?/presentation", "merman-core-graph?/presentation", "merman-core-structured?/presentation", "serde_json/raw_value"]
editor-facts = ["merman-core-preprocess/yaml-editor", "merman-core-flow?/editor-facts", "merman-core-graph?/editor-facts", "merman-core-sequence?/editor-facts", "merman-core-structured?/editor-facts"]
compat-json = ["presentation", "merman-model/compat-json"]
terminal-text = ["merman-model/terminal-text"]
# Diagram selection is independent of output formats and optional layout engines.
all-diagrams = [
    "diagram-agentflow",
    "diagram-architecture",
    "diagram-block",
    "diagram-c4",
    "diagram-class",
    "diagram-cynefin",
    "diagram-er",
    "diagram-event-modeling",
    "diagram-flowchart",
    "diagram-gantt",
    "diagram-git-graph",
    "diagram-info",
    "diagram-ishikawa",
    "diagram-journey",
    "diagram-kanban",
    "diagram-mindmap",
    "diagram-packet",
    "diagram-pie",
    "diagram-quadrant-chart",
    "diagram-radar",
    "diagram-railroad",
    "diagram-requirement",
    "diagram-sankey",
    "diagram-sequence",
    "diagram-state",
    "diagram-swimlane",
    "diagram-timeline",
    "diagram-tree-view",
    "diagram-treemap",
    "diagram-usecase",
    "diagram-venn",
    "diagram-wardley",
    "diagram-xychart",
    "diagram-zenuml",
]
diagram-architecture = ["merman-model/diagram-architecture"]
diagram-block = ["merman-model/diagram-block", "dep:indexmap", "dep:ryu-js"]
diagram-c4 = ["merman-model/diagram-c4"]
diagram-class = ["merman-model/diagram-class", "dep:merman-core-graph", "merman-core-graph/diagram-class"]
diagram-cynefin = ["merman-model/diagram-cynefin"]
diagram-er = ["merman-model/diagram-er", "dep:merman-core-graph", "merman-core-graph/diagram-er"]
diagram-event-modeling = ["merman-model/diagram-event-modeling"]
diagram-agentflow = ["merman-model/diagram-agentflow", "dep:rustc-hash", "dep:indexmap", "dep:merman-core-flow", "merman-core-flow/diagram-agentflow"]
diagram-usecase = ["merman-model/diagram-usecase", "dep:indexmap"]
diagram-flowchart = ["merman-model/diagram-flowchart", "dep:merman-core-flow", "merman-core-flow/diagram-flowchart"]
diagram-gantt = ["merman-model/diagram-gantt", "dep:merman-core-structured", "merman-core-structured/diagram-gantt"]
diagram-git-graph = ["merman-model/diagram-git-graph", "dep:merman-core-graph", "merman-core-graph/diagram-git-graph"]
diagram-info = ["merman-model/diagram-info", "dep:merman-core-structured", "merman-core-structured/diagram-info"]
diagram-ishikawa = ["merman-model/diagram-ishikawa", "dep:merman-core-structured", "merman-core-structured/diagram-ishikawa"]
diagram-journey = ["merman-model/diagram-journey"]
diagram-kanban = ["merman-model/diagram-kanban", "dep:ryu-js"]
diagram-mindmap = ["merman-model/diagram-mindmap"]
diagram-packet = ["merman-model/diagram-packet", "dep:merman-core-structured", "merman-core-structured/diagram-packet", "dep:ryu-js"]
diagram-pie = ["merman-model/diagram-pie", "dep:ryu-js"]
diagram-quadrant-chart = ["merman-model/diagram-quadrant-chart"]
diagram-radar = ["merman-model/diagram-radar", "dep:ryu-js"]
diagram-railroad = ["merman-model/diagram-railroad", "dep:merman-core-structured", "merman-core-structured/diagram-railroad"]
diagram-requirement = ["merman-model/diagram-requirement"]
diagram-sankey = ["merman-model/diagram-sankey", "dep:merman-core-structured", "merman-core-structured/diagram-sankey"]
diagram-sequence = ["merman-model/diagram-sequence", "dep:merman-core-sequence"]
diagram-state = ["merman-model/diagram-state", "dep:merman-core-graph", "merman-core-graph/diagram-state"]
diagram-swimlane = ["merman-model/diagram-swimlane", "dep:merman-core-flow", "merman-core-flow/diagram-swimlane"]
diagram-timeline = ["merman-model/diagram-timeline", "dep:merman-core-structured", "merman-core-structured/diagram-timeline"]
diagram-tree-view = ["merman-model/diagram-tree-view"]
diagram-treemap = ["merman-model/diagram-treemap", "dep:merman-core-structured", "merman-core-structured/diagram-treemap"]
diagram-venn = ["merman-model/diagram-venn"]
diagram-wardley = ["merman-model/diagram-wardley", "dep:indexmap", "dep:ryu-js"]
diagram-xychart = ["merman-model/diagram-xychart", "dep:ryu-js"]
diagram-zenuml = ["merman-model/diagram-zenuml", "dep:unicode-general-category", "dep:indexmap"]
# Configuration, sanitization, detection, and family identity remain unconditional.
# Parsers and typed models are selected independently from explicit system adapters.
default = []
operation-deadlines = ["merman-model/operation-deadlines"]
test-support = ["merman-model/test-support"]
system-clock = ["merman-model/system-clock"]
system-timezone = ["merman-model/system-timezone"]
system-random = ["merman-model/system-random"]
system-timing = ["merman-model/system-timing"]
benchmark-stages = ["merman-model/benchmark-stages"]

[dependencies]
merman-core-flow = { workspace = true, optional = true }
merman-core-graph = { workspace = true, optional = true }
merman-core-preprocess = { workspace = true, features = ["yaml"] }
merman-core-sequence = { workspace = true, optional = true }
merman-core-structured = { workspace = true, optional = true }
merman-markup = { workspace = true, features = ["html", "url"] }
merman-model = { workspace = true, features = ["html-entities"] }
cssparser.workspace = true
ryu-js = { workspace = true, optional = true }
indexmap = { workspace = true, features = ["serde"], optional = true }
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
json5.workspace = true
thiserror.workspace = true
unicode-general-category = { workspace = true, optional = true }
rustc-hash = { workspace = true, optional = true }

[dev-dependencies]
merman-core-structured = { workspace = true, features = ["test-support"] }
merman-core-preprocess = { workspace = true, features = ["test-support"] }
merman-model = { workspace = true, features = ["test-support"] }
futures = { workspace = true, features = ["executor"] }
merman-fixture-render-context = { path = "../merman-fixture-render-context" }
regex.workspace = true
