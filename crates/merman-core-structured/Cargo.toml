[package]
name = "merman-core-structured"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Syntax parsers for Merman's structured diagram families."
documentation = "https://docs.rs/merman-core-structured"
readme = "README.md"
keywords = ["mermaid", "diagrams", "parser"]
categories = ["parser-implementations", "visualization"]

[package.metadata.merman-legal]
third-party-bundle = true

[features]
default = []
diagram-block = ["dep:indexmap", "dep:merman-markup", "merman-markup/html", "dep:ryu-js", "merman-model/diagram-block"]
diagram-cynefin = ["dep:merman-core-preprocess", "merman-model/diagram-cynefin"]
diagram-event-modeling = ["dep:merman-core-preprocess", "dep:merman-markup", "merman-markup/html", "merman-model/diagram-event-modeling"]
diagram-gantt = ["dep:merman-core-preprocess", "dep:merman-markup", "merman-markup/url", "merman-model/diagram-gantt"]
diagram-info = ["dep:merman-core-preprocess", "merman-model/diagram-info"]
diagram-ishikawa = ["merman-model/diagram-ishikawa"]
diagram-journey = ["dep:merman-core-preprocess", "merman-model/diagram-journey"]
diagram-kanban = ["dep:merman-core-preprocess", "dep:merman-markup", "merman-markup/html", "dep:ryu-js", "dep:serde_json", "merman-model/diagram-kanban"]
diagram-packet = ["merman-model/diagram-packet"]
diagram-pie = ["dep:merman-core-preprocess", "dep:ryu-js", "merman-model/diagram-pie"]
diagram-quadrant-chart = ["dep:merman-core-preprocess", "dep:merman-markup", "merman-markup/html", "merman-model/diagram-quadrant-chart"]
diagram-radar = ["dep:merman-core-preprocess", "merman-model/diagram-radar"]
diagram-railroad = ["merman-model/diagram-railroad"]
diagram-sankey = ["merman-model/diagram-sankey", "dep:serde_json"]
diagram-timeline = ["dep:merman-core-preprocess", "merman-model/diagram-timeline"]
diagram-tree-view = ["dep:merman-core-preprocess", "dep:merman-markup", "merman-markup/html", "merman-model/diagram-tree-view"]
diagram-treemap = ["dep:merman-core-preprocess", "dep:serde_json", "merman-model/diagram-treemap"]
diagram-venn = ["merman-model/diagram-venn"]
diagram-wardley = ["dep:indexmap", "dep:merman-core-preprocess", "dep:ryu-js", "merman-model/diagram-wardley"]
diagram-xychart = ["dep:merman-markup", "merman-markup/html", "dep:ryu-js", "merman-model/diagram-xychart"]
editor-facts = []
presentation = ["merman-model/presentation-data"]
system-timezone = ["merman-model/system-timezone"]
test-support = []

[dependencies]
indexmap = { workspace = true, optional = true }
merman-core-preprocess = { workspace = true, optional = true }
merman-markup = { workspace = true, optional = true }
merman-model.workspace = true
ryu-js = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
merman-model = { workspace = true, features = ["test-support"] }
