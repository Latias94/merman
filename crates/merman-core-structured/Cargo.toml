[package]
name = "merman-core-structured"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Syntax parsers for Merman's structured diagram families."
readme = "README.md"

[package.metadata.merman-legal]
third-party-bundle = true

[features]
default = []
diagram-packet = ["merman-model/diagram-packet"]
diagram-railroad = ["merman-model/diagram-railroad"]
editor-facts = []

[dependencies]
merman-model.workspace = true

[dev-dependencies]
merman-model = { workspace = true, features = ["test-support"] }
