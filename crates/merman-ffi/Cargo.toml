[package]
name = "merman-ffi"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "C ABI bindings for merman headless Mermaid rendering."
documentation = "https://docs.rs/merman-ffi"
readme = "README.md"
keywords = ["mermaid", "diagrams", "ffi", "svg", "headless"]
categories = ["external-ffi-bindings", "visualization"]

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[package.metadata.merman]
artifact-profile-required = true

[features]
# Diagram selection is independent of output formats and optional layout engines.
all-diagrams = [
    "diagram-agentflow",
    "diagram-architecture",
    "diagram-block",
    "diagram-c4",
    "diagram-class",
    "diagram-cynefin",
    "diagram-er",
    "diagram-event-modeling",
    "diagram-flowchart",
    "diagram-gantt",
    "diagram-git-graph",
    "diagram-info",
    "diagram-ishikawa",
    "diagram-journey",
    "diagram-kanban",
    "diagram-mindmap",
    "diagram-packet",
    "diagram-pie",
    "diagram-quadrant-chart",
    "diagram-radar",
    "diagram-railroad",
    "diagram-requirement",
    "diagram-sankey",
    "diagram-sequence",
    "diagram-state",
    "diagram-swimlane",
    "diagram-timeline",
    "diagram-tree-view",
    "diagram-treemap",
    "diagram-usecase",
    "diagram-venn",
    "diagram-wardley",
    "diagram-xychart",
    "diagram-zenuml",
]
diagram-architecture = ["merman-bindings-core/diagram-architecture", "merman/diagram-architecture"]
diagram-block = ["merman-bindings-core/diagram-block", "merman/diagram-block"]
diagram-c4 = ["merman-bindings-core/diagram-c4", "merman/diagram-c4"]
diagram-class = ["merman-bindings-core/diagram-class", "merman/diagram-class"]
diagram-cynefin = ["merman-bindings-core/diagram-cynefin", "merman/diagram-cynefin"]
diagram-er = ["merman-bindings-core/diagram-er", "merman/diagram-er"]
diagram-event-modeling = [
    "merman-bindings-core/diagram-event-modeling",
    "merman/diagram-event-modeling",
]
diagram-agentflow = ["merman-bindings-core/diagram-agentflow", "merman/diagram-agentflow"]
diagram-usecase = ["merman-bindings-core/diagram-usecase", "merman/diagram-usecase"]
diagram-flowchart = ["merman-bindings-core/diagram-flowchart", "merman/diagram-flowchart"]
diagram-gantt = ["merman-bindings-core/diagram-gantt", "merman/diagram-gantt"]
diagram-git-graph = ["merman-bindings-core/diagram-git-graph", "merman/diagram-git-graph"]
diagram-info = ["merman-bindings-core/diagram-info", "merman/diagram-info"]
diagram-ishikawa = ["merman-bindings-core/diagram-ishikawa", "merman/diagram-ishikawa"]
diagram-journey = ["merman-bindings-core/diagram-journey", "merman/diagram-journey"]
diagram-kanban = ["merman-bindings-core/diagram-kanban", "merman/diagram-kanban"]
diagram-mindmap = ["merman-bindings-core/diagram-mindmap", "merman/diagram-mindmap"]
diagram-packet = ["merman-bindings-core/diagram-packet", "merman/diagram-packet"]
diagram-pie = ["merman-bindings-core/diagram-pie", "merman/diagram-pie"]
diagram-quadrant-chart = [
    "merman-bindings-core/diagram-quadrant-chart",
    "merman/diagram-quadrant-chart",
]
diagram-radar = ["merman-bindings-core/diagram-radar", "merman/diagram-radar"]
diagram-railroad = ["merman-bindings-core/diagram-railroad", "merman/diagram-railroad"]
diagram-requirement = ["merman-bindings-core/diagram-requirement", "merman/diagram-requirement"]
diagram-sankey = ["merman-bindings-core/diagram-sankey", "merman/diagram-sankey"]
diagram-sequence = ["merman-bindings-core/diagram-sequence", "merman/diagram-sequence"]
diagram-state = ["merman-bindings-core/diagram-state", "merman/diagram-state"]
diagram-swimlane = ["merman-bindings-core/diagram-swimlane", "merman/diagram-swimlane"]
diagram-timeline = ["merman-bindings-core/diagram-timeline", "merman/diagram-timeline"]
diagram-tree-view = ["merman-bindings-core/diagram-tree-view", "merman/diagram-tree-view"]
diagram-treemap = ["merman-bindings-core/diagram-treemap", "merman/diagram-treemap"]
diagram-venn = ["merman-bindings-core/diagram-venn", "merman/diagram-venn"]
diagram-wardley = ["merman-bindings-core/diagram-wardley", "merman/diagram-wardley"]
diagram-xychart = ["merman-bindings-core/diagram-xychart", "merman/diagram-xychart"]
diagram-zenuml = ["merman-bindings-core/diagram-zenuml", "merman/diagram-zenuml"]
default = []
native-runtime = ["merman-bindings-core/native-runtime"]
analysis = ["merman-bindings-core/analysis"]
ascii = ["merman-bindings-core/ascii"]
svg = ["merman-bindings-core/svg"]
png = ["svg", "merman-bindings-core/png"]
jpeg = ["svg", "merman-bindings-core/jpeg"]
pdf = ["svg", "merman-bindings-core/pdf"]
layout-cytoscape = ["svg", "merman-bindings-core/layout-cytoscape"]
layout-elk = ["svg", "merman-bindings-core/layout-elk"]
math = ["svg", "merman-bindings-core/math"]
[dependencies]
merman-bindings-core.workspace = true
merman.workspace = true
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
cc = "1.5.1"
libloading = "0.9.0"
