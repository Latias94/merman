[package]
name = "merman-core-preprocess"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Controlled source text edits and byte-span mapping for Merman."
documentation = "https://docs.rs/merman-core-preprocess"
readme = "README.md"
keywords = ["mermaid", "parser", "preprocessing", "source-map"]
categories = ["parser-implementations", "text-processing"]

[package.metadata.merman-legal]
third-party-bundle = true

[features]
default = []
mermaid-unicode = []
yaml = ["dep:granit-parser", "dep:serde_json"]
yaml-editor = ["yaml", "granit-parser/comments"]
test-support = []

[dependencies]
granit-parser = { workspace = true, optional = true }
merman-model.workspace = true
serde_json = { workspace = true, optional = true }

[dev-dependencies]
merman-model = { workspace = true, features = ["test-support"] }
