[package]
name = "merman-model"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Canonical Mermaid data and shared controlled execution contracts."
documentation = "https://docs.rs/merman-model"
readme = "README.md"
keywords = ["mermaid", "diagrams", "model"]
categories = ["data-structures", "visualization"]

[package.metadata.merman]
artifact-profile-required = true

[features]
default = []
all-diagrams = [
    "diagram-agentflow",
    "diagram-architecture",
    "diagram-block",
    "diagram-c4",
    "diagram-class",
    "diagram-cynefin",
    "diagram-er",
    "diagram-event-modeling",
    "diagram-flowchart",
    "diagram-gantt",
    "diagram-git-graph",
    "diagram-info",
    "diagram-ishikawa",
    "diagram-journey",
    "diagram-kanban",
    "diagram-mindmap",
    "diagram-packet",
    "diagram-pie",
    "diagram-quadrant-chart",
    "diagram-radar",
    "diagram-railroad",
    "diagram-requirement",
    "diagram-sankey",
    "diagram-sequence",
    "diagram-state",
    "diagram-swimlane",
    "diagram-timeline",
    "diagram-tree-view",
    "diagram-treemap",
    "diagram-usecase",
    "diagram-venn",
    "diagram-wardley",
    "diagram-xychart",
    "diagram-zenuml",
]
test-support = []
presentation-data = []
html-entities = ["dep:htmlize"]
terminal-text = ["dep:unicode-segmentation", "dep:unicode-width"]
diagram-architecture = []
diagram-c4 = []
diagram-cynefin = []
diagram-event-modeling = []
diagram-er = ["dep:indexmap"]
diagram-state = ["dep:indexmap"]
diagram-class = ["dep:indexmap"]
diagram-flowchart = ["dep:indexmap", "dep:rustc-hash"]
diagram-swimlane = ["dep:indexmap", "dep:rustc-hash"]
diagram-agentflow = ["dep:indexmap", "dep:rustc-hash"]
diagram-quadrant-chart = []
diagram-requirement = []
diagram-sankey = []
diagram-venn = []
diagram-wardley = []
diagram-gantt = []
diagram-git-graph = []
diagram-sequence = []
diagram-tree-view = []
diagram-zenuml = []
diagram-mindmap = []
diagram-xychart = []
diagram-block = ["dep:indexmap"]
diagram-info = []
diagram-ishikawa = []
diagram-journey = []
diagram-kanban = []
diagram-packet = []
diagram-pie = []
diagram-radar = []
diagram-railroad = []
diagram-timeline = []
diagram-treemap = []
diagram-usecase = []
operation-deadlines = ["dep:web-time"]
system-clock = []
system-timezone = [
    "dep:jiff",
    "dep:sha2",
    "jiff/std",
    "jiff/tz-system",
    "jiff/tz-fat",
    "jiff/tzdb-bundle-platform",
    "jiff/tzdb-zoneinfo",
    "jiff/tzdb-concatenated",
    "jiff/perf-inline",
]
system-random = ["dep:getrandom", "getrandom/std"]
system-timing = ["dep:web-time"]

[dependencies]
htmlize = { workspace = true, optional = true }
unicode-segmentation = { workspace = true, optional = true }
unicode-width = { workspace = true, optional = true }
indexmap = { workspace = true, features = ["serde"], optional = true }
rustc-hash = { workspace = true, optional = true }
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }
thiserror.workspace = true
jiff = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
web-time = { workspace = true, optional = true }
