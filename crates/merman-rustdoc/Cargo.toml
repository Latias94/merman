[package]
name = "merman-rustdoc"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Render Mermaid fences in rustdoc with headless Merman SVG output."
documentation = "https://docs.rs/merman-rustdoc"
readme = "README.md"
keywords = ["mermaid", "rustdoc", "proc-macro", "svg", "docs"]
categories = ["development-tools::build-utils", "visualization"]

[lib]
proc-macro = true

[package.metadata.merman]
artifact-profile-required = true

[features]
default = []
svg = [
    "dep:merman",
    "dep:proc-macro2",
    "dep:quote",
    "dep:roxmltree",
    "dep:serde_json",
    "dep:syn",
    "merman/svg",
]
layout-cytoscape = ["svg", "merman/layout-cytoscape"]
layout-elk = ["svg", "merman/layout-elk"]
math = ["svg", "merman/math"]

[dependencies]
merman = { workspace = true, default-features = false, optional = true }
proc-macro2 = { workspace = true, optional = true }
quote = { workspace = true, optional = true }
roxmltree = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
syn = { workspace = true, optional = true }

[[test]]
name = "attribute_macro"
required-features = ["svg"]

[[test]]
name = "complete_svg_e2e"
required-features = ["layout-cytoscape", "layout-elk", "math", "svg"]

[[test]]
name = "rustdoc_e2e"
required-features = ["svg"]
