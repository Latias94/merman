[package]
name = "merman-rustdoc"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Render Mermaid fences in rustdoc with headless Merman SVG output."
documentation = "https://docs.rs/merman-rustdoc"
readme = "README.md"
keywords = ["mermaid", "rustdoc", "proc-macro", "svg", "docs"]
categories = ["development-tools::build-utils", "visualization"]

[lib]
proc-macro = true

[package.metadata.merman]
artifact-profile-required = true

[features]
# Diagram selection is independent of output formats and optional layout engines.
all-diagrams = [
    "diagram-architecture",
    "diagram-block",
    "diagram-c4",
    "diagram-class",
    "diagram-cynefin",
    "diagram-er",
    "diagram-event-modeling",
    "diagram-flowchart",
    "diagram-gantt",
    "diagram-git-graph",
    "diagram-info",
    "diagram-ishikawa",
    "diagram-journey",
    "diagram-kanban",
    "diagram-mindmap",
    "diagram-packet",
    "diagram-pie",
    "diagram-quadrant-chart",
    "diagram-radar",
    "diagram-railroad",
    "diagram-requirement",
    "diagram-sankey",
    "diagram-sequence",
    "diagram-state",
    "diagram-swimlane",
    "diagram-timeline",
    "diagram-tree-view",
    "diagram-treemap",
    "diagram-venn",
    "diagram-wardley",
    "diagram-xychart",
    "diagram-zenuml",
]
diagram-architecture = ["merman?/diagram-architecture"]
diagram-block = ["merman?/diagram-block"]
diagram-c4 = ["merman?/diagram-c4"]
diagram-class = ["merman?/diagram-class"]
diagram-cynefin = ["merman?/diagram-cynefin"]
diagram-er = ["merman?/diagram-er"]
diagram-event-modeling = ["merman?/diagram-event-modeling"]
diagram-flowchart = ["merman?/diagram-flowchart"]
diagram-gantt = ["merman?/diagram-gantt"]
diagram-git-graph = ["merman?/diagram-git-graph"]
diagram-info = ["merman?/diagram-info"]
diagram-ishikawa = ["merman?/diagram-ishikawa"]
diagram-journey = ["merman?/diagram-journey"]
diagram-kanban = ["merman?/diagram-kanban"]
diagram-mindmap = ["merman?/diagram-mindmap"]
diagram-packet = ["merman?/diagram-packet"]
diagram-pie = ["merman?/diagram-pie"]
diagram-quadrant-chart = ["merman?/diagram-quadrant-chart"]
diagram-radar = ["merman?/diagram-radar"]
diagram-railroad = ["merman?/diagram-railroad"]
diagram-requirement = ["merman?/diagram-requirement"]
diagram-sankey = ["merman?/diagram-sankey"]
diagram-sequence = ["merman?/diagram-sequence"]
diagram-state = ["merman?/diagram-state"]
diagram-swimlane = ["merman?/diagram-swimlane"]
diagram-timeline = ["merman?/diagram-timeline"]
diagram-tree-view = ["merman?/diagram-tree-view"]
diagram-treemap = ["merman?/diagram-treemap"]
diagram-venn = ["merman?/diagram-venn"]
diagram-wardley = ["merman?/diagram-wardley"]
diagram-xychart = ["merman?/diagram-xychart"]
diagram-zenuml = ["merman?/diagram-zenuml"]
default = ["all-diagrams", "svg", "layout-cytoscape"]
complete-svg = ["svg", "layout-cytoscape", "math"]
complete-svg-elk = ["complete-svg", "layout-elk"]
svg = [
    "dep:merman",
    "dep:proc-macro2",
    "dep:quote",
    "dep:merman-doc",
    "dep:proc-macro-crate",
    "dep:serde_json",
    "dep:syn",
    "merman/svg",
]
layout-cytoscape = ["svg", "merman/layout-cytoscape"]
layout-elk = ["svg", "merman/layout-elk"]
math = ["svg", "merman/math"]

[dependencies]
merman = { workspace = true, default-features = false, optional = true }
proc-macro2 = { workspace = true, optional = true }
quote = { workspace = true, optional = true }
merman-doc = { workspace = true, optional = true }
proc-macro-crate = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
syn = { workspace = true, optional = true }

[[test]]
name = "attribute_macro"
required-features = ["svg"]

[[test]]
name = "complete_svg_e2e"
required-features = ["layout-cytoscape", "layout-elk", "math", "svg"]

[[test]]
name = "rustdoc_e2e"
required-features = ["svg"]

[dev-dependencies]
roxmltree.workspace = true
