t-baseline="auto" text-anchor="middle">12</text><rect x="1" y="14" width="28" height="32" class="packetBlock"/><text x="15" y="30" class="packetLabel" dominant-baseline="middle" text-anchor="middle">FLAGS</text><text x="1" y="12" class="packetByte start" dominant-baseline="auto" text-anchor="start">15</text><text x="29" y="12" class="packetByte end" dominant-baseline="auto" text-anchor="end">13</text></g><g><rect x="111" y="60" width="48" height="32" class="packetBlock"/><text x="135" y="76" class="packetLabel" dominant-baseline="middle" text-anchor="middle">FLAGS</text><text x="111" y="58" class="packetByte start" dominant-baseline="auto" text-anchor="start">20</text><text x="159" y="58" class="packetByte end" dominant-baseline="auto" text-anchor="end">16</text><rect x="81" y="60" width="28" height="32" class="packetBlock"/><text x="95" y="76" class="packetLabel" dominant-baseline="middle" text-anchor="middle">TAIL</text><text x="81" y="58" class="packetByte start" dominant-baseline="auto" text-anchor="start">23</text><text x="109" y="58" class="packetByte end" dominant-baseline="auto" text-anchor="end">21</text></g><text x="81" y="83" dominant-baseline="middle" text-anchor="middle" class="packetTitle"/></svg>