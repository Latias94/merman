<svg id="bit_order_descending" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 162 106" style="max-width: 162px; background-color: white;" role="graphics-document document" aria-roledescription="packet"><style>#bit_order_descending{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#bit_order_descending .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#bit_order_descending .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#bit_order_descending .error-icon{fill:#552222;}#bit_order_descending .error-text{fill:#552222;stroke:#552222;}#bit_order_descending .edge-thickness-normal{stroke-width:1px;}#bit_order_descending .edge-thickness-thick{stroke-width:3.5px;}#bit_order_descending .edge-pattern-solid{stroke-dasharray:0;}#bit_order_descending .edge-thickness-invisible{stroke-width:0;fill:none;}#bit_order_descending .edge-pattern-dashed{stroke-dasharray:3;}#bit_order_descending .edge-pattern-dotted{stroke-dasharray:2;}#bit_order_descending .marker{fill:#333333;stroke:#333333;}#bit_order_descending .marker.cross{stroke:#333333;}#bit_order_descending svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#bit_order_descending p{margin:0;}#bit_order_descending .packetByte{font-size:10px;}#bit_order_descending .packetByte.start{fill:black;}#bit_order_descending .packetByte.end{fill:black;}#bit_order_descending .packetLabel{fill:black;font-size:12px;}#bit_order_descending .packetTitle{fill:black;font-size:14px;}#bit_order_descending .packetBlock{stroke:black;stroke-width:1;fill:#efefef;}#bit_order_descending .node .neo-node{stroke:#9370DB;}#bit_order_descending [data-look="neo"].node rect,#bit_order_descending [data-look