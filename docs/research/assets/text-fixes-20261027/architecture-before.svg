<svg id="architecture" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-13.34375 18 106.6875 103.53906297683716" role="graphics-document document" aria-roledescription="architecture"><style>#architecture{font-family:Arial;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#architecture .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#architecture .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#architecture .error-icon{fill:#552222;}#architecture .error-text{fill:#552222;stroke:#552222;}#architecture .edge-thickness-normal{stroke-width:1px;}#architecture .edge-thickness-thick{stroke-width:3.5px;}#architecture .edge-pattern-solid{stroke-dasharray:0;}#architecture .edge-thickness-invisible{stroke-width:0;fill:none;}#architecture .edge-pattern-dashed{stroke-dasharray:3;}#architecture .edge-pattern-dotted{stroke-dasharray:2;}#architecture .marker{fill:#333333;stroke:#333333;}#architecture .marker.cross{stroke:#333333;}#architecture svg{font-family:Arial;font-size:16px;}#architecture p{margin:0;}#architecture .edge{stroke-width:3;stroke:#333333;fill:none;}#architecture .arrow{fill:#333333;}#architecture .node-bkg{fill:none;stroke:hsl(240, 60%, 86.2745098039%);stroke-width:2px;stroke-dasharray:8;}#architecture .node-icon-text{display:flex;align-items:center;}#architecture .node-icon-text>div{color:#fff;margin:1px;height:fit-content;text-align:center;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;}#architecture .node .neo-node{stroke:#9370DB;}#architecture [data-look="neo"].node rect,#architecture [data-look="neo"].cluster rect,#architecture [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#architecture [data-look="neo"].swimlane.cluster rect{filter:none;}#architecture [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#architecture [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#architecture [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#architecture [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#architecture [data-look="neo"].node circle .state-start{fill:#000000;}#architecture [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#architecture [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#architecture :root{--mermaid-font-family:Arial;}</style><g/><g class="architecture-edges"></g><g class="architecture-services"><g id="architecture-service-api" class="architecture-service" transform="translate(0,18)"><g dy="1em" alignment-baseline="middle" dominant-baseline="middle" text-anchor="middle" transform="translate(40, 80)"><g><rect class="background" style="stroke: none"/><text y="-10.1" style=""><tspan class="text-outer-tspan row" x="0" y="-0.1em" dy="1.1em"><tspan font-style="normal" class="text-inner-tspan" font-weight="bold">minimum</tspan><tspan font-style="normal" class="text-inner-tspan" font-weight="bold"> width</tspan></tspan></text></g></g><g><path class="node-bkg" id="architecture-node-api" d="M0,80 V5 Q0,0 5,0 H75 Q80,0 80,5 V80 Z"/></g></g></g><g class="architecture-groups"/></svg>
