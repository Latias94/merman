<svg id="review-quadrant" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 500 500" style="max-width:500px;background-color:#1e1f22" role="graphics-document document" aria-roledescription="quadrantChart"><rect class="merman-theme-canvas-base" data-merman-theme-canvas="base" aria-hidden="true" pointer-events="none" x="0" y="0" width="500" height="500" fill="#0f172a"/><style>#review-quadrant{font-family:Inter, ui-sans-serif, system-ui, sans-serif;font-size:16px;fill:#333;}#review-quadrant .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;stroke-linecap:round;}#review-quadrant .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;stroke-linecap:round;}#review-quadrant .error-icon{fill:hsl(220.5882352941, 100%, 98.3333333333%);}#review-quadrant .error-text{fill:rgb(8.5000000002, 5.7500000001, 0);stroke:rgb(8.5000000002, 5.7500000001, 0);}#review-quadrant .edge-thickness-normal{stroke-width:1px;}#review-quadrant .edge-thickness-thick{stroke-width:3.5px;}#review-quadrant .edge-pattern-solid{stroke-dasharray:0;}#review-quadrant .edge-thickness-invisible{stroke-width:0;fill:none;}#review-quadrant .edge-pattern-dashed{stroke-dasharray:3;}#review-quadrant .edge-pattern-dotted{stroke-dasharray:2;}#review-quadrant .marker{fill:#0b0b0b;stroke:#0b0b0b;}#review-quadrant .marker.cross{stroke:#0b0b0b;}#review-quadrant svg{font-family:Inter, ui-sans-serif, system-ui, sans-serif;font-size:16px;}#review-quadrant p{margin:0;}#review-quadrant .node .neo-node{stroke:hsl(40.5882352941, 60%, 83.3333333333%);}#review-quadrant [data-look="neo"].node rect,#review-quadrant [data-look="neo"].cluster rect,#review-quadrant [data-look="neo"].node polygon{stroke:url(#review-quadrant-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#review-quadrant [data-look="neo"].swimlane.cluster rect{filter:none;}#review-quadrant [data-look="neo"].node path{stroke:url(#review-quadrant-gradient);stroke-width:1px;}#review-quadrant [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#review-quadrant [data-look="neo"].node .neo-line path{stroke:hsl(40.5882352941, 60%, 83.3333333333%);filter:none;}#review-quadrant [data-look="neo"].node circle{stroke:url(#review-quadrant-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#review-quadrant [data-look="neo"].node circle .state-start{fill:#000000;}#review-quadrant [data-look="neo"].icon-shape .icon{fill:url(#review-quadrant-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#review-quadrant [data-look="neo"].icon-shape .icon-neo path{stroke:url(#review-quadrant-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}</style><g/><g class="main"><g class="quadrants"><g class="quadrant"><rect x="263" y="45" width="232" height="212" fill="#e8f5e9"/><text x="0" y="0" fill="#333" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(379, 50) rotate(0)">Plan</text></g><g class="quadrant"><rect x="31" y="45" width="232" height="212" fill="#e3f2fd"/><text x="0" y="0" fill="#2e2e2e" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(147, 50) rotate(0)">Do now</text></g><g class="quadrant"><rect x="31" y="257" width="232" height="212" fill="#f5f5f5"/><text x="0" y="0" fill="#292929" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(147, 262) rotate(0)">Maybe</text></g><g class="quadrant"><rect x="263" y="257" width="232" height="212" fill="#ffebee"/><text x="0" y="0" fill="#242424" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(379, 262) rotate(0)">Drop</text></g></g><g class="border"><line x1="30" y1="45" x2="496" y2="45" style="stroke:#94a3b8;stroke-width:2"/><line x1="495" y1="46" x2="495" y2="468" style="stroke:#94a3b8;stroke-width:2"/><line x1="30" y1="469" x2="496" y2="469" style="stroke:#94a3b8;stroke-width:2"/><line x1="31" y1="46" x2="31" y2="468" style="stroke:#94a3b8;stroke-width:2"/><line x1="263" y1="46" x2="263" y2="468" style="stroke:#94a3b8;stroke-width:1"/><line x1="32" y1="257" x2="494" y2="257" style="stroke:#94a3b8;stroke-width:1"/></g><g class="data-points"><g class="data-point"><circle cx="379" cy="363" r="5" fill="#000000" stroke="none" stroke-width="0"/><text x="0" y="0" fill="#e5e7eb" font-size="12" dominant-baseline="hanging" text-anchor="middle" transform="translate(379, 368) rotate(0)">Delta</text></g><g class="data-point"><circle cx="170.2" cy="341.8" r="5" fill="#000000" stroke="none" stroke-width="0"/><text x="0" y="0" fill="#e5e7eb" font-size="12" dominant-baseline="hanging" text-anchor="middle" transform="translate(170.2, 346.8) rotate(0)">Gamma</text></g><g class="data-point"><circle cx="355.79999999999995" cy="129.79999999999995" r="5" fill="#000000" stroke="none" stroke-width="0"/><text x="0" y="0" fill="#e5e7eb" font-size="12" dominant-baseline="hanging" text-anchor="middle" transform="translate(355.79999999999995, 134.79999999999995) rotate(0)">Beta</text></g><g class="data-point"><circle cx="147" cy="151" r="5" fill="#000000" stroke="none" stroke-width="0"/><text x="0" y="0" fill="#e5e7eb" font-size="12" dominant-baseline="hanging" text-anchor="middle" transform="translate(147, 156) rotate(0)">Alpha</text></g></g><g class="labels"><g class="label"><text x="0" y="0" fill="#e5e7eb" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(147, 479) rotate(0)">Low cost</text></g><g class="label"><text x="0" y="0" fill="#e5e7eb" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(379, 479) rotate(0)">High cost</text></g><g class="label"><text x="0" y="0" fill="#e5e7eb" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(5, 363) rotate(-90)">Low value</text></g><g class="label"><text x="0" y="0" fill="#e5e7eb" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(5, 151) rotate(-90)">High value</text></g></g><g class="title"><text x="0" y="0" fill="#e5e7eb" font-size="20" dominant-baseline="hanging" text-anchor="middle" transform="translate(250, 10) rotate(0)">Value vs. cost</text></g></g></svg>
