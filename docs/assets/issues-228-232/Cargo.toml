[package]
name = "merman-issue-comparison"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[workspace]

[[bin]]
name = "merman-issue-comparison"
path = "capture.rs"

[dependencies]
merman-bindings-core = { path = "../../../crates/merman-bindings-core", features = ["all-diagrams", "svg", "png"] }
merman = { path = "../../../crates/merman", default-features = false }
merman-export = { path = "../../../crates/merman-export", features = ["native-fonts"] }
serde_json = "1"
usvg = { version = "=0.47.0", default-features = false, features = ["text"] }
resvg = { version = "=0.47.0", default-features = false }
tiny-skia = "=0.12.0"
