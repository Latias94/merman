<svg id="zenuml" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="max-width:222px;background-color:#1e1f22" viewBox="0 0 222 211" role="graphics-document document" aria-roledescription="zenuml"><defs><style>#zenuml .frame-border-outer{fill:#666}#zenuml .frame-border-inner,#zenuml .frame-header-bg{fill:#fff}#zenuml .frame-header-line{stroke:#666;stroke-width:1;shape-rendering:crispEdges}#zenuml .frame-title{font-family:Helvetica,Verdana,serif;font-size:16px;font-weight:600;fill:#222}#zenuml .participant-box{fill:#fff;stroke:#666;stroke-width:2}#zenuml .participant-label{font-family:Helvetica,Verdana,serif;font-size:16px;fill:#222}#zenuml .participant-icon{color:#222}#zenuml .participant-icon [fill="currentColor"]:not([stroke]){stroke:#666;stroke-width:1}#zenuml .participant-emoji{font-size:16px}#zenuml .stereotype-label{font-family:Helvetica,Verdana,serif;font-size:16px;fill:#222}#zenuml .lifeline{stroke:#666;stroke-width:1}#zenuml .message-line{stroke:#000;stroke-width:2;shape-rendering:crispEdges}#zenuml .message-label{font-family:Helvetica,Verdana,serif;font-size:14px;fill:#222}#zenuml .arrow-head{fill:#000;stroke:#000;stroke-width:2}#zenuml .arrow-open{fill:none}#zenuml .occurrence{fill:#dedede;stroke:#666;stroke-width:2;shape-rendering:crispEdges}#zenuml .fragment-border{fill:none;stroke:#666;stroke-width:1;shape-rendering:crispEdges}#zenuml .fragment-header{fill:#dedede;fill-opacity:.498;stroke:none;shape-rendering:crispEdges}#zenuml .fragment-label{font-family:Helvetica,Verdana,serif;font-size:14px;font-weight:600;fill:#000}#zenuml .fragment-condition{font-family:Helvetica,Verdana,serif;font-size:14px;fill:#000}#zenuml .fragment-separator{stroke:#e5e7eb;stroke-width:1;shape-rendering:crispEdges}#zenuml .fragment-section-label{font-family:Helvetica,Verdana,serif;font-size:14px;fill:#000}#zenuml .return-line{stroke:#000;stroke-width:2;stroke-dasharray:6,4;shape-rendering:crispEdges}#zenuml .return-arrow{stroke:#000;stroke-width:2;fill:none}#zenuml .return-label{font-family:Helvetica,Verdana,serif;font-size:14px;fill:#222}#zenuml .return-icon{fill:#222}#zenuml .divider-line{stroke:#aa3;stroke-width:1}#zenuml .divider-bg{fill:#fff5ad;stroke:#aa3;stroke-width:1}#zenuml .divider-label{font-family:Helvetica,Verdana,serif;font-size:14px;fill:#333}#zenuml .comment-text{font-family:Helvetica,Verdana,serif;font-size:14px;fill:#333;opacity:.5}#zenuml .seq-number{font-family:Helvetica,Verdana,serif;font-size:12px;font-weight:100;fill:#6b7280}#zenuml .group-outline{fill:none;stroke:#666}#zenuml .group-title-bg{fill:#fff;stroke:none}#zenuml .group-title-text{font-family:Helvetica,Verdana,serif;font-size:13px;font-weight:400;fill:#222}</style></defs><rect class="frame-border-outer" x="0" y="0" width="222" height="211" rx="4"/><rect class="frame-border-inner" x="1" y="1" width="220" height="209" rx="3"/><line class="frame-header-line" x1="1" y1="33.5" x2="221" y2="33.5"/><g class="zenuml-content" transform="translate(11, 34)"><line class="lifeline" data-participant="Alice" x1="50.5" y1="68" x2="50.5" y2="176" stroke-dasharray="5,5" stroke-dashoffset="5" shape-rendering="crispEdges"/><line class="lifeline" data-participant="Bob" x1="150.5" y1="68" x2="150.5" y2="176" stroke-dasharray="5,5" stroke-dashoffset="5" shape-rendering="crispEdges"/><g class="participant" data-participant="Alice"><rect class="participant-box" x="11" y="29" width="78" height="38" rx="3"/><text class="participant-label" x="50" y="47.75" text-anchor="middle" dominant-baseline="central">Alice</text></g><g class="participant" data-participant="Bob"><rect class="participant-box" x="111" y="29" width="78" height="38" rx="3"/><text class="participant-label" x="150" y="47.75" text-anchor="middle" dominant-baseline="central">Bob</text></g><g class="message" data-statement="zenuml-statement-0"><line class="message-line" x1="51" y1="87" x2="150" y2="87" /><svg x="143" y="82" width="7" height="10" viewBox="0 0 7 9" overflow="visible" class="arrow-head arrow-open"><g><path d="M1 1.25 L6.15 4.5 L1 7.75" stroke="#000" stroke-linecap="round" stroke-width="2" fill="none"/></g></svg><text class="message-label" x="97" y="84" text-anchor="middle">Hello</text><text class="seq-number" x="47" y="84" text-anchor="end">1</text></g><g class="return" data-statement="zenuml-statement-1"><line x1="150" y1="119" x2="51" y2="119" class="return-line"/><polyline points="56.15,115.75 51,119 56.15,122.25" fill="none" stroke-linecap="round" class="return-arrow"/><text x="104" y="116" text-anchor="middle" class="return-label">Reply</text><text x="47" y="116" text-anchor="end" class="seq-number">2</text></g></g></svg>