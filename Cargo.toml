[workspace]
resolver = "2"
members = [
    "crates/merman",
    "crates/merman-analysis",
    "crates/merman-editor-core",
    "crates/merman-fixture-render-context",
    "crates/merman-core",
    "crates/merman-ascii",
    "crates/merman-bindings-core",
    "crates/merman-android-jni",
    "crates/merman-cli",
    "crates/merman-lsp",
    "crates/merman-ffi",
    "crates/merman-elk-layered",
    "crates/merman-layout-elk",
    "crates/merman-rustdoc",
    "crates/merman-render",
    "crates/merman-export",
    "crates/merman-typst-plugin",
    "crates/merman-uniffi",
    "crates/merman-wasm",
    "crates/dugong",
    "crates/dugong-graphlib",
    "crates/manatee",
    "crates/roughr",
    "crates/xtask",
]
exclude = [
    "repo-ref/dear-imgui-rs",
    "repo-ref/mermaid-rs-renderer",
]

[workspace.package]
version = "0.8.0-alpha.5"
edition = "2024"
authors = ["Mingzhen Zhuang <superfrankie621@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Latias94/merman"
homepage = "https://github.com/Latias94/merman"
rust-version = "1.95"

[workspace.metadata.merman-release]
independent-packages = ["roughr-merman"]

[workspace.dependencies]
atomic-write-file = { version = "0.3.0", default-features = false }
base64 = "0.22.1"
data-url = "0.3.2"
brotli = "8.0.3"
clap_mangen = "0.3.0"
euclid = "0.22.14"
flate2 = "1.1.9"
fs2 = "0.4.3"
htmlize = { version = "1.1.0", features = ["unescape"] }
indexmap = "2.2.6"
lalrpop = "0.23.1"
lalrpop-util = { version = "0.23.1", default-features = false }
libc = "0.2"
libm = { version = "=0.2.16", default-features = false }
pulldown-cmark = { version = "0.13.4", default-features = false }
ratex-layout = "0.1.14"
ratex-parser = "0.1.14"
ratex-svg = { version = "0.1.14", default-features = false }
ratex-types = "0.1.14"
regex = "1.11.1"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "default-tls"] }
rayon = "1.12.0"
roxmltree = "0.21.1"
quick-xml = "0.41.0"
ropey = { version = "1.6.1", default-features = false, features = ["cr_lines", "simd"] }
rustc-hash = "2.1.1"
ryu-js = "1.0.2"
roughr = { package = "roughr-merman", path = "crates/roughr", version = "0.12.3", default-features = false }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.150"
same-file = "1.0.6"
rustix = { version = "1.1.4", default-features = false, features = ["fs", "std"] }
sha2 = "0.10.9"
similar = { version = "3.1.1", default-features = false, features = ["std", "text"] }
tokio = { version = "1.52.3", default-features = false }
granit-parser = { version = "=1.0.0", default-features = false, features = ["error_messages"] }
serde-saphyr = { version = "=1.0.0", default-features = false }
toml = "1.1.2"
json5 = "1.3.1"
jsonschema = { version = "0.49.9", default-features = false }
kurbo = "0.13.1"
js-sys = "0.3"
thiserror = "2.0.11"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["fmt"] }
uniffi = { version = "0.32.0", default-features = false }
futures = { version = "0.3.31", default-features = false }
hashbrown = { version = "0.17.1", default-features = false, features = ["equivalent"] }
hickory-resolver = { version = "0.26.1", default-features = false, features = ["tokio", "system-config"] }
icu_collator = { version = "2.2.1", default-features = false, features = ["compiled_data"] }
icu_locale_core = { version = "2.2.0", default-features = false, features = ["alloc"] }
lol_html = "3.0"
url = "2.5.4"
cssparser = "0.36.0"
jiff = { version = "0.2.34", default-features = false }
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
console_error_panic_hook = "0.1"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
png = "0.18"
proc-macro2 = "1"
quote = "1"
getrandom = { version = "0.4", default-features = false }
resvg = { version = "0.47", default-features = false }
serde-wasm-bindgen = "0.6"
syn = { version = "2", features = ["full", "parsing"] }
usvg = { version = "0.47", default-features = false }
svgtypes = "=0.16.1"
tiny-skia = "0.12"
krilla = { version = "0.8", default-features = false }
krilla-svg = { version = "0.8", default-features = false }
unicode-width = { version = "0.2.2", default-features = false }
unicode-linebreak = "0.1.5"
unicode-segmentation = { version = "1.13.3", default-features = false }
unicode-general-category = "1.1.0"
unicode-normalization = "0.1.25"
wasm-bindgen = "0.2"
web-time = "1.1.0"
wasm-minimal-protocol = "0.2.0"
wasmi = { version = "1.0.9", default-features = false, features = ["simd"] }
windows-sys = { version = "0.61.2", default-features = false }
# The crate requires one transport runtime even when consumers only construct its LSP service.
tower-lsp-server = { version = "0.23.0", default-features = false, features = ["runtime-tokio"] }

# Workspace crates (publishable). Keeping versions explicit makes `cargo publish` work without
# duplicating version requirements across crates.
merman = { path = "crates/merman", version = "0.8.0-alpha.5", default-features = false }
merman-analysis = { path = "crates/merman-analysis", version = "0.8.0-alpha.5", default-features = false }
merman-ascii = { path = "crates/merman-ascii", version = "0.8.0-alpha.5", default-features = false }
merman-bindings-core = { path = "crates/merman-bindings-core", version = "0.8.0-alpha.5", default-features = false }
merman-core = { path = "crates/merman-core", version = "0.8.0-alpha.5", default-features = false }
merman-editor-core = { path = "crates/merman-editor-core", version = "0.8.0-alpha.5", default-features = false }
merman-elk-layered = { path = "crates/merman-elk-layered", version = "0.8.0-alpha.5", default-features = false }
merman-layout-elk = { path = "crates/merman-layout-elk", version = "0.8.0-alpha.5" }
merman-ffi = { path = "crates/merman-ffi", version = "0.8.0-alpha.5" }
merman-rustdoc = { path = "crates/merman-rustdoc", version = "0.8.0-alpha.5" }
merman-render = { path = "crates/merman-render", version = "0.8.0-alpha.5", default-features = false }
merman-export = { path = "crates/merman-export", version = "0.8.0-alpha.5", default-features = false }
merman-typst-plugin = { path = "crates/merman-typst-plugin", version = "0.8.0-alpha.5" }
merman-uniffi = { path = "crates/merman-uniffi", version = "0.8.0-alpha.5" }
merman-wasm = { path = "crates/merman-wasm", version = "0.8.0-alpha.5" }
merman-cli = { path = "crates/merman-cli", version = "0.8.0-alpha.5" }
dugong = { path = "crates/dugong", version = "0.8.0-alpha.5" }
dugong-graphlib = { path = "crates/dugong-graphlib", version = "0.8.0-alpha.5" }
manatee = { path = "crates/manatee", version = "0.8.0-alpha.5" }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[profile.native-sdk]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
strip = "debuginfo"
panic = "unwind"
incremental = false
debug-assertions = false
overflow-checks = false
rpath = false

[profile.native-distribution]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
debug = false
strip = "symbols"
panic = "unwind"
incremental = false
debug-assertions = false
overflow-checks = false
rpath = false

[profile.native-distribution.build-override]
strip = "none"

[profile.wasm-size]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
