[package]
edition = "2024"
rust-version = "1.87.0"
name = "merman-usvg"
version = "0.50.0"
autobins = false
autotests = false
description = "Merman's SVG parser and text shaping library, based on usvg."
documentation = "https://docs.rs/merman-usvg"
readme = "README.md"
keywords = ["svg"]
categories = ["multimedia::images"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Latias94/merman"

[features]
default = ["svgz", "text", "system-fonts", "memmap-fonts", "writer"]
svgz = ["dep:flate2"]
memmap-fonts = ["fontdb/memmap"]
system-fonts = [
    "fontdb/fs",
    "fontdb/fontconfig",
]
text = [
    "fontdb",
    "harfrust",
    "skrifa",
    "unicode-bidi",
    "unicode-script",
    "unicode-vo",
    "writer",
]
writer = ["dep:xmlwriter", "dep:base64"]

[lib]
name = "usvg"
path = "src/lib.rs"

[[test]]
name = "font_instances"
path = "tests/font_instances.rs"
required-features = ["text"]

[dependencies.base64]
version = "0.23"
optional = true

[dependencies.data-url]
version = "0.3"

[dependencies.flate2]
version = "1.1"
features = ["rust_backend"]
default-features = false
optional = true

[dependencies.fontdb]
version = "0.24"
optional = true
default-features = false

[dependencies.harfrust]
version = "0.15.0"
optional = true

[dependencies.imagesize]
version = "0.15.0"

[dependencies.kurbo]
version = "0.13.0"

[dependencies.log]
version = "0.4"

[dependencies.roxmltree]
version = "0.21.1"

[dependencies.skrifa]
version = "0.49.0"
default-features = false
features = ["std"]
optional = true

[dependencies.simplecss]
version = "0.2"

[dependencies.siphasher]
version = "1.0"

[dependencies.strict-num]
version = "0.1.1"

[dependencies.svgtypes]
version = "0.16.2"

[dependencies.tiny-skia-path]
version = "0.12.0"

[dependencies.unicode-bidi]
version = "0.3"
optional = true

[dependencies.unicode-script]
version = "0.5"
optional = true

[dependencies.unicode-vo]
version = "0.1"
optional = true

[dependencies.xmlwriter]
version = "0.1"
optional = true

[dev-dependencies.once_cell]
version = "1.21"
