[advisories]
ignore = [
  { id = "RUSTSEC-2026-0206", reason = "Pinned usvg 0.47 and the published krilla-svg 0.8.1 dependency closure still resolve rustybuzz 0.20.1. Published resvg/usvg 0.48+ provides a partial migration path, but does not remove the remaining application, PDF, and test dependency paths." },
  { id = "RUSTSEC-2026-0192", reason = "Pinned usvg 0.47 and the published krilla-svg 0.8.1 and ratex 0.1.15 dependency closures still resolve ttf-parser 0.25.1. Published resvg/usvg 0.48+ provides a partial migration path, but does not remove the remaining application, PDF, and math dependency paths." },
]

[licenses]
confidence-threshold = 0.93
unused-allowed-license = "deny"
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

