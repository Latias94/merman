name: Release Python Wheels

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Matching version tag; the tag need not exist for a nonpublishing candidate"
        required: true
        type: string
      source_ref:
        description: "Immutable commit, main, or the matching release tag"
        default: main
        type: string
      publish:
        description: "Upload qualified wheels to an existing immutable tagged GitHub release"
        default: false
        type: boolean
      publish_to_pypi:
        description: "Also publish to PyPI; requires publish=true"
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate-inputs:
    name: validate-inputs
    runs-on: ubuntu-24.04
    outputs:
      source_ref: ${{ steps.release.outputs.source_ref }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      source_tree: ${{ steps.source.outputs.source_tree }}
      source_date_epoch: ${{ steps.source.outputs.source_date_epoch }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Validate release inputs
        id: release
        shell: bash
        env:
          DISPATCH_RELEASE_TAG: ${{ inputs.release_tag }}
          DISPATCH_SOURCE_REF: ${{ inputs.source_ref }}
          PUBLISH: ${{ inputs.publish }}
          PUBLISH_TO_PYPI: ${{ inputs.publish_to_pypi }}
        run: |
          set -euo pipefail

          semver_re='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.(0|[1-9][0-9]*))?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          tag_re="^v${semver_re#^}"
          fail() {
            echo "::error::$1" >&2
            exit 1
          }

          RELEASE_TAG="$DISPATCH_RELEASE_TAG"

          [[ "$RELEASE_TAG" =~ $tag_re ]] || fail "release_tag must match vX.Y.Z or vX.Y.Z-alpha.N/beta.N/rc.N."
          [[ "$PUBLISH_TO_PYPI" != true || "$PUBLISH" == true ]] ||
            fail "publish_to_pypi requires publish=true"
          if [[ "$PUBLISH" == true ]]; then
            [[ "$DISPATCH_SOURCE_REF" == "$RELEASE_TAG" || "$DISPATCH_SOURCE_REF" == "refs/tags/$RELEASE_TAG" ]] ||
              fail "publishing requires source_ref to be the matching immutable tag"
            SOURCE_REF="refs/tags/$RELEASE_TAG"
          elif [[ "$DISPATCH_SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            SOURCE_REF="$DISPATCH_SOURCE_REF"
          elif [[ "$DISPATCH_SOURCE_REF" == main || "$DISPATCH_SOURCE_REF" == refs/heads/main ]]; then
            SOURCE_REF=refs/heads/main
          elif [[ "$DISPATCH_SOURCE_REF" == "$RELEASE_TAG" || "$DISPATCH_SOURCE_REF" == "refs/tags/$RELEASE_TAG" ]]; then
            SOURCE_REF="refs/tags/$RELEASE_TAG"
          else
            fail "source_ref must be an immutable commit, main, or the matching release tag"
          fi

          VERSION="${RELEASE_TAG#v}"
          [[ "$VERSION" =~ $semver_re ]] || fail "release_tag contains an unsupported SemVer version."

          {
            printf 'source_ref=%s\n' "$SOURCE_REF"
            printf 'release_tag=%s\n' "$RELEASE_TAG"
            printf 'version=%s\n' "$VERSION"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.release.outputs.source_ref }}
          persist-credentials: false
          fetch-depth: 1
          fetch-tags: true

      - name: Resolve immutable release source
        id: source
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          SOURCE_REF: ${{ steps.release.outputs.source_ref }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse "HEAD^{commit}")"
          source_tree="$(git rev-parse "HEAD^{tree}")"
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          if [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            test "$source_sha" = "$SOURCE_REF"
          fi
          if [[ "$PUBLISH" == true || "$SOURCE_REF" == "refs/tags/$RELEASE_TAG" ]]; then
            tag_sha="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
            tag_tree="$(git rev-parse "refs/tags/${RELEASE_TAG}^{tree}")"
            test "$source_sha" = "$tag_sha"
            test "$source_tree" = "$tag_tree"
          fi
          {
            printf 'source_sha=%s\n' "$source_sha"
            printf 'source_tree=%s\n' "$source_tree"
            printf 'source_date_epoch=%s\n' "$source_date_epoch"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: validate-inputs
    permissions:
      contents: read
    uses: ./.github/workflows/build-python.yml
    with:
      release_tag: ${{ needs.validate-inputs.outputs.release_tag }}
      source_ref: ${{ needs.validate-inputs.outputs.source_sha }}
      artifact_prefix: python

  github-release:
    needs:
      - validate-inputs
      - build
    # Publication stays in this dispatch owner; the reusable builder is read-only.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && github.workflow_ref == format('{0}/.github/workflows/release-python.yml@{1}', github.repository, github.ref) }}
    runs-on: ubuntu-24.04
    environment: github-release
    permissions:
      contents: write
    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: python-wheel-*
          path: wheels
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate-inputs.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.validate-inputs.outputs.source_sha }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null
          observed="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)"
          test "$observed" = "$SOURCE_SHA" || {
            echo "::error::Release tag moved after artifact verification." >&2
            exit 1
          }
          shopt -s nullglob
          wheels=(wheels/merman-*.whl)
          test "${#wheels[@]}" -gt 0
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${wheels[@]}"
          else
            echo "::error::GitHub Release $RELEASE_TAG does not exist; create it before uploading Python wheel assets."
            exit 1
          fi

  publish:
    needs:
      - validate-inputs
      - build
      - github-release
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && inputs.publish_to_pypi && github.workflow_ref == format('{0}/.github/workflows/release-python.yml@{1}', github.repository, github.ref) }}
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout trusted release verifier
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false

      - name: Download wheel artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: python-wheel-*
          path: wheels
          merge-multiple: true

      - name: Reconcile existing PyPI wheels before publication
        env:
          VERSION: ${{ needs.validate-inputs.outputs.version }}
        run: python3 trusted/scripts/reconcile_pypi_wheels.py --directory wheels --project merman --version "$VERSION"

      - name: Verify release tag still resolves to the source commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-inputs.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.validate-inputs.outputs.source_sha }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null
          observed="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)"
          test "$observed" = "$SOURCE_SHA" || {
            echo "::error::Release tag moved after artifact verification." >&2
            exit 1
          }

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          packages-dir: wheels
          skip-existing: true

      - name: Reconcile PyPI wheels after publication
        env:
          VERSION: ${{ needs.validate-inputs.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if python3 trusted/scripts/reconcile_pypi_wheels.py \
              --directory wheels \
              --project merman \
              --version "$VERSION" \
              --require-exact; then
              exit 0
            else
              status=$?
            fi
            if [[ "$status" -ne 3 ]]; then
              exit "$status"
            fi
            if [[ "$attempt" -eq 12 ]]; then
              echo "::error::PyPI did not expose the exact wheel set after publication." >&2
              exit 1
            fi
            sleep 15
          done
