name: Fuzz

on:
  schedule:
    - cron: "41 3 * * 2"
  workflow_dispatch:
    inputs:
      target:
        description: Fuzz target to run
        required: true
        default: all
        type: choice
        options:
          - all
          - parse_mermaid
          - render_mermaid
          - svg_pipeline
          - ffi_api
          - tree_sitter_mermaid_parse
          - tree_sitter_mermaid_edits
          - tree_sitter_mermaid_scanner
      preset:
        description: Bounded fuzzing budget
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - extended
          - long
  workflow_call:

permissions:
  contents: read

concurrency:
  # Same-run PR calls supersede older calls for the same PR. Scheduled and manual discovery
  # runs get a unique group so routine source activity cannot discard their coverage budget.
  group: fuzz-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

env:
  CARGO_FUZZ_VERSION: "0.13.2"
  FUZZ_NIGHTLY: nightly-2026-07-01
  RUST_BACKTRACE: "1"
  CARGO_INCREMENTAL: "0"

jobs:
  resolve-fuzz-plan:
    name: Resolve fuzz plan
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      profile: ${{ steps.plan.outputs.profile }}
    steps:
      - id: plan
        name: Select bounded target and budget
        shell: bash
        env:
          FUZZ_EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TARGET: ${{ inputs.target }}
          DISPATCH_PRESET: ${{ inputs.preset }}
        run: |
          case "$FUZZ_EVENT_NAME" in
            pull_request|push|merge_group|workflow_call)
              selected_targets=all
              profile=regression
              ;;
            schedule)
              selected_targets=all
              profile=scheduled
              ;;
            workflow_dispatch)
              case "$DISPATCH_TARGET" in
                all|parse_mermaid|render_mermaid|svg_pipeline|ffi_api|tree_sitter_mermaid_parse|tree_sitter_mermaid_edits|tree_sitter_mermaid_scanner)
                  selected_targets="$DISPATCH_TARGET"
                  ;;
                *)
                  echo "unsupported fuzz target" >&2
                  exit 1
                  ;;
              esac
              case "$DISPATCH_PRESET" in
                smoke|extended|long)
                  profile="$DISPATCH_PRESET"
                  ;;
                *)
                  echo "unsupported fuzz preset" >&2
                  exit 1
                  ;;
              esac
              ;;
            *)
              echo "unsupported workflow event: $FUZZ_EVENT_NAME" >&2
              exit 1
              ;;
          esac

          case "$selected_targets" in
            all) targets='parse_mermaid render_mermaid svg_pipeline ffi_api tree_sitter_mermaid_parse tree_sitter_mermaid_edits tree_sitter_mermaid_scanner' ;;
            parse_mermaid|render_mermaid|svg_pipeline|ffi_api|tree_sitter_mermaid_parse|tree_sitter_mermaid_edits|tree_sitter_mermaid_scanner) targets="$selected_targets" ;;
            *)
              echo "unsupported resolved fuzz target" >&2
              exit 1
              ;;
          esac

          matrix='{"include":['
          separator=''
          for target in $targets; do
            case "$target" in
              parse_mermaid)
                entry='{"target":"parse_mermaid","seed":"fuzz/seeds/mermaid","dictionary":"fuzz/dictionaries/mermaid.dict","max_len":262144}'
                ;;
              render_mermaid)
                entry='{"target":"render_mermaid","seed":"fuzz/seeds/mermaid","dictionary":"fuzz/dictionaries/mermaid.dict","max_len":32768}'
                ;;
              svg_pipeline)
                entry='{"target":"svg_pipeline","seed":"fuzz/seeds/svg","dictionary":"fuzz/dictionaries/svg.dict","max_len":262144}'
                ;;
              ffi_api)
                entry='{"target":"ffi_api","seed":"fuzz/seeds/ffi","dictionary":"fuzz/dictionaries/mermaid.dict","max_len":16384}'
                ;;
              tree_sitter_mermaid_parse)
                entry='{"target":"tree_sitter_mermaid_parse","seed":"distribution/tree-sitter-mermaid/fuzz/corpus/all-families","dictionary":"fuzz/dictionaries/mermaid.dict","max_len":262144}'
                ;;
              tree_sitter_mermaid_edits)
                entry='{"target":"tree_sitter_mermaid_edits","seed":"fuzz/seeds/tree-sitter-edits","dictionary":"fuzz/dictionaries/mermaid.dict","max_len":262144}'
                ;;
              tree_sitter_mermaid_scanner)
                entry='{"target":"tree_sitter_mermaid_scanner","seed":"fuzz/seeds/tree-sitter-scanner","dictionary":"fuzz/dictionaries/mermaid.dict","max_len":16384}'
                ;;
              *)
                echo "unsupported resolved matrix target" >&2
                exit 1
                ;;
            esac
            matrix+="$separator$entry"
            separator=','
          done
          matrix+=']}'

          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
          printf 'profile=%s\n' "$profile" >> "$GITHUB_OUTPUT"

  libfuzzer:
    needs: resolve-fuzz-plan
    name: libFuzzer (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve-fuzz-plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Install Rust nightly
        run: rustup toolchain install "$FUZZ_NIGHTLY" --profile minimal --component rust-src

      - name: Rust cache
        uses: Swatinem/rust-cache@v2.9.2
        with:
          cache-targets: false
          workspaces: |
            . -> target
            fuzz -> fuzz/target

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version "$CARGO_FUZZ_VERSION" --locked

      - name: Check fuzz workspace lockfile
        run: cargo +"$FUZZ_NIGHTLY" check --manifest-path fuzz/Cargo.toml --locked

      - name: Build libFuzzer harness
        run: |
          cargo +"$FUZZ_NIGHTLY" fuzz build \
            --fuzz-dir fuzz \
            --sanitizer address \
            "${{ matrix.target }}"

      - name: Run committed regression inputs
        shell: bash
        env:
          FUZZ_MAX_LEN: ${{ matrix.max_len }}
          FUZZ_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          case "$FUZZ_MAX_LEN" in
            16384|32768|65536|262144) ;;
            *)
              echo "unsupported matrix max_len" >&2
              exit 1
              ;;
          esac

          inputs=()
          while IFS= read -r -d '' input; do
            inputs+=("$input")
          done < <(
            find \
              "fuzz/corpus/$FUZZ_TARGET" \
              "${{ matrix.seed }}" \
              "fuzz/artifacts/$FUZZ_TARGET" \
              -type f -print0 2>/dev/null | sort -z
          )
          if [[ ${#inputs[@]} -eq 0 ]]; then
            echo "no committed regression inputs for $FUZZ_TARGET" >&2
            exit 1
          fi

          cargo +"$FUZZ_NIGHTLY" fuzz run \
            --fuzz-dir fuzz \
            --sanitizer address \
            --jobs 1 \
            "$FUZZ_TARGET" \
            "${inputs[@]}" \
            -- \
            "-dict=${{ matrix.dictionary }}" \
            -timeout=10 \
            "-max_len=$FUZZ_MAX_LEN"

      - name: Run bounded randomized libFuzzer discovery
        id: fuzz-run
        if: needs.resolve-fuzz-plan.outputs.profile != 'regression'
        continue-on-error: true
        shell: bash
        env:
          FUZZ_PROFILE: ${{ needs.resolve-fuzz-plan.outputs.profile }}
          FUZZ_MAX_LEN: ${{ matrix.max_len }}
        run: |
          mkdir -p fuzz/logs "fuzz/corpus/${{ matrix.target }}"
          case "$FUZZ_MAX_LEN" in
            16384|32768|65536|262144) ;;
            *)
              echo "unsupported matrix max_len" >&2
              exit 1
              ;;
          esac
          case "$FUZZ_PROFILE" in
            smoke)
              fuzz_args=(-runs=64)
              ;;
            extended)
              fuzz_args=(-max_total_time=300)
              ;;
            scheduled|long)
              fuzz_args=(-max_total_time=900)
              ;;
            *)
              echo "unsupported resolved fuzz profile" >&2
              exit 1
              ;;
          esac
          fuzz_args+=(-timeout=10 "-max_len=$FUZZ_MAX_LEN")
          set -o pipefail
          cargo +"$FUZZ_NIGHTLY" fuzz run \
            --fuzz-dir fuzz \
            --sanitizer address \
            --jobs 1 \
            "${{ matrix.target }}" \
            "fuzz/corpus/${{ matrix.target }}" \
            "${{ matrix.seed }}" \
            -- \
            "-dict=${{ matrix.dictionary }}" \
            "${fuzz_args[@]}" 2>&1 | tee "fuzz/logs/${{ matrix.target }}.log"

      - name: Classify fuzz result
        if: always() && needs.resolve-fuzz-plan.outputs.profile != 'regression'
        shell: bash
        env:
          FUZZ_OUTCOME: ${{ steps.fuzz-run.outcome }}
          FUZZ_PROFILE: ${{ needs.resolve-fuzz-plan.outputs.profile }}
          FUZZ_TARGET: ${{ matrix.target }}
        run: |
          log="fuzz/logs/$FUZZ_TARGET.log"
          {
            echo "## libFuzzer: \`$FUZZ_TARGET\`"
            echo
            echo "Profile: \`$FUZZ_PROFILE\`"
            echo
            if [[ "$FUZZ_OUTCOME" == "success" ]]; then
              echo "Result: completed without a detected finding."
            elif [[ -f "$log" ]] && grep -Eq '(^|[[:space:]])(ERROR|SUMMARY): (AddressSanitizer|UndefinedBehaviorSanitizer)' "$log"; then
              echo "Result: sanitizer finding detected."
            elif [[ -f "$log" ]] && grep -Eq "thread '.*' panicked at|panicked at" "$log"; then
              echo "Result: non-sanitizer Rust or harness panic; inspect the log and artifact before classifying it as a memory-safety finding."
            else
              echo "Result: non-sanitizer target failure; inspect the log and artifact before classifying it as a memory-safety finding."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$FUZZ_OUTCOME" != "success" ]]; then
            exit 1
          fi

      - name: Upload fuzz artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: |
            fuzz/artifacts/**
            fuzz/logs/**
          if-no-files-found: ignore
          retention-days: 14

  parser-differential:
    name: Selected Mermaid parser discovery
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: parser-differential
          cache-targets: false
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update --error-on=any
          sudo apt-get install --no-install-recommends --yes libfontconfig1-dev pkg-config
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: tools/mermaid-cli/package-lock.json
      - name: Install pinned npm
        run: npm install --global --ignore-scripts --registry=https://registry.npmjs.org/ npm@12.0.2
      - name: Verify selected reference before runtime install
        run: cargo run --locked --release -p xtask -- verify-mermaid-reference
      - name: Install selected Mermaid runtime
        working-directory: tools/mermaid-cli
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npm ci
      - name: Resolve selected Mermaid parser source
        id: parser-source
        shell: python
        run: |
          import json, os, re
          from pathlib import Path
          selected = json.loads(Path("tools/upstreams/REPOS.lock.json").read_text(encoding="utf-8"))["repos"]["mermaid"]
          commit = selected["commit"]
          if not re.fullmatch(r"[0-9a-f]{40}", commit):
              raise SystemExit("Invalid selected Mermaid commit")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"commit={commit}", file=output)
      - name: Checkout selected Mermaid parser source
        uses: actions/checkout@v7.0.1
        with:
          repository: mermaid-js/mermaid
          ref: ${{ steps.parser-source.outputs.commit }}
          path: repo-ref/mermaid
          persist-credentials: false
          sparse-checkout: |
            packages/mermaid/src/Diagram.ts
            packages/mermaid/src/mermaidAPI.ts
            packages/mermaid/src/preprocess.ts
            packages/mermaid/src/diagram-api/comments.ts
            packages/mermaid/src/diagrams/flowchart/parser/flow.jison
            packages/mermaid/src/diagrams/flowchart/parser/flowParser.ts
            packages/mermaid/src/diagrams/sequence/parser/sequenceDiagram.jison
          sparse-checkout-cone-mode: false
      - name: Install selected parser oracle browser and dependencies
        env:
          PUPPETEER_CACHE_DIR: ${{ runner.temp }}/merman-puppeteer
        run: sudo env "PATH=$PATH" "PUPPETEER_CACHE_DIR=$PUPPETEER_CACHE_DIR" node tools/mermaid-cli/node_modules/puppeteer/lib/puppeteer/node/cli.js browsers install chrome-headless-shell --install-deps
      - name: Replay and discover bounded parser differences
        env:
          PUPPETEER_CACHE_DIR: ${{ runner.temp }}/merman-puppeteer
        run: cargo run --locked --release -p xtask -- parser-differential --cases 5000 --timeout-seconds 900
      - name: Upload parser differential evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: parser-differential-discovery
          path: target/parser-differential/
          if-no-files-found: ignore
          retention-days: 14
