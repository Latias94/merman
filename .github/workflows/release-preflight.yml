name: Release Preflight

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v, for example 0.8.0-alpha.5"
        required: true
        type: string
      android_maven_group:
        description: "Maven group for the nonpublishing external consumer; no Central namespace claim"
        required: true
        default: io.merman.preflight
        type: string
      source_ref:
        description: "Immutable 40-character commit SHA, protected branch (main), or matching release tag to validate"
        required: true
        default: "main"
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate-inputs:
    name: validate-inputs
    runs-on: ubuntu-24.04
    outputs:
      source_ref: ${{ steps.release.outputs.source_ref }}
      source_sha: ${{ steps.pin-source.outputs.source_sha }}
      source_tree: ${{ steps.pin-source.outputs.source_tree }}
      source_date_epoch: ${{ steps.pin-source.outputs.source_date_epoch }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out trusted release tooling
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Validate release inputs
        id: release
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          DISPATCH_SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail

          fail() {
            echo "::error::$1" >&2
            exit 1
          }

          if ! VERSION="$(python3 scripts/release-version.py canonical --version "$DISPATCH_VERSION")"; then
            fail "version must match X.Y.Z or X.Y.Z-alpha.N/beta.N/rc.N."
          fi
          [[ "$VERSION" == "$DISPATCH_VERSION" ]] || fail "version must not use a v prefix."
          RELEASE_TAG="v$VERSION"
          SOURCE_REF="$DISPATCH_SOURCE_REF"

          [[ "$SOURCE_REF" != *$'\n'* && "$SOURCE_REF" != *$'\r'* ]] || fail "source_ref must be a single line."
          validated_source_ref="$SOURCE_REF"
          if [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            :
          elif [[ "$SOURCE_REF" == "main" || "$SOURCE_REF" == "refs/heads/main" ]]; then
            :
          elif [[ "$SOURCE_REF" == "$RELEASE_TAG" || "$SOURCE_REF" == "refs/tags/$RELEASE_TAG" ]]; then
            source_tag="${SOURCE_REF#refs/tags/}"
            validated_source_ref="refs/tags/$source_tag"
          else
            fail "source_ref tag must match version; source_ref must be an immutable lowercase commit SHA, main, refs/heads/main, a matching release tag, or refs/tags/<release-tag>."
          fi

          {
            printf 'source_ref=%s\n' "$validated_source_ref"
            printf 'release_tag=%s\n' "$RELEASE_TAG"
            printf 'version=%s\n' "$VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve immutable release source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.release.outputs.source_ref }}
          persist-credentials: false

      - name: Pin resolved source commit
        id: pin-source
        shell: bash
        env:
          EXPECTED_SOURCE_REF: ${{ steps.release.outputs.source_ref }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          if [[ "$EXPECTED_SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            test "$source_sha" = "$EXPECTED_SOURCE_REF"
          fi
          {
            printf 'source_sha=%s\n' "$source_sha"
            printf 'source_tree=%s\n' "$source_tree"
            printf 'source_date_epoch=%s\n' "$source_date_epoch"
          } >> "$GITHUB_OUTPUT"

      - name: Explain preflight delivery boundary
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          {
            printf '## Preflight only: no packages published\n\n'
            printf 'This run validates %s. Successful builds and Actions artifacts do not make its platform packages available.\n\n' "$RELEASE_TAG"
            printf 'Publish each selected channel through its owner, verify public delivery, and record deferred channels at their existing published versions.\n\n'
            printf '[Publishing owners and channel checklist](https://github.com/%s/blob/%s/docs/release/RELEASING.md#release-workflows)\n' "$GITHUB_REPOSITORY" "$WORKFLOW_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

  versions-and-packages:
    needs: validate-inputs
    name: versions-and-packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.validate-inputs.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-linux-android,wasm32-unknown-unknown

      - name: Rust cache
        uses: Swatinem/rust-cache@v2.9.2

      - name: Install cargo-about
        uses: taiki-e/install-action@v2.87.29
        with:
          tool: cargo-about@0.9.2

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@v2.87.29
        with:
          tool: cargo-semver-checks@0.51.0

      - name: Install cargo-nextest
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: nextest

      - name: Install CLI validators and native qualification fonts
        timeout-minutes: 10
        run: |
          apt_options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${apt_options[@]}" update --error-on=any
          sudo apt-get "${apt_options[@]}" install --no-install-recommends --yes elvish fish mandoc zsh fonts-dejavu-core

      - name: Verify release versions
        env:
          VERSION: ${{ needs.validate-inputs.outputs.version }}
        run: python3 scripts/release-version.py check --version "$VERSION"

      - name: Verify static release surface contract
        env:
          VERSION: ${{ needs.validate-inputs.outputs.version }}
        run: python3 scripts/release_surface_contract.py --version "$VERSION"

      - name: Compile prerelease lanes from fresh Cargo resolutions
        id: prerelease_compatibility
        env:
          VERSION: ${{ needs.validate-inputs.outputs.version }}
        run: |
          set -euo pipefail
          previous_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD^ 2>/dev/null || true)"
          if [[ -n "$previous_tag" ]]; then
            set -- --version "$VERSION" --previous-version "${previous_tag#v}"
            if [[ "$VERSION" == "0.8.0-alpha.7" && "$previous_tag" == "v0.8.0-alpha.6" ]]; then
              set -- "$@" --accept-alpha6-transition
            fi
            python3 scripts/verify_prerelease_compatibility.py "$@"
          else
            python3 scripts/verify_prerelease_compatibility.py \
              --version "$VERSION" \
              --allow-missing-previous
          fi

      - name: Verify release changelog projections
        env:
          VERSION: ${{ needs.validate-inputs.outputs.version }}
        run: python3 scripts/verify_release_changelog.py --version "$VERSION" --require-date

      - name: Verify independent crate versions changed with their source
        run: |
          set -euo pipefail
          base_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD^)"
          python3 scripts/verify-independent-crate-version-bumps.py --base-ref "$base_tag"

      - name: Verify roughr-merman public Rust API compatibility
        run: cargo semver-checks check-release -p roughr-merman --color always

      - name: Compile published roughr dependents from fresh registry projects
        run: |
          set -euo pipefail
          roughr_version="$(cargo pkgid -p roughr-merman | sed -E 's/.*[#@]//')"
          stable_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' HEAD)"
          prerelease_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*-*' HEAD)"
          python3 scripts/release_registry_dependents.py \
            --dependency "roughr-merman=$roughr_version" \
            --candidate-path crates/roughr \
            --dependent "merman-render=${stable_tag#v}" \
            --dependent "merman-render=${prerelease_tag#v}"

      - name: Prefetch locked Rust dependencies for offline metadata and license reports
        run: cargo fetch --locked

      - name: Verify artifact dependency boundaries
        run: python3 scripts/verify_artifact_dependency_closures.py

      - name: Verify exhaustive Cargo feature and artifact recipes
        run: cargo run --locked -p xtask -- verify-feature-matrix --strict

      - name: Verify native ABI projections
        run: cargo run --locked -p xtask -- verify-native-abi

      - name: Test theme authoring and font resource boundaries
        shell: bash
        run: |
          cargo test --locked -p merman-ffi --no-default-features \
            --features svg,diagram-flowchart --test c_consumer_smoke
          cargo test --locked -p merman-render --no-default-features \
            --features diagram-flowchart,diagram-swimlane \
            --test theme_font_capability --test flowchart_node_effects
          cargo test --locked -p merman-bindings-core --no-default-features \
            --features svg,diagram-flowchart --lib
          cargo test --locked -p merman --no-default-features --features svg,diagram-flowchart \
            --test theme_font_capability --test flowchart_edge_label_theme
          cargo test --locked -p merman-export --no-default-features \
            --features png,jpeg,pdf --lib

      - name: Test native theme consumers
        run: |
          cargo test --locked -p merman --no-default-features --features svg,diagram-flowchart,png,pdf,layout-cytoscape,system-fonts,compat-json \
            --test theme_flowchart_edge_effects --test flowchart_edge_label_theme --test render_operation \
            --test theme_composed_effects

      - name: Test optimized theme evidence and qualification rejection
        run: |
          cargo test --release --locked -p merman-render --no-default-features \
            --lib family::evidence_support::tests
          python3 scripts/run_theme_acceptance.py test --release --locked \
            -p merman-theme-acceptance --no-default-features --features png,all-diagrams,layout-cytoscape \
            --lib preset_qualification::

      - name: Verify published theme acceptance boundary
        run: python3 scripts/verify_theme_acceptance_boundary.py

      - name: Test preset qualification and family terminal behavior
        run: |
          python3 scripts/run_theme_acceptance.py test --locked -p merman-theme-acceptance \
            --no-default-features --features png,all-diagrams,layout-cytoscape \
            --test preset_qualification --test block_title_legacy_projection --test class_edge_label_background_legacy_projection --test flowchart_marker_legacy_projection
          python3 scripts/run_theme_acceptance.py nextest run --locked -p merman-render \
            --no-default-features --features all-diagrams --test theme_support_discovery_test --cargo-quiet

      - name: Verify generated CLI distribution assets
        run: python3 scripts/generate_cli_assets.py --check

      - name: Validate CLI distribution assets
        run: python3 scripts/verify_cli_assets.py --require bash,zsh,fish,elvish,mandoc

      - name: Verify CLI installation metadata
        run: python3 scripts/cli_installation_contract.py

      - name: Verify exact Rust dependency license reports
        run: python3 scripts/generate-rust-license-report.py --check

      - name: Verify legal material projections
        run: python3 scripts/sync-release-legal-materials.py --check

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Build package file lists
        run: |
          set -euo pipefail
          mkdir -p target/package-lists
          python3 tools/publish.py --list-crates-io-packages > target/package-lists/crates.txt
          while IFS= read -r crate; do
            cargo package -p "$crate" --list > "target/package-lists/$crate.txt"
          done < target/package-lists/crates.txt

      - name: Verify Cargo package legal materials
        run: python3 scripts/verify_crate_package_legal_materials.py

      - name: Verify registry-independent crate dry-runs
        run: python3 scripts/crates_io_release.py preflight-initial

      - name: Upload package lists
        uses: actions/upload-artifact@v7.0.2
        with:
          name: crate-package-lists
          path: target/package-lists/*.txt

  mermaid-reference-materialized:
    needs: validate-inputs
    name: mermaid-reference-materialized
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-inputs.outputs.source_sha }}
          persist-credentials: false

      - name: Setup Node for selected Mermaid graph
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: |
            playground/package-lock.json
            tools/mermaid-cli/package-lock.json

      - name: Install npm toolchain
        run: npm install --global --ignore-scripts --registry=https://registry.npmjs.org/ npm@12.2.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Materialize locked Mermaid source checkouts
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          lock = json.loads(Path("tools/upstreams/REPOS.lock.json").read_text())
          bundle = json.loads(Path("tools/upstreams/MERMAID_REFERENCE_BUNDLE.json").read_text())
          def checkout_paths(value):
              if isinstance(value, dict):
                  source = value.get("source")
                  if isinstance(source, dict) and source.get("checkoutPath"):
                      yield source["checkoutPath"]
                  for child in value.values():
                      yield from checkout_paths(child)
              elif isinstance(value, list):
                  for child in value:
                      yield from checkout_paths(child)

          checkout_names = set(checkout_paths(bundle))
          for name, repo in lock["repos"].items():
              if repo["path"] not in checkout_names:
                  continue
              checkout = Path(repo["path"])
              subprocess.run(
                  ["git", "clone", "--no-checkout", "--filter=blob:none", repo["url"], str(checkout)],
                  check=True,
              )
              subprocess.run(
                  ["git", "-C", str(checkout), "fetch", "--no-tags", "origin", repo["commit"]],
                  check=True,
              )
              subprocess.run(
                  ["git", "-C", str(checkout), "checkout", "--detach", repo["commit"]],
                  check=True,
              )
              observed = subprocess.check_output(
                  ["git", "-C", str(checkout), "rev-parse", "HEAD"], text=True
              ).strip()
              if observed != repo["commit"]:
                  raise SystemExit(
                      f"{repo['path']} resolved to {observed}, expected {repo['commit']}"
                  )
          if checkout_names != {
              repo["path"]
              for repo in lock["repos"].values()
              if repo["path"] in checkout_names
          }:
              raise SystemExit("not all bundle source checkouts were materialized")
          PY

      - name: Install selected npm graphs without lifecycle scripts
        run: |
          npm ci --ignore-scripts --prefix playground
          npm ci --ignore-scripts --prefix tools/mermaid-cli

      - name: Verify materialized Mermaid reference graph
        run: cargo run --locked -p xtask -- verify-mermaid-reference --materialized

      - name: Verify installed npm graph closure
        run: |
          npm ls --all --prefix playground
          npm ls --all --prefix tools/mermaid-cli

  cli-and-lsp-archives:
    needs: validate-inputs
    name: cli-and-lsp-archives (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    env:
      RELEASE_TAG: ${{ needs.validate-inputs.outputs.release_tag }}
      VERSION: ${{ needs.validate-inputs.outputs.version }}
      TARGET: ${{ matrix.target }}
      NATIVE_RUNNER: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.validate-inputs.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Install Python for GNU baseline checks
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Rust cache
        uses: Swatinem/rust-cache@v2.9.2
        with:
          cache-targets: false

      - name: Verify release versions and installation metadata
        run: |
          set -euo pipefail
          python3 scripts/release-version.py check --version "$VERSION"
          python3 scripts/cli_installation_contract.py

      - name: Install pinned cargo-dist
        env:
          DIST_INSTALLER_SHA256: b657cf8c04a8b7bc28f39d220f7e6dd11bbd2bdb072c552262bd9ccf597261b5
        run: |
          set -euo pipefail
          installer="$RUNNER_TEMP/cargo-dist-installer.sh"
          curl --proto '=https' --tlsv1.2 -LsSf \
            -o "$installer" \
            https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh
          printf '%s  %s\n' "$DIST_INSTALLER_SHA256" "$installer" | sha256sum --check
          sh "$installer"

      - name: Verify non-publishing cargo-dist plan
        run: |
          set -euo pipefail
          mkdir -p target
          dist plan "--tag=$RELEASE_TAG" --output-format=json > target/plan-dist-manifest.json
          python3 scripts/release_artifact_bundle.py verify-plan target/plan-dist-manifest.json \
            --tag "$RELEASE_TAG" \
            --version "$VERSION" \
            --target "$TARGET" \
            --runner "$NATIVE_RUNNER"

      - name: Install native qualification fonts
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes fonts-dejavu-core

      - name: Prepare ARM64 system resource probes
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          set -euo pipefail
          sudo apt-get update --error-on=any
          sudo apt-get install --no-install-recommends --yes ca-certificates openssl fontconfig fonts-dejavu-core poppler-utils strace
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=merman-resource-probe-CA' \
            -addext 'basicConstraints=critical,CA:TRUE' \
            -addext 'keyUsage=critical,keyCertSign,cRLSign' \
            -keyout "$RUNNER_TEMP/merman-resource-ca.key" -out "$RUNNER_TEMP/merman-resource-ca.crt"
          openssl req -newkey rsa:2048 -nodes -subj '/CN=localhost' \
            -keyout "$RUNNER_TEMP/merman-resource.key" -out "$RUNNER_TEMP/merman-resource.csr"
          printf 'basicConstraints=critical,CA:FALSE\nkeyUsage=critical,digitalSignature,keyEncipherment\nextendedKeyUsage=serverAuth\nsubjectAltName=IP:127.0.0.1\n' > "$RUNNER_TEMP/merman-resource.ext"
          openssl x509 -req -in "$RUNNER_TEMP/merman-resource.csr" \
            -CA "$RUNNER_TEMP/merman-resource-ca.crt" -CAkey "$RUNNER_TEMP/merman-resource-ca.key" \
            -CAcreateserial -days 1 -extfile "$RUNNER_TEMP/merman-resource.ext" \
            -out "$RUNNER_TEMP/merman-resource.crt"
          sudo install -m 0644 "$RUNNER_TEMP/merman-resource-ca.crt" /usr/local/share/ca-certificates/merman-resource-ca.crt
          sudo update-ca-certificates
          openssl verify -CAfile /etc/ssl/certs/ca-certificates.crt "$RUNNER_TEMP/merman-resource.crt"

      - name: Build final native archives
        run: |
          set -euo pipefail
          mkdir -p target/distrib
          dist build \
            "--tag=$RELEASE_TAG" \
            --artifacts=local \
            --target="$TARGET" \
            --output-format=json > target/native-dist-manifest.json
          python3 scripts/linux_binary_compatibility.py \
            "target/$TARGET/dist/merman-cli" "target/$TARGET/dist/merman-lsp"

      - name: Execute final native archives
        run: |
          set -euo pipefail
          archive="target/distrib/merman-cli-$TARGET.tar.xz"
          verification_args=(
            "$archive" --checksum "$archive.sha256"
            --target "$TARGET" --version "$VERSION"
            --repo-root . --execute
          )
          if [[ "$TARGET" == aarch64-unknown-linux-gnu ]]; then
            verification_args+=(
              --resource-certificate "$RUNNER_TEMP/merman-resource.crt"
              --resource-key "$RUNNER_TEMP/merman-resource.key"
            )
          fi
          if [[ "$TARGET" == x86_64-unknown-linux-gnu ]]; then
            python3 scripts/verify_cli_release_archive.py "${verification_args[@]}" \
              --preset-qualification-output target/preset-qualification.json
            python3 scripts/verify_cli_release_archive.py "${verification_args[@]}" \
              --preset-qualification-check target/preset-qualification.json
          else
            python3 scripts/verify_cli_release_archive.py "${verification_args[@]}"
          fi
          python3 scripts/verify_lsp_release_archive.py \
            "target/distrib/merman-lsp-$TARGET.tar.xz" \
            --checksum "target/distrib/merman-lsp-$TARGET.tar.xz.sha256" \
            --target "$TARGET" \
            --version "$VERSION" \
            --repo-root . \
            --execute

      - name: Upload scoped native preset qualification
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preset-qualification-${{ needs.validate-inputs.outputs.source_sha }}-${{ matrix.target }}
          path: |
            target/preset-qualification.json
            target/preset-qualification.catalog.json
          if-no-files-found: error

      - name: Upload native archive evidence
        uses: actions/upload-artifact@v7.0.2
        with:
          name: preflight-cli-lsp-${{ matrix.target }}
          path: |
            target/plan-dist-manifest.json
            target/native-dist-manifest.json
            target/distrib/merman-*-${{ matrix.target }}.tar.xz
            target/distrib/merman-*-${{ matrix.target }}.tar.xz.sha256
          if-no-files-found: error

  python-wheel:
    needs: validate-inputs
    name: python-wheel
    permissions:
      contents: read
    uses: ./.github/workflows/build-python.yml
    with:
      release_tag: ${{ needs.validate-inputs.outputs.release_tag }}
      source_ref: ${{ needs.validate-inputs.outputs.source_sha }}
      artifact_prefix: preflight-python

  android-aar:
    needs: validate-inputs
    name: android-aar
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.validate-inputs.outputs.source_sha }}
          persist-credentials: false

      - name: Verify pinned release source
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.validate-inputs.outputs.source_sha }}
          EXPECTED_SOURCE_TREE: ${{ needs.validate-inputs.outputs.source_tree }}
        run: |
          set -euo pipefail
          test "$(git rev-parse "HEAD^{commit}")" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse "HEAD^{tree}")" = "$EXPECTED_SOURCE_TREE"

      - name: Read Android toolchain versions
        id: android-toolchain
        run: |
          echo "java=$(python3 platforms/android/build-android.py --print-version java)" >> "$GITHUB_OUTPUT"
          echo "ndk=$(python3 platforms/android/build-android.py --print-version ndk)" >> "$GITHUB_OUTPUT"

      - name: Use validated release metadata
        id: version
        env:
          RELEASE_TAG: ${{ needs.validate-inputs.outputs.release_tag }}
          VERSION: ${{ needs.validate-inputs.outputs.version }}
        run: |
          set -euo pipefail
          {
            printf 'tag=%s\n' "$RELEASE_TAG"
            printf 'version=%s\n' "$VERSION"
          } >> "$GITHUB_OUTPUT"
          echo "Tag version: $VERSION"

      - name: Verify release version projections match tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 scripts/release-version.py check --version "$VERSION"

      - name: Setup JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ steps.android-toolchain.outputs.java }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2.9.2

      - name: Install Android NDK
        shell: bash
        env:
          ANDROID_NDK_VERSION: ${{ steps.android-toolchain.outputs.ndk }}
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;${ANDROID_NDK_VERSION}" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Build Android native libraries
        run: python3 platforms/android/build-android.py --targets aarch64-linux-android x86_64-linux-android

      - name: Verify legal material projections
        run: python3 scripts/sync-release-legal-materials.py --check

      - name: Run Android JVM contract tests
        run: platforms/android/gradlew -p platforms/android testDebugUnitTest --stacktrace

      - name: Publish to the local Maven staging repository
        env:
          MAVEN_GROUP: ${{ inputs.android_maven_group }}
        run: platforms/android/gradlew -p platforms/android "-PmermanMavenGroup=$MAVEN_GROUP" publishReleasePublicationToLocalStagingRepository --stacktrace --max-workers=2

      - name: Verify Maven publication contract
        env:
          MAVEN_GROUP: ${{ inputs.android_maven_group }}
          VERSION: ${{ needs.validate-inputs.outputs.version }}
        run: python3 scripts/verify-platform-bindings.py --verify-android-maven --android-maven-group "$MAVEN_GROUP" --android-maven-version "$VERSION"

      - name: Prepare selected-version Maven repository archive
        env:
          MAVEN_GROUP: ${{ inputs.android_maven_group }}
          VERSION: ${{ needs.validate-inputs.outputs.version }}
        run: python3 scripts/android_package.py package --repository platforms/android/build/repo --group-id "$MAVEN_GROUP" --version "$VERSION" --output-dir target/release-assets

      - name: Enable KVM access
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Qualify external Maven app on a 16 KB device
        uses: reactivecircus/android-emulator-runner@v2.38.0
        env:
          MAVEN_GROUP: ${{ inputs.android_maven_group }}
          VERSION: ${{ needs.validate-inputs.outputs.version }}
        with:
          api-level: 35
          arch: x86_64
          target: google_apis_ps16k
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          disable-linux-hw-accel: false
          script: |
            test "$(adb shell getconf PAGE_SIZE | tr -d '\r')" = "16384"
            python3 scripts/android_package.py qualify --archive "target/release-assets/merman-android-${VERSION}-maven.zip" --group-id "$MAVEN_GROUP" --version "$VERSION" --work-dir "$RUNNER_TEMP/merman-maven-consumer" --android-ndk-home "$ANDROID_NDK_HOME" --zipalign "$ANDROID_HOME/build-tools/35.0.0/zipalign" --connected

      - name: Prepare release asset
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          MAVEN_GROUP: ${{ inputs.android_maven_group }}
        run: |
          set -euo pipefail
          mkdir -p target/release-assets
          group_path="${MAVEN_GROUP//./\/}"
          staged_aar="platforms/android/build/repo/${group_path}/merman-android/${VERSION}/merman-android-${VERSION}.aar"
          test -f "$staged_aar"
          cp "$staged_aar" "target/release-assets/merman-android-${RELEASE_TAG}.aar"

      - name: Retain candidate Maven publication and AAR
        uses: actions/upload-artifact@v7.0.2
        with:
          name: preflight-android-maven
          path: target/release-assets/*
          if-no-files-found: error

  apple-xcframework:
    needs: validate-inputs
    name: apple-xcframework
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.validate-inputs.outputs.source_sha }}
          persist-credentials: false

      - name: Verify release versions
        env:
          VERSION: ${{ needs.validate-inputs.outputs.version }}
        run: python3 scripts/release-version.py check --version "$VERSION"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: llvm-tools-preview
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2.9.2

      - name: Build Apple XCFramework
        env:
          MERMAN_AUTO_INSTALL_RUST_TARGETS: "false"
        run: bash scripts/build-apple-xcframework.sh

      - name: Validate Swift package
        run: |
          swift package describe
          swift run --package-path platforms/apple/examples/smoke MermanAppleSmoke
          git diff --exit-code -- platforms/apple/Sources/Merman/Generated

      - name: Qualify installed package, simulator and matched distribution sizes
        env:
          VERSION: ${{ needs.validate-inputs.outputs.version }}
        run: |
          python3 scripts/apple_package.py --output-dir target/apple-package --version "$VERSION"
          python3 scripts/apple_qualify.py --package-archive "target/apple-package/Merman-swiftpm-v$VERSION.zip" \
            --work-dir target/apple-qualification --version "$VERSION" --simulator --compare-original

      - name: Qualify controlled HTTPS SwiftPM handoff and checksum rejection
        timeout-minutes: 45
        env:
          VERSION: ${{ needs.validate-inputs.outputs.version }}
          SOURCE_SHA: ${{ needs.validate-inputs.outputs.source_sha }}
        run: |
          python3 platforms/apple/tests/qualify_remote.py \
            --work-dir target/apple-https-qualification --version "$VERSION" --source-commit "$SOURCE_SHA" \
            --xcframework platforms/apple/Merman.xcframework

      - name: Retain controlled HTTPS resolution and consumer evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: preflight-apple-https-qualification
          if-no-files-found: error
          path: |
            target/apple-https-qualification/qualification.json
            target/apple-https-qualification/*.log
            target/apple-https-qualification/proof/qualification.json
            target/apple-https-qualification/proof/installed/*.json
            target/apple-https-qualification/proof/installed/*/consumer/Package.resolved

  web-npm-dry-run:
    needs: validate-inputs
    name: web-npm-dry-run
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.validate-inputs.outputs.source_sha }}
          persist-credentials: false

      - name: Verify release versions
        env:
          VERSION: ${{ needs.validate-inputs.outputs.version }}
        run: python3 scripts/release-version.py check --version "$VERSION"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown

      - name: Rust cache
        uses: Swatinem/rust-cache@v2.9.2

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: platforms/web/package-lock.json

      - name: Install npm toolchain
        run: npm install --global --ignore-scripts --registry=https://registry.npmjs.org/ npm@12.2.1

      - name: Install wasm-tools
        uses: taiki-e/install-action@v2.87.29
        with:
          tool: wasm-tools@1.261.0

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Verify generated Web contracts
        run: |
          cargo run --locked -p xtask -- verify-mermaid-reference
          cargo run --locked -p xtask -- verify-editor-language-contract
          cargo run --locked -p xtask -- verify-text-measurement-protocol
          cargo run --locked -p xtask -- verify-web-diagram-catalog

      - name: Install web package dependencies
        run: npm ci --prefix platforms/web

      - name: Build web package
        run: npm run build --prefix platforms/web

      - name: Verify and smoke web package
        run: npm run smoke --prefix platforms/web

      - name: Install isolated browser consumer tools
        run: |
          npm ci --include=dev --prefix playground
          npm ci --include=dev --prefix playground/tests
          npm run install:browser:chromium --prefix playground/tests

      - name: Test installed browser consumer contracts
        run: node --test platforms/web/scripts/installed-browser-consumer.test.mjs

      - name: Qualify installed Web packages in Chromium and Worker
        run: node platforms/web/scripts/installed-browser-consumer.mjs

      - name: Check final Web package WASM size budgets
        run: |
          cargo run --locked -p xtask -- wasm-size-matrix \
            --surface web \
            --web-package-root platforms/web/packages \
            --budget-file docs/release/WASM_SIZE_BUDGETS.json

      - name: Pack and verify Web package group dry-run
        shell: bash
        env:
          VERSION: ${{ needs.validate-inputs.outputs.version }}
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/merman-web-package-group"
          mkdir -p "$artifact_dir"
          source_sha="$(git rev-parse HEAD)"
          python3 scripts/web_package_group.py pack \
            --root . \
            --descriptor platforms/web/web-surface-descriptor.json \
            --artifact-dir "$artifact_dir" \
            --version "$VERSION" \
            --source-sha "$source_sha" \
            --target-dist-tag staging
          python3 scripts/web_package_group.py verify-artifact \
            --manifest "$artifact_dir/web-package-group.json" \
            --artifact-dir "$artifact_dir" \
            --version "$VERSION" \
            --source-sha "$source_sha" \
            --target-dist-tag staging \
            --descriptor platforms/web/web-surface-descriptor.json

  node-loader-package:
    needs: validate-inputs
    name: node-loader-package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.validate-inputs.outputs.source_sha }}
          persist-credentials: false

      - name: Verify release versions
        env:
          VERSION: ${{ needs.validate-inputs.outputs.version }}
        run: python3 scripts/release-version.py check --version "$VERSION"

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: platforms/node/package-lock.json

      - name: Install npm toolchain
        run: npm install --global --ignore-scripts --registry=https://registry.npmjs.org/ npm@12.2.1

      - name: Verify Node package contracts
        run: |
          npm ci --prefix platforms/node
          npm test --prefix platforms/node
          node platforms/node/scripts/verify-packages.mjs

      - name: Pack Node loader package
        run: |
          set -euo pipefail
          package_root="$RUNNER_TEMP/node-loader-package"
          artifact_dir="$RUNNER_TEMP/node-loader-artifact"
          node platforms/node/scripts/assemble-packages.mjs --loader-only --output-root "$package_root"
          mkdir -p "$artifact_dir"
          npm pack "$package_root/node" --json --pack-destination "$artifact_dir" > "$RUNNER_TEMP/node-loader-pack.json"

      - name: Upload Node loader package
        uses: actions/upload-artifact@v7.0.2
        with:
          name: preflight-node-npm-loader
          path: ${{ runner.temp }}/node-loader-artifact/*.tgz
          if-no-files-found: error

  node-wasm-package:
    needs: validate-inputs
    name: node-wasm-package
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.validate-inputs.outputs.source_sha }}
          persist-credentials: false

      - name: Verify release versions
        env:
          VERSION: ${{ needs.validate-inputs.outputs.version }}
        run: python3 scripts/release-version.py check --version "$VERSION"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown

      - name: Rust cache
        uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: crates/merman-node

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: platforms/node/package-lock.json

      - name: Install npm toolchain
        run: npm install --global --ignore-scripts --registry=https://registry.npmjs.org/ npm@12.2.1

      - name: Install Node build dependencies
        run: npm ci --prefix platforms/node

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Install pinned wasm-opt for Node WASM
        uses: sigoden/install-binary@v1.3.0
        with:
          repo: WebAssembly/binaryen
          name: wasm-opt
          tag: version_133

      - name: Build and probe Node WASM candidate
        run: node platforms/node/scripts/build-candidate.mjs --candidate node-wasm

      - name: Pack and install-smoke Node WASM package
        env:
          VERSION: ${{ needs.validate-inputs.outputs.version }}
        run: |
          set -euo pipefail
          package_root="$RUNNER_TEMP/node-wasm-package"
          artifact_dir="$RUNNER_TEMP/node-wasm-artifact"
          node platforms/node/scripts/assemble-packages.mjs --wasm --output-root "$package_root"
          node platforms/node/scripts/verify-packages.mjs --packed-root "$package_root"
          mkdir -p "$artifact_dir"
          npm pack "$package_root/node-wasm" --json --pack-destination "$artifact_dir" > "$RUNNER_TEMP/node-wasm-pack.json"
          smoke_root="$RUNNER_TEMP/node-wasm-install-smoke"
          mkdir -p "$smoke_root"
          cd "$smoke_root"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund "$artifact_dir"/*.tgz >/dev/null
          node "$GITHUB_WORKSPACE/platforms/node/scripts/smoke-installed-package.mjs" --project "$smoke_root" --version "$VERSION" --target node-wasm

      - name: Upload Node WASM package
        uses: actions/upload-artifact@v7.0.2
        with:
          name: preflight-node-npm-wasm
          path: ${{ runner.temp }}/node-wasm-artifact/*.tgz
          if-no-files-found: error

  node-platform-package:
    needs: validate-inputs
    name: node-platform-package (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
            rust_target: aarch64-apple-darwin
          - target: darwin-x64
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
          - target: linux-x64-gnu
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            docker_platform: linux/amd64
            libc: glibc
            consumer_image: node:22.0.0-bullseye
          - target: linux-x64-musl
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-musl
            docker_platform: linux/amd64
            libc: musl
            consumer_image: node:22.0.0-alpine3.19
          - target: linux-arm64-gnu
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            docker_platform: linux/arm64
            libc: glibc
            consumer_image: node:22.0.0-bullseye
          - target: linux-arm64-musl
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-musl
            docker_platform: linux/arm64
            libc: musl
            consumer_image: node:22.0.0-alpine3.19
          - target: win32-x64-msvc
            runner: windows-2025-vs2026
            rust_target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.validate-inputs.outputs.source_sha }}
          persist-credentials: false

      - name: Verify pinned release source and versions
        env:
          SOURCE_SHA: ${{ needs.validate-inputs.outputs.source_sha }}
          SOURCE_TREE: ${{ needs.validate-inputs.outputs.source_tree }}
          VERSION: ${{ needs.validate-inputs.outputs.version }}
        run: |
          set -euo pipefail
          test "$(git rev-parse 'HEAD^{commit}')" = "$SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          python3 scripts/release-version.py check --version "$VERSION"

      - name: Install Rust toolchain
        if: ${{ !startsWith(matrix.target, 'linux-') }}
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        if: ${{ !startsWith(matrix.target, 'linux-') }}
        uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: crates/merman-node

      - name: Build and package musl target on its matching CPU
        if: matrix.libc == 'musl'
        env:
          TARGET: ${{ matrix.target }}
          DOCKER_PLATFORM: ${{ matrix.docker_platform }}
        run: |
          set -euo pipefail
          docker build \
            --platform "$DOCKER_PLATFORM" \
            --file platforms/node/Dockerfile.musl \
            --build-arg NODE_IMAGE=node:24.13.1-alpine3.22 \
            --build-arg RUST_IMAGE=rust:1.95-alpine3.22 \
            --tag merman-node-musl:ci \
            platforms/node
          docker run --rm \
            --platform "$DOCKER_PLATFORM" \
            -e CARGO_INCREMENTAL=0 \
            -e TARGET="$TARGET" \
            -v "$GITHUB_WORKSPACE:/work" \
            -v "$RUNNER_TEMP:/runner-temp" \
            -w /work \
            merman-node-musl:ci \
            sh -c '
              set -eu
              git config --global --add safe.directory /work
              npm ci --prefix platforms/node
              node platforms/node/scripts/build-candidate.mjs --candidate napi --target "$TARGET"
              package_root=/runner-temp/node-packages
              artifact_dir=/runner-temp/node-platform-artifact
              smoke_tarballs=/runner-temp/node-smoke-tarballs
              node platforms/node/scripts/assemble-packages.mjs --target "$TARGET" --output-root "$package_root"
              node platforms/node/scripts/verify-packages.mjs --packed-root "$package_root"
              mkdir -p "$artifact_dir" "$smoke_tarballs"
              npm pack "$package_root/node" --json --pack-destination "$smoke_tarballs" >/runner-temp/node-root-pack.json
              npm pack "$package_root/$TARGET" --json --pack-destination "$artifact_dir" >/runner-temp/node-target-pack.json
              cp "$artifact_dir"/*.tgz "$smoke_tarballs"/
              test "$(find "$artifact_dir" -maxdepth 1 -name "*.tgz" -type f | wc -l | tr -d " ")" = 1
            '

      - name: Build and package GNU target at glibc 2.31 on its matching CPU
        if: matrix.libc == 'glibc'
        env:
          TARGET: ${{ matrix.target }}
          DOCKER_PLATFORM: ${{ matrix.docker_platform }}
        run: |
          set -euo pipefail
          docker build \
            --platform "$DOCKER_PLATFORM" \
            --file platforms/node/Dockerfile.gnu \
            --build-arg NODE_IMAGE=node:24.13.1-bullseye \
            --build-arg RUST_IMAGE=rust:1.95-bullseye \
            --tag merman-node-gnu:ci \
            platforms/node
          docker run --rm \
            --platform "$DOCKER_PLATFORM" \
            -e CARGO_INCREMENTAL=0 \
            -e TARGET="$TARGET" \
            -v "$GITHUB_WORKSPACE:/work" \
            -v "$RUNNER_TEMP:/runner-temp" \
            -w /work \
            merman-node-gnu:ci \
            sh -c '
              set -eu
              git config --global --add safe.directory /work
              test "$(node -p "process.report.getReport().header.glibcVersionRuntime")" = "2.31"
              npm ci --prefix platforms/node
              node platforms/node/scripts/build-candidate.mjs --candidate napi --target "$TARGET"
              package_root=/runner-temp/node-packages
              artifact_dir=/runner-temp/node-platform-artifact
              smoke_tarballs=/runner-temp/node-smoke-tarballs
              node platforms/node/scripts/assemble-packages.mjs --target "$TARGET" --output-root "$package_root"
              node platforms/node/scripts/verify-packages.mjs --packed-root "$package_root"
              mkdir -p "$artifact_dir" "$smoke_tarballs"
              npm pack "$package_root/node" --json --pack-destination "$smoke_tarballs" >/runner-temp/node-root-pack.json
              npm pack "$package_root/$TARGET" --json --pack-destination "$artifact_dir" >/runner-temp/node-target-pack.json
              cp "$artifact_dir"/*.tgz "$smoke_tarballs"/
            '

      - name: Resolve only the root package and execute Linux consumer on Node 22.0.0
        if: startsWith(matrix.target, 'linux-')
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.validate-inputs.outputs.version }}
          DOCKER_PLATFORM: ${{ matrix.docker_platform }}
          CONSUMER_IMAGE: ${{ matrix.consumer_image }}
          TARGET_LIBC: ${{ matrix.libc }}
        run: |
          set -euo pipefail
          docker run --rm \
            --platform "$DOCKER_PLATFORM" \
            -e TARGET="$TARGET" -e VERSION="$VERSION" -e TARGET_LIBC="$TARGET_LIBC" \
            -v "$GITHUB_WORKSPACE:/source:ro" \
            -v "$RUNNER_TEMP:/runner-temp" \
            -w /runner-temp \
            "$CONSUMER_IMAGE" \
            sh -c '
              set -eu
              test "$(node --version)" = "v22.0.0"
              if [ "$TARGET_LIBC" = musl ]; then
                apk add --no-cache python3
              else
                test "$(node -p "process.report.getReport().header.glibcVersionRuntime")" = "2.31"
              fi
              python3 /source/platforms/node/scripts/install-root-package.py \
                --tarball-dir /runner-temp/node-smoke-tarballs \
                --project /runner-temp/node-install-smoke --version "$VERSION" --target "$TARGET"
              node /source/platforms/node/scripts/smoke-installed-package.mjs \
                --project /runner-temp/node-install-smoke --version "$VERSION" --target "$TARGET"
            '

      - name: Setup Node
        if: ${{ !startsWith(matrix.target, 'linux-') }}
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: platforms/node/package-lock.json

      - name: Install npm toolchain
        if: ${{ !startsWith(matrix.target, 'linux-') }}
        run: npm install --global --ignore-scripts --registry=https://registry.npmjs.org/ npm@12.2.1

      - name: Install pinned Node build dependencies
        if: ${{ !startsWith(matrix.target, 'linux-') }}
        run: npm ci --prefix platforms/node

      - name: Build and probe native package
        if: ${{ !startsWith(matrix.target, 'linux-') }}
        run: node platforms/node/scripts/build-candidate.mjs --candidate napi --target "${{ matrix.target }}"

      - name: Assemble and verify target package
        if: ${{ !startsWith(matrix.target, 'linux-') }}
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          package_root="$RUNNER_TEMP/node-packages"
          node platforms/node/scripts/assemble-packages.mjs \
            --target "$TARGET" \
            --output-root "$package_root"
          node platforms/node/scripts/verify-packages.mjs --packed-root "$package_root"

      - name: Pack target package
        if: ${{ !startsWith(matrix.target, 'linux-') }}
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          package_root="$RUNNER_TEMP/node-packages"
          artifact_dir="$RUNNER_TEMP/node-platform-artifact"
          smoke_tarballs="$RUNNER_TEMP/node-smoke-tarballs"
          mkdir -p "$artifact_dir" "$smoke_tarballs"
          npm pack "$package_root/node" --json --pack-destination "$smoke_tarballs" > "$RUNNER_TEMP/node-root-pack.json"
          npm pack "$package_root/$TARGET" --json --pack-destination "$artifact_dir" > "$RUNNER_TEMP/node-target-pack.json"
          cp "$artifact_dir"/*.tgz "$smoke_tarballs/"
          test "$(find "$artifact_dir" -maxdepth 1 -name '*.tgz' -type f | wc -l | tr -d ' ')" = 1

      - name: Setup Node minimum consumer runtime
        if: ${{ !startsWith(matrix.target, 'linux-') }}
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22.0.0"
          package-manager-cache: false

      - name: Resolve only the root package and execute installed consumer on Node 22.0.0
        if: ${{ !startsWith(matrix.target, 'linux-') }}
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.validate-inputs.outputs.version }}
        run: |
          set -euo pipefail
          test "$(node --version)" = "v22.0.0"
          smoke_root="$RUNNER_TEMP/node-install-smoke"
          python3 platforms/node/scripts/install-root-package.py \
            --tarball-dir "$RUNNER_TEMP/node-smoke-tarballs" \
            --project "$smoke_root" --version "$VERSION" --target "$TARGET"
          node "$GITHUB_WORKSPACE/platforms/node/scripts/smoke-installed-package.mjs" \
            --project "$smoke_root" \
            --version "$VERSION" \
            --target "$TARGET"

      - name: Upload target package
        uses: actions/upload-artifact@v7.0.2
        with:
          name: preflight-node-npm-${{ matrix.target }}
          path: ${{ runner.temp }}/node-platform-artifact/*.tgz
          if-no-files-found: error

  node-npm-dry-run:
    needs:
      - validate-inputs
      - node-loader-package
      - node-wasm-package
      - node-platform-package
    name: node-npm-dry-run
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.validate-inputs.outputs.source_sha }}
          persist-credentials: false

      - name: Download Node package group
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: preflight-node-npm-*
          path: target/node-npm-package-group
          merge-multiple: true

      - name: Pack and verify Node package group dry-run
        env:
          VERSION: ${{ needs.validate-inputs.outputs.version }}
          SOURCE_SHA: ${{ needs.validate-inputs.outputs.source_sha }}
        run: |
          set -euo pipefail
          python3 scripts/node_package_group.py create-manifest \
            --artifact-dir target/node-npm-package-group \
            --descriptor platforms/node/package-surfaces.json \
            --version "$VERSION" \
            --source-sha "$SOURCE_SHA" \
            --target-dist-tag staging
          python3 scripts/node_package_group.py verify-artifact \
            --manifest target/node-npm-package-group/node-package-group.json \
            --artifact-dir target/node-npm-package-group \
            --descriptor platforms/node/package-surfaces.json \
            --version "$VERSION" \
            --source-sha "$SOURCE_SHA" \
            --target-dist-tag staging
          python3 scripts/node_package_group.py reconcile \
            --manifest target/node-npm-package-group/node-package-group.json \
            --artifact-dir target/node-npm-package-group \
            --descriptor platforms/node/package-surfaces.json \
            --report target/node-npm-package-group/reconciliation-report.json \
            --dry-run

  vscode-extension-dry-run:
    needs: validate-inputs
    name: vscode-extension-dry-run (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x64
          - os: macos-15
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
          - os: windows-2025-vs2026
            target: win32-x64
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.validate-inputs.outputs.source_sha }}
          persist-credentials: false

      - name: Checkout GNU compatibility tooling
        if: runner.os == 'Linux'
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .workflow-tools
          sparse-checkout: scripts/linux_binary_compatibility.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Verify release versions
        env:
          VERSION: ${{ needs.validate-inputs.outputs.version }}
        run: python scripts/release-version.py check --version "$VERSION"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Rust cache
        uses: Swatinem/rust-cache@v2.9.2
        with:
          cache-targets: false

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: tools/vscode-extension/package-lock.json

      - name: Install npm toolchain
        run: npm install --global --ignore-scripts --registry=https://registry.npmjs.org/ npm@12.2.1

      - name: Install extension dependencies
        working-directory: tools/vscode-extension
        run: npm ci

      - name: Build release runtime binaries
        run: |
          python3 scripts/artifact_profile_recipe.py lsp-stdio-release --build-host --locked
          python3 scripts/artifact_profile_recipe.py cli-release --build-host --locked

      - name: Verify GNU runtime compatibility
        if: runner.os == 'Linux'
        run: python3 .workflow-tools/scripts/linux_binary_compatibility.py target/dist/merman-cli target/dist/merman-lsp

      - name: Typecheck extension
        working-directory: tools/vscode-extension
        run: npm run check

      - name: Test extension
        working-directory: tools/vscode-extension
        run: npm test

      - name: Stage runtime binaries
        working-directory: tools/vscode-extension
        run: npm run prepare:binaries

      - name: Smoke extension host
        if: runner.os == 'Linux'
        working-directory: tools/vscode-extension
        run: xvfb-run -a npm run test:extension-host

      - name: Smoke extension host
        if: runner.os != 'Linux'
        working-directory: tools/vscode-extension
        run: npm run test:extension-host

      - name: Derive VSIX release metadata
        id: vsix
        env:
          RELEASE_VERSION: ${{ needs.validate-inputs.outputs.version }}
        run: |
          set -euo pipefail
          extension_version="$(node -p "require('./tools/vscode-extension/package.json').version")"
          {
            printf 'extension_version=%s\n' "$extension_version"
            printf 'runtime_version=%s\n' "$RELEASE_VERSION"
          } >> "$GITHUB_OUTPUT"
          echo "VSIX extension_version=${extension_version} runtime_version=${RELEASE_VERSION}"

      - name: Package VSIX
        working-directory: tools/vscode-extension
        env:
          MERMAN_VSCODE_RELEASE_VERSION: ${{ steps.vsix.outputs.extension_version }}
        run: npm run package -- --target "${{ matrix.target }}" --out "merman-vscode-${{ matrix.target }}.vsix"

      - name: Verify VSIX contents
        working-directory: tools/vscode-extension
        env:
          MERMAN_VSCODE_RELEASE_VERSION: ${{ steps.vsix.outputs.extension_version }}
        run: npm run verify:vsix -- --vsix "merman-vscode-${{ matrix.target }}.vsix" --platform "${{ matrix.target }}" --target "${{ matrix.target }}"

      - name: Smoke packaged VSIX
        if: runner.os == 'Linux'
        working-directory: tools/vscode-extension
        run: xvfb-run -a npm run smoke:vsix -- --vsix "merman-vscode-${{ matrix.target }}.vsix"

      - name: Smoke packaged VSIX
        if: runner.os != 'Linux'
        working-directory: tools/vscode-extension
        run: npm run smoke:vsix -- --vsix "merman-vscode-${{ matrix.target }}.vsix"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: preflight-vscode-extension-${{ matrix.target }}
          path: tools/vscode-extension/merman-vscode-${{ matrix.target }}.vsix
          if-no-files-found: error

  flutter-dry-run:
    needs: validate-inputs
    name: flutter-dry-run
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.validate-inputs.outputs.source_sha }}
          persist-credentials: false

      - name: Read Android toolchain versions
        id: android-toolchain
        run: echo "ndk=$(python3 platforms/android/build-android.py --print-version ndk)" >> "$GITHUB_OUTPUT"

      - name: Verify release versions
        env:
          VERSION: ${{ needs.validate-inputs.outputs.version }}
        run: python3 scripts/release-version.py check --version "$VERSION"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin,x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu,x86_64-pc-windows-gnu

      - name: Rust cache
        uses: Swatinem/rust-cache@v2.9.2

      - name: Install desktop cross tools
        run: |
          if ! command -v zig >/dev/null 2>&1; then
            brew install zig
          fi
          cargo install cargo-zigbuild --version 0.23.4 --locked

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools

      - name: Install Android NDK
        shell: bash
        env:
          ANDROID_NDK_VERSION: ${{ steps.android-toolchain.outputs.ndk }}
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Build Android native libraries
        run: python3 platforms/android/build-android.py --artifact-profile flutter-android-native --targets aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Build Apple and desktop native libraries
        run: python3 platforms/flutter/build-native.py all-desktop

      - name: Verify Flutter native artifact matrix
        run: |
          test -f platforms/flutter/native/android/armeabi-v7a/libmerman_ffi.so
          test -f platforms/flutter/native/android/arm64-v8a/libmerman_ffi.so
          test -f platforms/flutter/native/android/x86_64/libmerman_ffi.so
          test -f platforms/flutter/native/ios/arm64/libmerman_ffi.dylib
          test -f platforms/flutter/native/ios/arm64-simulator/libmerman_ffi.dylib
          test -f platforms/flutter/native/ios/x86_64-simulator/libmerman_ffi.dylib
          test -f platforms/flutter/native/macos/arm64/libmerman_ffi.dylib
          test -f platforms/flutter/native/macos/x86_64/libmerman_ffi.dylib
          test -f platforms/flutter/native/linux/aarch64/libmerman_ffi.so
          test -f platforms/flutter/native/linux/x86_64/libmerman_ffi.so
          test -f platforms/flutter/native/windows/x86_64/merman_ffi.dll

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - name: Validate Flutter package
        working-directory: platforms/flutter
        run: |
          flutter pub get
          dart run ffigen --config ffigen.yaml
          git ls-files --error-unmatch -- lib/src/generated/native_abi.dart
          git diff --exit-code -- lib/src/generated/native_abi.dart
          flutter analyze
          dart format --set-exit-if-changed \
            lib/merman.dart lib/src/merman_ffi.dart lib/src/operation_metadata.dart \
            example tool hook
          dart run tool/abi3_contract_test.dart
          dart run tool/native_assets_contract_test.dart
          dart run example/main.dart
          dart run tool/theme_authoring_smoke.dart

      - name: Freeze target native assets
        env:
          SOURCE_SHA: ${{ needs.validate-inputs.outputs.source_sha }}
          SOURCE_TREE: ${{ needs.validate-inputs.outputs.source_tree }}
          VERSION: ${{ needs.validate-inputs.outputs.version }}
          RELEASE_TAG: flutter-v${{ needs.validate-inputs.outputs.version }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/flutter_native_assets.py stage \
            --native-root platforms/flutter/native \
            --output "$RUNNER_TEMP/flutter-native-assets" \
            --base-url "https://github.com/$RELEASE_REPOSITORY/releases/download/$RELEASE_TAG/" \
            --source-sha "$SOURCE_SHA" --source-tree "$SOURCE_TREE" --version "$VERSION"

      - name: Package Flutter release artifact
        env:
          SOURCE_SHA: ${{ needs.validate-inputs.outputs.source_sha }}
          SOURCE_TREE: ${{ needs.validate-inputs.outputs.source_tree }}
          VERSION: ${{ needs.validate-inputs.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/flutter_release_archive.py pack \
            --package-root platforms/flutter \
            --native-manifest "$RUNNER_TEMP/flutter-native-assets/native-assets.json" \
            --archive "$RUNNER_TEMP/merman-flutter-package.tar.gz" \
            --receipt "$RUNNER_TEMP/merman-flutter-package.receipt.json" \
            --source-sha "$SOURCE_SHA" \
            --source-tree "$SOURCE_TREE" \
            --version "$VERSION"

      - name: Qualify the frozen thin package and relocated app
        env:
          SOURCE_SHA: ${{ needs.validate-inputs.outputs.source_sha }}
          SOURCE_TREE: ${{ needs.validate-inputs.outputs.source_tree }}
          VERSION: ${{ needs.validate-inputs.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/flutter_release_archive.py extract \
            --archive "$RUNNER_TEMP/merman-flutter-package.tar.gz" \
            --receipt "$RUNNER_TEMP/merman-flutter-package.receipt.json" \
            --destination "$RUNNER_TEMP/flutter-thin-package" --require-thin \
            --source-sha "$SOURCE_SHA" --source-tree "$SOURCE_TREE" --version "$VERSION"
          python3 scripts/verify_flutter_pub_package.py \
            --package-root "$RUNNER_TEMP/flutter-thin-package" --require-thin --max-compressed-mb 99
          python3 platforms/flutter/tool/qualify_packaged_app.py \
            --package-root "$RUNNER_TEMP/flutter-thin-package" \
            --assets-root "$RUNNER_TEMP/flutter-native-assets" \
            --output "$RUNNER_TEMP/flutter-packaged-app.json"

      - name: Retain Flutter candidate qualification
        uses: actions/upload-artifact@v7.0.2
        with:
          name: preflight-flutter-qualification
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/merman-flutter-package.receipt.json
            ${{ runner.temp }}/flutter-packaged-app.json

  sdk-archives:
    needs:
      - validate-inputs
      - versions-and-packages
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/release-sdk.yml
    with:
      source_ref: ${{ needs.validate-inputs.outputs.source_sha }}
      release_tag: ${{ needs.validate-inputs.outputs.release_tag }}

  release-preflight-evidence:
    needs:
      - validate-inputs
      - versions-and-packages
      - mermaid-reference-materialized
      - cli-and-lsp-archives
      - python-wheel
      - android-aar
      - apple-xcframework
      - web-npm-dry-run
      - node-loader-package
      - node-wasm-package
      - node-platform-package
      - node-npm-dry-run
      - vscode-extension-dry-run
      - flutter-dry-run
      - sdk-archives
    runs-on: ubuntu-24.04
    steps:
      - name: Check out trusted preflight evidence tooling
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Record successful immutable preflight
        id: evidence
        env:
          PREFLIGHT_WORKFLOW_SHA: ${{ github.workflow_sha }}
          PREFLIGHT_SOURCE_REF: ${{ inputs.source_ref }}
          PREFLIGHT_NEEDS: ${{ toJSON(needs) }}
          SOURCE_SHA: ${{ needs.validate-inputs.outputs.source_sha }}
          SOURCE_TREE: ${{ needs.validate-inputs.outputs.source_tree }}
          VERSION: ${{ needs.validate-inputs.outputs.version }}
        run: python3 scripts/release_preflight_evidence.py create --output "$RUNNER_TEMP/preflight-evidence.json"

      - name: Upload immutable preflight evidence
        if: ${{ steps.evidence.outputs.created == 'true' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-preflight-${{ needs.validate-inputs.outputs.source_sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/preflight-evidence.json
          if-no-files-found: error
