name: Nixpkgs CLI review build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nixpkgs-merman-0100-review-${{ github.ref }}
  cancel-in-progress: false

env:
  MERMAN_RELEASE_SOURCE: 91531bd081b1347a0bce3c297957a9389481c99d
  NIXPKGS_REVIEW_SOURCE: 98e793b844161d178a9a34ca243568388a91001d

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: Latias94/nixpkgs
          ref: ${{ env.NIXPKGS_REVIEW_SOURCE }}
          path: nixpkgs
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: DeterminateSystems/determinate-nix-action@v3.23.1
        with:
          extra-conf: |
            max-jobs = 2
            cores = 2
      - name: Prefetch the immutable release with Nix
        run: |
          mkdir candidate
          nix store prefetch-file --unpack --name source --json \
            "https://github.com/Latias94/merman/archive/$MERMAN_RELEASE_SOURCE.tar.gz" \
            > candidate/source.json
      - name: Materialize the source-bound package
        shell: python
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import tomllib

          candidate = Path("candidate")
          receipt = json.loads((candidate / "source.json").read_text())
          source = Path(receipt["storePath"])
          workspace = tomllib.loads((source / "Cargo.toml").read_text())
          assert workspace["workspace"]["package"]["version"] == "0.10.0"
          package = Path("nixpkgs/pkgs/by-name/me/merman-cli/package.nix").read_text()
          # Amend the existing PR recipe; keep its native build and install checks.
          replacements = (
              ('version = "0.9.3";', 'version = "0.10.0";'),
              ('rev = "3b915f69c02d55b873d252cf6c8a6048e7f3427d";',
               f'rev = "{os.environ["MERMAN_RELEASE_SOURCE"]}";'),
              ('hash = "sha256-hkOC1Y+nVE35bY2issYNoAKTFESH59y6wSwuwd9IlKs=";',
               f'hash = "{receipt["hash"]}";'),
              ('    "ascii"\n    "icons"', '    "ascii"\n    "fixes"\n    "icons"'),
          )
          for before, after in replacements:
              assert package.count(before) == 1, before
              package = package.replace(before, after)
          (candidate / "package.nix").write_text(package)
          shutil.copyfile(source / "Cargo.lock", candidate / "Cargo.lock")
          descriptor = json.loads((source / "capabilities/artifact-profiles-v2.json").read_text())
          profile = next(p for p in descriptor["profiles"] if p["id"] == "cli-release")
          (candidate / "expected-profile.json").write_text(json.dumps(profile))
          assert len(profile["cargo"]["features"]) == 23
          manpage_count = len(list((source / "crates/merman-cli/assets/man").glob("*.1")))
          assert manpage_count == 17, manpage_count
          provenance = {
              "version": "0.10.0",
              "release_source": os.environ["MERMAN_RELEASE_SOURCE"],
              "source_url": f"https://github.com/Latias94/merman/archive/{os.environ['MERMAN_RELEASE_SOURCE']}.tar.gz",
              "source_nar_hash": receipt["hash"],
              "nixpkgs_repository": "Latias94/nixpkgs",
              "nixpkgs_source": os.environ["NIXPKGS_REVIEW_SOURCE"],
              "workflow_source": os.environ["GITHUB_SHA"],
              "run_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "cargo_lock_sha256": hashlib.sha256((candidate / "Cargo.lock").read_bytes()).hexdigest(),
              "package_sha256": hashlib.sha256((candidate / "package.nix").read_bytes()).hexdigest(),
              "feature_count": len(profile["cargo"]["features"]),
              "manpage_count": manpage_count,
          }
          (candidate / "provenance.json").write_text(json.dumps(provenance, indent=2) + "\n")
          print(f"Release source: {os.environ['MERMAN_RELEASE_SOURCE']}")
          print(f"Nix source hash: {receipt['hash']}")
          print(f"Cargo.lock SHA-256: {provenance['cargo_lock_sha256']}")
      - name: Apply the candidate to the existing Nixpkgs PR head
        run: |
          cp candidate/package.nix candidate/Cargo.lock nixpkgs/pkgs/by-name/me/merman-cli/
          git -C nixpkgs diff --binary -- \
            pkgs/by-name/me/merman-cli/package.nix \
            pkgs/by-name/me/merman-cli/Cargo.lock > candidate/nixpkgs.patch
          git -C nixpkgs diff --check
      - name: Check the package format
        run: |
          formatter="$(nix-build --no-out-link -A nixfmt ./nixpkgs)"
          "$formatter/bin/nixfmt" --check nixpkgs/pkgs/by-name/me/merman-cli/package.nix
      - name: Evaluate all advertised systems
        run: |
          for system in x86_64-linux aarch64-linux aarch64-darwin; do
            nix-instantiate --eval --strict --json --expr "
              let
                pkgs = import ./nixpkgs { system = \"$system\"; };
                package = pkgs.merman-cli;
              in assert pkgs.lib.versionAtLeast pkgs.rustc.version \"1.95\"; {
                inherit (package) version buildFeatures buildType buildNoDefaultFeatures;
                inherit (package.meta) platforms;
                rustVersion = pkgs.rustc.version;
                drvPath = package.drvPath;
              }
            " > "candidate/eval-$system.json"
          done
      - name: Check the evaluated package against the release profile
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          candidate = Path("candidate")
          profile = json.loads((candidate / "expected-profile.json").read_text())["cargo"]
          systems = {"x86_64-linux", "aarch64-linux", "aarch64-darwin"}
          for system in sorted(systems):
              result = json.loads((candidate / f"eval-{system}.json").read_text())
              assert result["version"] == "0.10.0", result
              assert result["buildFeatures"] == profile["features"], result
              assert result["buildType"] == profile["profile"], result
              assert result["buildNoDefaultFeatures"] == (not profile["default_features"]), result
              assert set(result["platforms"]) == systems, result
              print(f"{system}: Rust {result['rustVersion']}, {result['drvPath']}")
          provenance = json.loads((candidate / "provenance.json").read_text())
          summary = (
              "# Nixpkgs merman-cli 0.10.0 candidate\n\n"
              f"- Release source: `{provenance['release_source']}`\n"
              f"- Workflow source: `{provenance['workflow_source']}`\n"
              f"- Nixpkgs PR head: `{provenance['nixpkgs_source']}`\n"
              f"- Source NAR hash (Nix prefetch): `{provenance['source_nar_hash']}`\n"
              f"- Cargo.lock SHA-256: `{provenance['cargo_lock_sha256']}`\n"
              "- cli-release: 23 features, dist, defaults disabled; 17 man pages\n"
              "- Evaluation: x86_64-linux, aarch64-linux, aarch64-darwin\n"
              "- Native build, installation, version and renderer checks: see the three build jobs.\n"
          )
          (candidate / "summary.md").write_text(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write(summary)
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: nixpkgs-merman-0.10.0-candidate
          path: candidate
          if-no-files-found: error

  build:
    needs: prepare
    name: build (${{ matrix.system }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      NIX_SYSTEM: ${{ matrix.system }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            system: x86_64-linux
          - os: ubuntu-24.04-arm
            system: aarch64-linux
          - os: macos-15
            system: aarch64-darwin
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          repository: Latias94/nixpkgs
          ref: ${{ env.NIXPKGS_REVIEW_SOURCE }}
          path: nixpkgs
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: nixpkgs-merman-0.10.0-candidate
          path: candidate
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: DeterminateSystems/determinate-nix-action@v3.23.1
        with:
          extra-conf: |
            max-jobs = 2
            cores = 2
      - name: Apply the exact prepared package
        run: |
          cp candidate/package.nix candidate/Cargo.lock nixpkgs/pkgs/by-name/me/merman-cli/
      - name: Build the Nixpkgs expression and its install checks
        run: |
          native_system="$(nix-instantiate --eval --strict --json --expr builtins.currentSystem)"
          printf '%s\n' "$native_system" > native-system.json
          test "$native_system" = "\"$NIX_SYSTEM\""
          nix-build --no-out-link -A merman-cli ./nixpkgs > package-output.txt
      - name: Run the package version test
        run: nix-build --no-out-link -A merman-cli.tests.version ./nixpkgs > version-test-output.txt
      - name: Smoke-test the installed renderer
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import subprocess
          from xml.etree import ElementTree

          output = Path("package-output.txt").read_text().strip()
          binary = str(Path(output) / "bin/merman-cli")
          version = subprocess.run([binary, "--version"], check=True, capture_output=True, text=True)
          assert version.stdout.strip() == "merman-cli 0.10.0", version.stdout
          source = b"flowchart LR\n  A[Start] --> B[Done]\n"
          formats = {"svg": None, "png": b"\x89PNG\r\n\x1a\n", "jpeg": b"\xff\xd8\xff", "pdf": b"%PDF-"}
          rendered = {}
          for format, magic in formats.items():
              result = subprocess.run(
                  [binary, "render", "-", "--format", format],
                  input=source, capture_output=True, timeout=120,
              )
              assert result.returncode == 0, (format, result.stderr)
              if magic is None:
                  assert ElementTree.fromstring(result.stdout).tag == "{http://www.w3.org/2000/svg}svg"
              else:
                  assert result.stdout.startswith(magic), (format, result.stdout[:32])
              rendered[format] = len(result.stdout)
              print(f"{format}: installed renderer produced {len(result.stdout)} bytes")
          proof = {
              "system": json.loads(Path("native-system.json").read_text()),
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "package_output": output,
              "version_test_output": Path("version-test-output.txt").read_text().strip(),
              "version": version.stdout.strip(),
              "rendered_bytes": rendered,
              "candidate": json.loads(Path("candidate/provenance.json").read_text()),
          }
          Path("smoke.json").write_text(json.dumps(proof, indent=2) + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(
                  f"# {proof['system']}: merman-cli 0.10.0\n\n"
                  f"- Package output: `{output}`\n"
                  f"- Version test output: `{proof['version_test_output']}`\n"
                  "- Native build and installed-CLI contract passed (17 man pages).\n"
                  "- Installed SVG/PNG/JPEG/PDF rendering passed.\n"
              )
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: nixpkgs-merman-0.10.0-${{ matrix.system }}-proof
          path: |
            candidate/provenance.json
            candidate/eval-${{ matrix.system }}.json
            native-system.json
            package-output.txt
            version-test-output.txt
            smoke.json
          if-no-files-found: error
