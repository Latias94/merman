name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  merge_group:
    types:
      - checks_requested
  schedule:
    - cron: "7 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-plan:
    name: ci-plan
    runs-on: ubuntu-24.04
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      cli: ${{ steps.plan.outputs.cli }}
      core: ${{ steps.plan.outputs.core }}
      fuzz: ${{ steps.plan.outputs.fuzz }}
      hygiene: ${{ steps.plan.outputs.hygiene }}
      node: ${{ steps.plan.outputs.node }}
      npm: ${{ steps.plan.outputs.npm }}
      performance: ${{ steps.plan.outputs.performance }}
      platform: ${{ steps.plan.outputs.platform }}
      python: ${{ steps.plan.outputs.python }}
      security: ${{ steps.plan.outputs.security }}
      typst: ${{ steps.plan.outputs.typst }}
      vscode: ${{ steps.plan.outputs.vscode }}
      web: ${{ steps.plan.outputs.web }}
      workflow: ${{ steps.plan.outputs.workflow }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve same-run CI owners
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request)
              base="$PR_BASE_SHA"
              head="$PR_HEAD_SHA"
              extra=()
              ;;
            merge_group)
              base="$MERGE_BASE_SHA"
              head="$MERGE_HEAD_SHA"
              extra=()
              ;;
            push)
              base="$PUSH_BASE_SHA"
              head="$PUSH_HEAD_SHA"
              extra=(--select-all --reason "main push full lifecycle")
              ;;
            schedule|workflow_dispatch)
              base="$PUSH_HEAD_SHA"
              head="$PUSH_HEAD_SHA"
              extra=(--select-owner core --reason "scheduled or manual full host safety net")
              ;;
            *)
              echo "unsupported CI event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac
          python3 scripts/ci_plan.py plan \
            --base "$base" \
            --head "$head" \
            --github-output "$GITHUB_OUTPUT" \
            "${extra[@]}"

  workflow-analysis:
    name: workflow-analysis
    needs: ci-plan
    if: ${{ needs.ci-plan.outputs.workflow == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install exact workflow analyzers
        shell: bash
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          ZIZMOR_VERSION: 1.29.0
          ZIZMOR_SHA256: 587b99c2e1b34575c6c8565c2bfde415ca8bc0310f5589f19bc948c8dea10a20
        run: |
          set -euo pipefail
          tools_dir="$RUNNER_TEMP/workflow-tools"
          mkdir -p "$tools_dir/actionlint" "$tools_dir/zizmor"

          actionlint_archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --location --show-error \
            --retry 3 \
            --output "$actionlint_archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$actionlint_archive" | sha256sum --check
          tar -xzf "$actionlint_archive" -C "$tools_dir/actionlint" actionlint

          cat > "$RUNNER_TEMP/zizmor-requirements.txt" <<EOF
          zizmor==${ZIZMOR_VERSION} --hash=sha256:${ZIZMOR_SHA256}
          EOF
          python3 -m pip install \
            --disable-pip-version-check \
            --no-deps \
            --only-binary=:all: \
            --require-hashes \
            --target "$tools_dir/zizmor" \
            --requirement "$RUNNER_TEMP/zizmor-requirements.txt"

          test -x "$tools_dir/actionlint/actionlint"
          test -x "$tools_dir/zizmor/bin/zizmor"
          echo "$tools_dir/actionlint" >> "$GITHUB_PATH"
          echo "$tools_dir/zizmor/bin" >> "$GITHUB_PATH"

      - name: Verify analyzer identities
        run: |
          actionlint -version
          zizmor --version

      - name: Validate GitHub Actions syntax and expressions
        run: actionlint

      - name: Audit GitHub Actions security
        run: zizmor --min-severity high .

  hygiene:
    name: hygiene
    needs: ci-plan
    if: ${{ needs.ci-plan.outputs.hygiene == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Verify release version projections
        run: python3 scripts/release-version.py

      - name: Verify CLI installation metadata
        run: python3 scripts/cli_installation_contract.py

      - name: Verify third-party source and license contract
        run: python3 scripts/verify-third-party-licenses.py

      - name: Verify legal material projections
        run: python3 scripts/sync-release-legal-materials.py --check

      - name: Verify Cargo package legal materials
        run: python3 scripts/verify_crate_package_legal_materials.py

      - name: Test release and workflow hygiene scripts
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Check whitespace (pull request or merge queue)
        if: github.event_name != 'push'
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: git diff --check "$BASE_SHA" "$HEAD_SHA"

      - name: Check whitespace (push)
        if: github.event_name == 'push'
        run: |
          base="${{ github.event.before }}"
          if [[ "$base" =~ ^0+$ ]]; then
            git show --check --format= --no-renames HEAD
          else
            git diff --check "$base...${{ github.sha }}"
          fi

  cli-contracts:
    name: cli-contracts
    needs: ci-plan
    if: ${{ needs.ci-plan.outputs.cli == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2.85.11
        with:
          tool: nextest

      - name: Rust cache
        uses: Swatinem/rust-cache@v2.9.2
        with:
          cache-targets: false

      - name: Install CLI asset validators
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes elvish fish mandoc zsh

      - name: Verify generated CLI distribution assets
        run: python3 scripts/generate_cli_assets.py --check

      - name: Validate CLI distribution assets
        run: python3 scripts/verify_cli_assets.py --require bash,zsh,fish,elvish,mandoc

      - name: Test exact CLI feature process matrix
        run: python3 scripts/verify_cli_process_matrix.py --locked

      - name: Lint all CLI feature branches
        run: cargo clippy --locked -p merman-cli --all-targets --all-features -- -D warnings

  nix-cli-package:
    name: nix-cli-package
    needs: ci-plan
    if: ${{ needs.ci-plan.outputs.cli == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3.21.9

      - name: Build reusable Nix derivation
        run: |
          nix-build --no-out-link default.nix \
            --arg pkgs 'import (builtins.getFlake (toString ./.)).inputs.nixpkgs { }'

      - name: Check Nix flake
        run: |
          nix flake check --all-systems --no-build --no-write-lock-file
          nix flake check --print-build-logs --no-write-lock-file

      - name: Run Nix flake app
        run: nix run --no-write-lock-file . -- --version

      - name: Check immutable Nix lock
        run: git diff --exit-code -- flake.lock

  cli-artifact-profiles:
    name: cli-artifact-profiles (${{ matrix.target }})
    needs: ci-plan
    if: ${{ needs.ci-plan.outputs.cli == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-2025-vs2026
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Validate PowerShell completion
        if: runner.os == 'Windows'
        run: python3 scripts/verify_cli_assets.py --require powershell

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Rust cache
        uses: Swatinem/rust-cache@v2.9.2
        with:
          cache-targets: false

      - name: Build exact CLI artifact profiles
        run: |
          python3 scripts/artifact_profile_recipe.py cli-analysis --build-host --locked
          python3 scripts/artifact_profile_recipe.py cli-release --build-host --locked

  build-test:
    name: build-test (${{ matrix.os }})
    needs: ci-plan
    if: ${{ needs.ci-plan.outputs.core == 'true' }}
    runs-on: ${{ matrix.os }}
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            parity: true
          - os: macos-15
            parity: false
          - os: windows-2025-vs2026
            parity: false

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Resolve pinned DOMPurify source
        id: dompurify-source
        if: matrix.parity
        shell: bash
        run: |
          commit="$(python3 - <<'PY'
          import json
          from pathlib import Path

          bundle = json.loads(
              Path("tools/upstreams/MERMAID_REFERENCE_BUNDLE.json").read_text(encoding="utf-8")
          )
          print(bundle["sanitizer"]["source"]["commit"])
          PY
          )"
          if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid DOMPurify source commit in reference bundle: $commit" >&2
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7.0.1
        name: Checkout pinned DOMPurify source
        if: matrix.parity
        with:
          repository: cure53/DOMPurify
          ref: ${{ steps.dompurify-source.outputs.commit }}
          path: repo-ref/dompurify
          persist-credentials: false
          sparse-checkout: |
            dist/purify.cjs.js
          sparse-checkout-cone-mode: false

      - name: Verify pinned DOMPurify source checkout
        if: matrix.parity
        shell: bash
        env:
          DOMPURIFY_SOURCE_COMMIT: ${{ steps.dompurify-source.outputs.commit }}
        run: |
          actual="$(git -C repo-ref/dompurify rev-parse HEAD)"
          test "$actual" = "$DOMPURIFY_SOURCE_COMMIT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Install parity Rust targets
        if: matrix.parity
        run: rustup target add aarch64-linux-android wasm32-unknown-unknown

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2.85.11
        with:
          tool: nextest

      - name: Free disk space (Ubuntu)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          df -h
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            "$AGENT_TOOLSDIRECTORY/CodeQL"
          sudo docker image prune --all --force || true
          df -h

      - name: Rust cache
        uses: Swatinem/rust-cache@v2.9.2
        with:
          cache-targets: false

      - name: Verify pinned Mermaid reference before runtime install
        if: matrix.parity
        run: cargo run --locked -p xtask -- verify-mermaid-reference

      - name: Setup Node for generated Mermaid artifacts
        if: matrix.parity
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            platforms/node/package-lock.json
            playground/tests/package-lock.json
            tools/mermaid-cli/package-lock.json

      - name: Install pinned Mermaid runtime
        if: matrix.parity
        working-directory: tools/mermaid-cli
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npm ci

      - name: Verify pull-request architecture contracts
        if: matrix.parity
        run: |
          cargo run --locked -p xtask -- verify-generated
          cargo run --locked -p xtask -- verify-feature-matrix

      - name: Test full workspace (Linux and safety-net lifecycles)
        if: runner.os == 'Linux' || github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: cargo nextest run --locked --cargo-quiet

      - name: Compile workspace on pull-request host runners
        if: runner.os != 'Linux' && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
        run: cargo check --workspace --all-targets --locked

      - name: Test host-sensitive contracts on pull requests
        if: runner.os != 'Linux' && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
        shell: bash
        run: |
          cargo nextest run --locked -p merman-layout-elk --lib --cargo-quiet \
            -E 'test(separate_children_layout_is_small_stack_safe_and_deterministic) | test(source_graph_dump_is_small_stack_safe_for_deep_hierarchy)'
          cargo nextest run --locked -p xtask --cargo-quiet \
            -E 'test(two_contenders_are_serialized) | test(dead_owner_is_recovered)'
          cargo nextest run --locked -p merman-ffi \
            --test header_smoke --test c_consumer_smoke --cargo-quiet
          cargo nextest run --locked -p merman-cli --test markdown_cli --cargo-quiet
          cargo nextest run --locked -p merman-cli --no-default-features --features rustdoc \
            --test rustdoc_cli --cargo-quiet

      - name: Check committed Rustdoc fragments before documentation
        if: matrix.parity
        run: cargo run --locked -p merman-cli -- rustdoc check --config crates/merman/merman-rustdoc.toml --quiet

      - name: Test architecture compile-fail contracts
        if: matrix.parity
        run: |
          cargo test -p merman-render --doc
          cargo test -p merman --doc --no-default-features --features layout-cytoscape,layout-elk,math,svg,system-clock,system-random,system-timezone,system-timing

      - name: Test exact Rustdoc artifact recipe
        if: matrix.parity
        run: |
          features="$(python3 scripts/artifact_profile_recipe.py rustdoc-static-svg)"
          cargo nextest run -p merman-rustdoc --no-default-features --features "$features" --cargo-quiet

      - name: Test representative Cargo feature unification contract
        if: matrix.parity
        run: |
          ambient_render_features="merman-bindings-core/layout-cytoscape,merman-bindings-core/layout-elk,merman-bindings-core/math"
          cargo nextest run --locked -p merman-bindings-core -p merman-ffi \
            --no-default-features \
            --features "$ambient_render_features,merman-ffi/svg" \
            --lib --cargo-quiet \
            -E '(package(merman-bindings-core) & test(ambient_render_backends_are_really_compiled)) | (package(merman-ffi) & test(ambient_render_dependencies_do_not_widen_the_native_c_owner_contract))'

      - name: Install Node candidate development dependencies
        if: matrix.parity && github.event_name == 'push'
        run: npm ci --prefix platforms/node

      - name: Install pinned wasm-pack for Node candidate builds
        if: matrix.parity && github.event_name == 'push'
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Build and probe the Node-WASM candidate
        if: matrix.parity && github.event_name == 'push'
        run: npm run --prefix platforms/node build:candidate -- --candidate node-wasm

      - name: Build and probe the Node N-API candidate
        if: matrix.parity && github.event_name == 'push'
        run: npm run --prefix platforms/node build:candidate -- --candidate napi --target linux-x64-gnu

      - name: Verify committed upstream alignment manifests
        if: matrix.parity
        run: cargo run --locked -p xtask -- check-alignment

      - name: Test system adapter feature contracts
        if: matrix.parity
        run: |
          cargo nextest run -p merman --no-default-features \
            --features layout-cytoscape,layout-elk,math,svg,system-clock,system-random,system-timezone,system-timing \
            --test runtime_determinism --test render_timezone --cargo-quiet

      - name: Test C FFI artifact-profile contract
        if: matrix.parity
        run: |
          features="$(python3 scripts/artifact_profile_recipe.py c-abi-native)"
          cargo nextest run --locked -p merman-ffi --no-default-features \
            --features "$features" --cargo-quiet

      - name: Check UniFFI no-render feature sets
        if: matrix.parity
        run: |
          cargo check -p merman-uniffi --no-default-features
          cargo check -p merman-uniffi --no-default-features --features ascii

      - name: SVG DOM comparison suite
        if: matrix.parity
        run: cargo run --release -p xtask -- compare-all-svgs --check-dom --dom-modes structure,parity,parity-root --dom-decimals 3 --flowchart-text-measurer vendored --report-root

      - name: Install root viewport oracle dependencies
        if: matrix.parity
        run: npm ci --prefix playground/tests

      - name: Install Chromium for root viewport oracle
        if: matrix.parity
        run: npm run install:browser:chromium --prefix playground/tests

      - name: Audit rendered SVG root viewports in Chromium
        if: matrix.parity
        run: |
          npm run oracle:root-viewport --prefix playground/tests -- \
            --local ../../target/compare \
            --upstream ../../fixtures/upstream-svgs \
            --output ../../target/root-viewport-diagnostic.json

      - name: Upload root viewport oracle report
        if: matrix.parity && always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: root-viewport-oracle-${{ github.run_attempt }}
          path: target/root-viewport-diagnostic.json
          if-no-files-found: ignore
          retention-days: 7

  node-contracts:
    name: node-contracts
    needs: ci-plan
    if: ${{ needs.ci-plan.outputs.node == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: platforms/node/package-lock.json

      - name: Install npm toolchain
        run: npm install --global --ignore-scripts --registry=https://registry.npmjs.org/ npm@11.17.0

      - name: Install Node candidate dependencies
        run: npm ci --prefix platforms/node

      - name: Verify Node candidate contracts and nested lock freshness
        run: npm test --prefix platforms/node

  typst-package:
    name: typst-package
    needs: ci-plan
    if: ${{ needs.ci-plan.outputs.typst == 'true' && github.event_name != 'push' }}
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      TYPST_CLI_VERSION: "0.15.0"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown

      - name: Rust cache
        uses: Swatinem/rust-cache@v2.9.2
        with:
          cache-targets: false

      - name: Install wasm-tools
        uses: taiki-e/install-action@v2.85.11
        with:
          tool: wasm-tools

      - name: Install wasm-opt
        uses: sigoden/install-binary@v1.2.0
        with:
          repo: WebAssembly/binaryen
          name: wasm-opt
          tag: version_131

      - name: Download Typst
        shell: bash
        run: |
          set -euo pipefail
          typst_asset="typst-x86_64-unknown-linux-musl.tar.xz"
          typst_root="${RUNNER_TEMP}/typst-${TYPST_CLI_VERSION}"
          download_dir="$(mktemp -d)"
          curl -fsSL --retry 3 --retry-connrefused --retry-delay 2 \
            -o "${download_dir}/${typst_asset}" \
            "https://github.com/typst/typst/releases/download/v${TYPST_CLI_VERSION}/${typst_asset}"
          tar -xJf "${download_dir}/${typst_asset}" -C "${download_dir}"
          mkdir -p "${typst_root}"
          install -m 0755 "${download_dir}/typst-x86_64-unknown-linux-musl/typst" "${typst_root}/typst"
          "${typst_root}/typst" --version

      - name: Test Typst plugin crate
        run: |
          cargo test --locked -p merman-typst-plugin --no-default-features
          cargo test --locked -p merman-typst-plugin --no-default-features \
            --features merman-bindings-core/svg,merman-bindings-core/math,merman-bindings-core/native-runtime

      - name: Check exact Typst WASM size budget
        run: cargo run --locked -p xtask -- wasm-size-matrix --surface typst --budget-file docs/release/WASM_SIZE_BUDGETS.json

      - name: Check exact Typst dependency closure
        run: python3 scripts/verify_artifact_dependency_closures.py --profile typst-wasm

      - name: Build and validate Typst package
        run: cargo run --locked -p xtask -- build-typst-package --profile publish

      - name: Smoke Typst package
        shell: bash
        run: |
          set -euo pipefail
          typst_bin="${RUNNER_TEMP}/typst-${TYPST_CLI_VERSION}/typst"
          cargo run --locked -p xtask -- typst-package-smoke --profile publish --skip-wasm-build --typst "${typst_bin}"

      - name: Upload Typst package smoke artifacts
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: typst-package-smoke
          path: target/typst-package-smoke
          if-no-files-found: ignore

  typst-package-compat:
    name: typst-package-compat
    needs: ci-plan
    if: ${{ needs.ci-plan.outputs.typst == 'true' && github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      TYPST_COMPAT_CLI_VERSION: "0.15.0"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown

      - name: Rust cache
        uses: Swatinem/rust-cache@v2.9.2
        with:
          cache-targets: false

      - name: Install wasm-tools
        uses: taiki-e/install-action@v2.85.11
        with:
          tool: wasm-tools

      - name: Install wasm-opt
        uses: sigoden/install-binary@v1.2.0
        with:
          repo: WebAssembly/binaryen
          name: wasm-opt
          tag: version_131

      - name: Check WASM size budgets
        run: cargo run --locked -p xtask -- wasm-size-matrix --surface typst --budget-file docs/release/WASM_SIZE_BUDGETS.json

      - name: Check exact Typst dependency closure
        run: python3 scripts/verify_artifact_dependency_closures.py --profile typst-wasm

      - name: Build and validate Typst package
        run: cargo run --locked -p xtask -- build-typst-package --profile publish

      - name: Download Typst compatibility version
        shell: bash
        run: |
          set -euo pipefail
          typst_asset="typst-x86_64-unknown-linux-musl.tar.xz"
          typst_root="${RUNNER_TEMP}/typst-${TYPST_COMPAT_CLI_VERSION}"
          download_dir="$(mktemp -d)"
          curl -fsSL --retry 3 --retry-connrefused --retry-delay 2 \
            -o "${download_dir}/${typst_asset}" \
            "https://github.com/typst/typst/releases/download/v${TYPST_COMPAT_CLI_VERSION}/${typst_asset}"
          tar -xJf "${download_dir}/${typst_asset}" -C "${download_dir}"
          mkdir -p "${typst_root}"
          install -m 0755 "${download_dir}/typst-x86_64-unknown-linux-musl/typst" "${typst_root}/typst"
          "${typst_root}/typst" --version

      - name: Smoke Typst compatibility version
        shell: bash
        run: |
          set -euo pipefail
          typst_bin="${RUNNER_TEMP}/typst-${TYPST_COMPAT_CLI_VERSION}/typst"
          cargo run --locked -p xtask -- typst-package-smoke --profile publish --skip-wasm-build --tests-only --typst "${typst_bin}"

      - name: Upload Typst package compatibility artifacts
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: typst-package-compat-smoke
          path: target/typst-package-smoke
          if-no-files-found: ignore

  platform-script-syntax:
    name: platform-script-syntax
    needs: ci-plan
    if: ${{ needs.ci-plan.outputs.platform == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Check Python platform scripts
        run: |
          python3 -m py_compile \
            scripts/verify-platform-bindings.py \
            scripts/build-python-uniffi-wheel.py \
            scripts/python_wheel_licenses.py \
            platforms/android/build-android.py \
            platforms/flutter/build-native.py

      - name: Check shell scripts
        run: bash -n scripts/build-apple-xcframework.sh platforms/ios/build-ios.sh

  platform-bindings:
    name: platform-bindings
    needs: ci-plan
    if: ${{ needs.ci-plan.outputs.platform == 'true' }}
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: llvm-tools-preview
          targets: aarch64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2.9.2
        with:
          cache-targets: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: "3.44.9"
          channel: stable
          cache: true

      - name: Verify platform bindings
        run: python3 scripts/verify-platform-bindings.py

  android-instrumentation:
    name: android-instrumentation
    needs: ci-plan
    if: ${{ needs.ci-plan.outputs.platform == 'true' }}
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Read Android toolchain versions
        id: android-toolchain
        run: |
          echo "java=$(python3 platforms/android/build-android.py --print-version java)" >> "$GITHUB_OUTPUT"
          echo "ndk=$(python3 platforms/android/build-android.py --print-version ndk)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2.9.2
        with:
          cache-targets: false

      - name: Setup JDK
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: ${{ steps.android-toolchain.outputs.java }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.1

      - name: Install Android NDK
        shell: bash
        env:
          ANDROID_NDK_VERSION: ${{ steps.android-toolchain.outputs.ndk }}
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;${ANDROID_NDK_VERSION}" "platforms;android-35"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Run Android JVM contract tests
        run: platforms/android/gradlew -p platforms/android testDebugUnitTest --stacktrace

      - name: Enable KVM access
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -e /dev/kvm ]]; then
            echo "::error::/dev/kvm is unavailable; Android emulator instrumentation requires hardware acceleration on Linux."
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Run Android instrumentation smoke
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          # The JNI smoke only needs minSdk coverage; the default image boots faster and flakes less.
          api-level: 29
          arch: x86_64
          target: default
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          disable-linux-hw-accel: false
          script: python3 scripts/verify-platform-bindings.py --only-android-instrumentation-smoke

  python-uniffi-wheel:
    name: python-uniffi-wheel
    needs: ci-plan
    if: ${{ needs.ci-plan.outputs.python == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Rust cache
        uses: Swatinem/rust-cache@v2.9.2

      - name: Build and smoke Python UniFFI wheel
        run: python scripts/build-python-uniffi-wheel.py --run-smoke

  c-ffi-example:
    name: c-ffi-example
    needs: ci-plan
    if: ${{ needs.ci-plan.outputs.platform == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Rust cache
        uses: Swatinem/rust-cache@v2.9.2

      - name: Build merman C ABI library
        run: python3 scripts/artifact_profile_recipe.py c-abi-native --build --locked

      - name: Build and run C example
        run: |
          profile_dir="$(python3 scripts/artifact_profile_recipe.py c-abi-native --field profile)"
          library_dir="target/$profile_dir"
          cc -I crates/merman-ffi/include \
            crates/merman-ffi/examples/render_svg.c \
            -L "$library_dir" -lmerman_ffi \
            -Wl,-rpath,"$PWD/$library_dir" \
            -o target/merman-ffi-render-svg
          target/merman-ffi-render-svg | grep -q '<svg'

  apple-swift-5-9-smoke:
    name: apple-swift-5-9-smoke
    needs: ci-plan
    if: ${{ needs.ci-plan.outputs.platform == 'true' }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 15.2 and verify Swift 5.9
        run: |
          sudo xcode-select --switch /Applications/Xcode_15.2.app/Contents/Developer
          swift --version
          swift --version | grep -Eq 'Apple Swift version 5\.9(\.[0-9]+)?([[:space:]]|$)'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Rust cache
        uses: Swatinem/rust-cache@v2.9.2

      - name: Build iOS XCFramework with Swift 5.9
        env:
          MERMAN_AUTO_INSTALL_RUST_TARGETS: "false"
        run: bash scripts/build-apple-xcframework.sh --ios

      - name: Type-check generated Swift with Swift 5.9
        run: |
          swiftc -typecheck -module-name Merman \
            -target arm64-apple-ios14.0 \
            -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -I platforms/apple/Merman.xcframework/ios-arm64/Headers \
            platforms/apple/Sources/Merman/Generated/Merman.swift
          swiftc -typecheck -module-name Merman \
            -target arm64-apple-ios14.0-simulator \
            -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" \
            -I platforms/apple/Merman.xcframework/ios-arm64_x86_64-simulator/Headers \
            platforms/apple/Sources/Merman/Generated/Merman.swift
          git diff --exit-code -- platforms/apple/Sources/Merman/Generated

  apple-uniffi-smoke:
    name: apple-uniffi-smoke
    needs: ci-plan
    if: ${{ needs.ci-plan.outputs.platform == 'true' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2.9.2

      - name: Build Apple XCFramework
        env:
          MERMAN_AUTO_INSTALL_RUST_TARGETS: "false"
        run: bash scripts/build-apple-xcframework.sh

      - name: Validate Swift package
        run: |
          swift package describe
          swift build
          swift build --triple arm64-apple-ios14.0 --sdk "$(xcrun --sdk iphoneos --show-sdk-path)"
          swift build --triple arm64-apple-ios14.0-simulator --sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)"
          swift run --package-path platforms/apple/examples/smoke MermanAppleSmoke
          git diff --exit-code -- platforms/apple/Sources/Merman/Generated

  npm-owner:
    name: npm-owner
    needs: ci-plan
    if: ${{ needs.ci-plan.outputs.npm == 'true' }}
    uses: ./.github/workflows/npm-audit.yml

  security-owner:
    name: security-owner
    needs: ci-plan
    if: ${{ needs.ci-plan.outputs.security == 'true' }}
    uses: ./.github/workflows/security-audit.yml
    with:
      representative_targets: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

  fuzz-owner:
    name: fuzz-owner
    needs: ci-plan
    if: ${{ needs.ci-plan.outputs.fuzz == 'true' }}
    uses: ./.github/workflows/fuzz.yml

  web-owner:
    name: web-owner
    needs: ci-plan
    if: ${{ needs.ci-plan.outputs.web == 'true' }}
    uses: ./.github/workflows/pages.yml
    with:
      ci_only: true

  vscode-owner:
    name: vscode-owner
    needs: ci-plan
    if: ${{ needs.ci-plan.outputs.vscode == 'true' }}
    uses: ./.github/workflows/vscode-extension.yml

  performance-contracts:
    name: performance-contracts
    needs: ci-plan
    if: ${{ needs.ci-plan.outputs.performance == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Check performance owner contracts
        run: |
          python3 -m py_compile \
            tools/bench/compare_mermaid_renderers.py \
            tools/bench/compare_self.py \
            tools/bench/corpus_utils.py \
            tools/bench/freeze_perf_baseline.py \
            tools/bench/native_memory.py \
            tools/bench/perf_runner.py \
            tools/bench/render_perf_comment.py \
            tools/bench/run_layout_work_calibration.py \
            tools/bench/run_native_memory.py \
            tools/bench/stage_spotcheck.py \
            tools/bench/verify_pipeline_bench_list.py
          python3 tools/bench/test_perf_baseline_manifest.py
          python3 -m unittest tools.bench.test_layout_work_calibration
          python3 tools/bench/test_native_memory_contracts.py
          python3 tools/bench/test_native_memory_driver_contracts.py
          python3 tools/bench/test_perf_contracts.py

  pr-gate:
    name: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 'pr-gate' || format('{0}-gate', github.event_name) }}
    if: ${{ always() }}
    needs:
      - ci-plan
      - workflow-analysis
      - hygiene
      - cli-contracts
      - nix-cli-package
      - cli-artifact-profiles
      - build-test
      - node-contracts
      - typst-package
      - typst-package-compat
      - platform-script-syntax
      - platform-bindings
      - android-instrumentation
      - python-uniffi-wheel
      - c-ffi-example
      - apple-swift-5-9-smoke
      - apple-uniffi-smoke
      - npm-owner
      - security-owner
      - fuzz-owner
      - web-owner
      - vscode-owner
      - performance-contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Aggregate selected owner results
        env:
          CI_PLAN_JSON: ${{ needs.ci-plan.outputs.plan }}
          CI_JOBS_JSON: |
            {"workflow-analysis":{"owner":"workflow","required":true,"result":"${{ needs.workflow-analysis.result }}"},
            "hygiene":{"owner":"hygiene","required":true,"result":"${{ needs.hygiene.result }}"},
            "cli-contracts":{"owner":"cli","required":true,"result":"${{ needs.cli-contracts.result }}"},
            "nix-cli-package":{"owner":"cli","required":true,"result":"${{ needs.nix-cli-package.result }}"},
            "cli-artifact-profiles":{"owner":"cli","required":true,"result":"${{ needs.cli-artifact-profiles.result }}"},
            "build-test":{"owner":"core","required":true,"result":"${{ needs.build-test.result }}"},
            "node-contracts":{"owner":"node","required":true,"result":"${{ needs.node-contracts.result }}"},
            "typst-package":{"owner":"typst","required":${{ github.event_name != 'push' }},"result":"${{ needs.typst-package.result }}"},
            "typst-package-compat":{"owner":"typst","required":${{ github.event_name == 'push' }},"result":"${{ needs.typst-package-compat.result }}"},
            "platform-script-syntax":{"owner":"platform","required":true,"result":"${{ needs.platform-script-syntax.result }}"},
            "platform-bindings":{"owner":"platform","required":true,"result":"${{ needs.platform-bindings.result }}"},
            "android-instrumentation":{"owner":"platform","required":true,"result":"${{ needs.android-instrumentation.result }}"},
            "python-uniffi-wheel":{"owner":"python","required":true,"result":"${{ needs.python-uniffi-wheel.result }}"},
            "c-ffi-example":{"owner":"platform","required":true,"result":"${{ needs.c-ffi-example.result }}"},
            "apple-swift-5-9-smoke":{"owner":"platform","required":true,"result":"${{ needs.apple-swift-5-9-smoke.result }}"},
            "apple-uniffi-smoke":{"owner":"platform","required":true,"result":"${{ needs.apple-uniffi-smoke.result }}"},
            "npm-owner":{"owner":"npm","required":true,"result":"${{ needs.npm-owner.result }}"},
            "security-owner":{"owner":"security","required":true,"result":"${{ needs.security-owner.result }}"},
            "fuzz-owner":{"owner":"fuzz","required":true,"result":"${{ needs.fuzz-owner.result }}"},
            "web-owner":{"owner":"web","required":true,"result":"${{ needs.web-owner.result }}"},
            "vscode-owner":{"owner":"vscode","required":true,"result":"${{ needs.vscode-owner.result }}"},
            "performance-contracts":{"owner":"performance","required":true,"result":"${{ needs.performance-contracts.result }}"}}
        run: python3 scripts/ci_plan.py gate --plan-json "$CI_PLAN_JSON" --jobs-json "$CI_JOBS_JSON"
