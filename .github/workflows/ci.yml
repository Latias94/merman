name: Nixpkgs CLI review build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nixpkgs-merman-093-review-${{ github.ref }}
  cancel-in-progress: false

env:
  MERMAN_RELEASE_SOURCE: 3b915f69c02d55b873d252cf6c8a6048e7f3427d
  NIXPKGS_REVIEW_SOURCE: 1ef8781d97d9e204bbb213472d2995641065ec72

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: NixOS/nixpkgs
          ref: ${{ env.NIXPKGS_REVIEW_SOURCE }}
          path: nixpkgs
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: DeterminateSystems/determinate-nix-action@v3.23.1
        with:
          extra-conf: |
            max-jobs = 2
            cores = 2
      - name: Prefetch the immutable release with Nix
        run: |
          mkdir candidate
          nix store prefetch-file --unpack --name source --json \
            "https://github.com/Latias94/merman/archive/$MERMAN_RELEASE_SOURCE.tar.gz" \
            > candidate/source.json
      - name: Materialize the source-bound package
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import shutil
          import tomllib

          candidate = Path("candidate")
          receipt = json.loads((candidate / "source.json").read_text())
          source = Path(receipt["storePath"])
          workspace = tomllib.loads((source / "Cargo.toml").read_text())
          assert workspace["workspace"]["package"]["version"] == "0.9.3"
          package = Path("nix/nixpkgs-review-package.nix").read_text()
          assert package.count("hash = lib.fakeHash;") == 1
          assert f'rev = "{os.environ["MERMAN_RELEASE_SOURCE"]}";' in package
          package = package.replace("hash = lib.fakeHash;", f'hash = "{receipt["hash"]}";')
          (candidate / "package.nix").write_text(package)
          shutil.copyfile(source / "Cargo.lock", candidate / "Cargo.lock")
          shutil.copyfile("nix/nixpkgs-review-maintainer.patch", candidate / "maintainer.patch")
          descriptor = json.loads((source / "capabilities/artifact-profiles-v2.json").read_text())
          profile = next(p for p in descriptor["profiles"] if p["id"] == "cli-release")
          (candidate / "expected-profile.json").write_text(json.dumps(profile))
          print(f"Release source: {os.environ['MERMAN_RELEASE_SOURCE']}")
          print(f"Nix source hash: {receipt['hash']}")
      - name: Apply the candidate to current Nixpkgs
        run: |
          git -C nixpkgs apply --check ../candidate/maintainer.patch
          git -C nixpkgs apply ../candidate/maintainer.patch
          mkdir -p nixpkgs/pkgs/by-name/me/merman-cli
          cp candidate/package.nix candidate/Cargo.lock nixpkgs/pkgs/by-name/me/merman-cli/
      - name: Evaluate all advertised systems
        run: |
          for system in x86_64-linux aarch64-linux aarch64-darwin x86_64-darwin; do
            nix-instantiate --eval --strict --json --expr "
              let
                pkgs = import ./nixpkgs { system = \"$system\"; };
                package = pkgs.merman-cli;
              in assert pkgs.lib.versionAtLeast pkgs.rustc.version \"1.95\"; {
                inherit (package) version buildFeatures buildType buildNoDefaultFeatures;
                inherit (package.meta) platforms;
                rustVersion = pkgs.rustc.version;
                drvPath = package.drvPath;
              }
            " > "candidate/eval-$system.json"
          done
      - name: Check the evaluated package against the release profile
        shell: python
        run: |
          import json
          from pathlib import Path

          candidate = Path("candidate")
          profile = json.loads((candidate / "expected-profile.json").read_text())["cargo"]
          systems = {"x86_64-linux", "aarch64-linux", "aarch64-darwin", "x86_64-darwin"}
          for system in sorted(systems):
              result = json.loads((candidate / f"eval-{system}.json").read_text())
              assert result["version"] == "0.9.3", result
              assert result["buildFeatures"] == profile["features"], result
              assert result["buildType"] == profile["profile"], result
              assert result["buildNoDefaultFeatures"] == (not profile["default_features"]), result
              assert set(result["platforms"]) == systems, result
              print(f"{system}: Rust {result['rustVersion']}, {result['drvPath']}")
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: nixpkgs-merman-0.9.3-candidate
          path: candidate
          if-no-files-found: error

  build:
    needs: prepare
    name: build (${{ matrix.system }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            system: x86_64-linux
          - os: ubuntu-24.04-arm
            system: aarch64-linux
          - os: macos-15
            system: aarch64-darwin
          - os: macos-15-intel
            system: x86_64-darwin
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          repository: NixOS/nixpkgs
          ref: ${{ env.NIXPKGS_REVIEW_SOURCE }}
          path: nixpkgs
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: nixpkgs-merman-0.9.3-candidate
          path: candidate
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: DeterminateSystems/determinate-nix-action@v3.23.1
        with:
          extra-conf: |
            max-jobs = 2
            cores = 2
      - name: Apply the exact prepared package
        run: |
          git -C nixpkgs apply --check ../candidate/maintainer.patch
          git -C nixpkgs apply ../candidate/maintainer.patch
          mkdir -p nixpkgs/pkgs/by-name/me/merman-cli
          cp candidate/package.nix candidate/Cargo.lock nixpkgs/pkgs/by-name/me/merman-cli/
      - name: Build the Nixpkgs expression and its install checks
        run: |
          nix-build --no-out-link -A merman-cli ./nixpkgs > package-output.txt
      - name: Run the package version test
        run: nix-build --no-out-link -A merman-cli.tests.version ./nixpkgs
      - name: Smoke-test the installed renderer
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          from xml.etree import ElementTree

          output = Path("package-output.txt").read_text().strip()
          binary = str(Path(output) / "bin/merman-cli")
          version = subprocess.run([binary, "--version"], check=True, capture_output=True, text=True)
          assert version.stdout.strip() == "merman-cli 0.9.3", version.stdout
          source = b"flowchart LR\n  A[Start] --> B[Done]\n"
          formats = {"svg": None, "png": b"\x89PNG\r\n\x1a\n", "jpeg": b"\xff\xd8\xff", "pdf": b"%PDF-"}
          for format, magic in formats.items():
              result = subprocess.run(
                  [binary, "render", "-", "--format", format],
                  input=source, capture_output=True, timeout=120,
              )
              assert result.returncode == 0, (format, result.stderr)
              if magic is None:
                  assert ElementTree.fromstring(result.stdout).tag == "{http://www.w3.org/2000/svg}svg"
              else:
                  assert result.stdout.startswith(magic), (format, result.stdout[:32])
              print(f"{format}: installed renderer produced {len(result.stdout)} bytes")
