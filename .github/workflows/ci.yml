name: Nixpkgs CLI review build

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Run nixpkgs-review or refresh the native package qualification
        type: choice
        default: nixpkgs-review
        options:
          - nixpkgs-review
          - native-builds

permissions:
  contents: read

concurrency:
  group: nixpkgs-merman-0100-review-${{ github.ref }}
  cancel-in-progress: false

env:
  MERMAN_RELEASE_SOURCE: e0e75bcab2fa8e39dd7a09465b7f2e035eda82ef
  NIXPKGS_REVIEW_SOURCE: 9afba8d00acec3255736355f5f178d83ee76372b
  NIXPKGS_REVIEW_BASE: 91c1f074170063316bb81ffc34c46a4611595923
  NIXPKGS_PR_HEAD: 7eb4f73927ab25e4b47706654b6a2d6cab449a3f
  NIXPKGS_TOOLING_SOURCE: 407405087ccd86e4c86d7e081d1a18dcbd5e3a3a

jobs:
  nixpkgs-review:
    if: ${{ inputs.mode == 'nixpkgs-review' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          repository: NixOS/nixpkgs
          ref: ${{ env.NIXPKGS_TOOLING_SOURCE }}
          path: nixpkgs
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: DeterminateSystems/determinate-nix-action@v3.23.1
        with:
          extra-conf: |
            max-jobs = 2
            cores = 2
            sandbox = true
      - name: Freeze the external PR snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import urllib.request

          proof = Path("proof")
          proof.mkdir()
          request = urllib.request.Request(
              "https://api.github.com/repos/NixOS/nixpkgs/pulls/570822",
              headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}"},
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              pr = json.load(response)
          assert pr["number"] == 570822 and pr["state"] == "open"
          assert pr["head"]["sha"] == os.environ["NIXPKGS_PR_HEAD"], pr["head"]["sha"]
          assert pr["head"]["repo"]["full_name"] == "Latias94/nixpkgs"
          assert pr["base"]["repo"]["full_name"] == "NixOS/nixpkgs"
          assert pr["base"]["ref"] == "master"
          assert pr["merge_commit_sha"] and pr["mergeable"] is True
          (proof / "pr.json").write_text(json.dumps(pr, indent=2) + "\n")
          request = urllib.request.Request(
              f"https://api.github.com/repos/NixOS/nixpkgs/git/commits/{pr['merge_commit_sha']}",
              headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}"},
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              merge = json.load(response)
          assert len(merge["parents"]) == 2 and merge["parents"][1]["sha"] == pr["head"]["sha"]
          (proof / "merge.json").write_text(json.dumps(merge, indent=2) + "\n")
          print(f"PR #570822: merge base {merge['parents'][0]['sha']}, head {pr['head']['sha']}")
          print(f"Frozen merge: {pr['merge_commit_sha']}")
      - name: Install the pinned stable nixpkgs-review and capture its help
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import subprocess

          proof = Path("proof")
          output = subprocess.check_output(
              ["nix-build", "--no-out-link", "-A", "nixpkgs-review", "./nixpkgs"], text=True,
          ).strip()
          binary = str(Path(output) / "bin/nixpkgs-review")
          version = subprocess.check_output([binary, "--version"], text=True).strip()
          assert version == "nixpkgs-review 4.0.0", version
          (proof / "tool-version.txt").write_text(version + "\n")
          (proof / "tool-help.txt").write_text(subprocess.check_output([binary, "pr", "--help"], text=True))
          (proof / "nix-version.txt").write_text(subprocess.check_output(["nix", "--version"], text=True))
          (proof / "tooling.json").write_text(json.dumps({
              "nixpkgs_source": os.environ["NIXPKGS_TOOLING_SOURCE"],
              "nixpkgs_review_version": version,
              "nixpkgs_review_source": "87a0e80e95e3371764984895b178a329782d7f35",
              "tool_output": output,
          }, indent=2) + "\n")
          with open(os.environ["GITHUB_PATH"], "a") as path:
              path.write(str(Path(output) / "bin") + "\n")
          print(version)
      - uses: actions/checkout@v7.0.1
        with:
          repository: Latias94/nixpkgs
          ref: ${{ env.NIXPKGS_PR_HEAD }}
          path: nixpkgs
          persist-credentials: false
      - name: Verify the unchanged PR package against the immutable release
        shell: python
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import tomllib

          proof = Path("proof")
          head = subprocess.check_output(["git", "-C", "nixpkgs", "rev-parse", "HEAD"], text=True).strip()
          assert head == os.environ["NIXPKGS_PR_HEAD"], head
          source_url = f"https://github.com/Latias94/merman/archive/{os.environ['MERMAN_RELEASE_SOURCE']}.tar.gz"
          source = json.loads(subprocess.check_output([
              "nix", "store", "prefetch-file", "--unpack", "--name", "source", "--json", source_url,
          ], text=True))
          (proof / "source.json").write_text(json.dumps(source, indent=2) + "\n")
          source_root = Path(source["storePath"])
          workspace = tomllib.loads((source_root / "Cargo.toml").read_text())
          assert workspace["workspace"]["package"]["version"] == "0.10.0"
          package_root = Path("nixpkgs/pkgs/by-name/me/merman-cli")
          lock = (package_root / "Cargo.lock").read_bytes()
          assert lock == (source_root / "Cargo.lock").read_bytes()
          expression = '''let pkgs = import ./nixpkgs { system = "x86_64-linux"; };
            package = pkgs.merman-cli; in {
              inherit (package) version buildFeatures buildType buildNoDefaultFeatures doInstallCheck;
              inherit (package.src) rev outputHash;
            }'''
          evaluated = json.loads(subprocess.check_output([
              "nix-instantiate", "--eval", "--strict", "--json", "--expr", expression,
          ], text=True))
          descriptor = json.loads((source_root / "capabilities/artifact-profiles-v2.json").read_text())
          profile = next(item["cargo"] for item in descriptor["profiles"] if item["id"] == "cli-release")
          assert evaluated["version"] == "0.10.0"
          assert evaluated["rev"] == os.environ["MERMAN_RELEASE_SOURCE"]
          assert evaluated["outputHash"] == source["hash"]
          assert evaluated["buildFeatures"] == profile["features"]
          assert evaluated["buildType"] == profile["profile"]
          assert evaluated["buildNoDefaultFeatures"] == (not profile["default_features"])
          assert evaluated["doInstallCheck"] is True
          for name in ("package.nix", "Cargo.lock"):
              (proof / name).write_bytes((package_root / name).read_bytes())
          provenance = {
              "release_source": os.environ["MERMAN_RELEASE_SOURCE"],
              "source_url": source_url,
              "source_nar_hash": source["hash"],
              "nixpkgs_pr_head": head,
              "workflow_source": os.environ["GITHUB_SHA"],
              "run_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "cargo_lock_sha256": hashlib.sha256(lock).hexdigest(),
              "package_sha256": hashlib.sha256((proof / "package.nix").read_bytes()).hexdigest(),
              "evaluated_package": evaluated,
          }
          (proof / "provenance.json").write_text(json.dumps(provenance, indent=2) + "\n")
          print(json.dumps(provenance, indent=2))
      - name: Run nixpkgs-review on only merman-cli and its passthru tests
        working-directory: nixpkgs
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess

          proof = Path("../proof").resolve()
          pr = json.loads((proof / "pr.json").read_text())
          environment = os.environ.copy()
          for name in ("GITHUB_TOKEN", "GH_TOKEN", "GITHUB_OAUTH_TOKEN", "GITHUB_TOKEN_CMD"):
              environment.pop(name, None)
          environment["NIXPKGS_REVIEW_CACHE_DIR"] = os.environ["RUNNER_TEMP"]
          command = [
              "nixpkgs-review", "pr", "570822", "--no-shell", "--no-pr-info", "--print-result",
              "--eval", "local", "--checkout", "merge", "--systems", "x86_64-linux",
              "--package", "merman-cli", "--tests", "--num-eval-workers", "2",
              "--option", "max-jobs", "2", "--option", "cores", "2", "--option", "sandbox", "true",
              "--token", "", "--pr-json", json.dumps(pr),
          ]
          (proof / "command.json").write_text(json.dumps(command, indent=2) + "\n")
          print(" ".join(command[:-1]) + "<frozen pr.json>", flush=True)
          with (proof / "review.log").open("w") as log:
              process = subprocess.Popen(command, env=environment, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              for line in process.stdout:
                  print(line, end="", flush=True)
                  log.write(line)
              status = process.wait()
          (proof / "exit-status.txt").write_text(str(status) + "\n")
          review = Path(os.environ["RUNNER_TEMP"]) / "nixpkgs-review/pr-570822"
          for name in ("report.json", "report.md"):
              if (review / name).is_file():
                  shutil.copyfile(review / name, proof / name)
          if (review / "logs").is_dir():
              shutil.copytree(review / "logs", proof / "logs")
          assert status == 0, status
          report = json.loads((proof / "report.json").read_text())
          assert report["pr"] == 570822 and report["commit"] == os.environ["NIXPKGS_PR_HEAD"]
          assert report["checkout"] == "merge" and set(report["result"]) == {"x86_64-linux"}
          result = report["result"]["x86_64-linux"]
          for category in ("failed", "broken", "non-existent", "blacklisted"):
              assert result[category] == [], (category, result[category])
          assert {item["name"] for item in result["built"]} == {"merman-cli"}, result
          assert {item["name"] for item in result["tests"]} == {"merman-cli.tests.version"}, result
          merge = pr["merge_commit_sha"]
          merge_metadata = json.loads((proof / "merge.json").read_text())
          base = merge_metadata["parents"][0]["sha"]
          for parent, expected in (("^1", base), ("^2", os.environ["NIXPKGS_PR_HEAD"])):
              actual = subprocess.check_output(["git", "rev-parse", merge + parent], text=True).strip()
              assert actual == expected, (parent, actual, expected)
          for name in ("package.nix", "Cargo.lock"):
              merged = subprocess.check_output(["git", "show", f"{merge}:pkgs/by-name/me/merman-cli/{name}"])
              assert merged == (proof / name).read_bytes(), name
          provenance = json.loads((proof / "provenance.json").read_text())
          provenance.update(nixpkgs_base=base, nixpkgs_pr_recorded_base=pr["base"]["sha"], nixpkgs_merge=merge, review_exit_status=status)
          (proof / "provenance.json").write_text(json.dumps(provenance, indent=2) + "\n")
          summary = (
              "# nixpkgs-review 4.0.0: PR #570822\n\n"
              f"- Merge base: `{base}`\n- Head: `{pr['head']['sha']}`\n- Merge: `{merge}`\n"
              f"- Merman release source: `{provenance['release_source']}`\n"
              "- Native x86_64-linux: merman-cli and merman-cli.tests.version built successfully.\n"
              "- Source NAR, release profile, byte-identical Cargo.lock and unchanged merged package verified.\n"
              "- No review shell, comments, approval or merge requested; GitHub credentials excluded from review.\n\n"
              + (proof / "report.md").read_text()
          )
          (proof / "summary.md").write_text(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write(summary)
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ always() }}
        with:
          name: nixpkgs-review-pr-570822-x86_64-linux
          path: proof
          if-no-files-found: error

  prepare:
    if: ${{ inputs.mode == 'native-builds' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: NixOS/nixpkgs
          ref: ${{ env.NIXPKGS_REVIEW_SOURCE }}
          path: nixpkgs
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: DeterminateSystems/determinate-nix-action@v3.23.1
        with:
          extra-conf: |
            max-jobs = 2
            cores = 2
      - name: Prefetch the immutable release with Nix
        run: |
          mkdir candidate
          nix store prefetch-file --unpack --name source --json \
            "https://github.com/Latias94/merman/archive/$MERMAN_RELEASE_SOURCE.tar.gz" \
            > candidate/source.json
      - name: Materialize the source-bound package
        shell: python
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import tomllib

          candidate = Path("candidate")
          receipt = json.loads((candidate / "source.json").read_text())
          source = Path(receipt["storePath"])
          workspace = tomllib.loads((source / "Cargo.toml").read_text())
          assert workspace["workspace"]["package"]["version"] == "0.10.0"
          package = Path("nixpkgs/pkgs/by-name/me/merman-cli/package.nix").read_text()
          assert hashlib.sha256(package.encode()).hexdigest() == "8616748b717035dd5bdb8f97b2ca6d5b895e41bfe56538b47447bdf922f49cfb"
          # Follow the current Nixpkgs system-library policy on the frozen PR merge.
          replacements = (
              ('  cmake,\n  perl,', '  pkg-config,\n  aws-lc,'),
              ('    cmake\n    perl', '    pkg-config'),
              ('  env.AWS_LC_SYS_USE_SYSTEM = "0";',
               '  buildInputs = [ aws-lc ];\n\n  env.AWS_LC_SYS_USE_SYSTEM = true;'),
          )
          for before, after in replacements:
              assert package.count(before) == 1, before
              package = package.replace(before, after)
          assert hashlib.sha256(package.encode()).hexdigest() == "b76ac2773dc3ea799ae0f806271fa6a4e8c99be271b8133ab2faa47522e160c7"
          (candidate / "package.nix").write_text(package)
          assert Path("nixpkgs/pkgs/by-name/me/merman-cli/Cargo.lock").read_bytes() == (source / "Cargo.lock").read_bytes()
          shutil.copyfile(source / "Cargo.lock", candidate / "Cargo.lock")
          descriptor = json.loads((source / "capabilities/artifact-profiles-v2.json").read_text())
          profile = next(p for p in descriptor["profiles"] if p["id"] == "cli-release")
          (candidate / "expected-profile.json").write_text(json.dumps(profile))
          assert len(profile["cargo"]["features"]) == 23
          manpage_count = len(list((source / "crates/merman-cli/assets/man").glob("*.1")))
          assert manpage_count == 17, manpage_count
          provenance = {
              "version": "0.10.0",
              "release_source": os.environ["MERMAN_RELEASE_SOURCE"],
              "source_url": f"https://github.com/Latias94/merman/archive/{os.environ['MERMAN_RELEASE_SOURCE']}.tar.gz",
              "source_nar_hash": receipt["hash"],
              "nixpkgs_repository": "NixOS/nixpkgs",
              "nixpkgs_source": os.environ["NIXPKGS_REVIEW_SOURCE"],
              "nixpkgs_base": os.environ["NIXPKGS_REVIEW_BASE"],
              "nixpkgs_pr_head": os.environ["NIXPKGS_PR_HEAD"],
              "qualification": "unpublished system AWS-LC candidate on the frozen PR merge",
              "workflow_source": os.environ["GITHUB_SHA"],
              "run_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "cargo_lock_sha256": hashlib.sha256((candidate / "Cargo.lock").read_bytes()).hexdigest(),
              "package_sha256": hashlib.sha256((candidate / "package.nix").read_bytes()).hexdigest(),
              "feature_count": len(profile["cargo"]["features"]),
              "manpage_count": manpage_count,
          }
          (candidate / "provenance.json").write_text(json.dumps(provenance, indent=2) + "\n")
          print(f"Release source: {os.environ['MERMAN_RELEASE_SOURCE']}")
          print(f"Nix source hash: {receipt['hash']}")
          print(f"Cargo.lock SHA-256: {provenance['cargo_lock_sha256']}")
      - name: Apply the candidate to the frozen Nixpkgs PR merge
        run: |
          test "$(git -C nixpkgs rev-parse HEAD)" = "$NIXPKGS_REVIEW_SOURCE"
          test "$(git -C nixpkgs rev-parse HEAD^1)" = "$NIXPKGS_REVIEW_BASE"
          test "$(git -C nixpkgs rev-parse HEAD^2)" = "$NIXPKGS_PR_HEAD"
          cp candidate/package.nix candidate/Cargo.lock nixpkgs/pkgs/by-name/me/merman-cli/
          git -C nixpkgs diff --binary -- \
            pkgs/by-name/me/merman-cli/package.nix \
            pkgs/by-name/me/merman-cli/Cargo.lock > candidate/nixpkgs.patch
          git -C nixpkgs diff --check
      - name: Check the package format
        run: |
          formatter="$(nix-build --no-out-link -A nixfmt ./nixpkgs)"
          "$formatter/bin/nixfmt" --check nixpkgs/pkgs/by-name/me/merman-cli/package.nix
      - name: Evaluate all advertised systems
        run: |
          for system in x86_64-linux aarch64-linux aarch64-darwin; do
            nix-instantiate --eval --strict --json --expr "
              let
                pkgs = import ./nixpkgs { system = \"$system\"; };
                package = pkgs.merman-cli;
              in assert pkgs.lib.versionAtLeast pkgs.rustc.version \"1.95\"; {
                inherit (package) version buildFeatures buildType buildNoDefaultFeatures;
                inherit (package.meta) platforms;
                rustVersion = pkgs.rustc.version;
                awsLcVersion = pkgs.aws-lc.version;
                systemAwsLc = package.env.AWS_LC_SYS_USE_SYSTEM;
                awsLcBuildInput = builtins.elem "aws-lc" (map pkgs.lib.getName package.buildInputs);
                pkgConfigBuildInput = builtins.elem "pkg-config" (map pkgs.lib.getName package.nativeBuildInputs);
                drvPath = package.drvPath;
              }
            " > "candidate/eval-$system.json"
          done
      - name: Check the evaluated package against the release profile
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          candidate = Path("candidate")
          profile = json.loads((candidate / "expected-profile.json").read_text())["cargo"]
          systems = {"x86_64-linux", "aarch64-linux", "aarch64-darwin"}
          for system in sorted(systems):
              result = json.loads((candidate / f"eval-{system}.json").read_text())
              assert result["version"] == "0.10.0", result
              assert result["buildFeatures"] == profile["features"], result
              assert result["buildType"] == profile["profile"], result
              assert result["buildNoDefaultFeatures"] == (not profile["default_features"]), result
              assert set(result["platforms"]) == systems, result
              assert result["systemAwsLc"] is True and result["awsLcBuildInput"] and result["pkgConfigBuildInput"], result
              print(f"{system}: Rust {result['rustVersion']}, {result['drvPath']}")
          provenance = json.loads((candidate / "provenance.json").read_text())
          summary = (
              "# Nixpkgs merman-cli 0.10.0 candidate\n\n"
              f"- Release source: `{provenance['release_source']}`\n"
              f"- Workflow source: `{provenance['workflow_source']}`\n"
              f"- Nixpkgs merge: `{provenance['nixpkgs_source']}`\n"
              f"- Merge base: `{provenance['nixpkgs_base']}`\n"
              f"- Original PR head: `{provenance['nixpkgs_pr_head']}`\n"
              "- Unpublished candidate: system AWS-LC and pkg-config; source, lock and release features unchanged.\n"
              f"- Source NAR hash (Nix prefetch): `{provenance['source_nar_hash']}`\n"
              f"- Cargo.lock SHA-256: `{provenance['cargo_lock_sha256']}`\n"
              "- cli-release: 23 features, dist, defaults disabled; 17 man pages\n"
              "- Evaluation: x86_64-linux, aarch64-linux, aarch64-darwin\n"
              "- Native build, installation, version and renderer checks: see the three build jobs.\n"
          )
          (candidate / "summary.md").write_text(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write(summary)
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: nixpkgs-merman-0.10.0-candidate
          path: candidate
          if-no-files-found: error

  build:
    needs: prepare
    name: build (${{ matrix.system }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      NIX_SYSTEM: ${{ matrix.system }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            system: x86_64-linux
          - os: ubuntu-24.04-arm
            system: aarch64-linux
          - os: macos-15
            system: aarch64-darwin
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          repository: NixOS/nixpkgs
          ref: ${{ env.NIXPKGS_REVIEW_SOURCE }}
          path: nixpkgs
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: nixpkgs-merman-0.10.0-candidate
          path: candidate
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: DeterminateSystems/determinate-nix-action@v3.23.1
        with:
          extra-conf: |
            max-jobs = 2
            cores = 2
      - name: Apply the exact prepared package
        run: |
          cp candidate/package.nix candidate/Cargo.lock nixpkgs/pkgs/by-name/me/merman-cli/
      - name: Review the unpublished Linux candidate with nixpkgs-review wip
        if: ${{ matrix.system == 'x86_64-linux' }}
        working-directory: nixpkgs
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess

          proof = Path("../candidate-review").resolve()
          proof.mkdir()
          output = subprocess.check_output(
              ["nix-build", "--no-out-link", "-A", "nixpkgs-review", "."], text=True,
          ).strip()
          binary = str(Path(output) / "bin/nixpkgs-review")
          version = subprocess.check_output([binary, "--version"], text=True).strip()
          assert version == "nixpkgs-review 4.0.0", version
          (proof / "tool-version.txt").write_text(version + "\n")
          (proof / "tool-help.txt").write_text(subprocess.check_output([binary, "wip", "--help"], text=True))
          environment = os.environ.copy()
          for name in ("GITHUB_TOKEN", "GH_TOKEN", "GITHUB_OAUTH_TOKEN", "GITHUB_TOKEN_CMD"):
              environment.pop(name, None)
          environment["NIXPKGS_REVIEW_CACHE_DIR"] = os.environ["RUNNER_TEMP"]
          command = [
              binary, "wip", "--branch", os.environ["NIXPKGS_REVIEW_SOURCE"],
              "--no-shell", "--print-result", "--systems", "x86_64-linux",
              "--package", "merman-cli", "--tests", "--num-eval-workers", "2",
              "--option", "max-jobs", "2", "--option", "cores", "2", "--option", "sandbox", "true",
              "--token", "",
          ]
          (proof / "command.json").write_text(json.dumps(command, indent=2) + "\n")
          print(" ".join(command), flush=True)
          with (proof / "review.log").open("w") as log:
              process = subprocess.Popen(command, env=environment, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              for line in process.stdout:
                  print(line, end="", flush=True)
                  log.write(line)
              status = process.wait()
          (proof / "exit-status.txt").write_text(str(status) + "\n")
          review = Path(os.environ["RUNNER_TEMP"]) / f"nixpkgs-review/rev-{os.environ['NIXPKGS_REVIEW_SOURCE']}-dirty"
          for name in ("report.json", "report.md"):
              if (review / name).is_file():
                  shutil.copyfile(review / name, proof / name)
          if (review / "logs").is_dir():
              shutil.copytree(review / "logs", proof / "logs")
          assert status == 0, status
          report = json.loads((proof / "report.json").read_text())
          assert report["pr"] is None and report["commit"] is None
          assert set(report["result"]) == {"x86_64-linux"}
          result = report["result"]["x86_64-linux"]
          for category in ("failed", "broken", "non-existent", "blacklisted"):
              assert result[category] == [], (category, result[category])
          assert {item["name"] for item in result["built"]} == {"merman-cli"}, result
          assert {item["name"] for item in result["tests"]} == {"merman-cli.tests.version"}, result
          shutil.copyfile("../candidate/provenance.json", proof / "provenance.json")
          summary = (
              "# nixpkgs-review wip: unpublished system AWS-LC candidate\n\n"
              f"- Frozen PR merge: `{os.environ['NIXPKGS_REVIEW_SOURCE']}`\n"
              f"- Original PR head remains unchanged: `{os.environ['NIXPKGS_PR_HEAD']}`\n"
              "- Only merman-cli and its version test were reviewed on x86_64-linux.\n"
              "- This tests a local candidate patch, not the published PR head.\n\n"
              + (proof / "report.md").read_text()
          )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write(summary)
      - name: Build the Nixpkgs expression and its install checks
        run: |
          native_system="$(nix-instantiate --eval --strict --json --expr builtins.currentSystem)"
          printf '%s\n' "$native_system" > native-system.json
          test "$native_system" = "\"$NIX_SYSTEM\""
          nix-build --no-out-link -A merman-cli ./nixpkgs > package-output.txt
      - name: Run the package version test
        run: nix-build --no-out-link -A merman-cli.tests.version ./nixpkgs > version-test-output.txt
      - name: Smoke-test the installed renderer
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import subprocess
          from xml.etree import ElementTree

          output = Path("package-output.txt").read_text().strip()
          binary = str(Path(output) / "bin/merman-cli")
          version = subprocess.run([binary, "--version"], check=True, capture_output=True, text=True)
          assert version.stdout.strip() == "merman-cli 0.10.0", version.stdout
          source = b"flowchart LR\n  A[Start] --> B[Done]\n"
          formats = {"svg": None, "png": b"\x89PNG\r\n\x1a\n", "jpeg": b"\xff\xd8\xff", "pdf": b"%PDF-"}
          rendered = {}
          for format, magic in formats.items():
              result = subprocess.run(
                  [binary, "render", "-", "--format", format],
                  input=source, capture_output=True, timeout=120,
              )
              assert result.returncode == 0, (format, result.stderr)
              if magic is None:
                  assert ElementTree.fromstring(result.stdout).tag == "{http://www.w3.org/2000/svg}svg"
              else:
                  assert result.stdout.startswith(magic), (format, result.stdout[:32])
              rendered[format] = len(result.stdout)
              print(f"{format}: installed renderer produced {len(result.stdout)} bytes")
          proof = {
              "system": json.loads(Path("native-system.json").read_text()),
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "package_output": output,
              "version_test_output": Path("version-test-output.txt").read_text().strip(),
              "version": version.stdout.strip(),
              "rendered_bytes": rendered,
              "candidate": json.loads(Path("candidate/provenance.json").read_text()),
          }
          Path("smoke.json").write_text(json.dumps(proof, indent=2) + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(
                  f"# {proof['system']}: merman-cli 0.10.0\n\n"
                  f"- Package output: `{output}`\n"
                  f"- Version test output: `{proof['version_test_output']}`\n"
                  "- Native build and installed-CLI contract passed (17 man pages).\n"
                  "- Installed SVG/PNG/JPEG/PDF rendering passed.\n"
              )
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ always() && matrix.system == 'x86_64-linux' }}
        with:
          name: nixpkgs-review-wip-merman-system-aws-lc-x86_64-linux
          path: candidate-review
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: nixpkgs-merman-0.10.0-${{ matrix.system }}-proof
          path: |
            candidate/provenance.json
            candidate/eval-${{ matrix.system }}.json
            native-system.json
            package-output.txt
            version-test-output.txt
            smoke.json
          if-no-files-found: error
