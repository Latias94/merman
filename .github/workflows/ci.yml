name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: hygiene
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Verify release crate order docs
        run: python3 scripts/verify-release-crate-order.py

      - name: Verify release version projections
        run: python3 scripts/release-version.py

      - name: Verify CLI installation metadata
        run: python3 scripts/cli_installation_contract.py

      - name: Verify third-party source and license contract
        run: python3 scripts/verify-third-party-licenses.py

      - name: Verify legal material projections
        run: python3 scripts/sync-release-legal-materials.py --check

      - name: Verify Cargo package legal materials
        run: python3 scripts/verify_crate_package_legal_materials.py

      - name: Test release and workflow hygiene scripts
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Check whitespace (pull request)
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.sha }}"

      - name: Check whitespace (push)
        if: github.event_name != 'pull_request'
        run: |
          base="${{ github.event.before }}"
          if [[ "$base" =~ ^0+$ ]]; then
            git show --check --format= --no-renames HEAD
          else
            git diff --check "$base...${{ github.sha }}"
          fi

  cli-contracts:
    name: cli-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Install CLI asset validators
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes elvish fish mandoc zsh

      - name: Verify generated CLI distribution assets
        run: python3 scripts/generate_cli_assets.py --check

      - name: Validate CLI distribution assets
        run: python3 scripts/verify_cli_assets.py --require bash,zsh,fish,elvish,mandoc

      - name: Test exact CLI feature process matrix
        run: python3 scripts/verify_cli_process_matrix.py --locked

      - name: Lint all CLI feature branches
        run: cargo clippy --locked -p merman-cli --all-targets --all-features -- -D warnings

  nix-cli-package:
    name: nix-cli-package
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3.21.8

      - name: Build reusable Nix derivation
        run: |
          nix-build --no-out-link default.nix \
            --arg pkgs 'import (builtins.getFlake (toString ./.)).inputs.nixpkgs { }'

      - name: Check Nix flake
        run: |
          nix flake check --all-systems --no-build --no-write-lock-file
          nix flake check --print-build-logs --no-write-lock-file

      - name: Run Nix flake app
        run: nix run --no-write-lock-file . -- --version

      - name: Check immutable Nix lock
        run: git diff --exit-code -- flake.lock

  cli-artifact-profiles:
    name: cli-artifact-profiles (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-2025-vs2026
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate PowerShell completion
        if: runner.os == 'Windows'
        run: python3 scripts/verify_cli_assets.py --require powershell

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Build exact CLI artifact profiles
        run: |
          python3 scripts/artifact_profile_recipe.py cli-analysis --build-host --locked
          python3 scripts/artifact_profile_recipe.py cli-release --build-host --locked

  build-test:
    name: build-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            parity: true
          - os: macos-15
            parity: false
          - os: windows-2025-vs2026
            parity: false

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Resolve pinned Mermaid source
        id: mermaid-source
        if: matrix.parity
        shell: bash
        run: |
          commit="$(python3 - <<'PY'
          import json
          from pathlib import Path

          bundle = json.loads(
              Path("tools/upstreams/MERMAID_REFERENCE_BUNDLE.json").read_text(encoding="utf-8")
          )
          print(bundle["release"]["source"]["commit"])
          PY
          )"
          if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid Mermaid source commit in reference bundle: $commit" >&2
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        name: Checkout pinned Mermaid Cypress sources
        if: matrix.parity
        with:
          repository: mermaid-js/mermaid
          ref: ${{ steps.mermaid-source.outputs.commit }}
          path: repo-ref/mermaid
          persist-credentials: false
          sparse-checkout: |
            cypress/integration/rendering/treeView/treeView.spec.ts
            cypress/integration/rendering/cynefin/cynefin.spec.js
            cypress/integration/rendering/railroad/railroad.spec.ts
          sparse-checkout-cone-mode: false

      - name: Verify pinned Mermaid source checkout
        if: matrix.parity
        shell: bash
        env:
          MERMAID_SOURCE_COMMIT: ${{ steps.mermaid-source.outputs.commit }}
        run: |
          actual="$(git -C repo-ref/mermaid rev-parse HEAD)"
          test "$actual" = "$MERMAID_SOURCE_COMMIT"

      - name: Resolve pinned DOMPurify source
        id: dompurify-source
        if: matrix.parity
        shell: bash
        run: |
          commit="$(python3 - <<'PY'
          import json
          from pathlib import Path

          bundle = json.loads(
              Path("tools/upstreams/MERMAID_REFERENCE_BUNDLE.json").read_text(encoding="utf-8")
          )
          print(bundle["sanitizer"]["source"]["commit"])
          PY
          )"
          if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid DOMPurify source commit in reference bundle: $commit" >&2
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        name: Checkout pinned DOMPurify source
        if: matrix.parity
        with:
          repository: cure53/DOMPurify
          ref: ${{ steps.dompurify-source.outputs.commit }}
          path: repo-ref/dompurify
          persist-credentials: false
          sparse-checkout: |
            dist/purify.cjs.js
          sparse-checkout-cone-mode: false

      - name: Verify pinned DOMPurify source checkout
        if: matrix.parity
        shell: bash
        env:
          DOMPURIFY_SOURCE_COMMIT: ${{ steps.dompurify-source.outputs.commit }}
        run: |
          actual="$(git -C repo-ref/dompurify rev-parse HEAD)"
          test "$actual" = "$DOMPURIFY_SOURCE_COMMIT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-linux-android,wasm32-unknown-unknown

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Free disk space (Ubuntu)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          df -h
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/.ghcup \
            "$AGENT_TOOLSDIRECTORY/CodeQL"
          sudo docker image prune --all --force || true
          df -h

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Verify pinned Mermaid reference before runtime install
        if: matrix.parity
        run: cargo run --locked -p xtask -- verify-mermaid-reference

      - name: Setup Node for generated Mermaid artifacts
        if: matrix.parity
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            platforms/node/package-lock.json
            tools/mermaid-cli/package-lock.json

      - name: Install pinned Mermaid runtime
        if: matrix.parity
        working-directory: tools/mermaid-cli
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: npm ci

      - name: Verify generated architecture contracts
        if: matrix.parity
        run: |
          cargo run --locked -p xtask -- verify-generated
          python3 scripts/verify_artifact_dependency_closures.py
          cargo run --locked -p xtask -- verify-feature-matrix --strict
          python3 .agents/skills/align-mermaid-release/scripts/validate_workflow.py

      - name: Test (nextest)
        run: cargo nextest run --cargo-quiet

      - name: Test architecture compile-fail contracts
        if: matrix.parity
        run: |
          cargo test -p merman-render --doc
          cargo test -p merman --doc --no-default-features --features layout-cytoscape,layout-elk,math,svg,system-clock,system-random,system-timezone,system-timing

      - name: Test exact Rustdoc artifact recipe
        if: matrix.parity
        run: |
          features="$(python3 scripts/artifact_profile_recipe.py rustdoc-static-svg)"
          cargo nextest run -p merman-rustdoc --no-default-features --features "$features" --cargo-quiet

      - name: Test exact artifact owner APIs
        if: matrix.parity
        shell: bash
        run: |
          run_owner_test() {
            local profile="$1"
            local expected_package="$2"
            shift 2

            local package
            package="$(python3 scripts/artifact_profile_recipe.py "$profile" --field package)"
            test "$package" = "$expected_package"

            local features
            features="$(python3 scripts/artifact_profile_recipe.py "$profile")"
            local -a args=(
              --locked
              --package "$package"
              --no-default-features
              --cargo-quiet
            )
            if [[ -n "$features" ]]; then
              args+=(--features "$features")
            fi
            cargo nextest run "${args[@]}" "$@"
          }

          run_owner_test rust-analysis merman-analysis \
            --test analyzer facts_and_diagnostics_payloads_use_independent_version_constants
          run_owner_test rust-ascii merman-ascii \
            --test flowchart_model flowchart_parser_lr_chain_matches_upstream_ascii_golden
          run_owner_test rust-editor-core merman-editor-core \
            --test completion completion_offers_known_node_ids_with_text_edits
          run_owner_test rust-editor-facade merman \
            --test feature_surface_smoke facade_exposes_callable_analysis_and_editor_apis
          run_owner_test rust-svg-basic merman
          run_owner_test rust-bindings-core-native-sdk merman-bindings-core \
            --lib runtime_capabilities_follow_callable_feature_surface
          run_owner_test rust-export-jpeg merman-export \
            --lib jpeg_leaf_encodes_a_sealed_svg
          run_owner_test rust-export-png merman-export \
            --lib png_leaf_encodes_a_sealed_svg
          run_owner_test rust-export-pdf merman-export \
            --lib pdf_leaf_encodes_a_sealed_svg

      - name: Test external Cargo feature unification contract
        if: matrix.parity
        run: |
          cargo nextest run --locked -p merman-bindings-core --no-default-features \
            --features merman-bindings-core/svg,merman/math,merman/system-timing \
            --lib --cargo-quiet
          features="$(python3 scripts/artifact_profile_recipe.py apple-uniffi-native)"
          qualified_features="merman-uniffi/${features//,/,merman-uniffi/}"
          cargo nextest run --locked -p merman-uniffi -p merman --no-default-features \
            --features "$qualified_features,merman/system-timing" \
            --lib --cargo-quiet \
            -E 'package(merman-uniffi) & test(engine_exposes_metadata)'

      - name: Install Node candidate development dependencies
        if: matrix.parity
        run: npm ci --prefix platforms/node

      - name: Verify Node candidate contracts and nested lock freshness
        if: matrix.parity
        run: npm test --prefix platforms/node

      - name: Verify Cypress corpus against pinned Mermaid source
        if: matrix.parity
        run: cargo run --locked -p xtask -- import-upstream-cypress --check-11-16-corpus-manifest-source

      - name: Test (nextest, merman render)
        if: matrix.parity
        run: cargo nextest run -p merman --no-default-features --features layout-cytoscape,layout-elk,math,svg,system-clock,system-random,system-timezone,system-timing --cargo-quiet

      - name: Test C FFI artifact-profile consumer smoke
        if: matrix.parity
        run: |
          features="$(python3 scripts/artifact_profile_recipe.py c-abi-native)"
          qualified_features="merman-ffi/${features//,/,merman-ffi/}"
          cargo nextest run --locked -p merman-ffi -p merman --no-default-features \
            --features "$qualified_features,merman/system-timing" \
            --test c_consumer_smoke --cargo-quiet

      - name: Check UniFFI no-render feature sets
        if: matrix.parity
        run: |
          cargo check -p merman-uniffi --no-default-features
          cargo check -p merman-uniffi --no-default-features --features ascii

      - name: SVG DOM structure
        if: matrix.parity
        run: cargo run --release -p xtask -- compare-all-svgs --check-dom --dom-mode structure --dom-decimals 3

      - name: SVG DOM parity
        if: matrix.parity
        run: cargo run --release -p xtask -- compare-all-svgs --check-dom --dom-mode parity --dom-decimals 3

      - name: SVG DOM parity (parity-root)
        if: matrix.parity
        run: cargo run --release -p xtask -- compare-all-svgs --check-dom --dom-mode parity-root --dom-decimals 3 --flowchart-text-measurer vendored --report-root

  typst-package:
    name: typst-package
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      TYPST_CLI_VERSION: "0.15.0"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Install wasm-tools
        uses: taiki-e/install-action@wasm-tools

      - name: Download Typst
        shell: bash
        run: |
          set -euo pipefail
          typst_asset="typst-x86_64-unknown-linux-musl.tar.xz"
          typst_root="${RUNNER_TEMP}/typst-${TYPST_CLI_VERSION}"
          download_dir="$(mktemp -d)"
          curl -fsSL --retry 3 --retry-connrefused --retry-delay 2 \
            -o "${download_dir}/${typst_asset}" \
            "https://github.com/typst/typst/releases/download/v${TYPST_CLI_VERSION}/${typst_asset}"
          tar -xJf "${download_dir}/${typst_asset}" -C "${download_dir}"
          mkdir -p "${typst_root}"
          install -m 0755 "${download_dir}/typst-x86_64-unknown-linux-musl/typst" "${typst_root}/typst"
          "${typst_root}/typst" --version

      - name: Test Typst plugin crate
        run: cargo test --locked -p merman-typst-plugin

      - name: Check exact Typst WASM size budget
        run: cargo run --locked -p xtask -- wasm-size-matrix --surface typst --budget-file docs/release/WASM_SIZE_BUDGETS.json

      - name: Check exact Typst dependency closure
        run: cargo run --locked -p xtask -- profile-budget check-deps --profile typst-wasm --artifact-profile typst-wasm

      - name: Build and validate Typst package
        run: cargo run --locked -p xtask -- build-typst-package --profile publish

      - name: Smoke Typst package
        shell: bash
        run: |
          set -euo pipefail
          typst_bin="${RUNNER_TEMP}/typst-${TYPST_CLI_VERSION}/typst"
          cargo run --locked -p xtask -- typst-package-smoke --profile publish --skip-wasm-build --typst "${typst_bin}"

      - name: Upload Typst package smoke artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: typst-package-smoke
          path: target/typst-package-smoke
          if-no-files-found: ignore

  typst-package-compat:
    name: typst-package-compat
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      TYPST_COMPAT_CLI_VERSION: "0.15.0"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Install wasm-tools
        uses: taiki-e/install-action@wasm-tools

      - name: Check WASM size budgets
        run: cargo run --locked -p xtask -- wasm-size-matrix --budget-file docs/release/WASM_SIZE_BUDGETS.json

      - name: Check exact Typst dependency closure
        run: cargo run --locked -p xtask -- profile-budget check-deps --profile typst-wasm --artifact-profile typst-wasm

      - name: Build and validate Typst package
        run: cargo run --locked -p xtask -- build-typst-package --profile publish

      - name: Download Typst compatibility version
        shell: bash
        run: |
          set -euo pipefail
          typst_asset="typst-x86_64-unknown-linux-musl.tar.xz"
          typst_root="${RUNNER_TEMP}/typst-${TYPST_COMPAT_CLI_VERSION}"
          download_dir="$(mktemp -d)"
          curl -fsSL --retry 3 --retry-connrefused --retry-delay 2 \
            -o "${download_dir}/${typst_asset}" \
            "https://github.com/typst/typst/releases/download/v${TYPST_COMPAT_CLI_VERSION}/${typst_asset}"
          tar -xJf "${download_dir}/${typst_asset}" -C "${download_dir}"
          mkdir -p "${typst_root}"
          install -m 0755 "${download_dir}/typst-x86_64-unknown-linux-musl/typst" "${typst_root}/typst"
          "${typst_root}/typst" --version

      - name: Smoke Typst compatibility version
        shell: bash
        run: |
          set -euo pipefail
          typst_bin="${RUNNER_TEMP}/typst-${TYPST_COMPAT_CLI_VERSION}/typst"
          cargo run --locked -p xtask -- typst-package-smoke --profile publish --skip-wasm-build --tests-only --typst "${typst_bin}"

      - name: Upload Typst package compatibility artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: typst-package-compat-smoke
          path: target/typst-package-smoke
          if-no-files-found: ignore

  platform-script-syntax:
    name: platform-script-syntax
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check Python platform scripts
        run: |
          python3 -m py_compile \
            scripts/verify-platform-bindings.py \
            scripts/build-python-uniffi-wheel.py \
            scripts/python_wheel_licenses.py \
            platforms/android/build-android.py \
            platforms/flutter/tool/android-smoke.py

      - name: Check shell scripts
        run: bash -n scripts/build-apple-xcframework.sh platforms/ios/build-ios.sh platforms/flutter/build-ios.sh platforms/flutter/build-desktop.sh

  platform-bindings:
    name: platform-bindings
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-linux-android

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.3"
          channel: stable
          cache: true

      - name: Precache Flutter Android artifacts
        run: flutter precache --android

      - name: Verify platform bindings
        run: python3 scripts/verify-platform-bindings.py

      - name: Verify Flutter Android packaging
        run: python3 platforms/flutter/tool/android-smoke.py --targets aarch64-linux-android

  android-instrumentation:
    name: android-instrumentation
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Read Android toolchain versions
        id: android-toolchain
        run: |
          echo "java=$(python3 platforms/android/build-android.py --print-version java)" >> "$GITHUB_OUTPUT"
          echo "ndk=$(python3 platforms/android/build-android.py --print-version ndk)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.android-toolchain.outputs.java }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        shell: bash
        env:
          ANDROID_NDK_VERSION: ${{ steps.android-toolchain.outputs.ndk }}
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;${ANDROID_NDK_VERSION}" "platforms;android-35"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Enable KVM access
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -e /dev/kvm ]]; then
            echo "::error::/dev/kvm is unavailable; Android emulator instrumentation requires hardware acceleration on Linux."
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Run Android instrumentation smoke
        uses: reactivecircus/android-emulator-runner@v2.37.0
        with:
          # The JNI smoke only needs minSdk coverage; the default image boots faster and flakes less.
          api-level: 29
          arch: x86_64
          target: default
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          disable-linux-hw-accel: false
          script: python3 scripts/verify-platform-bindings.py --only-android-instrumentation-smoke

  python-uniffi-wheel:
    name: python-uniffi-wheel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build and smoke Python UniFFI wheel
        run: python scripts/build-python-uniffi-wheel.py --run-smoke

  c-ffi-example:
    name: c-ffi-example
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build merman C ABI library
        run: python3 scripts/artifact_profile_recipe.py c-abi-native --build --locked

      - name: Build and run C example
        run: |
          profile_dir="$(python3 scripts/artifact_profile_recipe.py c-abi-native --field profile)"
          library_dir="target/$profile_dir"
          cc -I crates/merman-ffi/include \
            crates/merman-ffi/examples/render_svg.c \
            -L "$library_dir" -lmerman_ffi \
            -Wl,-rpath,"$PWD/$library_dir" \
            -o target/merman-ffi-render-svg
          target/merman-ffi-render-svg | grep -q '<svg'

  apple-swift-5-9-smoke:
    name: apple-swift-5-9-smoke
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Select Xcode 15.2 and verify Swift 5.9
        run: |
          sudo xcode-select --switch /Applications/Xcode_15.2.app/Contents/Developer
          swift --version
          swift --version | grep -Eq 'Apple Swift version 5\.9(\.[0-9]+)?([[:space:]]|$)'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build Apple XCFramework with Swift 5.9
        env:
          MERMAN_AUTO_INSTALL_RUST_TARGETS: "false"
        run: bash scripts/build-apple-xcframework.sh

      - name: Validate Swift 5.9 package
        run: |
          swift package describe
          swift build
          swiftc -typecheck -module-name Merman \
            -target arm64-apple-ios14.0 \
            -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -I platforms/apple/Merman.xcframework/ios-arm64/Headers \
            platforms/apple/Sources/Merman/Generated/Merman.swift
          swiftc -typecheck -module-name Merman \
            -target arm64-apple-ios14.0-simulator \
            -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" \
            -I platforms/apple/Merman.xcframework/ios-arm64_x86_64-simulator/Headers \
            platforms/apple/Sources/Merman/Generated/Merman.swift
          swift run --package-path platforms/apple/examples/smoke MermanAppleSmoke
          git diff --exit-code -- platforms/apple/Sources/Merman/Generated

  apple-uniffi-smoke:
    name: apple-uniffi-smoke
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build Apple XCFramework
        env:
          MERMAN_AUTO_INSTALL_RUST_TARGETS: "false"
        run: bash scripts/build-apple-xcframework.sh

      - name: Validate Swift package
        run: |
          swift package describe
          swift build
          swift build --triple arm64-apple-ios14.0 --sdk "$(xcrun --sdk iphoneos --show-sdk-path)"
          swift build --triple arm64-apple-ios14.0-simulator --sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)"
          swift run --package-path platforms/apple/examples/smoke MermanAppleSmoke
          git diff --exit-code -- platforms/apple/Sources/Merman/Generated
