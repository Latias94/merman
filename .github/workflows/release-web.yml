name: Release Web package group (npm)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag/version to publish, for example v0.8.0-alpha.5"
        required: true
        type: string
      source_ref:
        description: "Protected branch (main), matching release tag, or refs/tags/<release-tag> to build from"
        required: true
        default: "main"
        type: string
      publish_to_npm:
        description: "Publish the admitted @mermanjs/web package group after checks pass"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate-inputs:
    name: validate-inputs
    runs-on: ubuntu-24.04
    outputs:
      source_ref: ${{ steps.release.outputs.source_ref }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      version: ${{ steps.release.outputs.version }}
      npm_dist_tag: ${{ steps.release.outputs.npm_dist_tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Validate release inputs
        id: release
        shell: bash
        env:
          DISPATCH_RELEASE_TAG: ${{ inputs.release_tag }}
          DISPATCH_SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail

          fail() {
            echo "::error::$1" >&2
            exit 1
          }

          RELEASE_TAG="$DISPATCH_RELEASE_TAG"
          SOURCE_REF="$DISPATCH_SOURCE_REF"

          if ! VERSION="$(python3 scripts/release-version.py canonical --version "$RELEASE_TAG")"; then
            fail "release_tag must match vX.Y.Z or vX.Y.Z-alpha.N/beta.N/rc.N."
          fi
          [[ "$RELEASE_TAG" == "v$VERSION" ]] || fail "release_tag must use the canonical v-prefixed release version."
          if ! npm_dist_tag="$(python3 scripts/release-version.py npm-dist-tag --version "$RELEASE_TAG")"; then
            fail "release_tag contains an unsupported SemVer version."
          fi

          [[ "$SOURCE_REF" != *$'\n'* && "$SOURCE_REF" != *$'\r'* ]] || fail "source_ref must be a single line."
          validated_source_ref="$SOURCE_REF"
          if [[ "$SOURCE_REF" == "main" || "$SOURCE_REF" == "refs/heads/main" ]]; then
            :
          elif [[ "$SOURCE_REF" == "$RELEASE_TAG" || "$SOURCE_REF" == "refs/tags/$RELEASE_TAG" ]]; then
            source_tag="${SOURCE_REF#refs/tags/}"
            validated_source_ref="refs/tags/$source_tag"
          else
            fail "source_ref tag must match release_tag; source_ref must be main, refs/heads/main, a matching release tag, or refs/tags/<release-tag>."
          fi

          {
            printf 'source_ref=%s\n' "$validated_source_ref"
            printf 'release_tag=%s\n' "$RELEASE_TAG"
            printf 'version=%s\n' "$VERSION"
            printf 'npm_dist_tag=%s\n' "$npm_dist_tag"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: validate-inputs
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.validate-inputs.outputs.source_ref }}
          persist-credentials: false

      - name: Record checked-out release source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::checkout did not resolve a full Git commit id" >&2
            exit 1
          }
          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"

      - name: Verify release projections and README install mode
        env:
          VERSION: ${{ needs.validate-inputs.outputs.version }}
        run: python3 scripts/release-version.py check --version "$VERSION"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown

      - name: Rust cache
        uses: Swatinem/rust-cache@v2.9.2

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install wasm-tools
        uses: taiki-e/install-action@v2.85.11
        with:
          tool: wasm-tools

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Verify generated Web contracts
        run: |
          python3 scripts/sync-release-legal-materials.py --check
          cargo run --locked -p xtask -- verify-mermaid-reference
          cargo run --locked -p xtask -- verify-editor-token-descriptor
          cargo run --locked -p xtask -- verify-text-measurement-protocol
          cargo run --locked -p xtask -- verify-web-diagram-catalog
          cargo run --locked -p xtask -- verify-artifact-profiles
          cargo run --locked -p xtask -- verify-capability-surface

      - name: Install Web workspace dependencies
        run: npm ci --prefix platforms/web

      - name: Build Web package group
        run: npm run build --prefix platforms/web

      - name: Verify and smoke Web package group
        run: npm run smoke --prefix platforms/web

      - name: Check final Web package WASM size budgets
        run: |
          cargo run --locked -p xtask -- wasm-size-matrix \
            --surface web \
            --web-package-root platforms/web/packages \
            --budget-file docs/release/WASM_SIZE_BUDGETS.json

      - name: Pack verified Web package group
        id: pack
        shell: bash
        env:
          VERSION: ${{ needs.validate-inputs.outputs.version }}
          NPM_DIST_TAG: ${{ needs.validate-inputs.outputs.npm_dist_tag }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/merman-web-package-group"
          mkdir -p "$artifact_dir"
          python3 scripts/web_package_group.py pack \
            --root . \
            --descriptor platforms/web/web-surface-descriptor.json \
            --artifact-dir "$artifact_dir" \
            --version "$VERSION" \
            --source-sha "$SOURCE_SHA" \
            --target-dist-tag "$NPM_DIST_TAG"
          python3 scripts/web_package_group.py verify-artifact \
            --manifest "$artifact_dir/web-package-group.json" \
            --artifact-dir "$artifact_dir" \
            --version "$VERSION" \
            --descriptor platforms/web/web-surface-descriptor.json
          printf 'artifact_dir=%s\n' "$artifact_dir" >> "$GITHUB_OUTPUT"

      - name: Upload verified Web package group
        uses: actions/upload-artifact@v7.0.1
        with:
          name: merman-web-npm-package-group
          path: ${{ steps.pack.outputs.artifact_dir }}
          if-no-files-found: error

  publish:
    needs:
      - validate-inputs
      - build
    if: ${{ inputs.publish_to_npm }}
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      # The artifact is data only. Run release logic from the trusted workflow revision.
      - name: Checkout trusted release verifier
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Download verified Web package group
        uses: actions/download-artifact@v8.0.1
        with:
          name: merman-web-npm-package-group
          path: target/npm-package-group

      - name: Verify downloaded Web package group
        shell: bash
        env:
          VERSION: ${{ needs.validate-inputs.outputs.version }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          NPM_DIST_TAG: ${{ needs.validate-inputs.outputs.npm_dist_tag }}
        run: |
          set -euo pipefail
          python3 scripts/web_package_group.py verify-artifact \
            --manifest target/npm-package-group/web-package-group.json \
            --artifact-dir target/npm-package-group \
            --version "$VERSION" \
            --source-sha "$SOURCE_SHA" \
            --target-dist-tag "$NPM_DIST_TAG" \
            --descriptor platforms/web/web-surface-descriptor.json

      - name: Publish npm package group
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/web_package_group.py reconcile \
            --manifest target/npm-package-group/web-package-group.json \
            --artifact-dir target/npm-package-group \
            --registry https://registry.npmjs.org \
            --report target/npm-package-group/reconciliation-report.json

      - name: Upload npm reconciliation report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: merman-web-npm-reconciliation-report
          path: target/npm-package-group/reconciliation-report.json
          if-no-files-found: warn
