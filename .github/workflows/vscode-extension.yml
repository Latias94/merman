name: Native CLI and VS Code Extension

on:
  workflow_call:
    inputs:
      source_sha:
        description: "Immutable source commit selected by the CI caller"
        required: true
        type: string
      check_cli_profiles:
        description: "Check exact non-Linux CLI analysis and complete profiles"
        required: true
        type: boolean
      package_vscode:
        description: "Build, test, and package the VS Code extension on all four platforms"
        required: true
        type: boolean
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Protected branch (main), version tag, or refs/tags/<version-tag> to package from"
        required: true
        default: "main"
        type: string

permissions:
  contents: read

concurrency:
  group: vscode-extension-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-inputs:
    name: validate-inputs
    if: ${{ inputs.source_sha == '' }}
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.pin-source.outputs.source_sha }}
    steps:
      - name: Validate package source ref
        id: source
        shell: bash
        env:
          DISPATCH_SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail

          semver_re='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.(0|[1-9][0-9]*))?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          tag_re="^v${semver_re#^}"
          fail() {
            echo "::error::$1" >&2
            exit 1
          }

          SOURCE_REF="$DISPATCH_SOURCE_REF"
          [[ "$SOURCE_REF" != *$'\n'* && "$SOURCE_REF" != *$'\r'* ]] || fail "source_ref must be a single line."
          validated_source_ref="$SOURCE_REF"
          if [[ "$SOURCE_REF" == "main" || "$SOURCE_REF" == "refs/heads/main" ]]; then
            :
          elif [[ "$SOURCE_REF" =~ $tag_re || "$SOURCE_REF" =~ ^refs/tags/${tag_re#^} ]]; then
            :
            validated_source_ref="refs/tags/${SOURCE_REF#refs/tags/}"
          else
            fail "source_ref must be main, refs/heads/main, a version tag, or refs/tags/<release-tag>."
          fi

          printf 'source_ref=%s\n' "$validated_source_ref" >> "$GITHUB_OUTPUT"

      - name: Resolve validated package source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.source.outputs.source_ref }}
          persist-credentials: false

      - name: Pin immutable package source
        id: pin-source
        shell: bash
        run: |
          source_sha="$(git rev-parse HEAD)"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"

  cli-profiles:
    name: cli-profiles (${{ matrix.target }})
    if: ${{ inputs.check_cli_profiles && !inputs.package_vscode }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-2025-vs2026
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Validate PowerShell completion
        if: runner.os == 'Windows'
        run: python3 scripts/verify_cli_assets.py --require powershell

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Rust cache
        uses: Swatinem/rust-cache@v2.9.3
        with:
          cache-targets: false

      - name: Build exact CLI analysis profile
        run: python3 scripts/artifact_profile_recipe.py cli-analysis --build-host --locked

      - name: Build complete CLI
        run: python3 scripts/artifact_profile_recipe.py cli-release --build-host --locked

  editor-language-contract:
    needs: validate-inputs
    if: ${{ !cancelled() && (inputs.package_vscode || inputs.source_sha == '') && (inputs.source_sha != '' || needs.validate-inputs.result == 'success') }}
    name: editor-language-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_sha || needs.validate-inputs.outputs.source_sha }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Verify legal material projections
        run: python3 scripts/sync-release-legal-materials.py --check

      - name: Rust cache
        uses: Swatinem/rust-cache@v2.9.3
        with:
          cache-targets: false

      - name: Verify generated editor language contract
        run: cargo run --locked -p xtask -- verify-editor-language-contract

  package:
    # CI uses its immutable commit directly; standalone dispatch resolves the selected ref first.
    needs: validate-inputs
    if: ${{ !cancelled() && (inputs.package_vscode || inputs.source_sha == '') && (inputs.source_sha != '' || needs.validate-inputs.result == 'success') }}
    name: package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x64
          - os: macos-15
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
          - os: windows-2025-vs2026
            target: win32-x64

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_sha || needs.validate-inputs.outputs.source_sha }}
          persist-credentials: false

      - name: Validate PowerShell completion
        if: inputs.check_cli_profiles && runner.os == 'Windows'
        run: python3 scripts/verify_cli_assets.py --require powershell

      - name: Checkout GNU compatibility tooling
        if: runner.os == 'Linux'
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .workflow-tools
          sparse-checkout: scripts/linux_binary_compatibility.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Rust cache
        uses: Swatinem/rust-cache@v2.9.3
        with:
          cache-targets: false

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: tools/vscode-extension/package-lock.json

      - name: Install pinned npm
        run: npm install --global --ignore-scripts --registry=https://registry.npmjs.org/ npm@12.2.1

      - name: Install extension dependencies
        working-directory: tools/vscode-extension
        run: npm ci

      - name: Build exact CLI analysis profile
        if: inputs.check_cli_profiles && runner.os != 'Linux'
        run: python3 scripts/artifact_profile_recipe.py cli-analysis --build-host --locked

      - name: Build release runtime binaries
        run: |
          python3 scripts/artifact_profile_recipe.py lsp-stdio-release --build-host --locked
          python3 scripts/artifact_profile_recipe.py cli-release --build-host --locked

      - name: Verify GNU runtime compatibility
        if: runner.os == 'Linux'
        run: python3 .workflow-tools/scripts/linux_binary_compatibility.py target/dist/merman-cli target/dist/merman-lsp

      - name: Typecheck extension
        working-directory: tools/vscode-extension
        run: npm run check

      - name: Test extension
        working-directory: tools/vscode-extension
        run: npm test

      - name: Stage runtime binaries
        working-directory: tools/vscode-extension
        run: npm run prepare:binaries

      - name: Smoke extension host
        if: runner.os == 'Linux'
        working-directory: tools/vscode-extension
        run: xvfb-run -a npm run test:extension-host

      - name: Smoke extension host
        if: runner.os != 'Linux'
        working-directory: tools/vscode-extension
        run: npm run test:extension-host

      - name: Derive VSIX release metadata
        id: vsix
        run: |
          runtime_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          extension_version="$(node -p "require('./tools/vscode-extension/package.json').version")"
          source_sha="$(git rev-parse HEAD)"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          runtime_channel="stable"
          if [[ "$runtime_version" == *-* ]]; then
            runtime_channel="${runtime_version#*-}"
            runtime_channel="${runtime_channel%%.*}"
          fi
          {
            echo "extension_version=${extension_version}"
            echo "runtime_version=${runtime_version}"
            echo "runtime_channel=${runtime_channel}"
            echo "source_sha=${source_sha}"
          } >> "$GITHUB_OUTPUT"
          echo "VSIX extension_version=${extension_version} runtime_version=${runtime_version} runtime_channel=${runtime_channel} source_sha=${source_sha}"

      - name: Package VSIX
        working-directory: tools/vscode-extension
        env:
          MERMAN_VSCODE_RELEASE_VERSION: ${{ steps.vsix.outputs.extension_version }}
        run: npm run package -- --target "${{ matrix.target }}" --out "merman-vscode-${{ matrix.target }}.vsix"

      - name: Verify VSIX contents
        working-directory: tools/vscode-extension
        env:
          MERMAN_VSCODE_RELEASE_VERSION: ${{ steps.vsix.outputs.extension_version }}
        run: npm run verify:vsix -- --vsix "merman-vscode-${{ matrix.target }}.vsix" --platform "${{ matrix.target }}" --target "${{ matrix.target }}"

      - name: Smoke packaged VSIX
        if: runner.os == 'Linux'
        working-directory: tools/vscode-extension
        run: xvfb-run -a npm run smoke:vsix -- --vsix "merman-vscode-${{ matrix.target }}.vsix"

      - name: Smoke packaged VSIX
        if: runner.os != 'Linux'
        working-directory: tools/vscode-extension
        run: npm run smoke:vsix -- --vsix "merman-vscode-${{ matrix.target }}.vsix"

      - name: Upload VSIX
        uses: actions/upload-artifact@v7.0.2
        with:
          name: merman-vscode-${{ steps.vsix.outputs.extension_version }}-runtime-${{ steps.vsix.outputs.runtime_version }}-${{ steps.vsix.outputs.runtime_channel }}-${{ steps.vsix.outputs.source_sha }}-${{ matrix.target }}
          path: tools/vscode-extension/merman-vscode-${{ matrix.target }}.vsix
          if-no-files-found: error
