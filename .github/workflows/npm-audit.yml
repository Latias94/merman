name: npm Dependency Audit

on:
  push:
    branches:
      - main
      - master
    paths:
      - playground/package.json
      - playground/package-lock.json
      - playground/tests/package.json
      - playground/tests/package-lock.json
      - tools/mermaid-cli/package.json
      - tools/mermaid-cli/package-lock.json
      - .github/workflows/npm-audit.yml
  pull_request:
    paths:
      - playground/package.json
      - playground/package-lock.json
      - playground/tests/package.json
      - playground/tests/package-lock.json
      - tools/mermaid-cli/package.json
      - tools/mermaid-cli/package-lock.json
      - .github/workflows/npm-audit.yml
  schedule:
    - cron: "53 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: npm dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            playground/package-lock.json
            playground/tests/package-lock.json
            tools/mermaid-cli/package-lock.json

      - name: Install npm toolchain
        run: npm install --global --ignore-scripts --registry=https://registry.npmjs.org/ npm@11.17.0

      - name: Verify package manifests match lockfiles
        run: |
          npm ci --ignore-scripts --no-audit --dry-run --prefix playground
          npm ci --ignore-scripts --no-audit --dry-run --prefix playground/tests
          npm ci --ignore-scripts --no-audit --dry-run --prefix tools/mermaid-cli

      - name: Audit production and tooling dependencies
        run: |
          npm run verify:security --prefix playground
          npm run audit:tooling --prefix playground
          npm audit --package-lock-only --audit-level=high --prefix tools/mermaid-cli
