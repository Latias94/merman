name: Release SDK

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Immutable commit, main, or matching release tag"
        type: string
        required: true
        default: main
      release_tag:
        description: "Matching vX.Y.Z release tag (need not exist for validation)"
        type: string
        required: true
  workflow_call:
    inputs:
      source_ref:
        type: string
        default: main
      release_tag:
        type: string
        required: true
    outputs:
      source_sha:
        value: ${{ jobs.validate-inputs.outputs.source_sha }}
      version:
        value: ${{ jobs.validate-inputs.outputs.version }}

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  validate-inputs:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      source_tree: ${{ steps.source.outputs.source_tree }}
      version: ${{ steps.inputs.outputs.version }}
    steps:
      - name: Check out trusted release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Validate release inputs
        id: inputs
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          version="$(python3 scripts/release-version.py canonical --version "${RELEASE_TAG#v}")"
          test "$RELEASE_TAG" = "v$version"
          if [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            source_ref="$SOURCE_REF"
          elif [[ "$SOURCE_REF" == main || "$SOURCE_REF" == refs/heads/main ]]; then
            source_ref=refs/heads/main
          elif [[ "$SOURCE_REF" == "$RELEASE_TAG" || "$SOURCE_REF" == "refs/tags/$RELEASE_TAG" ]]; then
            source_ref="refs/tags/$RELEASE_TAG"
          else
            echo '::error::source_ref must be an immutable commit, main, or the matching release tag.'
            exit 1
          fi
          printf 'source_ref=%s\nversion=%s\n' "$source_ref" "$version" >> "$GITHUB_OUTPUT"
      - name: Resolve selected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.inputs.outputs.source_ref }}
          fetch-tags: true
          persist-credentials: false
      - name: Pin immutable source
        id: source
        shell: bash
        env:
          SOURCE_REF: ${{ steps.inputs.outputs.source_ref }}
          VERSION: ${{ steps.inputs.outputs.version }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse 'HEAD^{commit}')"
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          if [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            test "$source_sha" = "$SOURCE_REF"
          fi
          python3 -c 'import os,tomllib; assert tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["version"] == os.environ["VERSION"]'
          printf 'source_sha=%s\nsource_tree=%s\n' "$source_sha" "$source_tree" >> "$GITHUB_OUTPUT"

  package:
    name: sdk-${{ matrix.platform.kind }}-${{ matrix.flavor }} (${{ matrix.platform.target }})
    needs: validate-inputs
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        flavor: [standard, math, full]
        platform:
          - {kind: native, target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04}
          - {kind: native, target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm}
          - {kind: native, target: aarch64-apple-darwin, runner: macos-15}
          - {kind: native, target: x86_64-apple-darwin, runner: macos-15-intel}
          - {kind: native, target: x86_64-pc-windows-msvc, runner: windows-2025}
          - {kind: wasi, target: wasm32-wasip1, runner: ubuntu-24.04}
    env:
      SDK_PROFILE: sdk-${{ matrix.platform.kind }}-${{ matrix.flavor }}
      SDK_TARGET: ${{ matrix.platform.target }}
      SOURCE_SHA: ${{ needs.validate-inputs.outputs.source_sha }}
      SOURCE_TREE: ${{ needs.validate-inputs.outputs.source_tree }}
      VERSION: ${{ needs.validate-inputs.outputs.version }}
      CARGO_TARGET_DIR: target/sdk-build/${{ matrix.platform.kind }}-${{ matrix.flavor }}-${{ matrix.platform.target }}
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Check out pinned source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-inputs.outputs.source_sha }}
          persist-credentials: false
      - name: Set up Python
        # Official v7.0.0 ref resolved from actions/setup-python.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Verify pinned source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse 'HEAD^{commit}')" = "$SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
        with:
          # Install rust-toolchain.toml components up front, before Cargo activates the override.
          components: ${{ matrix.platform.kind == 'native' && !contains(matrix.platform.target, 'windows') && 'rustfmt, clippy, llvm-tools-preview' || 'rustfmt, clippy' }}
          targets: ${{ matrix.platform.target }}
      - name: Install the existing license report tool
        if: matrix.platform.target != 'x86_64-apple-darwin'
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-about@0.9.2
      - name: Build the license CLI where no matching binary is available
        if: matrix.platform.target == 'x86_64-apple-darwin'
        run: cargo install --locked cargo-about --version 0.9.2 --features cli
      - name: Verify license tool installation before building the SDK
        run: cargo about --version
      - name: Install pinned host qualification dependencies
        shell: bash
        run: python -m pip install --requirement platforms/wasi/requirements.txt
      - name: Fetch locked dependencies
        shell: bash
        run: cargo fetch --locked
      - name: Build and qualify the exact SDK with the shared local entry point
        shell: bash
        run: |
          set -euo pipefail
          python scripts/sdk_qualify.py --profile "$SDK_PROFILE" --target "$SDK_TARGET" \
            --work-dir "target/sdk-input/$SDK_PROFILE/$SDK_TARGET" --output-dir target/sdk-output \
            --source-commit "$SOURCE_SHA"
      - name: Upload SDK archive and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-package-${{ env.SDK_PROFILE }}-${{ env.SDK_TARGET }}
          path: target/sdk-output/*
          if-no-files-found: error
      - name: Retain host qualification evidence separately from public SDK payloads
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-smoke-${{ env.SDK_PROFILE }}-${{ env.SDK_TARGET }}
          path: target/sdk-input/${{ env.SDK_PROFILE }}/${{ env.SDK_TARGET }}/evidence
          if-no-files-found: error

  cli-reference:
    name: Build the existing release CLI for SDK comparison
    needs: validate-inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CARGO_TARGET_DIR: target/sdk-cli
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Check out the same pinned source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-inputs.outputs.source_sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
        with:
          components: rustfmt, clippy
      - name: Build the descriptor-owned CLI release recipe once
        run: python scripts/artifact_profile_recipe.py cli-release --build-host --locked
      - name: Stage the comparison CLI with the normal CLI license material
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/sdk-cli-reference
          cp target/sdk-cli/dist/merman-cli LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md target/sdk-cli-reference/
          cp -R THIRD_PARTY_LICENSES target/sdk-cli-reference/
          printf 'Corresponding source: https://github.com/%s/tree/%s\n' "$GITHUB_REPOSITORY" "$(git rev-parse HEAD)" > target/sdk-cli-reference/SOURCE_AVAILABILITY.txt
      - name: Retain the internal comparison executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-cli-reference
          path: target/sdk-cli-reference/
          if-no-files-found: error

  native-wasi-parity:
    name: native/WASI/CLI output parity (${{ matrix.flavor }})
    needs: [validate-inputs, package, cli-reference]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        flavor: [standard, math, full]
    steps:
      - name: Check out the same pinned qualification helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-inputs.outputs.source_sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install the pinned shared qualification dependencies
        run: python -m pip install --requirement platforms/wasi/requirements.txt
      - name: Download native host evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdk-smoke-sdk-native-${{ matrix.flavor }}-x86_64-unknown-linux-gnu
          path: sdk-parity/native
      - name: Download both WASI host outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdk-smoke-sdk-wasi-${{ matrix.flavor }}-wasm32-wasip1
          path: sdk-parity/wasi
      - name: Download the same-source CLI
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdk-cli-reference
          path: sdk-parity/cli
      - name: Download the qualified WASI archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdk-package-sdk-wasi-${{ matrix.flavor }}-wasm32-wasip1
          path: sdk-parity/archive
      - name: Compare CLI and extracted WASI with matching fonts, scale and background
        shell: python
        env:
          SDK_FLAVOR: ${{ matrix.flavor }}
          VERSION: ${{ needs.validate-inputs.outputs.version }}
        run: |
          import os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd()))
          from scripts.release_archive import verified_archive_contents
          root = Path('sdk-parity').resolve()
          cli = root / 'cli/merman-cli'
          cli.chmod(0o755)
          flavor = os.environ['SDK_FLAVOR']
          archive = root / 'archive' / ('merman-sdk-wasi-' + flavor + '-wasm32-wasip1.tar.xz')
          with verified_archive_contents(
              archive, Path(str(archive) + '.sha256'), package_name='merman-sdk-wasi-' + flavor,
              target='wasm32-wasip1', version=os.environ['VERSION'],
          ) as extracted:
              subprocess.run([
                  sys.executable, 'platforms/wasi/cli_compare.py', '--cli', str(cli),
                  '--module', str(extracted.root / 'lib/merman_wasi.wasm'), '--flavor', flavor,
                  '--output-dir', str(root / 'cli-comparison'),
              ], check=True)
      - name: Compare dimensions and decoded RGBA8, not PNG compression bytes
        shell: python
        env:
          SDK_FLAVOR: ${{ matrix.flavor }}
          SOURCE_SHA: ${{ needs.validate-inputs.outputs.source_sha }}
        run: |
          import os, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('platforms/wasi').resolve()))
          from common import compare_pixels, write_json
          root = Path('sdk-parity')
          names = ['basic'] + ([] if os.environ['SDK_FLAVOR'] == 'standard' else ['math'])
          report = {}
          for runtime in ('wazero', 'wasmtime'):
              for name in names:
                  report[runtime + '/' + name] = compare_pixels(
                      root / 'native' / 'native-smoke' / (name + '.png'),
                      root / 'wasi' / 'wasi-smoke' / runtime / (name + '.png'))
          write_json(root / 'parity.json', {'source_commit': os.environ['SOURCE_SHA'],
                                           'flavor': os.environ['SDK_FLAVOR'], 'artifacts': report})
      - name: Retain native/WASI pixel comparison evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-parity-${{ matrix.flavor }}
          path: |
            sdk-parity/parity.json
            sdk-parity/cli-comparison
          if-no-files-found: error
