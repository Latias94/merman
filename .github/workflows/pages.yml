name: GitHub Pages

on:
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/pages.yml"
      - "abi/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "docs/release/WASM_SIZE_BUDGETS.json"
      - "platforms/web/**"
      - "playground/**"
      - "scripts/check-svg-safety-policy.mjs"
      - "scripts/generate-svg-safety-policy.mjs"
      - "scripts/svg-safety-policy.mjs"
      - "tools/vscode-extension/src/preview-svg-safety-policy.ts"
  pull_request:
    paths:
      - ".github/workflows/pages.yml"
      - "abi/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "docs/release/WASM_SIZE_BUDGETS.json"
      - "platforms/web/**"
      - "playground/**"
      - "scripts/check-svg-safety-policy.mjs"
      - "scripts/generate-svg-safety-policy.mjs"
      - "scripts/svg-safety-policy.mjs"
      - "tools/vscode-extension/src/preview-svg-safety-policy.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build playground
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            platforms/web/package-lock.json
            playground/package-lock.json

      - name: Install npm toolchain
        run: npm install --global --ignore-scripts --registry=https://registry.npmjs.org/ npm@11.17.0

      - name: Install WASM tools
        run: |
          cargo install wasm-bindgen-cli --version 0.2.108 --locked
          cargo install wasm-pack --version 0.15.0 --locked

      - name: Verify generated browser contracts
        run: |
          cargo run -p xtask -- verify-text-measurement-abi
          cargo run -p xtask -- verify-web-diagram-catalog
          cargo run -p xtask -- verify-playground-example-catalog

      - name: Install web package dependencies
        run: npm ci --prefix platforms/web

      - name: Build web package
        run: npm run build --prefix platforms/web

      - name: Verify web package
        run: npm run prepack --prefix platforms/web

      - name: Smoke web package
        run: npm run smoke --prefix platforms/web

      - name: Install playground dependencies
        run: npm ci --prefix playground

      - name: Install playground browsers
        run: npm exec --prefix playground -- playwright install --with-deps chromium firefox webkit

      - name: Test playground
        run: npm test --prefix playground

      - name: Lint playground
        run: npm run lint --prefix playground

      - name: Build playground
        run: npm run build --prefix playground

      - name: Verify playground dist
        run: npm run verify:dist --prefix playground

      - name: Smoke playground in supported browsers
        run: npm run test:browser:smoke:built --prefix playground

      - name: Test playground in Chromium
        run: npm run test:browser:chromium --prefix playground

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playground-browser-failure-${{ github.run_attempt }}
          path: |
            playground/playwright-report
            playground/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: playground/dist

  deploy:
    name: Deploy playground
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
