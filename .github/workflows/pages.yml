name: GitHub Pages

on:
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/pages.yml"
      - "abi/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "LICENSE-*"
      - "THIRD_PARTY_NOTICES.md"
      - "THIRD_PARTY_LICENSES/**"
      - "crates/**"
      - "docs/release/WASM_SIZE_BUDGETS.json"
      - "platforms/web/**"
      - "playground/**"
      - "scripts/check-svg-safety-policy.mjs"
      - "scripts/generate-svg-safety-policy.mjs"
      - "scripts/svg-safety-policy.mjs"
      - "scripts/sync-release-legal-materials.py"
      - "tools/vscode-extension/src/preview-svg-safety-policy.ts"
  pull_request:
    paths:
      - ".github/workflows/pages.yml"
      - "abi/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "LICENSE-*"
      - "THIRD_PARTY_NOTICES.md"
      - "THIRD_PARTY_LICENSES/**"
      - "crates/**"
      - "docs/release/WASM_SIZE_BUDGETS.json"
      - "platforms/web/**"
      - "playground/**"
      - "scripts/check-svg-safety-policy.mjs"
      - "scripts/generate-svg-safety-policy.mjs"
      - "scripts/svg-safety-policy.mjs"
      - "scripts/sync-release-legal-materials.py"
      - "tools/vscode-extension/src/preview-svg-safety-policy.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build playground
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            platforms/web/package-lock.json
            playground/package-lock.json
            playground/tests/package-lock.json

      - name: Install npm toolchain
        run: npm install --global --ignore-scripts --registry=https://registry.npmjs.org/ npm@11.17.0

      - name: Install wasm-tools
        uses: taiki-e/install-action@wasm-tools

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Verify deployable browser projections
        if: github.event_name != 'pull_request'
        run: |
          cargo run --locked -p xtask -- verify-mermaid-reference
          cargo run --locked -p xtask -- verify-capability-surface
          cargo run --locked -p xtask -- verify-editor-token-descriptor
          cargo run --locked -p xtask -- verify-text-measurement-protocol
          cargo run --locked -p xtask -- verify-web-diagram-catalog
          cargo run --locked -p xtask -- verify-resource-contract
          cargo run --locked -p xtask -- verify-playground-example-catalog

      - name: Install web package dependencies
        run: npm ci --prefix platforms/web

      - name: Build web package
        run: npm run build --prefix platforms/web

      - name: Verify and smoke web package
        run: npm run smoke --prefix platforms/web

      - name: Check final Web package WASM size budgets
        run: |
          cargo run --locked -p xtask -- wasm-size-matrix \
            --surface web \
            --web-package-root platforms/web/packages \
            --budget-file docs/release/WASM_SIZE_BUDGETS.json

      - name: Install playground dependencies
        run: npm ci --prefix playground

      - name: Install playground browser-test dependencies
        run: npm ci --prefix playground/tests

      - name: Verify playground dependency boundaries
        run: npm run verify:dependencies --prefix playground

      - name: Install playground browsers
        run: npm run install:browsers --prefix playground/tests

      - name: Prepare playground browser runtime
        run: npm run prepare:browser-runtime --prefix playground

      - name: Test prepared playground
        run: npm run test:prepared --prefix playground

      - name: Lint playground
        run: npm run lint --prefix playground

      - name: Build prepared playground
        run: npm run build:prepared --prefix playground

      - name: Smoke playground in Firefox and WebKit
        run: npm run test:browser:smoke:non-chromium:built --prefix playground

      - name: Test playground in desktop Chromium
        run: npm run test:browser:chromium:desktop:built --prefix playground

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playground-browser-failure-${{ github.run_attempt }}
          path: |
            playground/playwright-report
            playground/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: playground/dist

  deploy:
    name: Deploy playground
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
