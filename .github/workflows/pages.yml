name: GitHub Pages

on:
  workflow_call:
    inputs:
      ci_only:
        description: Build and test without entering the Pages deployment path
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-package:
    name: Build Web package
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown

      - name: Rust cache
        uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: pages-web-wasm

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: platforms/web/package-lock.json

      - name: Install npm toolchain
        run: npm install --global --ignore-scripts --registry=https://registry.npmjs.org/ npm@12.0.2

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Install web package dependencies
        run: npm ci --prefix platforms/web

      - name: Build web package
        run: npm run build --prefix platforms/web

      - name: Verify and smoke web package
        run: npm run smoke --prefix platforms/web

      - name: Upload built Web package
        id: upload
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pages-web-package-${{ github.run_attempt }}
          path: |
            platforms/web/packages
            platforms/web/pkg
            platforms/web/dist
          if-no-files-found: error
          retention-days: 7

  budget-tool:
    name: Build Web budget tool
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Rust cache
        uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: pages-web-budget-tool

      - name: Build optimized budget tool
        run: cargo build --locked --release -p xtask

      - name: Setup Node for deployable browser projections
        if: github.event_name != 'pull_request' && inputs.ci_only != true
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.21.0"

      - name: Verify deployable browser projections
        if: github.event_name != 'pull_request' && inputs.ci_only != true
        run: |
          target/release/xtask verify-mermaid-reference
          target/release/xtask verify-capability-surface
          target/release/xtask verify-editor-language-contract
          target/release/xtask verify-text-measurement-protocol
          target/release/xtask verify-web-diagram-catalog
          target/release/xtask verify-resource-contract
          target/release/xtask verify-playground-example-catalog

      - name: Upload budget tool
        id: upload
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pages-web-budget-tool-${{ github.run_attempt }}
          path: target/release/xtask
          if-no-files-found: error
          retention-days: 7

  size-budgets:
    name: Check Web package size budgets
    needs: [web-package, budget-tool]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Download built Web package
        uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.web-package.outputs.artifact_id }}
          path: platforms/web

      - name: Download budget tool
        uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.budget-tool.outputs.artifact_id }}
          path: target/release

      - name: Install wasm-tools
        uses: taiki-e/install-action@v2.87.29
        with:
          tool: wasm-tools@1.261.0

      - name: Check final Web package WASM size budgets
        run: |
          chmod +x target/release/xtask
          target/release/xtask wasm-size-matrix \
            --surface web \
            --web-package-root platforms/web/packages \
            --budget-file docs/release/WASM_SIZE_BUDGETS.json

  build:
    name: Build playground
    needs: web-package
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown

      - name: Rust cache
        uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: pages-playground-tools
          cache-targets: false

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: |
            platforms/web/package-lock.json
            playground/package-lock.json
            playground/tests/package-lock.json

      - name: Install npm toolchain
        run: npm install --global --ignore-scripts --registry=https://registry.npmjs.org/ npm@12.0.2

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Download built Web package
        uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.web-package.outputs.artifact_id }}
          path: platforms/web

      - name: Install Web package checker dependencies
        run: npm ci --prefix platforms/web

      - name: Install playground dependencies
        run: npm ci --prefix playground

      - name: Install playground browser-test dependencies
        run: npm ci --prefix playground/tests

      - name: Verify playground dependency boundaries
        run: npm run verify:dependencies --prefix playground

      - name: Install playground browsers
        run: npm run install:browsers --prefix playground/tests

      - name: Prepare playground browser runtime
        run: npm run prepare:browser-runtime --prefix playground

      - name: Test prepared playground
        run: npm run test:prepared --prefix playground

      - name: Lint playground
        run: npm run lint --prefix playground

      - name: Build prepared playground
        run: npm run build:prepared --prefix playground

      - name: Smoke playground in Firefox and WebKit
        run: npm run test:browser:smoke:non-chromium:built --prefix playground

      - name: Test playground in desktop Chromium
        run: npm run test:browser:chromium:desktop:built --prefix playground

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playground-browser-failure-${{ github.run_attempt }}
          path: |
            playground/playwright-report
            playground/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Configure Pages
        if: github.event_name != 'pull_request' && inputs.ci_only != true
        uses: actions/configure-pages@v6.0.0

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && inputs.ci_only != true
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: playground/dist
