name: Release Crates (crates.io)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish, for example v0.8.0-alpha.5"
        required: true
        type: string
      source_ref:
        description: "Matching immutable release tag/ref or reviewed full commit SHA"
        required: true
        type: string
      recovery_run_id:
        description: "Prior release-crates workflow run containing receipts; required for a new-run recovery"
        required: false
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate-inputs:
    name: validate-inputs
    runs-on: ubuntu-24.04
    outputs:
      source_ref: ${{ steps.release.outputs.source_ref }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      version: ${{ steps.release.outputs.version }}
      recovery_run_id: ${{ steps.release.outputs.recovery_run_id }}
    steps:
      - name: Validate release inputs
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_RELEASE_TAG: ${{ inputs.release_tag }}
          DISPATCH_SOURCE_REF: ${{ inputs.source_ref }}
          DISPATCH_RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
          GIT_REF: ${{ github.ref }}
          GIT_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          semver_re='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.(0|[1-9][0-9]*))?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          tag_re="^v${semver_re#^}"
          fail() {
            echo "::error::$1" >&2
            exit 1
          }

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            RELEASE_TAG="$DISPATCH_RELEASE_TAG"
            SOURCE_REF="$DISPATCH_SOURCE_REF"
          else
            RELEASE_TAG="$GIT_REF_NAME"
            SOURCE_REF="$GIT_REF"
          fi

          [[ "$RELEASE_TAG" =~ $tag_re ]] || fail "release_tag must match vX.Y.Z or vX.Y.Z-alpha.N/beta.N/rc.N."
          [[ "$SOURCE_REF" != *$'\n'* && "$SOURCE_REF" != *$'\r'* ]] || fail "source_ref must be a single line."
          validated_source_ref="$SOURCE_REF"
          if [[ "$SOURCE_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            validated_source_ref="$SOURCE_REF"
          elif [[ "$SOURCE_REF" =~ $tag_re || "$SOURCE_REF" =~ ^refs/tags/${tag_re#^} ]]; then
            source_tag="${SOURCE_REF#refs/tags/}"
            [[ "$source_tag" == "$RELEASE_TAG" ]] || fail "source_ref tag must match release_tag."
            validated_source_ref="refs/tags/$source_tag"
          else
            fail "source_ref must be a reviewed full commit SHA or the matching immutable release tag."
          fi

          VERSION="${RELEASE_TAG#v}"
          [[ "$VERSION" =~ $semver_re ]] || fail "release_tag contains an unsupported SemVer version."
          RECOVERY_RUN_ID="$DISPATCH_RECOVERY_RUN_ID"
          if [ -n "$RECOVERY_RUN_ID" ] && [[ ! "$RECOVERY_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            fail "recovery_run_id must be a positive GitHub Actions run id."
          fi

          {
            printf 'source_ref=%s\n' "$validated_source_ref"
            printf 'release_tag=%s\n' "$RELEASE_TAG"
            printf 'version=%s\n' "$VERSION"
            printf 'recovery_run_id=%s\n' "$RECOVERY_RUN_ID"
          } >> "$GITHUB_OUTPUT"

  preflight:
    needs: validate-inputs
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      source_tree: ${{ steps.source.outputs.source_tree }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.validate-inputs.outputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve verified source commit
        id: source
        run: |
          set -euo pipefail

          source_sha="$(git rev-parse HEAD)"
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          {
            printf 'source_sha=%s\n' "$source_sha"
            printf 'source_tree=%s\n' "$source_tree"
          } >> "$GITHUB_OUTPUT"
          echo "Verified source commit and tree: $source_sha $source_tree"

      - name: Use validated release metadata
        id: version
        env:
          RELEASE_TAG: ${{ needs.validate-inputs.outputs.release_tag }}
          VERSION: ${{ needs.validate-inputs.outputs.version }}
        run: |
          set -euo pipefail
          {
            printf 'tag=%s\n' "$RELEASE_TAG"
            printf 'version=%s\n' "$VERSION"
          } >> "$GITHUB_OUTPUT"
          echo "Tag version: $VERSION"

      - name: Verify release projections and README install mode
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 scripts/release-version.py check --version "$VERSION"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: aarch64-linux-android,wasm32-unknown-unknown

      - name: Verify independent crate versions changed with their source
        run: |
          set -euo pipefail
          base_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD^)"
          python3 scripts/verify-independent-crate-version-bumps.py --base-ref "$base_tag"

      - name: Verify exhaustive Cargo feature and artifact recipes
        run: cargo run --locked -p xtask -- verify-feature-matrix --strict

      - name: Verify crates.io publish graph
        run: |
          set -euo pipefail
          mapfile -t crates < <(python3 tools/publish.py --list-crates-io-packages)
          if [ "${#crates[@]}" -eq 0 ]; then
            echo "::error::Cargo metadata produced an empty crates.io publish order"
            exit 1
          fi
          printf 'crates.io publish graph contains %s packages\n' "${#crates[@]}"

  web-owner-preflight:
    name: web-owner-preflight
    needs: preflight
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          persist-credentials: false

      - name: Verify pinned source commit
        env:
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Verify generated Web contracts
        run: |
          cargo run --locked -p xtask -- verify-mermaid-reference
          cargo run --locked -p xtask -- verify-editor-token-descriptor
          cargo run --locked -p xtask -- verify-text-measurement-protocol
          cargo run --locked -p xtask -- verify-capability-surface
          cargo run --locked -p xtask -- verify-artifact-profiles
          cargo run --locked -p xtask -- verify-web-diagram-catalog

      - name: Build, verify, and smoke Web package group
        run: |
          npm ci --prefix platforms/web
          npm run build --prefix platforms/web
          npm run smoke --prefix platforms/web

  typst-owner-preflight:
    name: typst-owner-preflight
    needs: preflight
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      TYPST_CLI_VERSION: "0.15.0"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          persist-credentials: false

      - name: Verify pinned source commit
        env:
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-tools
        uses: taiki-e/install-action@v2.85.11
        with:
          tool: wasm-tools

      - name: Install wasm-opt
        uses: sigoden/install-binary@v1.2.0
        with:
          repo: WebAssembly/binaryen
          name: wasm-opt
          tag: version_131

      - name: Download Typst
        shell: bash
        run: |
          set -euo pipefail
          typst_asset="typst-x86_64-unknown-linux-musl.tar.xz"
          typst_root="${RUNNER_TEMP}/typst-${TYPST_CLI_VERSION}"
          download_dir="$(mktemp -d)"
          curl -fsSL --retry 3 --retry-connrefused --retry-delay 2 \
            -o "${download_dir}/${typst_asset}" \
            "https://github.com/typst/typst/releases/download/v${TYPST_CLI_VERSION}/${typst_asset}"
          tar -xJf "${download_dir}/${typst_asset}" -C "${download_dir}"
          mkdir -p "${typst_root}"
          install -m 0755 "${download_dir}/typst-x86_64-unknown-linux-musl/typst" "${typst_root}/typst"
          "${typst_root}/typst" --version

      - name: Verify generated Typst contracts
        run: |
          cargo run --locked -p xtask -- verify-capability-surface
          cargo run --locked -p xtask -- verify-artifact-profiles
          cargo run --locked -p xtask -- verify-typst-profile-constants

      - name: Build and smoke exact Typst artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_artifact_dependency_closures.py --profile typst-wasm
          cargo run --locked -p xtask -- wasm-size-matrix --surface typst --budget-file docs/release/WASM_SIZE_BUDGETS.json
          cargo run --locked -p xtask -- build-typst-package --profile publish
          typst_bin="${RUNNER_TEMP}/typst-${TYPST_CLI_VERSION}/typst"
          cargo run --locked -p xtask -- typst-package-smoke --profile publish --skip-wasm-build --typst "${typst_bin}"

  publish:
    needs: [validate-inputs, preflight, web-owner-preflight, typst-owner-preflight]
    runs-on: ubuntu-24.04
    environment: crates.io
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          path: source
          persist-credentials: false

      - name: Checkout trusted release operator
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false

      - name: Verify pinned source commit
        working-directory: source
        env:
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
          SOURCE_TREE: ${{ needs.preflight.outputs.source_tree }}
        run: |
          set -euo pipefail

          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Invalid preflight source SHA: $SOURCE_SHA"
            exit 1
          fi

          current_sha="$(git rev-parse HEAD)"
          current_tree="$(git rev-parse 'HEAD^{tree}')"
          if [ "$current_sha" != "$SOURCE_SHA" ]; then
            echo "::error::Publish checkout $current_sha does not match preflight source $SOURCE_SHA"
            exit 1
          fi
          if [ "$current_tree" != "$SOURCE_TREE" ]; then
            echo "::error::Publish tree $current_tree does not match preflight tree $SOURCE_TREE"
            exit 1
          fi

          echo "Publishing verified source commit and tree: $current_sha $current_tree"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.100.0

      - name: Download prior crates.io receipts for recovery
        if: ${{ github.run_attempt > 1 || needs.validate-inputs.outputs.recovery_run_id != '' }}
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: crates-io-receipts-${{ needs.preflight.outputs.source_sha }}-attempt-*
          path: recovery-receipts
          github-token: ${{ github.token }}
          run-id: ${{ needs.validate-inputs.outputs.recovery_run_id != '' && needs.validate-inputs.outputs.recovery_run_id || github.run_id }}

      - name: Upload crates to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
          SOURCE_TREE: ${{ needs.preflight.outputs.source_tree }}
        run: |
          set -euo pipefail
          recovery_args=()
          if [ -d recovery-receipts ]; then
            recovery_args+=(--recovery-receipts-dir recovery-receipts)
          fi
          python3 trusted/scripts/crates_io_release.py publish-receipted \
            --repo-root source \
            --source-sha "$SOURCE_SHA" \
            --source-tree "$SOURCE_TREE" \
            --receipts-dir source/target/crates-io-receipts \
            "${recovery_args[@]}"

      - name: Upload crates.io receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: crates-io-receipts-${{ needs.preflight.outputs.source_sha }}-attempt-${{ github.run_attempt }}
          path: source/target/crates-io-receipts/*.json
          if-no-files-found: warn
