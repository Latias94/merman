name: Security Audit

on:
  push:
    branches:
      - main
      - master
    paths:
      - Cargo.lock
      - Cargo.toml
      - "**/Cargo.lock"
      - "**/Cargo.toml"
      - rust-toolchain.toml
      - about.toml
      - capabilities/artifact-profiles-v1.json
      - deny.toml
      - docs/security/RUSTSEC_EXCEPTIONS.json
      - "LICENSE-*"
      - THIRD_PARTY_NOTICES.md
      - "THIRD_PARTY_LICENSES/**"
      - "crates/**/Cargo.toml"
      - fuzz/Cargo.lock
      - fuzz/Cargo.toml
      - crates/merman-node/Cargo.lock
      - platforms/node/candidate-builds.json
      - "platforms/**/THIRD_PARTY_LICENSES/rust-cargo-dependencies.json"
      - "platforms/python/legal/rust-cargo-dependencies/*.json"
      - scripts/generate-rust-license-report.py
      - scripts/python_wheel_licenses.py
      - scripts/artifact_profile_recipe.py
      - scripts/audit_plan.py
      - scripts/strict_json.py
      - scripts/verify_artifact_dependency_closures.py
      - scripts/verify_rustsec_exceptions.py
      - ".github/workflows/security-audit.yml"
  pull_request:
    paths:
      - Cargo.lock
      - Cargo.toml
      - "**/Cargo.lock"
      - "**/Cargo.toml"
      - rust-toolchain.toml
      - about.toml
      - capabilities/artifact-profiles-v1.json
      - deny.toml
      - docs/security/RUSTSEC_EXCEPTIONS.json
      - "LICENSE-*"
      - THIRD_PARTY_NOTICES.md
      - "THIRD_PARTY_LICENSES/**"
      - "crates/**/Cargo.toml"
      - fuzz/Cargo.lock
      - fuzz/Cargo.toml
      - crates/merman-node/Cargo.lock
      - platforms/node/candidate-builds.json
      - "platforms/**/THIRD_PARTY_LICENSES/rust-cargo-dependencies.json"
      - "platforms/python/legal/rust-cargo-dependencies/*.json"
      - scripts/generate-rust-license-report.py
      - scripts/python_wheel_licenses.py
      - scripts/artifact_profile_recipe.py
      - scripts/audit_plan.py
      - scripts/strict_json.py
      - scripts/verify_artifact_dependency_closures.py
      - scripts/verify_rustsec_exceptions.py
      - ".github/workflows/security-audit.yml"
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-plan:
    name: discover tracked audit locks
    runs-on: ubuntu-24.04
    outputs:
      cargo: ${{ steps.plan.outputs.cargo }}
    steps:
      - uses: actions/checkout@v6

      - name: Build tracked lockfile matrices
        id: plan
        run: python3 scripts/audit_plan.py --github-output "$GITHUB_OUTPUT"

  cargo-audit:
    name: cargo-audit (${{ matrix.lockfile }})
    needs: audit-plan
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.audit-plan.outputs.cargo) }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Audit Rust dependencies
        env:
          AUDIT_LOCKFILE: ${{ matrix.lockfile }}
        run: cargo audit --file "$AUDIT_LOCKFILE"

  cargo-dependency-policy:
    name: cargo-deny dependency policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.1

      - name: Verify dependency advisories, bans, licenses, and sources
        run: cargo deny check advisories bans licenses sources

      - name: Verify governed RustSec exceptions
        run: python3 scripts/verify_rustsec_exceptions.py

      - name: Verify artifact dependency boundaries
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            python3 scripts/verify_artifact_dependency_closures.py \
              --representative-targets
          else
            python3 scripts/verify_artifact_dependency_closures.py
          fi

      - name: Verify checked-in Rust dependency notices
        run: python3 scripts/generate-rust-license-report.py --check
