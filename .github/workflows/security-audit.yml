name: Security Audit

on:
  workflow_call:
    inputs:
      representative_targets:
        description: Limit dependency closure probes to representative PR targets
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-plan:
    name: discover tracked audit locks
    runs-on: ubuntu-24.04
    outputs:
      cargo: ${{ steps.plan.outputs.cargo }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Build tracked lockfile matrices
        id: plan
        run: python3 scripts/audit_plan.py --github-output "$GITHUB_OUTPUT"

  cargo-audit:
    name: cargo-audit (${{ matrix.lockfile }})
    needs: audit-plan
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.audit-plan.outputs.cargo) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0

      - name: Install cargo-audit
        uses: taiki-e/install-action@e40e306b80d964fa5d3792fcbb48bf976d23dce8 # cargo-audit

      - name: Audit Rust dependencies
        env:
          AUDIT_LOCKFILE: ${{ matrix.lockfile }}
        run: cargo audit --file "$AUDIT_LOCKFILE"

  cargo-dependency-policy:
    name: cargo-deny dependency policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0

      - name: Install cargo-deny
        uses: taiki-e/install-action@c0977eb8b4952c1e8e932703147dba6f76856a53 # cargo-deny

      - name: Install cargo-about
        uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2
        with:
          tool: cargo-about@0.9.1

      - name: Verify dependency advisories, bans, licenses, and sources
        run: cargo deny check advisories bans licenses sources

      - name: Verify governed RustSec exceptions
        run: python3 scripts/verify_rustsec_exceptions.py

      - name: Verify artifact dependency boundaries
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" || "${{ inputs.representative_targets }}" == "true" ]]; then
            python3 scripts/verify_artifact_dependency_closures.py \
              --representative-targets
          else
            python3 scripts/verify_artifact_dependency_closures.py
          fi

      - name: Verify checked-in Rust dependency notices
        run: python3 scripts/generate-rust-license-report.py --check
