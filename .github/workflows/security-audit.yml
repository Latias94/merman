name: Security Audit

on:
  push:
    branches:
      - main
      - master
    paths:
      - Cargo.lock
      - Cargo.toml
      - about.toml
      - deny.toml
      - "LICENSE-*"
      - THIRD_PARTY_NOTICES.md
      - "THIRD_PARTY_LICENSES/**"
      - "crates/**/Cargo.toml"
      - fuzz/Cargo.lock
      - fuzz/Cargo.toml
      - ".github/workflows/security-audit.yml"
  pull_request:
    paths:
      - Cargo.lock
      - Cargo.toml
      - about.toml
      - deny.toml
      - "LICENSE-*"
      - THIRD_PARTY_NOTICES.md
      - "THIRD_PARTY_LICENSES/**"
      - "crates/**/Cargo.toml"
      - fuzz/Cargo.lock
      - fuzz/Cargo.toml
      - ".github/workflows/security-audit.yml"
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-audit:
    name: cargo-audit (${{ matrix.lockfile }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        lockfile:
          - Cargo.lock
          - fuzz/Cargo.lock
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Audit Rust dependencies
        run: cargo audit --file "${{ matrix.lockfile }}"

  cargo-dependency-policy:
    name: cargo-deny dependency policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.1

      - name: Verify dependency advisories, bans, licenses, and sources
        run: cargo deny check advisories bans licenses sources

      - name: Verify checked-in Rust dependency notices
        run: python3 scripts/generate-rust-license-report.py --check
