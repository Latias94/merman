name: Bootstrap Three New Crates (manual only)

# Dispatch once per frozen source; recover by rerunning this run, never a new dispatch.
# Configure each new crate's release-crates.yml Trusted Publisher after acceptance.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Reviewed immutable main commit (40 lowercase hex characters)"
        required: true
        type: string
      version:
        description: "First-publication version: 0.10.0-alpha.1 only"
        required: true
        type: string
      preflight_run_id:
        description: "Successful scope=release preflight whose workflow head equals the product source"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: crates-bootstrap-${{ inputs.source_sha }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: "2"
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONPATH: ${{ github.workspace }}
  SOURCE_ROOT: release-source

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    environment: crates.io
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      VERSION: ${{ inputs.version }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}
    steps:
      - name: Validate immutable dispatch identity
        shell: python
        env:
          PREFLIGHT_RUN_ID: ${{ inputs.preflight_run_id }}
        run: |
          import os, re
          source = os.environ["SOURCE_SHA"]
          if not re.fullmatch(r"[0-9a-f]{40}", source):
              raise SystemExit("source_sha must be an immutable lowercase 40-hex SHA")
          if os.environ["VERSION"] != "0.10.0-alpha.1":
              raise SystemExit("bootstrap is restricted to 0.10.0-alpha.1")
          if not re.fullmatch(r"[1-9][0-9]*", os.environ["PREFLIGHT_RUN_ID"]):
              raise SystemExit("preflight_run_id must be positive")

      - name: Check out reviewed bootstrap tooling
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Check out immutable product source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          path: release-source
          fetch-depth: 0
          persist-credentials: false

      - name: Restore original bytes on reruns
        if: ${{ github.run_attempt > 1 }}
        uses: actions/download-artifact@v8.0.2
        with:
          name: crates-bootstrap-${{ github.run_id }}-attempt-1
          path: release-source/target

      - name: Require complete immutable release preflight
        id: preflight
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          PREFLIGHT_RUN_ID: ${{ inputs.preflight_run_id }}
        run: |
          import json, os, subprocess, tomllib
          from dataclasses import asdict
          from pathlib import Path
          from scripts.crates_io_release import assert_release_source
          from scripts.release_preflight_evidence import ReleaseIdentity, GitHubApi, find_evidence
          root = Path(os.environ["SOURCE_ROOT"]).resolve()
          source, version = os.environ["SOURCE_SHA"], os.environ["VERSION"]
          subprocess.run(["git", "fetch", "--no-tags", "origin", "+refs/heads/main:refs/remotes/origin/main"], cwd=root, check=True)
          subprocess.run(["git", "merge-base", "--is-ancestor", source, "refs/remotes/origin/main"], cwd=root, check=True)
          tree = subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], cwd=root, text=True).strip()
          assert_release_source(root, source, tree)
          if tomllib.loads((root / "Cargo.toml").read_text())["workspace"]["package"]["version"] != version:
              raise SystemExit("workspace version does not match bootstrap version")
          identity = ReleaseIdentity(os.environ["GITHUB_REPOSITORY"], int(os.environ["GITHUB_REPOSITORY_ID"]),
                                     source, source, tree, version)
          evidence = find_evidence(identity, GitHubApi(identity.repository, os.environ["GH_TOKEN"]))
          if evidence is None or evidence["run_id"] != int(os.environ["PREFLIGHT_RUN_ID"]):
              raise SystemExit("the specified complete scope=release preflight receipt is required")
          receipts = root / "target/bootstrap-receipts"
          receipts.mkdir(parents=True, exist_ok=True)
          (receipts / "preflight.json").write_text(json.dumps({**asdict(identity), **evidence, "tooling_sha": os.environ["WORKFLOW_SHA"]}, indent=2) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"source_tree={tree}\n")

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Prepare and bootstrap only the three new crates
        shell: python
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          SOURCE_TREE: ${{ steps.preflight.outputs.source_tree }}
        run: |
          import os
          token = os.environ.pop("CARGO_REGISTRY_TOKEN", "")
          os.environ.pop("CARGO_REGISTRIES_CRATES_IO_TOKEN", None)
          import json
          from dataclasses import asdict
          from pathlib import Path
          from shutil import copyfile
          from scripts.crates_io_release import (
              CRATES_IO_API, CRATES_IO_INDEX, PreparedCrate, _prepare_crate,
              _assert_artifact_unchanged, assert_release_source, fetch_crates_io_checksum,
              reconcile_registry_barrier, sha256_file,
          )
          from tools.publish import cargo_metadata, crates_io_publish_plan, run_command
          root = Path(os.environ["SOURCE_ROOT"]).resolve()
          source, tree, version = (os.environ[key] for key in ("SOURCE_SHA", "SOURCE_TREE", "VERSION"))
          attempt = int(os.environ["GITHUB_RUN_ATTEMPT"])
          assert_release_source(root, source, tree)
          metadata = cargo_metadata(root)
          plan = crates_io_publish_plan(metadata)
          names = {"merman-model", "merman-theme-contract", "merman-markup"}
          order = [name for name in plan.order if name in names]
          if set(order) != names or any(plan.packages[name].version != version or
                  not set(plan.packages[name].internal_deps) <= names for name in order):
              raise RuntimeError("bootstrap requires exactly the three coupled crates and their internal dependency closure")
          target = Path(metadata["target_directory"]).resolve()
          if target != root / "target":
              raise RuntimeError("bootstrap artifacts must remain in the retained product target directory")
          receipts = root / "target/bootstrap-receipts"
          for name in order:
              package = plan.packages[name]
              prepared_path = receipts / f"{name}.prepared.json"
              original_path = target / "bootstrap-crates" / f"{name}-{version}.crate"
              identity = dict(source_sha=source, source_tree=tree, version=version, package=name,
                              run_id=os.environ["GITHUB_RUN_ID"], prepared_attempt=1,
                              tooling_sha=os.environ["WORKFLOW_SHA"],
                              manifest_sha256=sha256_file(package.manifest_path))
              if attempt > 1:
                  if not prepared_path.is_file():
                      raise RuntimeError(f"{name}: no original prepared bytes; manual review required, never upload on rerun")
                  prepared = json.loads(prepared_path.read_text())
                  if any(prepared.get(key) != value for key, value in identity.items()):
                      raise RuntimeError(f"{name}: original prepared identity mismatch; manual review required")
                  item = PreparedCrate(package, original_path,
                                       prepared["artifact_sha256"], prepared["artifact_size"], identity["manifest_sha256"])
              else:
                  item = _prepare_crate(root, target, package)
                  original_path.parent.mkdir(parents=True, exist_ok=True)
                  copyfile(item.artifact_path, original_path)
                  prepared = dict(identity, artifact_sha256=item.artifact_sha256, artifact_size=item.artifact_size)
                  prepared_path.write_text(json.dumps(prepared, indent=2) + "\n")
              original = PreparedCrate(package, original_path, prepared["artifact_sha256"],
                                       prepared["artifact_size"], identity["manifest_sha256"])
              record = dict(prepared, run_attempt=attempt, states=[])
              def save(state, **details):
                  record.update(details)
                  record["states"].append(state)
                  path = receipts / f"{name}.attempt-{attempt}.json"
                  temporary = path.with_suffix(".tmp")
                  temporary.write_text(json.dumps(record, indent=2) + "\n")
                  temporary.replace(path)
              try:
                  assert_release_source(root, source, tree)
                  _assert_artifact_unchanged(item)
                  _assert_artifact_unchanged(original)
                  save("packaged" if attempt == 1 else "observe-only")
                  checksum = fetch_crates_io_checksum(name, version)
                  if checksum is not None and checksum != item.artifact_sha256:
                      save("mismatch", registry_checksum=checksum)
                      raise RuntimeError(f"{name}: registry checksum conflicts with original bytes")
                  if checksum is None and attempt == 1:
                      dry_run = run_command(["cargo", "publish", "-p", name, "--locked", "--dry-run", "--registry", "crates-io"], cwd=root)
                      assert_release_source(root, source, tree)
                      _assert_artifact_unchanged(item)
                      _assert_artifact_unchanged(original)
                      if dry_run.returncode:
                          raise RuntimeError(f"{name}: credential-free locked dry-run failed")
                      save("prepared")
                      if not token:
                          raise RuntimeError("CARGO_REGISTRY_TOKEN is unavailable at the upload boundary")
                      save("upload-intent")
                      result = run_command(["cargo", "publish", "-p", name, "--locked", "--no-verify", "--registry", "crates-io"],
                                           cwd=root, env=dict(os.environ, CARGO_REGISTRY_TOKEN=token))
                      save("upload-returned", returncode=result.returncode)
                  assert_release_source(root, source, tree)
                  _assert_artifact_unchanged(item)
                  _assert_artifact_unchanged(original)
                  barrier = reconcile_registry_barrier([item], registry_api=CRATES_IO_API, registry_index=CRATES_IO_INDEX,
                                                       attempts=12, delay_seconds=15)
                  save(barrier.state, registry=asdict(barrier))
                  if barrier.state != "complete":
                      raise RuntimeError(f"{name}: {barrier.state}; retain original bytes and seek manual review; never resend")
              except Exception as error:
                  save("failed", error=str(error))
                  raise

      - name: Retain original crates and receipts for this attempt
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: crates-bootstrap-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            release-source/target/bootstrap-receipts/
            release-source/target/bootstrap-crates/merman-model-0.10.0-alpha.1.crate
            release-source/target/bootstrap-crates/merman-theme-contract-0.10.0-alpha.1.crate
            release-source/target/bootstrap-crates/merman-markup-0.10.0-alpha.1.crate
