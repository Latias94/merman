# This file is derived from dist: https://axodotdev.github.io/cargo-dist
# Merman maintains the permission split and shell-safety hardening in this file. The matching
# allow-dirty = ["ci"] setting prevents cargo-dist 0.32.0 from replacing those security controls.
#
# Copyright 2022-2024, axodotdev
# SPDX-License-Identifier: MIT or Apache-2.0
#
# CI that:
#
# * checks for a Git Tag that looks like a release
# * builds artifacts with dist (archives, installers, hashes)
# * uploads those artifacts to temporary workflow zip
# * on success, uploads the artifacts to a GitHub Release
#
# Note that the GitHub Release will be created with a generated
# title/body based on your changelogs.

name: Release
permissions:
  "contents": "read"

# This task will run whenever you push a git tag that looks like a version
# like "1.0.0", "v0.1.0-prerelease.1", "my-app/0.1.0", "releases/v1.0.0", etc.
# Various formats will be parsed into a VERSION and an optional PACKAGE_NAME, where
# PACKAGE_NAME must be the name of a Cargo package in your workspace, and VERSION
# must be a Cargo-style SemVer Version (must have at least major.minor.patch).
#
# If PACKAGE_NAME is specified, then the announcement will be for that
# package (erroring out if it doesn't have the given version or isn't dist-able).
#
# If PACKAGE_NAME isn't specified, then the announcement will be for all
# (dist-able) packages in the workspace with that version (this mode is
# intended for workspaces with only one dist-able package, or with all dist-able
# packages versioned/released in lockstep).
#
# If you push multiple tags at once, separate instances of this workflow will
# spin up, creating an independent announcement for each one. However, GitHub
# will hard limit this to 3 tags per commit, as it will assume more tags is a
# mistake.
#
# If there's a prerelease-style suffix to the version, then the release(s)
# will be marked as a prerelease.
on:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

jobs:
  # Run 'dist plan' (or host) to determine what tasks we need to do
  plan:
    runs-on: "ubuntu-24.04"
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ steps.release.outputs.tag }}
      publishing: ${{ true }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Validate release tag
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          canonical_version="$(python3 scripts/release-version.py canonical --version "$RELEASE_TAG")"
          if [[ "$RELEASE_TAG" != "v$canonical_version" ]]; then
            echo "::error::Release tag must be v$canonical_version." >&2
            exit 1
          fi
          python3 scripts/release-version.py check --version "$RELEASE_TAG"
          printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Install dist
        # we specify bash to get pipefail; it guards against the `curl` command
        # failing. otherwise `sh` won't catch that `curl` returned non-0
        shell: bash
        run: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh"
      - name: Cache dist
        uses: actions/upload-artifact@v7
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist
      - id: plan
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          dist host --steps=create "--tag=$RELEASE_TAG" --output-format=json > plan-dist-manifest.json
          echo "dist ran successfully"
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  # Build and packages all the platform-specific things
  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    # Let the initial task tell us to not run (currently very blunt)
    needs:
      - plan
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null && (needs.plan.outputs.publishing == 'true' || fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload') }}
    strategy:
      fail-fast: false
      # Target platforms/runners are computed by dist in create-release.
      # Each member of the matrix has the following arguments:
      #
      # - runner: the github runner
      # - dist-args: cli flags to pass to dist
      # - install-dist: expression to run to install dist on the runner
      #
      # Typically there will be:
      # - 1 "global" task that builds universal installers
      # - N "local" tasks that build each platform's binaries and platform-specific installers
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && matrix.container.image || null }}
    env:
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - name: enable windows longpaths
        run: |
          git config --global core.longpaths true
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Rust non-interactively if not already installed
        if: ${{ matrix.container }}
        run: |
          if ! command -v cargo > /dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - name: Install dist
        run: ${{ matrix.install_dist.run }}
      # Get the dist-manifest
      - name: Fetch local artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Install dependencies
        run: |
          ${{ matrix.packages_install }}
      - name: Build artifacts
        shell: bash
        run: |
          # Actually do builds and make zips and whatnot
          dist build "--tag=$RELEASE_TAG" --print=linkage --output-format=json ${{ matrix.dist_args }} > dist-manifest.json
          echo "dist ran successfully"
      - id: cargo-dist
        name: Post-build
        # We force bash here just because github makes it really hard to get values up
        # to "real" actions without writing to env-vars, and writing to env-vars has
        # inconsistent syntax between shell and powershell.
        shell: bash
        run: |
          # Parse out what we just built and upload it to scratch storage
          {
            echo "paths<<EOF"
            dist print-upload-files-from-manifest --manifest dist-manifest.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # Build and package all the platform-agnostic(ish) things
  build-global-artifacts:
    needs:
      - plan
      - build-local-artifacts
    runs-on: "ubuntu-24.04"
    env:
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@v8
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Get all the local artifacts for the global tasks to use (for e.g. checksums)
      - name: Fetch local artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: cargo-dist
        shell: bash
        run: |
          dist build "--tag=$RELEASE_TAG" --output-format=json "--artifacts=global" > dist-manifest.json
          echo "dist ran successfully"

          # Parse out what we just built and upload it to scratch storage
          {
            echo "paths<<EOF"
            jq --raw-output ".upload_files[]" dist-manifest.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # Verify every CLI archive before anything with release authority can consume it.
  verify-cli-archives:
    needs:
      - plan
      - build-local-artifacts
      - build-global-artifacts
    runs-on: "ubuntu-24.04"
    permissions:
      contents: read
    env:
      RAW_ARTIFACT_DIR: artifacts
      RELEASE_ASSET_DIR: ${{ runner.temp }}/verified-release-assets
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
      VERIFIED_CLI_DIR: ${{ runner.temp }}/verified-cli
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
      - name: Download cargo-dist artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - name: Verify CLI release archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$VERIFIED_CLI_DIR" "$RELEASE_ASSET_DIR"

          release_version="$(
            python3 scripts/release-version.py canonical --version "$RELEASE_TAG"
          )"
          host_target="$(rustc -vV | sed -n 's/^host: //p')"
          if [[ -z "$host_target" ]]; then
            echo "::error::Could not determine the Rust host target." >&2
            exit 1
          fi

          mapfile -d '' cli_archives < <(
            find "$RAW_ARTIFACT_DIR" -maxdepth 1 -type f \
              \( -name 'merman-cli-*.tar.xz' -o -name 'merman-cli-*.zip' \) \
              -print0
          )
          if (( ${#cli_archives[@]} == 0 )); then
            echo "::error::No merman-cli release archives were produced." >&2
            exit 1
          fi

          for archive in "${cli_archives[@]}"; do
            archive_name="${archive##*/}"
            case "$archive_name" in
              merman-cli-*.tar.xz)
                target="${archive_name#merman-cli-}"
                target="${target%.tar.xz}"
                ;;
              merman-cli-*.zip)
                target="${archive_name#merman-cli-}"
                target="${target%.zip}"
                ;;
              *)
                echo "::error::Unexpected CLI archive name: $archive_name" >&2
                exit 1
                ;;
            esac

            execute_args=()
            if [[ "$target" == "$host_target" ]]; then
              execute_args+=(--execute)
            fi
            python3 scripts/verify_cli_release_archive.py \
              "$archive" \
              --checksum "$archive.sha256" \
              --target "$target" \
              --version "$release_version" \
              --repo-root "$GITHUB_WORKSPACE" \
              --verified-output "$VERIFIED_CLI_DIR/$archive_name" \
              "${execute_args[@]}"
          done

          while IFS= read -r -d '' asset; do
            asset_name="${asset##*/}"
            case "$asset_name" in
              *-dist-manifest.json|merman-cli-*.tar.xz|merman-cli-*.zip)
                continue
                ;;
            esac
            cp -- "$asset" "$RELEASE_ASSET_DIR/$asset_name"
          done < <(find "$RAW_ARTIFACT_DIR" -maxdepth 1 -type f -print0)
          cp -- "$VERIFIED_CLI_DIR"/* "$RELEASE_ASSET_DIR/"
      - name: Upload verified release assets
        uses: actions/upload-artifact@v7
        with:
          name: verified-release-assets
          path: ${{ env.RELEASE_ASSET_DIR }}
          if-no-files-found: error

  # Determines if we should publish/announce
  host:
    needs:
      - plan
      - build-local-artifacts
      - build-global-artifacts
      - verify-cli-archives
    # Only verified snapshots may cross into the job with release authority.
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.publishing == 'true' && needs.verify-cli-archives.result == 'success' && (needs.build-global-artifacts.result == 'skipped' || needs.build-global-artifacts.result == 'success') && (needs.build-local-artifacts.result == 'skipped' || needs.build-local-artifacts.result == 'success') }}
    environment: github-release
    permissions:
      contents: write
    runs-on: "ubuntu-24.04"
    steps:
      # Create a GitHub Release while uploading all files to it
      - name: "Download GitHub Artifacts"
        uses: actions/download-artifact@v8
        with:
          name: verified-release-assets
          path: artifacts
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          IS_PRERELEASE: ${{ fromJson(needs.plan.outputs.val).announcement_is_prerelease }}
          ANNOUNCEMENT_TITLE: ${{ fromJson(needs.plan.outputs.val).announcement_title }}
          ANNOUNCEMENT_BODY: ${{ fromJson(needs.plan.outputs.val).announcement_github_body }}
          RELEASE_COMMIT: "${{ github.sha }}"
        shell: bash
        run: |
          set -euo pipefail
          notes_file="$RUNNER_TEMP/notes.txt"
          printf '%s\n' "$ANNOUNCEMENT_BODY" > "$notes_file"

          mapfile -d '' assets < <(
            find artifacts -maxdepth 1 -type f ! -name '*-dist-manifest.json' -print0
          )
          if (( ${#assets[@]} == 0 )); then
            echo "::error::No release assets were produced." >&2
            exit 1
          fi

          release_args=(
            --verify-tag
            --target "$RELEASE_COMMIT"
            --title "$ANNOUNCEMENT_TITLE"
            --notes-file "$notes_file"
          )
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            release_args+=(--prerelease)
          fi
          release_args+=(-- "$RELEASE_TAG" "${assets[@]}")
          gh release create "${release_args[@]}"
