# This file is derived from dist: https://axodotdev.github.io/cargo-dist
# Merman maintains the permission split and shell-safety hardening in this file. The matching
# allow-dirty = ["ci"] setting prevents cargo-dist 0.32.0 from replacing those security controls.
#
# Copyright 2022-2024, axodotdev
# SPDX-License-Identifier: MIT or Apache-2.0
#
# CI that:
#
# * checks for a Git Tag that looks like a release
# * builds artifacts with dist (archives, installers, hashes)
# * uploads those artifacts to temporary workflow zip
# * on success, uploads the artifacts to a GitHub Release
#
# Note that the GitHub Release will be created with a generated
# title/body based on your changelogs.

name: Release
permissions:
  "contents": "read"

# This task will run whenever you push a git tag that looks like a version
# like "1.0.0", "v0.1.0-prerelease.1", "my-app/0.1.0", "releases/v1.0.0", etc.
# Various formats will be parsed into a VERSION and an optional PACKAGE_NAME, where
# PACKAGE_NAME must be the name of a Cargo package in your workspace, and VERSION
# must be a Cargo-style SemVer Version (must have at least major.minor.patch).
#
# If PACKAGE_NAME is specified, then the announcement will be for that
# package (erroring out if it doesn't have the given version or isn't dist-able).
#
# If PACKAGE_NAME isn't specified, then the announcement will be for all
# (dist-able) packages in the workspace with that version (this mode is
# intended for workspaces with only one dist-able package, or with all dist-able
# packages versioned/released in lockstep).
#
# If you push multiple tags at once, separate instances of this workflow will
# spin up, creating an independent announcement for each one. However, GitHub
# will hard limit this to 3 tags per commit, as it will assume more tags is a
# mistake.
#
# If there's a prerelease-style suffix to the version, then the release(s)
# will be marked as a prerelease.
on:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

jobs:
  # Run 'dist plan' (or host) to determine what tasks we need to do
  plan:
    runs-on: "ubuntu-24.04"
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      publishing: ${{ true }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          submodules: recursive
      - name: Validate release tag
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          canonical_version="$(python3 scripts/release-version.py canonical --version "$RELEASE_TAG")"
          if [[ "$RELEASE_TAG" != "v$canonical_version" ]]; then
            echo "::error::Release tag must be v$canonical_version." >&2
            exit 1
          fi
          python3 scripts/release-version.py check --version "$RELEASE_TAG"
          source_sha="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          if [[ "$source_sha" != "$(git rev-parse HEAD)" ]]; then
            echo "::error::Release tag does not resolve to the checked-out commit." >&2
            exit 1
          fi
          {
            printf 'tag=%s\n' "$RELEASE_TAG"
            printf 'version=%s\n' "$canonical_version"
            printf 'source_sha=%s\n' "$source_sha"
          } >> "$GITHUB_OUTPUT"
      - name: Install dist
        shell: bash
        env:
          DIST_INSTALLER_SHA256: b657cf8c04a8b7bc28f39d220f7e6dd11bbd2bdb072c552262bd9ccf597261b5
        run: |
          set -euo pipefail
          installer="$RUNNER_TEMP/cargo-dist-installer.sh"
          curl --proto '=https' --tlsv1.2 -LsSf \
            -o "$installer" \
            https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh
          printf '%s  %s\n' "$DIST_INSTALLER_SHA256" "$installer" | sha256sum --check
          sh "$installer"
      - id: plan
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          dist host --steps=create "--tag=$RELEASE_TAG" --output-format=json > plan-dist-manifest.json
          echo "dist ran successfully"
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
          echo "prerelease=$(jq -r '.announcement_is_prerelease' plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  # Build and packages all the platform-specific things
  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    # Let the initial task tell us to not run (currently very blunt)
    needs:
      - plan
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null && (needs.plan.outputs.publishing == 'true' || fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload') }}
    strategy:
      fail-fast: false
      # Target platforms/runners are computed by dist in create-release.
      # Each member of the matrix has the following arguments:
      #
      # - runner: the github runner
      # - dist-args: cli flags to pass to dist
      # - install-dist: expression to run to install dist on the runner
      #
      # Typically there will be:
      # - 1 "global" task that builds universal installers
      # - N "local" tasks that build each platform's binaries and platform-specific installers
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && matrix.container.image || null }}
    env:
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - name: enable windows longpaths
        run: |
          git config --global core.longpaths true
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Rust non-interactively if not already installed
        if: ${{ matrix.container }}
        run: |
          if ! command -v cargo > /dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - name: Install pinned dist on Unix
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        env:
          DIST_INSTALLER_SHA256: b657cf8c04a8b7bc28f39d220f7e6dd11bbd2bdb072c552262bd9ccf597261b5
        run: |
          set -euo pipefail
          installer="$RUNNER_TEMP/cargo-dist-installer.sh"
          curl --proto '=https' --tlsv1.2 -LsSf \
            -o "$installer" \
            https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh
          observed="$(shasum -a 256 "$installer" | awk '{print $1}')"
          if [[ "$observed" != "$DIST_INSTALLER_SHA256" ]]; then
            echo "::error::cargo-dist installer checksum mismatch." >&2
            exit 1
          fi
          sh "$installer"
      - name: Install pinned dist on Windows
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        env:
          DIST_INSTALLER_SHA256: a3435e9944f1a1297add11c6a8ac1f543c14a5ea88879ee05b24ff8218d46d87
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path $env:RUNNER_TEMP "cargo-dist-installer.ps1"
          Invoke-WebRequest `
            -Uri "https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.ps1" `
            -OutFile $installer
          $observed = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          if ($observed -ne $env:DIST_INSTALLER_SHA256) {
            throw "cargo-dist installer checksum mismatch"
          }
          & $installer
      - name: Fetch the cargo-dist plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: artifacts-plan-dist-manifest
          path: target/distrib/
      - name: Install dependencies
        run: |
          ${{ matrix.packages_install }}
      - name: Build artifacts
        shell: bash
        run: |
          # Actually do builds and make zips and whatnot
          dist build "--tag=$RELEASE_TAG" --print=linkage --output-format=json ${{ matrix.dist_args }} > dist-manifest.json
          echo "dist ran successfully"
      - id: cargo-dist
        name: Post-build
        # We force bash here just because github makes it really hard to get values up
        # to "real" actions without writing to env-vars, and writing to env-vars has
        # inconsistent syntax between shell and powershell.
        shell: bash
        run: |
          # Parse out what we just built and upload it to scratch storage
          {
            echo "paths<<EOF"
            dist print-upload-files-from-manifest --manifest dist-manifest.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # Verify local archives before generating any executable installer from them.
  verify-release-archives:
    needs:
      - plan
      - build-local-artifacts
    runs-on: "ubuntu-24.04"
    permissions:
      contents: read
    env:
      GENERATED_ASSET_DIR: ${{ github.workspace }}/target/distrib
      LOCAL_ARTIFACT_DIR: ${{ github.workspace }}/local-artifacts
      RELEASE_ASSET_DIR: ${{ github.workspace }}/release-verification/assets
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
      SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
      VERIFIED_ARCHIVE_DIR: ${{ github.workspace }}/release-verification/archives
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          submodules: recursive
      - name: Download isolated local cargo-dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: artifacts-build-local-*
          path: ${{ env.LOCAL_ARTIFACT_DIR }}
      - name: Download the trusted cargo-dist plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: artifacts-plan-dist-manifest
          path: plan-artifact
      - name: Verify CLI and LSP archive structure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$VERIFIED_ARCHIVE_DIR"
          for specification in \
            'merman-cli:cli-release:scripts/verify_cli_release_archive.py' \
            'merman-lsp:lsp-stdio-release:scripts/verify_lsp_release_archive.py'; do
            IFS=: read -r package profile verifier <<<"$specification"
            IFS=, read -r -a targets <<<"$(
              python3 scripts/artifact_profile_recipe.py "$profile" --field triples
            )"
            if (( ${#targets[@]} == 0 )); then
              echo "::error::$profile declares no release targets." >&2
              exit 1
            fi
            for target in "${targets[@]}"; do
              extension=tar.xz
              if [[ "$target" == *-windows-* ]]; then
                extension=zip
              fi
              archive_name="$package-$target.$extension"
              producer="$LOCAL_ARTIFACT_DIR/artifacts-build-local-$target"
              python3 "$verifier" \
                "$producer/$archive_name" \
                --checksum "$producer/$archive_name.sha256" \
                --target "$target" \
                --version "$RELEASE_VERSION" \
                --repo-root "$GITHUB_WORKSPACE" \
                --verified-output "$VERIFIED_ARCHIVE_DIR/$archive_name"
            done
          done
      - name: Prepare trusted global-generation inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release_artifact_bundle.py prepare-global \
            "$LOCAL_ARTIFACT_DIR" \
            "$VERIFIED_ARCHIVE_DIR" \
            plan-artifact/plan-dist-manifest.json \
            docs/release/SURFACES.json \
            "$GENERATED_ASSET_DIR" \
            --tag "$RELEASE_TAG" \
            --version "$RELEASE_VERSION"
      - name: Install independently pinned dist
        shell: bash
        env:
          DIST_INSTALLER_SHA256: b657cf8c04a8b7bc28f39d220f7e6dd11bbd2bdb072c552262bd9ccf597261b5
        run: |
          set -euo pipefail
          installer="$RUNNER_TEMP/cargo-dist-installer.sh"
          curl --proto '=https' --tlsv1.2 -LsSf \
            -o "$installer" \
            https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh
          printf '%s  %s\n' "$DIST_INSTALLER_SHA256" "$installer" | sha256sum --check
          sh "$installer"
      - name: Generate final installers and checksum index
        shell: bash
        run: |
          set -euo pipefail
          dist build \
            "--tag=$RELEASE_TAG" \
            --artifacts=global \
            --output-format=json > generated-global-dist-manifest.json
          mv generated-global-dist-manifest.json "$GENERATED_ASSET_DIR/dist-manifest.json"
          sh -n "$GENERATED_ASSET_DIR/merman-cli-installer.sh"
          sh -n "$GENERATED_ASSET_DIR/merman-lsp-installer.sh"
      - name: Assemble the verified bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release_artifact_bundle.py assemble \
            "$GENERATED_ASSET_DIR" \
            "$VERIFIED_ARCHIVE_DIR" \
            "$RELEASE_ASSET_DIR" \
            docs/release/SURFACES.json \
            --version "$RELEASE_VERSION" \
            --source-sha "$SOURCE_SHA"
          chmod -R a-w "$RELEASE_ASSET_DIR"
      - name: Upload verified release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verified-release-assets
          path: ${{ env.RELEASE_ASSET_DIR }}
          if-no-files-found: error

  verify-release-archives-native:
    needs:
      - plan
      - verify-release-archives
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.plan.outputs.version }}
      SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          submodules: recursive
      - name: Download verified release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: verified-release-assets
          path: verified-release-assets
      - name: Parse generated PowerShell installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('merman-cli-installer.ps1', 'merman-lsp-installer.ps1')) {
            $path = Join-Path 'verified-release-assets' $name
            [scriptblock]::Create([IO.File]::ReadAllText($path)) | Out-Null
          }
      - name: Execute final CLI and LSP archives
        shell: bash
        run: |
          set -euo pipefail
          extension=tar.xz
          if [[ "$TARGET" == *-windows-* ]]; then
            extension=zip
          fi
          for specification in \
            'merman-cli:scripts/verify_cli_release_archive.py' \
            'merman-lsp:scripts/verify_lsp_release_archive.py'; do
            IFS=: read -r package verifier <<<"$specification"
            archive="$package-$TARGET.$extension"
            python3 "$verifier" \
              "verified-release-assets/$archive" \
              --checksum "verified-release-assets/$archive.sha256" \
              --target "$TARGET" \
              --version "$RELEASE_VERSION" \
              --repo-root "$GITHUB_WORKSPACE" \
              --execute
          done
      - name: Record native verification receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/release_artifact_bundle.py" write-receipt \
            verified-release-assets \
            --target "$TARGET" \
            --source-sha "$SOURCE_SHA" \
            --output "native-release-verification-$TARGET.json"
      - name: Upload native verification receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-release-verification-${{ matrix.target }}
          path: native-release-verification-${{ matrix.target }}.json
          if-no-files-found: error

  release-verification-gate:
    needs:
      - plan
      - verify-release-archives
      - verify-release-archives-native
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Require central and native verification success
        env:
          CENTRAL_RESULT: ${{ needs.verify-release-archives.result }}
          NATIVE_RESULT: ${{ needs.verify-release-archives-native.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CENTRAL_RESULT" != success || "$NATIVE_RESULT" != success ]]; then
            echo "::error::Release verification failed: central=$CENTRAL_RESULT native=$NATIVE_RESULT" >&2
            exit 1
          fi
      - name: Checkout verified release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.source_sha }}
      - name: Download verified release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: verified-release-assets
          path: verified-release-assets
      - name: Download native verification receipts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: native-release-verification-*
          path: native-receipts
          merge-multiple: true
      - name: Verify native receipt closure
        env:
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/release_artifact_bundle.py" verify-receipts \
            verified-release-assets \
            native-receipts \
            --source-sha "$SOURCE_SHA"

  generate-cli-registry-candidates:
    needs:
      - plan
      - release-verification-gate
    if: ${{ always() && needs.plan.result == 'success' && needs.release-verification-gate.result == 'success' }}
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - name: Record prerelease candidate policy
        if: ${{ needs.plan.outputs.prerelease == 'true' }}
        shell: bash
        run: echo "Registry candidates are intentionally omitted for prereleases."
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        if: ${{ needs.plan.outputs.prerelease != 'true' }}
        with:
          persist-credentials: false
          submodules: recursive
      - name: Download verified release bundle
        if: ${{ needs.plan.outputs.prerelease != 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: verified-release-assets
          path: verified-release-assets
      - name: Generate and validate stable registry candidates
        if: ${{ needs.plan.outputs.prerelease != 'true' }}
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $output = Join-Path $env:RUNNER_TEMP "registry-candidates"
          python3 scripts/generate_cli_registry_candidates.py `
            verified-release-assets `
            --version $env:RELEASE_VERSION `
            --output-dir $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python3 -m json.tool (Join-Path $output "scoop/merman-cli.json") > $null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $winget = Get-Command winget.exe -ErrorAction SilentlyContinue
          if ($null -eq $winget) {
            Add-AppxPackage `
              -RegisterByFamilyName `
              -MainPackage Microsoft.DesktopAppInstaller_8wekyb3d8bbwe
            $winget = Get-Command winget.exe -ErrorAction Stop
          }
          & $winget.Source validate `
            --manifest (Join-Path $output "winget") `
            --disable-interactivity
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload stable registry candidates
        if: ${{ needs.plan.outputs.prerelease != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cli-registry-candidates-${{ needs.plan.outputs.version }}
          path: ${{ runner.temp }}/registry-candidates
          if-no-files-found: error

  attest-release-assets:
    needs:
      - plan
      - release-verification-gate
    if: ${{ always() && needs.plan.result == 'success' && needs.release-verification-gate.result == 'success' }}
    runs-on: ubuntu-24.04
    environment: github-release
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download verified release bundle
        # actions/download-artifact v8
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: verified-release-assets
          path: verified-release-assets
      - name: Verify release tag still resolves to the source commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null
          observed="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)"
          if [[ "$observed" != "$SOURCE_SHA" ]]; then
            echo "::error::Release tag moved after artifact verification." >&2
            exit 1
          fi
      - name: Attest verified release assets
        # actions/attest v4
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6
        with:
          subject-path: verified-release-assets/*

  # Publish only the exact bundle that passed central, native, candidate, and attestation gates.
  host:
    needs:
      - plan
      - release-verification-gate
      - generate-cli-registry-candidates
      - attest-release-assets
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.publishing == 'true' && needs.release-verification-gate.result == 'success' && needs.generate-cli-registry-candidates.result == 'success' && needs.attest-release-assets.result == 'success' }}
    environment: github-release
    permissions:
      contents: write
    runs-on: "ubuntu-24.04"
    steps:
      # Create a GitHub Release while uploading all files to it
      - name: "Download GitHub Artifacts"
        # actions/download-artifact v8
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: verified-release-assets
          path: artifacts
      - name: Verify release tag still resolves to the source commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null
          observed="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)"
          if [[ "$observed" != "$SOURCE_SHA" ]]; then
            echo "::error::Release tag moved after artifact verification." >&2
            exit 1
          fi
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          IS_PRERELEASE: ${{ fromJson(needs.plan.outputs.val).announcement_is_prerelease }}
          ANNOUNCEMENT_TITLE: ${{ fromJson(needs.plan.outputs.val).announcement_title }}
          ANNOUNCEMENT_BODY: ${{ fromJson(needs.plan.outputs.val).announcement_github_body }}
        shell: bash
        run: |
          set -euo pipefail
          notes_file="$RUNNER_TEMP/notes.txt"
          printf '%s\n' "$ANNOUNCEMENT_BODY" > "$notes_file"

          mapfile -d '' assets < <(
            find artifacts -maxdepth 1 -type f -print0
          )
          if (( ${#assets[@]} == 0 )); then
            echo "::error::No release assets were produced." >&2
            exit 1
          fi

          release_args=(
            --verify-tag
            --title "$ANNOUNCEMENT_TITLE"
            --notes-file "$notes_file"
          )
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            release_args+=(--prerelease)
          fi
          release_args+=(-- "$RELEASE_TAG" "${assets[@]}")
          gh release create "${release_args[@]}"
