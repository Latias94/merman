name: Release Tree-sitter Mermaid

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tree-sitter Mermaid tag, for example tree-sitter-mermaid-v0.1.0"
        required: true
        type: string
      source_ref:
        description: "Reviewed full commit SHA, matching release tag, or main for build-only"
        required: true
        default: "main"
        type: string
      publish:
        description: "Publish the verified crate and npm package"
        required: true
        default: false
        type: boolean
      publish_github_release:
        description: "Publish the verified assets as a GitHub Release"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate-inputs:
    runs-on: ubuntu-24.04
    outputs:
      npm_dist_tag: ${{ steps.release.outputs.npm_dist_tag }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      source_tree: ${{ steps.source.outputs.source_tree }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Validate release inputs
        id: release
        shell: bash
        env:
          DISPATCH_PUBLISH: ${{ inputs.publish }}
          DISPATCH_PUBLISH_GITHUB_RELEASE: ${{ inputs.publish_github_release }}
          DISPATCH_RELEASE_TAG: ${{ inputs.release_tag }}
          DISPATCH_SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          release_tag="$DISPATCH_RELEASE_TAG"
          source_ref="$DISPATCH_SOURCE_REF"
          prefix=tree-sitter-mermaid-v
          [[ "$release_tag" == "$prefix"* ]] || {
            echo "::error::release_tag must start with $prefix" >&2
            exit 1
          }
          version="${release_tag#"$prefix"}"
          canonical="$(python3 scripts/release-version.py canonical --version "$version")"
          test "$canonical" = "$version"
          npm_dist_tag="$(python3 scripts/release-version.py npm-dist-tag --version "$version")"

          [[ "$source_ref" != *$'\n'* && "$source_ref" != *$'\r'* ]] || {
            echo "::error::source_ref must be one line" >&2
            exit 1
          }
          if [[ "$source_ref" =~ ^[0-9a-f]{40}$ ]]; then
            validated_source_ref="$source_ref"
          elif [[ "$source_ref" == "main" || "$source_ref" == "refs/heads/main" ]]; then
            [[ "$DISPATCH_PUBLISH" == "false" ]] || {
              echo "::error::main is build-only; publish from the matching release tag" >&2
              exit 1
            }
            validated_source_ref="$source_ref"
          elif [[ "$source_ref" == "$release_tag" || "$source_ref" == "refs/tags/$release_tag" ]]; then
            validated_source_ref="refs/tags/$release_tag"
          else
            echo "::error::source_ref must be a full SHA, main for build-only, or the matching release tag" >&2
            exit 1
          fi
          if [[ "$DISPATCH_PUBLISH" == "true" && "$validated_source_ref" != "refs/tags/$release_tag" ]]; then
            echo "::error::publishing requires source_ref to be the matching immutable tag" >&2
            exit 1
          fi
          if [[ "$DISPATCH_PUBLISH_GITHUB_RELEASE" == "true" && "$DISPATCH_PUBLISH" != "true" ]]; then
            echo "::error::a GitHub Release requires registry publication or reconciliation" >&2
            exit 1
          fi
          {
            printf 'npm_dist_tag=%s\n' "$npm_dist_tag"
            printf 'release_tag=%s\n' "$release_tag"
            printf 'source_ref=%s\n' "$validated_source_ref"
            printf 'version=%s\n' "$version"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.source_ref }}
          path: release-source
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve immutable source
        id: source
        shell: bash
        env:
          EXPECTED_SOURCE_REF: ${{ steps.release.outputs.source_ref }}
        run: |
          set -euo pipefail
          source_sha="$(git -C release-source rev-parse 'HEAD^{commit}')"
          source_tree="$(git -C release-source rev-parse 'HEAD^{tree}')"
          if [[ "$EXPECTED_SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            test "$source_sha" = "$EXPECTED_SOURCE_REF"
          fi
          {
            printf 'source_sha=%s\n' "$source_sha"
            printf 'source_tree=%s\n' "$source_tree"
          } >> "$GITHUB_OUTPUT"

  verify:
    needs: validate-inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-inputs.outputs.source_sha }}
          persist-credentials: false

      - name: Verify source and package versions
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.validate-inputs.outputs.source_sha }}
          SOURCE_TREE: ${{ needs.validate-inputs.outputs.source_tree }}
          VERSION: ${{ needs.validate-inputs.outputs.version }}
        run: |
          set -euo pipefail
          test "$(git rev-parse 'HEAD^{commit}')" = "$SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          python3 - "$VERSION" <<'PY'
          import json
          import re
          import sys
          import tomllib
          from pathlib import Path

          version = sys.argv[1]
          root = Path("distribution/tree-sitter-mermaid")
          npm_manifest = json.loads((root / "package.json").read_text())
          if npm_manifest["name"] != "@mermanjs/tree-sitter-mermaid":
              raise SystemExit(
                  f"unexpected npm package name: {npm_manifest['name']}"
              )
          cmake = re.search(
              r'project\(tree-sitter-mermaid\s+VERSION\s+"([^"]+)"',
              (root / "CMakeLists.txt").read_text(),
          )
          make = re.search(
              r"(?m)^VERSION\s*:=\s*(\S+)\s*$", (root / "Makefile").read_text()
          )
          if cmake is None or make is None:
              raise SystemExit("could not read the public C package versions")
          versions = {
              "Cargo.toml": tomllib.loads((root / "Cargo.toml").read_text())["package"][
                  "version"
              ],
              "package.json": npm_manifest["version"],
              "tree-sitter.json": json.loads(
                  (root / "tree-sitter.json").read_text()
              )["metadata"]["version"],
              "metadata/provenance.json": json.loads(
                  (root / "metadata/provenance.json").read_text()
              )["package"]["version"],
              "CMakeLists.txt": cmake.group(1),
              "Makefile": make.group(1),
          }
          mismatches = {path: found for path, found in versions.items() if found != version}
          if mismatches:
              raise SystemExit(f"version mismatch for {mismatches}; requested={version}")
          PY

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: distribution/tree-sitter-mermaid/package-lock.json

      - name: Install pinned npm
        run: npm install --global --ignore-scripts --registry=https://registry.npmjs.org/ npm@12.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0

      - name: Install cargo-nextest
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: nextest

      - name: Install grammar toolchain
        run: |
          npm ci --ignore-scripts --prefix distribution/tree-sitter-mermaid
          npm rebuild tree-sitter-cli --prefix distribution/tree-sitter-mermaid
          npm run build:node --prefix distribution/tree-sitter-mermaid

      - name: Read pinned WASI SDK version
        id: wasi-version
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          provenance = json.loads(
              Path("distribution/tree-sitter-mermaid/metadata/provenance.json").read_text()
          )
          version = provenance["toolchain"]["wasiSdk"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")

      - name: Install pinned WASI SDK
        id: wasi-sdk
        uses: bytecodealliance/setup-wasi-sdk-action@77d09f3df1e8da344d8403cf8631af8977938b4c # v1.0.0
        with:
          version: ${{ steps.wasi-version.outputs.version }}
          add-to-path: false

      - name: Verify language package
        env:
          TREE_SITTER_WASI_SDK_PATH: ${{ steps.wasi-sdk.outputs.wasi-sdk-path }}
        run: |
          npm run check:generated --prefix distribution/tree-sitter-mermaid
          npm run check:wasm --prefix distribution/tree-sitter-mermaid
          npm run test:corpus --prefix distribution/tree-sitter-mermaid
          cargo fmt --all -- --check
          cargo nextest run --locked -p tree-sitter-mermaid --no-fail-fast
          cargo clippy --locked -p tree-sitter-mermaid --all-targets -- -D warnings
          npm run test:node --prefix distribution/tree-sitter-mermaid
          npm run test:wasm --prefix distribution/tree-sitter-mermaid
          npm run test:c --prefix distribution/tree-sitter-mermaid
          python3 scripts/verify-third-party-licenses.py
          python3 scripts/verify_crate_package_legal_materials.py

  prebuild:
    needs: validate-inputs
    name: prebuild (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
          - target: linux-x64
            runner: ubuntu-24.04
          - target: win32-x64
            runner: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-inputs.outputs.source_sha }}
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: distribution/tree-sitter-mermaid/package-lock.json

      - name: Install pinned npm
        run: npm install --global --ignore-scripts --registry=https://registry.npmjs.org/ npm@12.0.2

      - name: Build N-API prebuild
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --prefix distribution/tree-sitter-mermaid
          npm run prebuild --prefix distribution/tree-sitter-mermaid
          test "$(find distribution/tree-sitter-mermaid/prebuilds -name '*.node' -type f | wc -l | tr -d ' ')" -ge 1
          PREBUILDS_ONLY=1 npm run test:node --prefix distribution/tree-sitter-mermaid
          tar -czf - -C distribution/tree-sitter-mermaid prebuilds \
            > "$RUNNER_TEMP/tree-sitter-mermaid-prebuild-$TARGET.tar.gz"

      - name: Upload prebuild
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tree-sitter-mermaid-prebuild-${{ matrix.target }}
          path: ${{ runner.temp }}/tree-sitter-mermaid-prebuild-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  assemble:
    needs: [validate-inputs, verify, prebuild]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-inputs.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: distribution/tree-sitter-mermaid/package-lock.json

      - name: Install pinned npm
        run: npm install --global --ignore-scripts --registry=https://registry.npmjs.org/ npm@12.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0

      - name: Download native prebuilds from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: tree-sitter-mermaid-prebuild-*
          path: ${{ runner.temp }}/tree-sitter-mermaid-prebuilds

      - name: Assemble and smoke exact release packages
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.validate-inputs.outputs.source_sha }}
          VERSION: ${{ needs.validate-inputs.outputs.version }}
        run: |
          set -euo pipefail
          package=distribution/tree-sitter-mermaid
          release_dir="$RUNNER_TEMP/tree-sitter-mermaid-release"
          mkdir -p "$release_dir"
          while IFS= read -r archive; do
            tar -xzf "$archive" -C "$package"
          done < <(find "$RUNNER_TEMP/tree-sitter-mermaid-prebuilds" -name '*.tar.gz' -type f | sort)

          shopt -s nullglob
          expected_prebuilds=(darwin-arm64 darwin-x64 linux-x64 win32-x64)
          for target in "${expected_prebuilds[@]}"; do
            binaries=("$package/prebuilds/$target"/*.node)
            test "${#binaries[@]}" -eq 1
          done
          test "$(find "$package/prebuilds" -name '*.node' -type f | wc -l | tr -d ' ')" -eq 4

          npm ci --ignore-scripts --prefix "$package"
          git archive \
            --format=tar.gz \
            --prefix="tree-sitter-mermaid-$VERSION/" \
            --output="$release_dir/tree-sitter-mermaid-$VERSION-source.tar.gz" \
            "$SOURCE_SHA:$package"
          TREE_SITTER_MERMAID_REQUIRE_PREBUILDS=1 \
            npm run test:package-smoke --prefix "$package" -- \
              --output-dir "$release_dir" \
              --c-source-archive "$release_dir/tree-sitter-mermaid-$VERSION-source.tar.gz"
          cp "$package/tree-sitter-mermaid.wasm" "$release_dir/tree-sitter-mermaid.wasm"
          cp "$package/metadata/provenance.json" "$release_dir/tree-sitter-mermaid-provenance.json"
          (cd "$release_dir" && sha256sum ./* > SHA256SUMS)

      - name: Upload release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tree-sitter-mermaid-release-${{ needs.validate-inputs.outputs.version }}
          path: ${{ runner.temp }}/tree-sitter-mermaid-release/*
          if-no-files-found: error

  attest:
    needs: [validate-inputs, assemble]
    runs-on: ubuntu-24.04
    environment: github-release
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tree-sitter-mermaid-release-${{ needs.validate-inputs.outputs.version }}
          path: ${{ runner.temp }}/tree-sitter-mermaid-release
      - name: Attest release candidate
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/tree-sitter-mermaid-release/*

  publish-crates:
    needs: [validate-inputs, assemble, attest]
    if: ${{ inputs.publish }}
    runs-on: ubuntu-24.04
    environment: crates.io
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-inputs.outputs.source_sha }}
          persist-credentials: false
      - name: Checkout trusted recovery observer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
      - name: Download release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tree-sitter-mermaid-release-${{ needs.validate-inputs.outputs.version }}
          path: ${{ runner.temp }}/tree-sitter-mermaid-release
      - name: Verify the Cargo package matches the staged candidate
        env:
          VERSION: ${{ needs.validate-inputs.outputs.version }}
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/tree-sitter-mermaid-release"
          (cd "$release_dir" && sha256sum --check SHA256SUMS)
          cargo package --locked --no-verify -p tree-sitter-mermaid
          cmp \
            "$release_dir/tree-sitter-mermaid-$VERSION.crate" \
            "target/package/tree-sitter-mermaid-$VERSION.crate"
      - name: Inspect crate publication state
        id: crate-state
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate-inputs.outputs.version }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/tree-sitter-mermaid-release/tree-sitter-mermaid-$VERSION.crate"
          registry_copy="$RUNNER_TEMP/tree-sitter-mermaid-$VERSION-registry.crate"
          registry_url="https://crates.io/api/v1/crates/tree-sitter-mermaid/$VERSION/download"
          registry_user_agent="merman-tree-sitter-release/$VERSION (+https://github.com/Latias94/merman)"
          registry_status="$(curl --silent --show-error --location --max-time 30 \
            --user-agent "$registry_user_agent" --write-out '%{http_code}' \
            --output "$registry_copy" "$registry_url")"
          if [[ "$registry_status" == "200" ]]; then
            cmp "$candidate" "$registry_copy"
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          elif [[ "$registry_status" != "404" ]]; then
            echo "::error::Cannot establish registry state: crates.io returned HTTP $registry_status." >&2
            exit 1
          fi
          echo "exists=false" >> "$GITHUB_OUTPUT"
          history="$(python3 trusted/scripts/release_attempt_history.py \
            --owner grammar-crates --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" --before-attempt "$RUN_ATTEMPT")"
          if [ "$history" = "never-attempted" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify crate release tag before upload
        if: ${{ steps.crate-state.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-inputs.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.validate-inputs.outputs.source_sha }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null
          observed="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)"
          test "$observed" = "$SOURCE_SHA" || {
            echo "::error::Release tag moved after artifact verification." >&2
            exit 1
          }

      - name: Publish crate
        if: ${{ steps.crate-state.outputs.publish == 'true' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          publish_status=0
          cargo publish --locked --no-verify -p tree-sitter-mermaid \
            --registry crates-io --token "$CARGO_REGISTRY_TOKEN" || publish_status=$?
          echo "cargo publish returned $publish_status; confirming the immutable candidate."

      - name: Observe the original crate after publication
        if: ${{ steps.crate-state.outputs.exists == 'false' }}
        env:
          VERSION: ${{ needs.validate-inputs.outputs.version }}
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/tree-sitter-mermaid-release/tree-sitter-mermaid-$VERSION.crate"
          registry_copy="$RUNNER_TEMP/tree-sitter-mermaid-$VERSION-registry.crate"
          registry_url="https://crates.io/api/v1/crates/tree-sitter-mermaid/$VERSION/download"
          registry_user_agent="merman-tree-sitter-release/$VERSION (+https://github.com/Latias94/merman)"
          deadline=$((SECONDS + 300))
          delay=5
          for attempt in $(seq 1 12); do
            remaining=$((deadline - SECONDS))
            [ "$remaining" -gt 0 ] || break
            timeout=$((remaining < 30 ? remaining : 30))
            if curl --fail --silent --show-error --location --max-time "$timeout" \
              --user-agent "$registry_user_agent" \
              --output "$registry_copy" "$registry_url"; then
              cmp "$candidate" "$registry_copy"
              exit 0
            fi
            [ "$attempt" -lt 12 ] || break
            remaining=$((deadline - SECONDS))
            [ "$remaining" -gt 0 ] || break
            wait=$((delay < remaining ? delay : remaining))
            sleep "$wait"
            delay=$((delay < 15 ? delay * 2 : 30))
          done
          echo "::error::The original crate remains pending registry visibility. Preserve this run's candidate and resume observation; do not republish." >&2
          exit 1

  publish-npm:
    needs: [validate-inputs, assemble, attest]
    if: ${{ inputs.publish }}
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Checkout trusted registry observer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          registry-url: https://registry.npmjs.org

      - name: Install pinned npm
        run: npm install --global --ignore-scripts --registry=https://registry.npmjs.org/ npm@12.0.2

      - name: Download release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tree-sitter-mermaid-release-${{ needs.validate-inputs.outputs.version }}
          path: ${{ runner.temp }}/tree-sitter-mermaid-release
      - name: Inspect npm publication state
        id: npm-state
        env:
          GH_TOKEN: ${{ github.token }}
          NPM_DIST_TAG: ${{ needs.validate-inputs.outputs.npm_dist_tag }}
          VERSION: ${{ needs.validate-inputs.outputs.version }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          candidates=("$RUNNER_TEMP/tree-sitter-mermaid-release"/mermanjs-tree-sitter-mermaid-*.tgz)
          test "${#candidates[@]}" -eq 1
          candidate="${candidates[0]}"
          registry_copy="$RUNNER_TEMP/mermanjs-tree-sitter-mermaid-$VERSION-registry.tgz"
          registry_state="$(python3 trusted/scripts/npm_package_group.py inspect \
            --package @mermanjs/tree-sitter-mermaid \
            --version "$VERSION" --tag "$NPM_DIST_TAG" --tarball "$candidate")"
          if [[ "$registry_state" == "exact" ]]; then
            registry_url="$(npm view "@mermanjs/tree-sitter-mermaid@$VERSION" dist.tarball)"
            curl --fail --silent --show-error --location \
              --output "$registry_copy" "$registry_url"
            cmp "$candidate" "$registry_copy"
            if [ "$RUN_ATTEMPT" -eq 1 ]; then
              observed="$(npm view "@mermanjs/tree-sitter-mermaid" "dist-tags.$NPM_DIST_TAG")"
              test "$observed" = "$VERSION"
            else
              python3 trusted/scripts/npm_package_group.py observe \
                --package @mermanjs/tree-sitter-mermaid \
                --version "$VERSION" --tag "$NPM_DIST_TAG" --tarball "$candidate"
            fi
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "exists=false" >> "$GITHUB_OUTPUT"
          history="$(python3 trusted/scripts/release_attempt_history.py \
            --owner grammar-npm --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" --before-attempt "$RUN_ATTEMPT")"
          if [ "$history" = "never-attempted" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify npm release tag before upload
        if: ${{ steps.npm-state.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-inputs.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.validate-inputs.outputs.source_sha }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null
          observed="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)"
          test "$observed" = "$SOURCE_SHA" || {
            echo "::error::Release tag moved after artifact verification." >&2
            exit 1
          }

      - name: Publish npm package
        if: ${{ steps.npm-state.outputs.publish == 'true' }}
        env:
          NPM_DIST_TAG: ${{ needs.validate-inputs.outputs.npm_dist_tag }}
        run: |
          set -euo pipefail
          candidates=("$RUNNER_TEMP/tree-sitter-mermaid-release"/mermanjs-tree-sitter-mermaid-*.tgz)
          test "${#candidates[@]}" -eq 1
          publish_status=0
          npm publish "${candidates[0]}" --access public --provenance --ignore-scripts --tag "$NPM_DIST_TAG" || \
            publish_status=$?
          echo "npm publish returned $publish_status; confirming the immutable candidate."

      - name: Observe the original npm candidate after publication
        if: ${{ steps.npm-state.outputs.exists == 'false' }}
        env:
          NPM_DIST_TAG: ${{ needs.validate-inputs.outputs.npm_dist_tag }}
          VERSION: ${{ needs.validate-inputs.outputs.version }}
        run: |
          set -euo pipefail
          candidates=("$RUNNER_TEMP/tree-sitter-mermaid-release"/mermanjs-tree-sitter-mermaid-*.tgz)
          test "${#candidates[@]}" -eq 1
          candidate="${candidates[0]}"
          python3 trusted/scripts/npm_package_group.py observe \
            --package @mermanjs/tree-sitter-mermaid \
            --version "$VERSION" --tag "$NPM_DIST_TAG" --tarball "$candidate"
          registry_url="$(npm view "@mermanjs/tree-sitter-mermaid@$VERSION" dist.tarball)"
          registry_copy="$RUNNER_TEMP/mermanjs-tree-sitter-mermaid-$VERSION-registry.tgz"
          curl --fail --silent --show-error --location \
            --output "$registry_copy" "$registry_url"
          cmp "$candidate" "$registry_copy"

  publish-github:
    needs: [validate-inputs, assemble, attest, publish-crates, publish-npm]
    if: ${{ inputs.publish && inputs.publish_github_release }}
    runs-on: ubuntu-24.04
    environment: github-release
    permissions:
      contents: write
    steps:
      - name: Download release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tree-sitter-mermaid-release-${{ needs.validate-inputs.outputs.version }}
          path: ${{ runner.temp }}/tree-sitter-mermaid-release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate-inputs.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.validate-inputs.outputs.source_sha }}
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/tree-sitter-mermaid-release"
          verify_existing_release() {
            local existing="$RUNNER_TEMP/tree-sitter-mermaid-existing-release"
            test "$(gh release view "$RELEASE_TAG" --json tagName --jq .tagName)" = "$RELEASE_TAG" || \
              return 1
            mkdir -p "$existing"
            gh release download "$RELEASE_TAG" --dir "$existing"
            python3 - "$release_dir" "$existing" <<'PY'
          import filecmp
          import sys
          from pathlib import Path

          expected = Path(sys.argv[1])
          actual = Path(sys.argv[2])
          expected_files = {path.name: path for path in expected.iterdir() if path.is_file()}
          actual_files = {path.name: path for path in actual.iterdir() if path.is_file()}
          if expected_files.keys() != actual_files.keys():
              raise SystemExit(
                  f"release asset mismatch: expected={sorted(expected_files)}, "
                  f"actual={sorted(actual_files)}"
              )
          for name, expected_file in expected_files.items():
              if not filecmp.cmp(expected_file, actual_files[name], shallow=False):
                  raise SystemExit(f"release asset differs: {name}")
          PY
          }

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            verify_existing_release
            echo "GitHub already contains the verified release assets"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null
          observed="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)"
          test "$observed" = "$SOURCE_SHA" || {
            echo "::error::Release tag moved after artifact verification." >&2
            exit 1
          }
          if gh release create "$RELEASE_TAG" "$release_dir"/* \
            --verify-tag --generate-notes --title "$RELEASE_TAG"; then
            exit 0
          fi
          sleep 10
          verify_existing_release
