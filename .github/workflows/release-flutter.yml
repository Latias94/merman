name: Release Flutter (pub.dev)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag/version to publish, for example v0.8.0-alpha.5"
        required: true
        type: string
      publish_to_pub:
        description: "Publish to pub.dev after dry-run passes"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  validate-inputs:
    name: validate-inputs
    runs-on: ubuntu-24.04
    outputs:
      source_ref: ${{ steps.release.outputs.source_ref }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      source_tree: ${{ steps.source.outputs.source_tree }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Validate release inputs
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_RELEASE_TAG: ${{ inputs.release_tag }}
          GIT_REF: ${{ github.ref }}
          GIT_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          semver_re='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.(0|[1-9][0-9]*))?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          tag_re="^v${semver_re#^}"
          fail() {
            echo "::error::$1" >&2
            exit 1
          }

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            RELEASE_TAG="$DISPATCH_RELEASE_TAG"
          else
            RELEASE_TAG="$GIT_REF_NAME"
          fi

          [[ "$RELEASE_TAG" =~ $tag_re ]] || fail "release_tag must match vX.Y.Z or vX.Y.Z-alpha.N/beta.N/rc.N."
          if [[ "$EVENT_NAME" != "workflow_dispatch" ]]; then
            [[ "$GIT_REF" == "refs/tags/$RELEASE_TAG" ]] || fail "tag push ref must match release_tag."
          fi
          SOURCE_REF="refs/tags/$RELEASE_TAG"

          VERSION="${RELEASE_TAG#v}"
          [[ "$VERSION" =~ $semver_re ]] || fail "release_tag contains an unsupported SemVer version."

          {
            printf 'source_ref=%s\n' "$SOURCE_REF"
            printf 'release_tag=%s\n' "$RELEASE_TAG"
            printf 'version=%s\n' "$VERSION"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.release.outputs.source_ref }}
          persist-credentials: false
          fetch-depth: 1
          fetch-tags: true

      - name: Resolve immutable release source
        id: source
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse "HEAD^{commit}")"
          source_tree="$(git rev-parse "HEAD^{tree}")"
          tag_sha="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          tag_tree="$(git rev-parse "refs/tags/${RELEASE_TAG}^{tree}")"
          test "$source_sha" = "$tag_sha"
          test "$source_tree" = "$tag_tree"
          {
            printf 'source_sha=%s\n' "$source_sha"
            printf 'source_tree=%s\n' "$source_tree"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: validate-inputs
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.validate-inputs.outputs.source_sha }}
          persist-credentials: false

      - name: Verify pinned release source
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.validate-inputs.outputs.source_sha }}
          EXPECTED_SOURCE_TREE: ${{ needs.validate-inputs.outputs.source_tree }}
        run: |
          set -euo pipefail
          test "$(git rev-parse "HEAD^{commit}")" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse "HEAD^{tree}")" = "$EXPECTED_SOURCE_TREE"

      - name: Read Android toolchain versions
        id: android-toolchain
        run: echo "ndk=$(python3 platforms/android/build-android.py --print-version ndk)" >> "$GITHUB_OUTPUT"

      - name: Verify release version projections match tag
        env:
          VERSION: ${{ needs.validate-inputs.outputs.version }}
        run: python3 scripts/release-version.py check --version "$VERSION"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-linux-android,x86_64-linux-android,aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin,x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu,x86_64-pc-windows-gnu

      - name: Install desktop cross tools
        run: |
          if ! command -v zig >/dev/null 2>&1; then
            brew install zig
          fi
          cargo install cargo-zigbuild --version 0.21.8 --locked

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.1

      - name: Install Android NDK
        shell: bash
        env:
          ANDROID_NDK_VERSION: ${{ steps.android-toolchain.outputs.ndk }}
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Build Android native libraries
        run: python3 platforms/android/build-android.py --artifact-profile flutter-android-native --targets aarch64-linux-android x86_64-linux-android

      - name: Verify Android libraries in Flutter package
        run: |
          test -f platforms/flutter/android/src/main/jniLibs/arm64-v8a/libmerman_ffi.so
          test -f platforms/flutter/android/src/main/jniLibs/x86_64/libmerman_ffi.so

      - name: Build and inject iOS XCFramework
        env:
          MERMAN_AUTO_INSTALL_RUST_TARGETS: "false"
        run: |
          bash platforms/flutter/build-ios.sh
          test -d platforms/flutter/ios/MermanFFI.xcframework

      - name: Build desktop native libraries
        env:
          MERMAN_AUTO_INSTALL_RUST_TARGETS: "false"
        run: bash platforms/flutter/build-desktop.sh --all

      - name: Verify Flutter native artifacts
        run: |
          test -d platforms/flutter/macos/MermanFFI.xcframework
          test -f platforms/flutter/windows/merman_ffi.dll
          test -f platforms/flutter/linux/lib/x86_64/libmerman_ffi.so
          test -f platforms/flutter/linux/lib/aarch64/libmerman_ffi.so

      - name: Setup Dart with pub.dev OIDC credentials
        uses: dart-lang/setup-dart@v1.8.0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: "3.38.3"
          channel: stable
          cache: true

      - name: Validate Flutter package
        working-directory: platforms/flutter
        run: |
          flutter pub get
          dart run ffigen --config ffigen.yaml
          git ls-files --error-unmatch -- lib/src/generated/native_abi.dart
          git diff --exit-code -- lib/src/generated/native_abi.dart
          flutter analyze
          dart format --set-exit-if-changed lib example tool
          dart run tool/abi3_contract_test.dart
          MACOS_LIBRARY="$(find macos/MermanFFI.xcframework -type f -name 'libmerman_ffi.dylib' -print -quit)"
          test -n "$MACOS_LIBRARY"
          dart run example/smoke.dart "$MACOS_LIBRARY"
          python3 ../../scripts/verify_flutter_pub_package.py \
            --package-root . \
            --max-compressed-mb 99

      - name: Verify legal material projections
        run: python3 scripts/sync-release-legal-materials.py --check

      - name: Package Flutter release artifact
        env:
          SOURCE_SHA: ${{ needs.validate-inputs.outputs.source_sha }}
          SOURCE_TREE: ${{ needs.validate-inputs.outputs.source_tree }}
          VERSION: ${{ needs.validate-inputs.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/flutter_release_archive.py pack \
            --package-root platforms/flutter \
            --archive "$RUNNER_TEMP/merman-flutter-package.tar.gz" \
            --receipt "$RUNNER_TEMP/merman-flutter-package.receipt.json" \
            --source-sha "$SOURCE_SHA" \
            --source-tree "$SOURCE_TREE" \
            --version "$VERSION"

      - name: Upload Flutter package artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: merman-flutter-package
          path: |
            ${{ runner.temp }}/merman-flutter-package.tar.gz
            ${{ runner.temp }}/merman-flutter-package.receipt.json

  pubdev_version:
    needs:
      - validate-inputs
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      exists: ${{ steps.pubdev.outputs.exists }}
    steps:
      - name: Check pub.dev version
        id: pubdev
        env:
          VERSION: ${{ needs.validate-inputs.outputs.version }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          version = os.environ["VERSION"]
          exists = False
          try:
              with urllib.request.urlopen("https://pub.dev/api/packages/merman", timeout=30) as response:
                  data = json.load(response)
              exists = any(item.get("version") == version for item in data.get("versions", []))
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"exists={str(exists).lower()}\n")
          print(f"pub.dev merman {version} exists: {exists}")
          PY

  publish:
    needs:
      - validate-inputs
      - build
      - pubdev_version
    if: ${{ github.event_name == 'push' && needs.pubdev_version.outputs.exists != 'true' }}
    runs-on: macos-15
    environment: pub.dev
    permissions:
      contents: read
      id-token: write
    steps:
      # The downloaded archive is data only. Run extraction from the trusted workflow revision.
      - name: Checkout trusted Flutter release verifier
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false

      - name: Download Flutter package artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: merman-flutter-package
          path: target/flutter-package

      - name: Verify and extract Flutter package artifact
        env:
          SOURCE_SHA: ${{ needs.validate-inputs.outputs.source_sha }}
          SOURCE_TREE: ${{ needs.validate-inputs.outputs.source_tree }}
          VERSION: ${{ needs.validate-inputs.outputs.version }}
        run: |
          set -euo pipefail
          python3 trusted/scripts/flutter_release_archive.py extract \
            --archive target/flutter-package/merman-flutter-package.tar.gz \
            --receipt target/flutter-package/merman-flutter-package.receipt.json \
            --destination target/flutter-publish \
            --source-sha "$SOURCE_SHA" \
            --source-tree "$SOURCE_TREE" \
            --version "$VERSION"

      - name: Setup Dart with pub.dev OIDC credentials
        uses: dart-lang/setup-dart@v1.8.0

      - name: Publish to pub.dev
        working-directory: target/flutter-publish
        run: dart pub publish --force --skip-validation

  skip_existing:
    needs:
      - validate-inputs
      - build
      - pubdev_version
    if: ${{ github.event_name == 'push' && needs.pubdev_version.outputs.exists == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Skip existing pub.dev version
        env:
          VERSION: ${{ needs.validate-inputs.outputs.version }}
        run: echo "merman $VERSION is already published on pub.dev; skipping."

  explain_manual_publish_skip:
    needs:
      - validate-inputs
      - build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_to_pub }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Explain manual pub.dev publish skip
        run: |
          echo "::warning::pub.dev automated publishing only accepts GitHub Actions runs triggered by a pushed git tag. This manual run completed validation but did not publish."
