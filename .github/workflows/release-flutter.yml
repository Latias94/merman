name: Release Flutter (pub.dev)

on:
  push:
    tags:
      - "flutter-v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Flutter release tag, for example flutter-v0.8.0-alpha.5"
        required: true
        type: string
      source_ref:
        description: "Source commit, branch, or matching Flutter release tag to validate"
        required: true
        default: "main"
        type: string

permissions:
  contents: read

jobs:
  validate-inputs:
    name: validate-inputs
    runs-on: ubuntu-24.04
    outputs:
      source_ref: ${{ steps.release.outputs.source_ref }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      source_tree: ${{ steps.source.outputs.source_tree }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Validate release inputs
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_RELEASE_TAG: ${{ inputs.release_tag }}
          DISPATCH_SOURCE_REF: ${{ inputs.source_ref }}
          GIT_REF: ${{ github.ref }}
          GIT_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          semver_re='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.(0|[1-9][0-9]*))?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          tag_re="^flutter-v${semver_re#^}"
          fail() {
            echo "::error::$1" >&2
            exit 1
          }

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            RELEASE_TAG="$DISPATCH_RELEASE_TAG"
            SOURCE_REF="$DISPATCH_SOURCE_REF"
          else
            RELEASE_TAG="$GIT_REF_NAME"
            SOURCE_REF="refs/tags/$RELEASE_TAG"
          fi

          [[ "$RELEASE_TAG" =~ $tag_re ]] || fail "release_tag must match flutter-vX.Y.Z or flutter-vX.Y.Z-alpha.N/beta.N/rc.N."
          if [[ "$EVENT_NAME" != "workflow_dispatch" ]]; then
            [[ "$GIT_REF" == "refs/tags/$RELEASE_TAG" ]] || fail "tag push ref must match release_tag."
          fi

          VERSION="${RELEASE_TAG#flutter-v}"
          [[ "$VERSION" =~ $semver_re ]] || fail "release_tag contains an unsupported SemVer version."

          {
            printf 'source_ref=%s\n' "$SOURCE_REF"
            printf 'release_tag=%s\n' "$RELEASE_TAG"
            printf 'version=%s\n' "$VERSION"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.source_ref }}
          persist-credentials: false
          fetch-depth: 1
          fetch-tags: true

      - name: Resolve immutable release source
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse "HEAD^{commit}")"
          source_tree="$(git rev-parse "HEAD^{tree}")"
          if [[ "$EVENT_NAME" != "workflow_dispatch" ]]; then
            tag_sha="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
            tag_tree="$(git rev-parse "refs/tags/${RELEASE_TAG}^{tree}")"
            test "$source_sha" = "$tag_sha"
            test "$source_tree" = "$tag_tree"
          fi
          {
            printf 'source_sha=%s\n' "$source_sha"
            printf 'source_tree=%s\n' "$source_tree"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: validate-inputs
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-inputs.outputs.source_sha }}
          persist-credentials: false

      - name: Verify pinned release source
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.validate-inputs.outputs.source_sha }}
          EXPECTED_SOURCE_TREE: ${{ needs.validate-inputs.outputs.source_tree }}
        run: |
          set -euo pipefail
          test "$(git rev-parse "HEAD^{commit}")" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse "HEAD^{tree}")" = "$EXPECTED_SOURCE_TREE"

      - name: Read Android toolchain versions
        id: android-toolchain
        run: echo "ndk=$(python3 platforms/android/build-android.py --print-version ndk)" >> "$GITHUB_OUTPUT"

      - name: Verify release version projections match tag
        env:
          VERSION: ${{ needs.validate-inputs.outputs.version }}
        run: python3 scripts/release-version.py check --version "$VERSION"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin,x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu,x86_64-pc-windows-gnu

      - name: Install desktop cross tools
        run: |
          if ! command -v zig >/dev/null 2>&1; then
            brew install zig
          fi
          cargo install cargo-zigbuild --version 0.21.8 --locked

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android NDK
        shell: bash
        env:
          ANDROID_NDK_VERSION: ${{ steps.android-toolchain.outputs.ndk }}
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Build Android native libraries
        run: python3 platforms/android/build-android.py --artifact-profile flutter-android-native --targets aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Build Apple and desktop native libraries
        run: python3 platforms/flutter/build-native.py all-desktop

      - name: Verify Flutter native artifacts
        run: |
          test -f platforms/flutter/native/android/armeabi-v7a/libmerman_ffi.so
          test -f platforms/flutter/native/android/arm64-v8a/libmerman_ffi.so
          test -f platforms/flutter/native/android/x86_64/libmerman_ffi.so
          test -f platforms/flutter/native/ios/arm64/libmerman_ffi.dylib
          test -f platforms/flutter/native/ios/arm64-simulator/libmerman_ffi.dylib
          test -f platforms/flutter/native/ios/x86_64-simulator/libmerman_ffi.dylib
          test -f platforms/flutter/native/macos/arm64/libmerman_ffi.dylib
          test -f platforms/flutter/native/macos/x86_64/libmerman_ffi.dylib
          test -f platforms/flutter/native/linux/aarch64/libmerman_ffi.so
          test -f platforms/flutter/native/linux/x86_64/libmerman_ffi.so
          test -f platforms/flutter/native/windows/x86_64/merman_ffi.dll

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.44.9"
          channel: stable
          cache: true

      - name: Validate Flutter package
        working-directory: platforms/flutter
        run: |
          flutter pub get
          dart run ffigen --config ffigen.yaml
          git ls-files --error-unmatch -- lib/src/generated/native_abi.dart
          git diff --exit-code -- lib/src/generated/native_abi.dart
          flutter analyze
          dart format --set-exit-if-changed \
            lib/merman.dart lib/src/merman_ffi.dart lib/src/operation_metadata.dart \
            example tool hook
          dart run tool/abi3_contract_test.dart
          dart run example/main.dart
          python3 ../../scripts/verify_flutter_pub_package.py \
            --package-root . \
            --max-compressed-mb 99

      - name: Verify legal material projections
        run: python3 scripts/sync-release-legal-materials.py --check

      - name: Package Flutter release artifact
        env:
          SOURCE_SHA: ${{ needs.validate-inputs.outputs.source_sha }}
          SOURCE_TREE: ${{ needs.validate-inputs.outputs.source_tree }}
          VERSION: ${{ needs.validate-inputs.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/flutter_release_archive.py pack \
            --package-root platforms/flutter \
            --archive "$RUNNER_TEMP/merman-flutter-package.tar.gz" \
            --receipt "$RUNNER_TEMP/merman-flutter-package.receipt.json" \
            --source-sha "$SOURCE_SHA" \
            --source-tree "$SOURCE_TREE" \
            --version "$VERSION"

      - name: Upload Flutter package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: merman-flutter-package
          path: |
            ${{ runner.temp }}/merman-flutter-package.tar.gz
            ${{ runner.temp }}/merman-flutter-package.receipt.json

  pubdev_version:
    needs:
      - validate-inputs
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      exists: ${{ steps.pubdev.outputs.exists }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Download Flutter package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: merman-flutter-package
          path: ${{ runner.temp }}/merman-flutter-package

      - name: Check pub.dev version
        id: pubdev
        env:
          VERSION: ${{ needs.validate-inputs.outputs.version }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/merman-flutter-package/merman-flutter-package.tar.gz"
          state="$(python3 -m scripts.reconcile_pub_package \
            --archive "$archive" \
            --package merman \
            --version "$VERSION")"
          case "$state" in
            exact)
              echo 'exists=true' >> "$GITHUB_OUTPUT"
              ;;
            missing)
              echo 'exists=false' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::unexpected pub.dev reconciliation state: $state" >&2
              exit 1
              ;;
          esac
          echo "pub.dev merman $VERSION state: $state"

  publish:
    needs:
      - validate-inputs
      - build
      - pubdev_version
    if: ${{ github.event_name == 'push' && needs.pubdev_version.outputs.exists != 'true' }}
    runs-on: macos-15
    environment: pub.dev
    permissions:
      contents: read
      id-token: write
    steps:
      # The downloaded archive is data only. Run extraction from the trusted workflow revision.
      - name: Checkout trusted Flutter release verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false

      - name: Download Flutter package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: merman-flutter-package
          path: target/flutter-package

      - name: Verify and extract Flutter package artifact
        env:
          SOURCE_SHA: ${{ needs.validate-inputs.outputs.source_sha }}
          SOURCE_TREE: ${{ needs.validate-inputs.outputs.source_tree }}
          VERSION: ${{ needs.validate-inputs.outputs.version }}
        run: |
          set -euo pipefail
          python3 trusted/scripts/flutter_release_archive.py extract \
            --archive target/flutter-package/merman-flutter-package.tar.gz \
            --receipt target/flutter-package/merman-flutter-package.receipt.json \
            --destination target/flutter-publish \
            --source-sha "$SOURCE_SHA" \
            --source-tree "$SOURCE_TREE" \
            --version "$VERSION"

      - name: Setup Dart with pub.dev OIDC credentials
        uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0

      - name: Publish to pub.dev
        working-directory: target/flutter-publish
        run: dart pub publish --force --skip-validation

  skip_existing:
    needs:
      - validate-inputs
      - build
      - pubdev_version
    if: ${{ github.event_name == 'push' && needs.pubdev_version.outputs.exists == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Skip existing pub.dev version
        env:
          VERSION: ${{ needs.validate-inputs.outputs.version }}
        run: echo "merman $VERSION is already published on pub.dev; skipping."

  explain_manual_publish_skip:
    needs:
      - validate-inputs
      - build
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Explain manual pub.dev publish skip
        run: |
          echo "::warning::pub.dev automated publishing only accepts GitHub Actions runs triggered by a pushed Flutter release tag. This manual run completed validation but did not publish."
