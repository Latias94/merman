name: Release Flutter (pub.dev)

on:
  push:
    tags:
      - "flutter-v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Workspace release tag, for example v0.10.0-alpha.2"
        required: true
        type: string
      source_ref:
        description: "Matching tag or reviewed facade commit; main is validation-only"
        required: true
        default: "main"
        type: string
      native_run_id:
        description: "Original native-asset producer run for a facade-only repair; empty builds all targets"
        required: false
        default: ""
        type: string
      publish:
        description: "Publish native assets to the workspace Release and the facade to pub.dev"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-flutter-${{ github.event_name == 'push' && github.ref_name || format('flutter-{0}', inputs.release_tag) }}
  cancel-in-progress: false

jobs:
  validate-inputs:
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      source_tree: ${{ steps.source.outputs.source_tree }}
      authentication_sha: ${{ steps.source.outputs.authentication_sha }}
      native_source_sha: ${{ steps.source.outputs.native_source_sha }}
      native_source_tree: ${{ steps.source.outputs.native_source_tree }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      authentication_tag: ${{ steps.release.outputs.authentication_tag }}
      publish: ${{ steps.release.outputs.publish }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Validate release inputs
        id: release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_REF: ${{ inputs.source_ref }}
          NATIVE_RUN_ID: ${{ inputs.native_run_id }}
          PUBLISH: ${{ inputs.publish }}
          GIT_REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == push ]]; then
            RELEASE_TAG="${GIT_REF#refs/tags/flutter-}"
            SOURCE_REF="$GIT_REF"
            PUBLISH=true
          fi
          semver_re='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.(0|[1-9][0-9]*))?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?'
          [[ "$RELEASE_TAG" =~ ^v${semver_re}$ ]] || {
            echo '::error::release_tag must be a workspace v<version> tag.' >&2; exit 1;
          }
          AUTHENTICATION_TAG="flutter-$RELEASE_TAG"
          [[ -z "$NATIVE_RUN_ID" || "$NATIVE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || exit 1
          if [[ "$SOURCE_REF" == "$RELEASE_TAG" || "$SOURCE_REF" == "refs/tags/$RELEASE_TAG" ]]; then
            SOURCE_REF="refs/tags/$RELEASE_TAG"
          elif [[ "$SOURCE_REF" == "$AUTHENTICATION_TAG" || "$SOURCE_REF" == "refs/tags/$AUTHENTICATION_TAG" ]]; then
            SOURCE_REF="refs/tags/$AUTHENTICATION_TAG"
          elif [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            :
          elif [[ "$PUBLISH" == false && "$SOURCE_REF" == main ]]; then
            SOURCE_REF=refs/heads/main
          else
            echo '::error::Use the matching tag or a reviewed immutable facade commit; main is validation-only.' >&2; exit 1
          fi
          if [[ "$PUBLISH" == true && "$GIT_REF" != "refs/tags/$AUTHENTICATION_TAG" ]]; then
            echo '::error::pub.dev publication must run on the matching Flutter authentication tag.' >&2; exit 1
          fi
          {
            printf 'source_ref=%s\n' "$SOURCE_REF"
            printf 'release_tag=%s\n' "$RELEASE_TAG"
            printf 'authentication_tag=%s\n' "$AUTHENTICATION_TAG"
            printf 'publish=%s\n' "$PUBLISH"
            printf 'version=%s\n' "${RELEASE_TAG#v}"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.release.outputs.source_ref }}
          persist-credentials: false
          fetch-depth: 1
          fetch-tags: true

      - name: Resolve immutable facade source
        id: source
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          AUTHENTICATION_TAG: ${{ steps.release.outputs.authentication_tag }}
          PUBLISH: ${{ steps.release.outputs.publish }}
          NATIVE_RUN_ID: ${{ inputs.native_run_id }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse 'HEAD^{commit}')"
          native_source_sha="$source_sha"
          native_source_tree="$(git rev-parse 'HEAD^{tree}')"
          if [[ "$PUBLISH" == true || -n "$NATIVE_RUN_ID" ]]; then
            git fetch --no-tags origin \
              "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            native_source_sha="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
            native_source_tree="$(git rev-parse "refs/tags/$RELEASE_TAG^{tree}")"
            if [[ "$PUBLISH" == true && -z "$NATIVE_RUN_ID" ]]; then
              test "$source_sha" = "$native_source_sha"
            fi
          fi
          if [[ "$PUBLISH" == true ]]; then
            authentication_sha="$(git rev-parse "refs/tags/$AUTHENTICATION_TAG^{commit}")"
            printf 'authentication_sha=%s\n' "$authentication_sha" >> "$GITHUB_OUTPUT"
          fi
          {
            printf 'source_sha=%s\n' "$source_sha"
            printf 'source_tree=%s\n' "$(git rev-parse 'HEAD^{tree}')"
            printf 'native_source_sha=%s\n' "$native_source_sha"
            printf 'native_source_tree=%s\n' "$native_source_tree"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: validate-inputs
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/build-flutter.yml
    with:
      release_tag: ${{ needs.validate-inputs.outputs.release_tag }}
      source_sha: ${{ needs.validate-inputs.outputs.source_sha }}
      native_source_sha: ${{ needs.validate-inputs.outputs.native_source_sha }}
      native_source_tree: ${{ needs.validate-inputs.outputs.native_source_tree }}
      native_run_id: ${{ inputs.native_run_id }}

  pubdev_version:
    needs: [validate-inputs, build]
    if: ${{ needs.validate-inputs.outputs.publish == 'true' }}
    runs-on: ubuntu-24.04
    outputs:
      exists: ${{ steps.pubdev.outputs.exists }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v8.0.2
        with:
          name: merman-flutter-package
          path: ${{ runner.temp }}/merman-flutter-package

      - name: Reconcile pub.dev version
        id: pubdev
        env:
          VERSION: ${{ needs.validate-inputs.outputs.version }}
        run: |
          set -euo pipefail
          state="$(python3 -m scripts.reconcile_pub_package \
            --archive "$RUNNER_TEMP/merman-flutter-package/merman-flutter-package.tar.gz" \
            --package merman --version "$VERSION")"
          case "$state" in
            exact) echo 'exists=true' >> "$GITHUB_OUTPUT" ;;
            missing) echo 'exists=false' >> "$GITHUB_OUTPUT" ;;
            *) exit 1 ;;
          esac
          printf 'pub.dev merman %s state: %s\n' "$VERSION" "$state" >> "$GITHUB_STEP_SUMMARY"

  publish-native-assets:
    needs: [validate-inputs, build, pubdev_version]
    if: ${{ needs.validate-inputs.outputs.publish == 'true' }}
    runs-on: ubuntu-24.04
    environment: github-release
    permissions:
      contents: write
    outputs:
      public_verified: ${{ steps.public.outputs.verified }}
      native_source_sha: ${{ steps.native.outputs.source_sha }}
    steps:
      - name: Checkout trusted native asset verifier
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false

      - uses: actions/download-artifact@v8.0.2
        with:
          name: merman-flutter-package
          path: target/flutter-package

      - uses: actions/download-artifact@v8.0.2
        with:
          name: merman-flutter-native-assets
          path: target/flutter-native-assets

      - name: Verify the frozen facade and native asset bytes
        id: native
        env:
          SOURCE_SHA: ${{ needs.validate-inputs.outputs.source_sha }}
          SOURCE_TREE: ${{ needs.validate-inputs.outputs.source_tree }}
          NATIVE_SOURCE_SHA: ${{ needs.validate-inputs.outputs.native_source_sha }}
          NATIVE_SOURCE_TREE: ${{ needs.validate-inputs.outputs.native_source_tree }}
          VERSION: ${{ needs.validate-inputs.outputs.version }}
          RELEASE_TAG: ${{ needs.validate-inputs.outputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 trusted/scripts/flutter_release_archive.py extract \
            --archive target/flutter-package/merman-flutter-package.tar.gz \
            --receipt target/flutter-package/merman-flutter-package.receipt.json \
            --destination target/flutter-facade --require-thin \
            --source-sha "$SOURCE_SHA" --source-tree "$SOURCE_TREE" --version "$VERSION"
          python3 trusted/scripts/flutter_native_assets.py verify \
            --manifest target/flutter-facade/hook/native-assets.json \
            --base-url "https://github.com/$REPOSITORY/releases/download/$RELEASE_TAG/" \
            --version "$VERSION" --source-sha "$NATIVE_SOURCE_SHA" \
            --source-tree "$NATIVE_SOURCE_TREE" --assets-root target/flutter-native-assets
          printf 'source_sha=%s\n' "$NATIVE_SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Upload missing native assets to the workspace Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate-inputs.outputs.release_tag }}
          SOURCE_SHA: ${{ steps.native.outputs.source_sha }}
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" > /dev/null
          observed="$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)"
          test "$observed" = "$SOURCE_SHA"
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = false
          existing_assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          python3 trusted/scripts/flutter_native_assets.py list \
            --manifest target/flutter-facade/hook/native-assets.json > "$RUNNER_TEMP/flutter-native-assets.list"
          existing_dir="$(mktemp -d)"
          missing_assets=()
          while IFS= read -r name; do
            asset="target/flutter-native-assets/$name"
            if grep --fixed-strings --line-regexp --quiet "$name" <<< "$existing_assets"; then
              gh release download "$RELEASE_TAG" --pattern "$name" --dir "$existing_dir"
              cmp "$asset" "$existing_dir/$name"
            else
              missing_assets+=("$asset")
            fi
          done < "$RUNNER_TEMP/flutter-native-assets.list"
          if test "${#missing_assets[@]}" -gt 0; then
            gh release upload "$RELEASE_TAG" "${missing_assets[@]}"
          fi

      - name: Verify every exact public target download before pub.dev
        id: public
        env:
          RELEASE_TAG: ${{ needs.validate-inputs.outputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 trusted/scripts/flutter_native_assets.py verify-public \
            --manifest target/flutter-facade/hook/native-assets.json \
            --base-url "https://github.com/$REPOSITORY/releases/download/$RELEASE_TAG/"
          echo 'verified=true' >> "$GITHUB_OUTPUT"

  publish:
    needs: [validate-inputs, build, pubdev_version, publish-native-assets]
    if: ${{ needs.validate-inputs.outputs.publish == 'true' && needs.pubdev_version.outputs.exists != 'true' && needs.publish-native-assets.outputs.public_verified == 'true' }}
    runs-on: ubuntu-24.04
    environment: pub.dev
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Checkout trusted Flutter release verifier
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false

      - uses: actions/download-artifact@v8.0.2
        with:
          name: merman-flutter-package
          path: target/flutter-package

      - name: Verify and extract Flutter package artifact
        env:
          SOURCE_SHA: ${{ needs.validate-inputs.outputs.source_sha }}
          SOURCE_TREE: ${{ needs.validate-inputs.outputs.source_tree }}
          VERSION: ${{ needs.validate-inputs.outputs.version }}
        run: |
          python3 trusted/scripts/flutter_release_archive.py extract \
            --archive target/flutter-package/merman-flutter-package.tar.gz \
            --receipt target/flutter-package/merman-flutter-package.receipt.json \
            --destination target/flutter-publish --require-thin \
            --source-sha "$SOURCE_SHA" --source-tree "$SOURCE_TREE" --version "$VERSION"

      - name: Verify release tag still resolves to the native source commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-inputs.outputs.release_tag }}
          AUTHENTICATION_TAG: ${{ needs.validate-inputs.outputs.authentication_tag }}
          AUTHENTICATION_SHA: ${{ needs.validate-inputs.outputs.authentication_sha }}
          SOURCE_SHA: ${{ needs.publish-native-assets.outputs.native_source_sha }}
          SOURCE_TREE: ${{ needs.validate-inputs.outputs.native_source_tree }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > /dev/null
          observed="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)"
          test "$observed" = "$SOURCE_SHA"
          native_tree="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$SOURCE_SHA" --jq .tree.sha)"
          test "$native_tree" = "$SOURCE_TREE"
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$AUTHENTICATION_TAG" > /dev/null
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$AUTHENTICATION_TAG" --jq .sha)" = "$AUTHENTICATION_SHA"

      - name: Reconcile before permitting a pub.dev upload
        id: send
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          AUTHENTICATION_TAG: ${{ needs.validate-inputs.outputs.authentication_tag }}
          AUTHENTICATION_SHA: ${{ needs.validate-inputs.outputs.authentication_sha }}
          VERSION: ${{ needs.validate-inputs.outputs.version }}
        run: |
          set -euo pipefail
          state="$(cd trusted && python3 -m scripts.reconcile_pub_package \
            --archive "$GITHUB_WORKSPACE/target/flutter-package/merman-flutter-package.tar.gz" \
            --package merman --version "$VERSION")"
          if test "$state" = exact; then
            echo 'upload=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$state" = missing
          history="$(python3 trusted/scripts/release_attempt_history.py \
            --owner flutter --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" --before-attempt "$RUN_ATTEMPT" \
            --authentication-tag "$AUTHENTICATION_TAG" --authentication-sha "$AUTHENTICATION_SHA")"
          test "$history" = never-attempted || {
            echo '::error::The earlier pub.dev upload outcome is unresolved. Observe the original package; do not resend.' >&2
            exit 1
          }
          echo 'upload=true' >> "$GITHUB_OUTPUT"

      - name: Setup Dart with pub.dev OIDC credentials
        if: ${{ steps.send.outputs.upload == 'true' }}
        uses: dart-lang/setup-dart@v1.8.1

      - name: Publish to pub.dev
        if: ${{ steps.send.outputs.upload == 'true' }}
        working-directory: target/flutter-publish
        run: dart pub publish --force --skip-validation

      - name: Reconcile exact public package after publication
        working-directory: trusted
        env:
          VERSION: ${{ needs.validate-inputs.outputs.version }}
        run: |
          set -euo pipefail
          state="$(python3 -m scripts.reconcile_pub_package \
            --archive "$GITHUB_WORKSPACE/target/flutter-package/merman-flutter-package.tar.gz" \
            --package merman --version "$VERSION")"
          test "$state" = exact
