name: Release Android (AAR)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to upload the AAR to, for example v0.8.0-alpha.5"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-inputs:
    name: validate-inputs
    runs-on: ubuntu-24.04
    outputs:
      source_ref: ${{ steps.release.outputs.source_ref }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      source_tree: ${{ steps.source.outputs.source_tree }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Validate release inputs
        id: release
        shell: bash
        env:
          DISPATCH_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          semver_re='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.(0|[1-9][0-9]*))?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          tag_re="^v${semver_re#^}"
          fail() {
            echo "::error::$1" >&2
            exit 1
          }

          RELEASE_TAG="$DISPATCH_RELEASE_TAG"

          [[ "$RELEASE_TAG" =~ $tag_re ]] || fail "release_tag must match vX.Y.Z or vX.Y.Z-alpha.N/beta.N/rc.N."
          SOURCE_REF="refs/tags/$RELEASE_TAG"

          VERSION="${RELEASE_TAG#v}"
          [[ "$VERSION" =~ $semver_re ]] || fail "release_tag contains an unsupported SemVer version."

          {
            printf 'source_ref=%s\n' "$SOURCE_REF"
            printf 'release_tag=%s\n' "$RELEASE_TAG"
            printf 'version=%s\n' "$VERSION"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.source_ref }}
          persist-credentials: false
          fetch-depth: 1
          fetch-tags: true

      - name: Resolve immutable release source
        id: source
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse "HEAD^{commit}")"
          source_tree="$(git rev-parse "HEAD^{tree}")"
          tag_sha="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          tag_tree="$(git rev-parse "refs/tags/${RELEASE_TAG}^{tree}")"
          test "$source_sha" = "$tag_sha"
          test "$source_tree" = "$tag_tree"
          {
            printf 'source_sha=%s\n' "$source_sha"
            printf 'source_tree=%s\n' "$source_tree"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: validate-inputs
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate-inputs.outputs.source_sha }}
          persist-credentials: false

      - name: Verify pinned release source
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.validate-inputs.outputs.source_sha }}
          EXPECTED_SOURCE_TREE: ${{ needs.validate-inputs.outputs.source_tree }}
        run: |
          set -euo pipefail
          test "$(git rev-parse "HEAD^{commit}")" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse "HEAD^{tree}")" = "$EXPECTED_SOURCE_TREE"

      - name: Read Android toolchain versions
        id: android-toolchain
        run: |
          echo "java=$(python3 platforms/android/build-android.py --print-version java)" >> "$GITHUB_OUTPUT"
          echo "ndk=$(python3 platforms/android/build-android.py --print-version ndk)" >> "$GITHUB_OUTPUT"

      - name: Use validated release metadata
        id: version
        env:
          RELEASE_TAG: ${{ needs.validate-inputs.outputs.release_tag }}
          VERSION: ${{ needs.validate-inputs.outputs.version }}
        run: |
          set -euo pipefail
          {
            printf 'tag=%s\n' "$RELEASE_TAG"
            printf 'version=%s\n' "$VERSION"
          } >> "$GITHUB_OUTPUT"
          echo "Tag version: $VERSION"

      - name: Verify release version projections match tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 scripts/release-version.py check --version "$VERSION"

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.android-toolchain.outputs.java }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Android NDK
        shell: bash
        env:
          ANDROID_NDK_VERSION: ${{ steps.android-toolchain.outputs.ndk }}
        run: |
          set -euo pipefail
          sdkmanager --install "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Build Android native libraries
        run: python3 platforms/android/build-android.py --targets aarch64-linux-android x86_64-linux-android

      - name: Verify legal material projections
        run: python3 scripts/sync-release-legal-materials.py --check

      - name: Run Android JVM contract tests
        run: platforms/android/gradlew -p platforms/android testDebugUnitTest --stacktrace

      - name: Publish to the local Maven staging repository
        run: platforms/android/gradlew -p platforms/android publishReleasePublicationToLocalStagingRepository --stacktrace

      - name: Verify Maven publication contract
        run: python3 scripts/verify-platform-bindings.py --verify-android-maven

      - name: Prepare release asset
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p target/release-assets
          staged_aar="platforms/android/build/repo/io/merman/merman-android/${VERSION}/merman-android-${VERSION}.aar"
          test -f "$staged_aar"
          cp "$staged_aar" "target/release-assets/merman-android-${RELEASE_TAG}.aar"

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v6
        with:
          name: merman-android-aar
          path: target/release-assets/*.aar

  upload-release:
    needs: [validate-inputs, build]
    runs-on: ubuntu-24.04
    environment: github-release
    permissions:
      contents: write
    steps:
      - name: Download AAR artifact
        uses: actions/download-artifact@v6
        with:
          name: merman-android-aar
          path: target/release-assets

      - name: Upload AAR to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate-inputs.outputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" target/release-assets/*.aar --clobber
          else
            echo "::error::GitHub Release $RELEASE_TAG does not exist; create it before uploading AAR assets."
            exit 1
          fi
