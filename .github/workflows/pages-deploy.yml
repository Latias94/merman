name: GitHub Pages

on:
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/pages-deploy.yml"
      - ".github/workflows/pages.yml"
      - "contracts/abi/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "LICENSE-*"
      - "THIRD_PARTY_NOTICES.md"
      - "THIRD_PARTY_LICENSES/**"
      - "crates/**"
      - "docs/release/WASM_SIZE_BUDGETS.json"
      - "docs/workstreams/web-wasm-playground/editor-artifact-receipt-v*.json"
      - "platforms/web/**"
      - "playground/**"
      - "scripts/check-svg-safety-policy.mjs"
      - "scripts/generate-svg-safety-policy.mjs"
      - "scripts/svg-safety-policy.mjs"
      - "scripts/sync-release-legal-materials.py"
      - "tools/vscode-extension/src/preview-svg-safety-policy.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test playground
    permissions:
      contents: read
    uses: ./.github/workflows/pages.yml
    with:
      ci_only: false

  deploy:
    name: Deploy playground
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
