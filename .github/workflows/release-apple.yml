name: Release Apple (SwiftPM)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Matching version tag; the tag need not exist for a nonpublishing candidate"
        required: true
        type: string
      source_ref:
        description: "Immutable commit, main, or the matching release tag"
        default: main
        type: string
      publish:
        description: "Upload qualified packages to an existing immutable tagged release"
        default: false
        type: boolean
      remote_package_url:
        description: "Optional HTTPS Git URL containing the exact thin delivery tree; never created by this workflow"
        default: ""
        type: string
      remote_package_revision:
        description: "Exact delivery-repository commit to resolve and render; required with remote_package_url"
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: release-apple-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  validate-inputs:
    name: validate-inputs
    runs-on: ubuntu-24.04
    outputs:
      source_ref: ${{ steps.release.outputs.source_ref }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      source_tree: ${{ steps.source.outputs.source_tree }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Validate release inputs
        id: release
        shell: bash
        env:
          DISPATCH_RELEASE_TAG: ${{ inputs.release_tag }}
          DISPATCH_SOURCE_REF: ${{ inputs.source_ref }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail

          semver_re='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.(0|[1-9][0-9]*))?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          tag_re="^v${semver_re#^}"
          fail() {
            echo "::error::$1" >&2
            exit 1
          }

          RELEASE_TAG="$DISPATCH_RELEASE_TAG"

          [[ "$RELEASE_TAG" =~ $tag_re ]] || fail "release_tag must match vX.Y.Z or vX.Y.Z-alpha.N/beta.N/rc.N."
          if [[ "$PUBLISH" == true ]]; then
            [[ "$DISPATCH_SOURCE_REF" == "$RELEASE_TAG" || "$DISPATCH_SOURCE_REF" == "refs/tags/$RELEASE_TAG" ]] ||
              fail "publishing requires source_ref to be the matching immutable tag"
            SOURCE_REF="refs/tags/$RELEASE_TAG"
          elif [[ "$DISPATCH_SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            SOURCE_REF="$DISPATCH_SOURCE_REF"
          elif [[ "$DISPATCH_SOURCE_REF" == main || "$DISPATCH_SOURCE_REF" == refs/heads/main ]]; then
            SOURCE_REF=refs/heads/main
          elif [[ "$DISPATCH_SOURCE_REF" == "$RELEASE_TAG" || "$DISPATCH_SOURCE_REF" == "refs/tags/$RELEASE_TAG" ]]; then
            SOURCE_REF="refs/tags/$RELEASE_TAG"
          else
            fail "source_ref must be an immutable commit, main, or the matching release tag"
          fi

          VERSION="${RELEASE_TAG#v}"
          [[ "$VERSION" =~ $semver_re ]] || fail "release_tag contains an unsupported SemVer version."

          {
            printf 'source_ref=%s\n' "$SOURCE_REF"
            printf 'release_tag=%s\n' "$RELEASE_TAG"
            printf 'version=%s\n' "$VERSION"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.release.outputs.source_ref }}
          persist-credentials: false
          fetch-depth: 1
          fetch-tags: true

      - name: Resolve immutable release source
        id: source
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          SOURCE_REF: ${{ steps.release.outputs.source_ref }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse "HEAD^{commit}")"
          source_tree="$(git rev-parse "HEAD^{tree}")"
          if [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            test "$source_sha" = "$SOURCE_REF"
          fi
          if [[ "$PUBLISH" == true || "$SOURCE_REF" == "refs/tags/$RELEASE_TAG" ]]; then
            tag_sha="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
            tag_tree="$(git rev-parse "refs/tags/${RELEASE_TAG}^{tree}")"
            test "$source_sha" = "$tag_sha"
            test "$source_tree" = "$tag_tree"
          fi
          {
            printf 'source_sha=%s\n' "$source_sha"
            printf 'source_tree=%s\n' "$source_tree"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: validate-inputs
    runs-on: macos-15
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.validate-inputs.outputs.source_sha }}
          persist-credentials: false

      - name: Verify pinned release source
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.validate-inputs.outputs.source_sha }}
          EXPECTED_SOURCE_TREE: ${{ needs.validate-inputs.outputs.source_tree }}
        run: |
          set -euo pipefail
          test "$(git rev-parse "HEAD^{commit}")" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse "HEAD^{tree}")" = "$EXPECTED_SOURCE_TREE"

      - name: Use validated release metadata
        id: version
        env:
          RELEASE_TAG: ${{ needs.validate-inputs.outputs.release_tag }}
          VERSION: ${{ needs.validate-inputs.outputs.version }}
        run: |
          set -euo pipefail
          {
            printf 'tag=%s\n' "$RELEASE_TAG"
            printf 'version=%s\n' "$VERSION"
          } >> "$GITHUB_OUTPUT"
          echo "Tag version: $VERSION"

      - name: Verify release version projections match tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 scripts/release-version.py check --version "$VERSION"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: llvm-tools-preview
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2.9.2

      - name: Build Apple XCFramework
        env:
          MERMAN_AUTO_INSTALL_RUST_TARGETS: "false"
        run: bash scripts/build-apple-xcframework.sh

      - name: Verify legal material projections
        run: python3 scripts/sync-release-legal-materials.py --check

      - name: Validate Swift package
        run: |
          swift package describe
          swift run --package-path platforms/apple/examples/smoke MermanAppleSmoke
          git ls-files --error-unmatch -- platforms/apple/Sources/Merman/Generated/Merman.swift platforms/apple/Sources/Merman/Generated/MermanFFI.h platforms/apple/Sources/Merman/Generated/MermanFFI.modulemap
          git diff --exit-code -- platforms/apple/Sources/Merman/Generated

      - name: Package matching SwiftPM and XCFramework distributions
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          SOURCE_SHA: ${{ needs.validate-inputs.outputs.source_sha }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 scripts/apple_package.py --output-dir target/apple-package --version "$VERSION" \
            --source-commit "$SOURCE_SHA" \
            --artifact-url "https://github.com/$GH_REPO/releases/download/$RELEASE_TAG/Merman.xcframework-${RELEASE_TAG}.zip"

      - name: Qualify extracted package, simulator runtime and matched archive sizes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 scripts/apple_qualify.py \
            --package-archive "target/apple-package/Merman-swiftpm-v$VERSION.zip" \
            --work-dir target/apple-qualification --version "$VERSION" --simulator --compare-original

      - name: Upload XCFramework artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: merman-apple-xcframework
          if-no-files-found: error
          path: |
            target/apple-package/Merman.xcframework-${{ steps.version.outputs.tag }}.zip
            target/apple-package/Merman.xcframework-${{ steps.version.outputs.tag }}.zip.checksum
            target/apple-package/Merman-swiftpm-${{ steps.version.outputs.tag }}.zip
            target/apple-package/Merman-swiftpm-${{ steps.version.outputs.tag }}.zip.checksum
            target/apple-package/Merman-swiftpm-remote-${{ steps.version.outputs.tag }}.zip
            target/apple-package/Merman-swiftpm-remote-${{ steps.version.outputs.tag }}.zip.checksum
            target/apple-package/Merman-swiftpm-${{ steps.version.outputs.tag }}.Package.swift

      - name: Retain consumer and size evidence
        uses: actions/upload-artifact@v7.0.2
        with:
          name: merman-apple-qualification
          if-no-files-found: error
          path: |
            target/apple-qualification/qualification.json
            target/apple-qualification/installed/*.json
            target/apple-qualification/comparison/original.json

  qualify-remote:
    if: ${{ !cancelled() && needs.build.result == 'success' && (!inputs.publish || needs.upload-release.result == 'success') && (inputs.remote_package_url != '' || inputs.remote_package_revision != '') }}
    needs: [validate-inputs, build, upload-release]
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.validate-inputs.outputs.source_sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v8.0.2
        with:
          name: merman-apple-xcframework
          path: target/apple-package

      - name: Resolve the exact remote SwiftPM dependency and execute consumers
        env:
          VERSION: ${{ needs.validate-inputs.outputs.version }}
          REMOTE_PACKAGE_URL: ${{ inputs.remote_package_url }}
          REMOTE_PACKAGE_REVISION: ${{ inputs.remote_package_revision }}
        run: |
          python3 scripts/apple_qualify.py \
            --package-archive "target/apple-package/Merman-swiftpm-remote-v$VERSION.zip" \
            --work-dir target/apple-remote-qualification --version "$VERSION" --simulator \
            --remote-package-url "$REMOTE_PACKAGE_URL" --remote-package-revision "$REMOTE_PACKAGE_REVISION"

      - name: Retain remote resolution and consumer evidence
        uses: actions/upload-artifact@v7.0.2
        with:
          name: merman-apple-remote-qualification
          if-no-files-found: error
          path: |
            target/apple-remote-qualification/qualification.json
            target/apple-remote-qualification/installed/*.json
            target/apple-remote-qualification/installed/*/consumer/Package.resolved

  upload-release:
    if: ${{ inputs.publish }}
    needs: [validate-inputs, build]
    runs-on: ubuntu-24.04
    environment: github-release
    permissions:
      contents: write
    steps:
      - name: Download XCFramework artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: merman-apple-xcframework
          path: platforms/apple

      - name: Upload XCFramework to GitHub Release
        id: upload-release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate-inputs.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.validate-inputs.outputs.source_sha }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null
          observed="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)"
          test "$observed" = "$SOURCE_SHA" || {
            echo "::error::Release tag moved after artifact verification." >&2
            exit 1
          }
          assets=(
            "platforms/apple/Merman.xcframework-${RELEASE_TAG}.zip"
            "platforms/apple/Merman.xcframework-${RELEASE_TAG}.zip.checksum"
            "platforms/apple/Merman-swiftpm-${RELEASE_TAG}.zip"
            "platforms/apple/Merman-swiftpm-${RELEASE_TAG}.zip.checksum"
            "platforms/apple/Merman-swiftpm-remote-${RELEASE_TAG}.zip"
            "platforms/apple/Merman-swiftpm-remote-${RELEASE_TAG}.zip.checksum"
            "platforms/apple/Merman-swiftpm-${RELEASE_TAG}.Package.swift"
          )
          for asset in "${assets[@]}"; do test -f "$asset"; done
          is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)"
          if test "$is_draft" != false; then
            echo "::error::Publish GitHub Release $RELEASE_TAG before uploading XCFramework assets."
            exit 1
          fi
          if ! existing_assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"; then
            echo "::error::GitHub Release $RELEASE_TAG does not exist; create it before uploading XCFramework assets."
            exit 1
          fi
          existing_dir="$(mktemp -d)"
          missing_assets=()
          for asset in "${assets[@]}"; do
            name="$(basename "$asset")"
            if grep --fixed-strings --line-regexp --quiet "$name" <<< "$existing_assets"; then
              gh release download "$RELEASE_TAG" --pattern "$name" --dir "$existing_dir"
              cmp "$asset" "$existing_dir/$name"
            else
              missing_assets+=("$asset")
            fi
          done
          if test "${#missing_assets[@]}" -gt 0; then
            gh release upload "$RELEASE_TAG" "${missing_assets[@]}"
          fi

      - name: Verify published XCFramework bytes
        id: verify-published
        env:
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate-inputs.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.validate-inputs.outputs.source_sha }}
        run: |
          set -euo pipefail
          verify_dir="$(mktemp -d)"
          assets=(
            "platforms/apple/Merman.xcframework-${RELEASE_TAG}.zip"
            "platforms/apple/Merman.xcframework-${RELEASE_TAG}.zip.checksum"
            "platforms/apple/Merman-swiftpm-${RELEASE_TAG}.zip"
            "platforms/apple/Merman-swiftpm-${RELEASE_TAG}.zip.checksum"
            "platforms/apple/Merman-swiftpm-remote-${RELEASE_TAG}.zip"
            "platforms/apple/Merman-swiftpm-remote-${RELEASE_TAG}.zip.checksum"
            "platforms/apple/Merman-swiftpm-${RELEASE_TAG}.Package.swift"
          )
          for asset in "${assets[@]}"; do
            test -f "$asset"
            name="$(basename "$asset")"
            curl --disable --fail --location --silent --show-error \
              --proto '=https' --proto-redir '=https' \
              --output "$verify_dir/$name" \
              "https://github.com/$GH_REPO/releases/download/$RELEASE_TAG/$name"
            cmp "$asset" "$verify_dir/$name"
          done
          (
            cd "$verify_dir"
            sha256sum --check --strict ./*.checksum
          )
          {
            printf '## Apple delivery verified\n\n'
            printf 'Release: %s\n\nSource: %s\n\n' "$RELEASE_TAG" "$SOURCE_SHA"
            for asset in "${assets[@]}"; do
              name="$(basename "$asset")"
              printf -- '- [%s](https://github.com/%s/releases/download/%s/%s)\n' "$name" "$GH_REPO" "$RELEASE_TAG" "$name"
            done
            printf '\nAll public downloads match the qualified build artifacts byte for byte.\n'
          } >> "$GITHUB_STEP_SUMMARY"
