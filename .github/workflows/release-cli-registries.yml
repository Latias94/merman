name: CLI Registry Candidates

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Published stable workspace tag, for example v0.8.0"
        required: true
        type: string

permissions:
  contents: read
  attestations: read

concurrency:
  group: cli-registry-candidates-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.release.outputs.version }}
      source_sha: ${{ steps.release.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Resolve the published stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "::error::Expected a stable vX.Y.Z release tag."
            exit 1
          }
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" > release.json
          jq -e --arg tag "$RELEASE_TAG" '.tag_name == $tag and .draft == false and .prerelease == false' release.json
          source_sha="$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          {
            printf 'version=%s\n' "${RELEASE_TAG#v}"
            printf 'source_sha=%s\n' "$source_sha"
          } >> "$GITHUB_OUTPUT"
      - name: Checkout the immutable artifact source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.release.outputs.source_sha }}
          path: release-source
          persist-credentials: false
      - name: Download and verify the original release bundle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" --dir release-assets \
            --pattern 'merman-cli-*' --pattern 'merman-lsp-*' \
            --pattern 'sha256.sum' --pattern 'release-verification.json'
          gh attestation verify release-assets/release-verification.json \
            --repo "$GH_REPO" --signer-workflow "$GH_REPO/.github/workflows/release.yml"
          python3 scripts/release_artifact_bundle.py verify-bundle release-assets \
            --version "$RELEASE_VERSION" --source-sha "$SOURCE_SHA"
          python3 scripts/generate_cli_registry_candidates.py release-assets \
            --version "$RELEASE_VERSION" --repo-root release-source --output-dir candidates
          # Keep the artifact/source receipt beside the generated registry manifests.
          cp release-assets/release-verification.json candidates/
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: cli-registry-candidates-${{ steps.release.outputs.version }}
          path: candidates
          if-no-files-found: error

  winget:
    needs: prepare
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: cli-registry-candidates-${{ needs.prepare.outputs.version }}
          path: candidates
      - name: Install pinned WinGet validator
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $existing = Get-Command winget.exe -ErrorAction SilentlyContinue
          if ($null -ne $existing) { & $existing.Source --version }
          Install-Module Microsoft.WinGet.Client -RequiredVersion 1.29.380 `
            -Repository PSGallery -Scope CurrentUser -Force
          Import-Module Microsoft.WinGet.Client -RequiredVersion 1.29.380
          Repair-WinGetPackageManager -Version 1.29.380 -Force
          $actual = & winget.exe --version
          Write-Output "WinGet validator: $actual"
          if ($LASTEXITCODE -ne 0 -or $actual.Trim() -ne "v1.29.380") {
            throw "The pinned WinGet validator is unavailable."
          }
      - name: Validate the version directory
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        shell: pwsh
        run: |
          winget.exe validate `
            --manifest "candidates/winget/manifests/l/Latias94/MermanCLI/$env:RELEASE_VERSION" `
            --disable-interactivity
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: winget-validated-${{ needs.prepare.outputs.version }}
          path: |
            candidates/winget
            candidates/release-verification.json
          if-no-files-found: error

  scoop:
    needs: prepare
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: cli-registry-candidates-${{ needs.prepare.outputs.version }}
          path: candidates
      - name: Checkout the official Scoop schema
        uses: actions/checkout@v7.0.1
        with:
          repository: ScoopInstaller/Scoop
          ref: v0.6.0
          path: scoop-schema
          persist-credentials: false
          sparse-checkout: schema.json
          sparse-checkout-cone-mode: false
      - name: Validate the Scoop manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Json -LiteralPath candidates/scoop/merman-cli.json `
              -SchemaFile scoop-schema/schema.json)) {
            throw "The Scoop manifest does not match the official schema."
          }
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: scoop-validated-${{ needs.prepare.outputs.version }}
          path: |
            candidates/scoop
            candidates/release-verification.json
          if-no-files-found: error
