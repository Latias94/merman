name: Performance

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled
    paths:
      - ".github/workflows/performance.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "docs/performance/**"
      - "tools/bench/**"
      - "tools/mermaid-cli/**"
      - "crates/merman/**"
      - "crates/merman-ascii/**"
      - "crates/merman-bindings-core/**"
      - "crates/merman-cli/**"
      - "crates/merman-core/**"
      - "crates/merman-core-graph/**"
      - "crates/merman-core-preprocess/**"
      - "crates/merman-core-sequence/**"
      - "crates/merman-core-structured/**"
      - "crates/merman-elk-layered/**"
      - "crates/merman-export/**"
      - "crates/merman-layout-elk/**"
      - "crates/merman-model/**"
      - "crates/merman-markup/**"
      - "crates/merman-render/**"
      - "crates/merman-render-charts/**"
      - "crates/merman-render-core/**"
      - "crates/merman-render-graph/**"
      - "crates/merman-render-structured/**"
      - "crates/roughr/**"
      - "crates/manatee/**"
      - "crates/dugong/**"
      - "crates/dugong-graphlib/**"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      run:
        description: "Which performance lane to run"
        type: choice
        default: regression
        options:
          - contracts
          - ascii
          - frontmatter
          - regression
          - reference
          - full
      preset:
        description: "Benchmark preset"
        type: choice
        default: long
        options:
          - quick
          - long
      suite:
        description: "Corpus suite"
        type: choice
        default: canary
        options:
          - canary
          - standard
          - cross_family
          - full
      ascii_suite:
        description: "ASCII corpus suite"
        type: choice
        default: comparable
        options:
          - comparable
          - closeout
      base_ref:
        description: "Base ref for regression comparisons"
        required: false
        default: main
      base_repository:
        description: "Base repository for manual regression comparisons"
        required: false
        default: ""
      head_ref:
        description: "Head ref for manual runs; set this when head_repository differs"
        required: false
        default: ""
      head_repository:
        description: "Head repository for manual runs"
        required: false
        default: ""
      relative_threshold_percent:
        description: "Relative regression threshold percentage"
        required: false
        default: "10"
      evidence_mode:
        description: "Evidence quality for self comparisons"
        type: choice
        default: confirmation
        options:
          - diagnostic
          - confirmation
      absolute_threshold_ns:
        description: "Absolute regression threshold in nanoseconds (50000 = 50 us)"
        required: false
        default: "50000"

permissions:
  contents: read

concurrency:
  group: performance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eligibility:
    name: perf-eligibility
    runs-on: ubuntu-24.04
    outputs:
      contracts: ${{ steps.select.outputs.performance }}
    steps:
      - name: Checkout classifier input
        if: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'perf') && !contains(github.event.pull_request.labels.*.name, 'perf-frontmatter') }}
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select standalone performance contracts
        id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HAS_REGRESSION_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'perf') }}
          HAS_FRONTMATTER_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'perf-frontmatter') }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ||
                "$HAS_REGRESSION_LABEL" == "true" ||
                "$HAS_FRONTMATTER_LABEL" == "true" ]]; then
            echo "performance=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 scripts/ci_plan.py plan \
            --base "$PR_BASE_SHA" \
            --head "$PR_HEAD_SHA" \
            --github-output "$GITHUB_OUTPUT"

  contracts:
    name: perf-contracts
    needs: eligibility
    if: ${{ needs.eligibility.outputs.contracts == 'true' }}
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
    steps:
      # Keep PR contract recipes and source on the same merge revision.
      - name: Checkout contract revision
        uses: actions/checkout@v7.0.1
        with:
          path: head
          fetch-depth: 5 # The weekly baseline contract exercises a multi-commit Git interval.
          persist-credentials: false
          ref: ${{ inputs.head_ref || github.sha }}
          repository: ${{ inputs.head_repository || github.repository }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.100.0

      - name: Check performance helper contracts
        if: github.event_name != 'pull_request'
        working-directory: head
        run: |
          python3 -m compileall -q tools/bench/bench.py tools/bench/merman_bench
          python3 -m unittest discover -s tools/bench
          node --test tools/bench/collectors/node_runner.test.mjs

      - name: Verify compiled pipeline benchmark list
        if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'perf')
        working-directory: head
        run: python3 tools/bench/bench.py criterion-list --features all-diagrams,svg,compat-json,editor-facts,layout-cytoscape,layout-dagre,layout-elk,math

      - name: Verify compiled ASCII benchmark list
        working-directory: head
        run: |
          python3 tools/bench/bench.py criterion-list \
            --corpus-view ascii \
            --features all-diagrams,ascii

      - name: Build native memory probe contract
        if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'perf')
        working-directory: head
        run: |
          cargo test --locked -p merman --test native_memory_allocator
          python3 tools/bench/bench.py memory --smoke \
            --build-timeout-seconds 900 \
            --json-out target/bench/native_memory_smoke.json
          python3 tools/bench/test_contracts.py \
            --verify-smoke-report target/bench/native_memory_smoke.json

  measurement-plan:
    name: perf-measurement-plan
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'perf') || contains(github.event.pull_request.labels.*.name, 'perf-frontmatter')
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      selected: ${{ steps.plan.outputs.selected }}
    steps:
      - name: Checkout performance descriptors
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.head_ref || github.sha }}
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || inputs.head_repository || github.repository }}

      - name: Select performance descriptors
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_RUN: ${{ inputs.run }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          python3 tools/bench/bench.py ci select \
            --event "$EVENT_NAME" \
            --dispatch-run "$DISPATCH_RUN" \
            --labels-json "$PR_LABELS" \
            --github-output "$GITHUB_OUTPUT"

  measurement:
    name: perf-${{ matrix.id }}
    needs: [measurement-plan, weekly-baseline]
    if: ${{ !cancelled() && needs.measurement-plan.result == 'success' && needs.measurement-plan.outputs.selected == 'true' }}
    runs-on: &measurement_runner ubuntu-24.04
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.measurement-plan.outputs.matrix) }}
    steps:
      - name: Checkout head
        uses: actions/checkout@v7.0.1
        with:
          path: head
          fetch-depth: ${{ github.event_name == 'schedule' && matrix.id != 'regression' && 2 || 1 }}
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.head_ref || github.sha }}
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || inputs.head_repository || github.repository }}

      - name: Resolve the scheduled base for this descriptor
        id: scheduled-base
        if: github.event_name == 'schedule'
        working-directory: head
        env:
          LANE: ${{ matrix.id }}
          MEASURED_BASE: ${{ needs.weekly-baseline.result == 'success' && needs.weekly-baseline.outputs.base_sha || '' }}
        run: |
          if [[ "$LANE" == regression ]]; then
            sha="${MEASURED_BASE:?Scheduled workload baseline selection failed}"
          else
            sha="$(git rev-parse HEAD^)"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout base
        uses: actions/checkout@v7.0.1
        with:
          path: base
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || steps.scheduled-base.outputs.sha || inputs.base_ref || 'main' }}
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.repo.full_name || inputs.base_repository || github.repository }}

      - name: Install Rust toolchain
        uses: &measurement_toolchain dtolnay/rust-toolchain@1.100.0

      - name: Read the base revision's performance recipe
        id: base-recipe
        env:
          LANE_ID: ${{ matrix.id }}
        run: |
          PYTHONPATH=head/tools/bench python3 - <<'PY'
          import os
          from pathlib import Path

          from merman_bench.ci import CORPUS, load_registry

          base = Path("base")
          legacy = base / "tools/bench/performance_lanes.json"
          registry = load_registry(legacy if legacy.is_file() else base / CORPUS)
          lane = registry.by_id[os.environ["LANE_ID"]]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"bench={lane['bench']}\n")
              output.write(f"features={lane['features']}\n")
              output.write(f"default_features={str(lane['default_features']).lower()}\n")
              output.write(f"corpus={lane['corpus']}\n")
              output.write(f"corpus_view={lane.get('corpus_view', '')}\n")
          PY

      - name: Measure descriptor and write receipt
        id: comparison
        working-directory: head
        env:
          PRESET: ${{ github.event_name == 'pull_request' && 'quick' || inputs.preset || 'long' }}
          SUITE: ${{ github.event_name == 'workflow_dispatch' && matrix.id == 'regression' && inputs.suite || github.event_name == 'workflow_dispatch' && matrix.id == 'ascii' && inputs.ascii_suite || matrix.suite }}
          GROUP: ${{ matrix.group }}
          PACKAGE: ${{ matrix.package }}
          BENCH: ${{ matrix.bench }}
          BASE_BENCH: ${{ steps.base-recipe.outputs.bench }}
          CORPUS: ${{ matrix.corpus }}
          CORPUS_VIEW: ${{ matrix.corpus_view }}
          BASE_CORPUS: ${{ steps.base-recipe.outputs.corpus }}
          BASE_CORPUS_VIEW: ${{ steps.base-recipe.outputs.corpus_view }}
          FEATURES: ${{ matrix.features }}
          BASE_FEATURES: ${{ steps.base-recipe.outputs.features }}
          BASE_DEFAULT_FEATURES: ${{ steps.base-recipe.outputs.default_features }}
          DEFAULT_FEATURES: ${{ matrix.default_features }}
          EVIDENCE_MODE: ${{ github.event_name == 'pull_request' && 'diagnostic' || inputs.evidence_mode || 'confirmation' }}
          RELATIVE_THRESHOLD_PERCENT: ${{ inputs.relative_threshold_percent || '10' }}
          ABSOLUTE_THRESHOLD_NS: ${{ inputs.absolute_threshold_ns || '50000' }}
          BASE_LABEL: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.repo.full_name || inputs.base_repository || github.repository }}@${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || steps.scheduled-base.outputs.sha || inputs.base_ref || 'main' }}
          HEAD_LABEL: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || inputs.head_repository || github.repository }}@${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || inputs.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          args=(
            --base-dir ../base
            --head-dir .
            --base-target-dir target/performance/base
            --head-target-dir target/performance/head
            --base-package "$PACKAGE"
            --head-package "$PACKAGE"
            --base-bench "$BASE_BENCH"
            --head-bench "$BENCH"
            --base-corpus "$BASE_CORPUS"
            --head-corpus "$CORPUS"
            --base-features "$BASE_FEATURES"
            --head-features "$FEATURES"
            --base-label "$BASE_LABEL"
            --head-label "$HEAD_LABEL"
            --preset "$PRESET"
            --suite "$SUITE"
            --evidence-mode "$EVIDENCE_MODE"
            --relative-threshold-percent "$RELATIVE_THRESHOLD_PERCENT"
            --absolute-threshold-ns "$ABSOLUTE_THRESHOLD_NS"
            --out target/performance/comparison.md
            --json-out target/performance/comparison.json
          )
          if [[ -n "$BASE_CORPUS_VIEW" ]]; then
            args+=(--base-corpus-view "$BASE_CORPUS_VIEW")
          fi
          if [[ -n "$CORPUS_VIEW" ]]; then
            args+=(--head-corpus-view "$CORPUS_VIEW")
          fi
          case "$DEFAULT_FEATURES" in
            true) ;;
            false) args+=(--no-head-default-features) ;;
            *)
              echo "unsupported default-feature policy: $DEFAULT_FEATURES" >&2
              exit 1
              ;;
          esac
          case "$BASE_DEFAULT_FEATURES" in
            true) ;;
            false) args+=(--no-base-default-features) ;;
            *)
              echo "unsupported base default-feature policy: $BASE_DEFAULT_FEATURES" >&2
              exit 1
              ;;
          esac
          if [[ -n "$GROUP" ]]; then
            args+=(--group "$GROUP")
          fi
          set +e
          python3 tools/bench/bench.py ab "${args[@]}"
          comparison_exit=$?
          set -e
          echo "comparison_exit=$comparison_exit" >> "$GITHUB_OUTPUT"

      - name: Render receipt summary
        id: render
        if: ${{ always() }}
        working-directory: head
        run: |
          set -euo pipefail
          set +e
          python3 tools/bench/bench.py summary \
            --json target/performance/comparison.json \
            --out target/performance/summary.md \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --artifact "${{ matrix.artifact }}" \
            --marker "${{ matrix.marker }}" \
            --title "${{ matrix.title }}" \
            --process-exit-code "${{ steps.comparison.outputs.comparison_exit || '2' }}"
          render_exit=$?
          set -e
          echo "render_exit=$render_exit" >> "$GITHUB_OUTPUT"

      - name: Upload measurement receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            head/target/performance/comparison.md
            head/target/performance/comparison.json
            head/target/performance/summary.md

      - name: Observe ordered workloads on the measured revisions
        id: workloads
        if: ${{ matrix.id == 'regression' && hashFiles('head/tools/bench/bench.py') != '' }}
        env:
          WORKLOAD_SUITE: ${{ (github.event_name == 'schedule' || inputs.run == 'full') && 'full' || 'quick' }}
        run: &workload_recipe |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/head/target/performance/workloads"
          bench=tools/bench/bench.py
          python3 "head/$bench" plan --suite "$WORKLOAD_SUITE" --out "$out/plan.json"
          incomplete=0
          for side in head base; do
            driver="$side/$bench"
            if [[ ! -f "$driver" ]]; then
              driver="$side/tools/bench/run_workloads.py"
            fi
            if [[ ! -f "$driver" ]]; then
              echo 'This revision predates the ordered workload runner.' > "$out/$side-unavailable.txt"
              continue
            fi
            python3 "$driver" rust --plan "$out/plan.json" --metric memory --out "$out/$side-memory.json" || incomplete=1
            python3 "$driver" rust --plan "$out/plan.json" --metric work --out "$out/$side-work.json" || incomplete=1
            python3 "$driver" rust --plan "$out/plan.json" --metric memory --operation prepare-retained --scenario retained-configs --warmups 0 --site-css-bytes 65536 --out "$out/$side-retained.json" || incomplete=1
          done
          for metric in memory work retained; do
            if [[ -f "$out/base-$metric.json" && -f "$out/head-$metric.json" ]]; then
              python3 "head/$bench" compare "$out/base-$metric.json" "$out/head-$metric.json" --out "$out/compare-$metric.json" || incomplete=1
            fi
          done
          exit "$incomplete"

      - name: Record the scheduled workload interval
        id: weekly-receipt
        if: ${{ !cancelled() && github.event_name == 'schedule' && matrix.id == 'regression' }}
        working-directory: head
        env:
          WEEKLY_INTERVAL: ${{ needs.weekly-baseline.outputs.interval }}
          WORKLOAD_RESULT: ${{ steps.workloads.outcome }}
        run: python3 -B tools/bench/bench.py weekly record target/performance/workloads

      - name: Upload ordered workload observations
        if: ${{ always() && matrix.id == 'regression' && hashFiles('head/target/performance/workloads/plan.json', 'head/target/performance/workloads/weekly-interval.json') != '' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ steps.weekly-receipt.outputs.artifact || (github.event_name == 'schedule' && format('perf-public-workloads-incomplete-{0}', github.run_attempt)) || 'perf-public-workloads' }}
          path: head/target/performance/workloads
          if-no-files-found: error

      - name: Write pull-request job summary
        if: ${{ always() && github.event_name == 'pull_request' }}
        working-directory: head
        env:
          TITLE: ${{ matrix.title }}
        run: |
          set -euo pipefail
          if [[ -s target/performance/summary.md ]]; then
            cat target/performance/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            printf '## %s\n\nThe performance summary was not generated. Check the job logs and retained artifact.\n' \
              "$TITLE" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Enforce measurement result
        if: ${{ always() }}
        working-directory: head
        env:
          COMPARISON_EXIT: ${{ steps.comparison.outputs.comparison_exit || '2' }}
          RENDER_EXIT: ${{ steps.render.outputs.render_exit || '2' }}
        run: |
          python3 tools/bench/bench.py ci enforce \
            --comparison-exit "$COMPARISON_EXIT" \
            --render-exit "$RENDER_EXIT"

  weekly-baseline:
    name: Select scheduled workload baseline
    if: github.event_name == 'schedule'
    runs-on: *measurement_runner
    permissions:
      contents: read
      actions: read
    outputs:
      base_sha: ${{ steps.select.outputs.base_sha }}
      interval: ${{ steps.select.outputs.interval }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Materialize the weekly sentinel
        run: python3 -B tools/bench/bench.py plan --scenario mixed-families --out "$RUNNER_TEMP/weekly-sentinel.json"

      - name: Select the previous measured ancestor
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          WORKLOAD_SOURCES: ${{ hashFiles('tools/bench/bench.py', 'tools/bench/merman_bench/*.py', 'crates/merman/benches/workloads/**/*.rs', 'crates/merman/benches/workloads.rs', 'crates/merman/benches/memory.rs', 'crates/merman/benches/memory/**/*.rs', 'crates/merman/benches/native_memory/allocator.rs', 'rust-toolchain.toml') }}
          WORKLOAD_RECIPE: *workload_recipe
          WORKLOAD_RUNNER: *measurement_runner
          WORKLOAD_TOOLCHAIN: *measurement_toolchain
        run: python3 -B tools/bench/bench.py weekly select "$RUNNER_TEMP/weekly-sentinel.json"

  node-reference:
    name: perf-node-reference
    if: github.event_name == 'workflow_dispatch' && (inputs.run == 'reference' || inputs.run == 'full')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          repository: ${{ inputs.head_repository || github.repository }}
          ref: ${{ inputs.head_ref || github.sha }}

      - name: Check for a locked Node reference project
        id: project
        run: |
          if test -f tools/bench/bench.py && test -f tools/bench/node-reference/package-lock.json; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'The selected revision predates the unified Node reference collector.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-node@v7.1.0
        if: steps.project.outputs.available == 'true'
        with:
          node-version: "26.13.0"
          cache: npm
          cache-dependency-path: |
            tools/bench/node-reference/package-lock.json
            tools/mermaid-cli/package-lock.json

      - name: Check the SVG drawing observer in Chromium
        if: steps.project.outputs.available == 'true' && hashFiles('tools/bench/workload_drawing_browser.mjs') != ''
        run: |
          npm ci --prefix tools/mermaid-cli --ignore-scripts --no-audit --no-fund
          chrome="$(command -v google-chrome)"
          observers=(tools/bench/workload_drawing_browser.test.mjs)
          if [[ -f tools/bench/workload_svg_pixels.test.mjs ]]; then observers+=(tools/bench/workload_svg_pixels.test.mjs); fi
          PUPPETEER_EXECUTABLE_PATH="$chrome" node --test "${observers[@]}"
          echo "PUPPETEER_EXECUTABLE_PATH=$chrome" >> "$GITHUB_ENV"

      - name: Collect the locked Node SVG references
        if: steps.project.outputs.available == 'true'
        run: |
          npm ci --prefix tools/bench/node-reference --ignore-scripts --no-audit --no-fund
          node --test tools/bench/collectors/node_runner.test.mjs
          python3 tools/bench/bench.py plan --suite full --out target/bench/reference-plan.json
          checks=()
          if [[ -f tools/bench/workload_drawing_browser.mjs ]]; then checks+=(--check-drawings); fi
          python3 tools/bench/bench.py node --plan target/bench/reference-plan.json --out-dir target/bench/node-reference "${checks[@]}"

      - name: Replay the native cross-family suite
        if: steps.project.outputs.available == 'true' && inputs.run == 'full'
        run: |
          python3 tools/bench/bench.py plan --scenario corpus-cross_family --out target/bench/families-plan.json
          python3 tools/bench/bench.py node --plan target/bench/families-plan.json --out-dir target/bench/node-cross-family

      - name: Generate a reader report from the Node coverage bundle
        if: ${{ !cancelled() && steps.project.outputs.available == 'true' && hashFiles('target/bench/node-reference/coverage.json') != '' }}
        env:
          RAW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          python3 -B tools/bench/bench.py report --date "$(date -u +%F)" \
            --node-matrix target/bench/node-reference --raw-url "$RAW_RUN_URL" \
            --out target/bench/node-reference/reader/report.md
          python3 -B tools/bench/bench.py report --from target/bench/node-reference/reader/report.json --check

      - name: Upload Node observations
        if: ${{ always() && hashFiles('target/bench/node-reference/plan.json') != '' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: perf-node-reference
          path: |
            target/bench/node-reference
            target/bench/node-cross-family
