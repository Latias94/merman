name: Performance

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled
    paths:
      - ".github/workflows/performance.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "docs/performance/**"
      - "tools/bench/**"
      - "tools/mermaid-cli/**"
      - "crates/merman/**"
      - "crates/merman-bindings-core/**"
      - "crates/merman-core/**"
      - "crates/merman-render/**"
      - "crates/roughr/**"
      - "crates/manatee/**"
      - "crates/dugong/**"
      - "crates/dugong-graphlib/**"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      run:
        description: "Which performance lane to run"
        type: choice
        default: regression
        options:
          - contracts
          - frontmatter
          - regression
          - reference
          - full
      preset:
        description: "Benchmark preset"
        type: choice
        default: long
        options:
          - quick
          - long
      suite:
        description: "Corpus suite"
        type: choice
        default: canary
        options:
          - canary
          - standard
          - cross_family
          - full
      base_ref:
        description: "Base ref for regression comparisons"
        required: false
        default: main
      base_repository:
        description: "Base repository for manual regression comparisons"
        required: false
        default: ""
      head_ref:
        description: "Head ref for manual runs; set this when head_repository differs"
        required: false
        default: ""
      head_repository:
        description: "Head repository for manual runs"
        required: false
        default: ""
      relative_threshold_percent:
        description: "Relative regression threshold percentage"
        required: false
        default: "10"
      evidence_mode:
        description: "Evidence quality for self comparisons"
        type: choice
        default: confirmation
        options:
          - diagnostic
          - confirmation
      absolute_threshold_ns:
        description: "Absolute regression threshold in nanoseconds (50000 = 50 us)"
        required: false
        default: "50000"
      include_mermaid_js:
        description: "Also run Mermaid JS comparison"
        type: boolean
        default: false
      mmdr_ref:
        description: "Pinned mermaid-rs-renderer ref"
        required: false
        default: "7ff1196ed297c32a65a6b3cdc28f3ca3787fb65e"
      mmdr_toolchain:
        description: "Rust toolchain for mermaid-rs-renderer"
        required: false
        default: "1.92.0"

permissions:
  contents: read

concurrency:
  group: performance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: perf-contracts
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout head
        uses: actions/checkout@v6
        with:
          path: head
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.head_ref || github.sha }}
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || inputs.head_repository || github.repository }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Check Python performance scripts
        working-directory: head
        run: |
          python3 -m py_compile \
            tools/bench/compare_mermaid_renderers.py \
            tools/bench/compare_self.py \
            tools/bench/corpus_utils.py \
            tools/bench/freeze_perf_baseline.py \
            tools/bench/native_memory.py \
            tools/bench/perf_runner.py \
            tools/bench/render_perf_comment.py \
            tools/bench/run_layout_work_calibration.py \
            tools/bench/run_native_memory.py \
            tools/bench/stage_spotcheck.py \
            tools/bench/test_layout_work_calibration.py \
            tools/bench/test_perf_baseline_manifest.py \
            tools/bench/test_native_memory_contracts.py \
            tools/bench/test_native_memory_driver_contracts.py \
            tools/bench/test_perf_contracts.py \
            tools/bench/verify_pipeline_bench_list.py

      - name: Check performance helper contracts
        working-directory: head
        run: |
          python3 tools/bench/test_perf_baseline_manifest.py
          python3 -m unittest tools.bench.test_layout_work_calibration
          python3 tools/bench/test_native_memory_contracts.py
          python3 tools/bench/test_native_memory_driver_contracts.py
          python3 tools/bench/test_perf_contracts.py

      - name: Verify compiled pipeline benchmark list
        if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'perf')
        working-directory: head
        run: python3 tools/bench/verify_pipeline_bench_list.py --features svg,layout-cytoscape,layout-elk,math

      - name: Build native memory probe contract
        if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'perf')
        working-directory: head
        run: |
          cargo test --locked -p merman --test native_memory_allocator
          python3 tools/bench/run_native_memory.py --smoke \
            --json-out target/bench/native_memory_smoke.json
          python3 tools/bench/test_native_memory_driver_contracts.py \
            --verify-smoke-report target/bench/native_memory_smoke.json

  regression:
    name: perf-regression
    runs-on: ubuntu-24.04
    if: (github.event_name == 'workflow_dispatch' && (inputs.run == 'regression' || inputs.run == 'full')) || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'perf'))
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Checkout head
        uses: actions/checkout@v6
        with:
          path: head
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.head_ref || github.sha }}
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || inputs.head_repository || github.repository }}

      - name: Checkout base
        uses: actions/checkout@v6
        with:
          path: base
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.base_ref }}
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.repo.full_name || inputs.base_repository || github.repository }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Run self regression comparison
        id: regression_comparison
        working-directory: head
        env:
          PRESET: ${{ github.event_name == 'pull_request' && 'quick' || inputs.preset }}
          SUITE: ${{ github.event_name == 'pull_request' && 'canary' || inputs.suite }}
          EVIDENCE_MODE: ${{ github.event_name == 'pull_request' && 'diagnostic' || inputs.evidence_mode || 'confirmation' }}
          RELATIVE_THRESHOLD_PERCENT: ${{ inputs.relative_threshold_percent || '10' }}
          ABSOLUTE_THRESHOLD_NS: ${{ inputs.absolute_threshold_ns || '50000' }}
          BASE_LABEL: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.repo.full_name || inputs.base_repository || github.repository }}@${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || inputs.base_ref || 'main' }}
          HEAD_LABEL: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || inputs.head_repository || github.repository }}@${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || inputs.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          set +e
          python3 tools/bench/compare_self.py \
            --base-dir ../base \
            --head-dir . \
            --base-target-dir target/performance/base \
            --head-target-dir target/performance/head \
            --base-features svg \
            --head-features svg \
            --base-label "$BASE_LABEL" \
            --head-label "$HEAD_LABEL" \
            --preset "$PRESET" \
            --suite "$SUITE" \
            --evidence-mode "$EVIDENCE_MODE" \
            --relative-threshold-percent "$RELATIVE_THRESHOLD_PERCENT" \
            --absolute-threshold-ns "$ABSOLUTE_THRESHOLD_NS" \
            --out target/performance/self_comparison.md \
            --json-out target/performance/self_comparison.json
          comparison_exit=$?
          set -e
          echo "comparison_exit=$comparison_exit" >> "$GITHUB_OUTPUT"

      - name: Render regression PR comment
        id: regression_comment_render
        if: ${{ always() }}
        working-directory: head
        run: |
          set -euo pipefail
          set +e
          python3 tools/bench/render_perf_comment.py \
            --json target/performance/self_comparison.json \
            --out target/performance/pr_comment.md \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --artifact perf-regression \
            --process-exit-code "${{ steps.regression_comparison.outputs.comparison_exit || '2' }}"
          comment_render_exit=$?
          set -e
          echo "comment_render_exit=$comment_render_exit" >> "$GITHUB_OUTPUT"

      - name: Upload regression artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: perf-regression
          path: |
            head/target/performance/self_comparison.md
            head/target/performance/self_comparison.json
            head/target/performance/pr_comment.md

      - name: Write regression job summary
        if: ${{ always() && github.event_name == 'pull_request' }}
        working-directory: head
        run: |
          set -euo pipefail
          body_file="target/performance/pr_comment.md"
          if [ -s "$body_file" ]; then
            cat "$body_file" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Merman Performance Regression"
              echo
              echo "The performance comment body was not generated. Check the job logs and artifact upload step."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Enforce regression performance result
        if: ${{ always() }}
        env:
          REGRESSION_COMPARISON_EXIT: ${{ steps.regression_comparison.outputs.comparison_exit || '2' }}
          REGRESSION_COMMENT_RENDER_EXIT: ${{ steps.regression_comment_render.outputs.comment_render_exit || '2' }}
        run: |
          set -euo pipefail
          if [ "$REGRESSION_COMMENT_RENDER_EXIT" -ne 0 ]; then
            echo "::error::The performance report consumer rejected the evidence contract."
            exit 2
          fi
          case "$REGRESSION_COMPARISON_EXIT" in
            0)
              exit 0
              ;;
            1)
              echo "::error::Decision-grade evidence confirmed a performance regression."
              exit "$REGRESSION_COMPARISON_EXIT"
              ;;
            2)
              echo "::error::The performance comparison evidence contract failed."
              exit "$REGRESSION_COMPARISON_EXIT"
              ;;
            3)
              echo "::error::The performance comparison was statistically inconclusive."
              exit "$REGRESSION_COMPARISON_EXIT"
              ;;
            *)
              echo "::error::Unexpected performance comparison exit code: $REGRESSION_COMPARISON_EXIT"
              exit 2
              ;;
          esac

  regression-comment:
    name: perf-regression-comment
    runs-on: ubuntu-24.04
    needs:
      - regression
    if: ${{ always() && github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'perf') }}
    permissions:
      contents: read
      issues: write
    steps:
      - name: Download regression artifacts
        uses: actions/download-artifact@v7
        with:
          name: perf-regression
          path: perf-regression

      - name: Write regression job summary
        run: |
          set -euo pipefail
          body_file="perf-regression/pr_comment.md"
          if [ -s "$body_file" ]; then
            cat "$body_file" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Merman Performance Regression"
              echo
              echo "The performance comment body was not generated. Check the perf-regression artifact."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Comment regression summary
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          marker="<!-- merman-perf-regression -->"
          body_file="perf-regression/pr_comment.md"
          if [ ! -s "$body_file" ]; then
            echo "::warning title=Performance comment unavailable::Performance comment body is missing; see the job summary and uploaded artifacts."
            exit 0
          fi
          if ! comment_ids="$(
            gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
              --jq ".[] | select(.body | contains(\"$marker\")) | .id"
          )"; then
            echo "::warning title=Performance comment unavailable::Could not read existing PR comments; see the job summary and perf-regression artifact."
            exit 0
          fi
          comment_id="$(printf '%s\n' "$comment_ids" | sed -n '1p')"
          python3 - "$body_file" <<'PY' > comment_payload.json
          import json
          import sys

          body_path = sys.argv[1]
          body = open(body_path, encoding="utf-8").read()
          print(json.dumps({"body": body}))
          PY
          if [ -n "$comment_id" ]; then
            if ! gh api --silent --method PATCH "repos/$REPO/issues/comments/$comment_id" --input comment_payload.json; then
              echo "::warning title=Performance comment unavailable::Could not update the PR performance comment; see the job summary and perf-regression artifact."
            fi
          else
            if ! gh api --silent --method POST "repos/$REPO/issues/$PR_NUMBER/comments" --input comment_payload.json; then
              echo "::warning title=Performance comment unavailable::Could not create the PR performance comment; see the job summary and perf-regression artifact."
            fi
          fi

  frontmatter:
    name: perf-frontmatter
    runs-on: ubuntu-24.04
    if: (github.event_name == 'workflow_dispatch' && (inputs.run == 'frontmatter' || inputs.run == 'full')) || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'perf-frontmatter'))
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Checkout head
        uses: actions/checkout@v6
        with:
          path: head
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.head_ref || github.sha }}
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || inputs.head_repository || github.repository }}

      - name: Checkout base
        uses: actions/checkout@v6
        with:
          path: base
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.base_ref }}
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.repo.full_name || inputs.base_repository || github.repository }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Run frontmatter regression comparison
        id: frontmatter_comparison
        working-directory: head
        env:
          PRESET: ${{ github.event_name == 'pull_request' && 'quick' || inputs.preset }}
          EVIDENCE_MODE: ${{ github.event_name == 'pull_request' && 'diagnostic' || inputs.evidence_mode || 'confirmation' }}
          RELATIVE_THRESHOLD_PERCENT: ${{ inputs.relative_threshold_percent || '10' }}
          ABSOLUTE_THRESHOLD_NS: ${{ inputs.absolute_threshold_ns || '50000' }}
          BASE_LABEL: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.repo.full_name || inputs.base_repository || github.repository }}@${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || inputs.base_ref || 'main' }}
          HEAD_LABEL: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || inputs.head_repository || github.repository }}@${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || inputs.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          set +e
          python3 tools/bench/compare_self.py \
            --base-dir ../base \
            --head-dir . \
            --base-target-dir target/performance/base \
            --head-target-dir target/performance/head \
            --base-features svg \
            --head-features svg \
            --base-label "$BASE_LABEL" \
            --head-label "$HEAD_LABEL" \
            --preset "$PRESET" \
            --suite frontmatter \
            --group frontmatter_preprocess \
            --evidence-mode "$EVIDENCE_MODE" \
            --relative-threshold-percent "$RELATIVE_THRESHOLD_PERCENT" \
            --absolute-threshold-ns "$ABSOLUTE_THRESHOLD_NS" \
            --out target/performance/frontmatter_comparison.md \
            --json-out target/performance/frontmatter_comparison.json
          comparison_exit=$?
          set -e
          echo "comparison_exit=$comparison_exit" >> "$GITHUB_OUTPUT"

      - name: Render frontmatter PR comment
        id: frontmatter_comment_render
        if: ${{ always() }}
        working-directory: head
        run: |
          set -euo pipefail
          set +e
          python3 tools/bench/render_perf_comment.py \
            --json target/performance/frontmatter_comparison.json \
            --out target/performance/frontmatter_pr_comment.md \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --artifact perf-frontmatter \
            --marker "<!-- merman-perf-frontmatter -->" \
            --title "Merman Frontmatter Performance Regression" \
            --process-exit-code "${{ steps.frontmatter_comparison.outputs.comparison_exit || '2' }}"
          comment_render_exit=$?
          set -e
          echo "comment_render_exit=$comment_render_exit" >> "$GITHUB_OUTPUT"

      - name: Upload frontmatter artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: perf-frontmatter
          path: |
            head/target/performance/frontmatter_comparison.md
            head/target/performance/frontmatter_comparison.json
            head/target/performance/frontmatter_pr_comment.md

      - name: Write frontmatter job summary
        if: ${{ always() && github.event_name == 'pull_request' }}
        working-directory: head
        run: |
          set -euo pipefail
          body_file="target/performance/frontmatter_pr_comment.md"
          if [ -s "$body_file" ]; then
            cat "$body_file" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Merman Frontmatter Performance Regression"
              echo
              echo "The frontmatter performance comment body was not generated. Check the job logs and artifact upload step."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Enforce frontmatter performance result
        if: ${{ always() }}
        env:
          FRONTMATTER_COMPARISON_EXIT: ${{ steps.frontmatter_comparison.outputs.comparison_exit || '2' }}
          FRONTMATTER_COMMENT_RENDER_EXIT: ${{ steps.frontmatter_comment_render.outputs.comment_render_exit || '2' }}
        run: |
          set -euo pipefail
          if [ "$FRONTMATTER_COMMENT_RENDER_EXIT" -ne 0 ]; then
            echo "::error::The frontmatter performance report consumer rejected the evidence contract."
            exit 2
          fi
          case "$FRONTMATTER_COMPARISON_EXIT" in
            0)
              exit 0
              ;;
            1)
              echo "::error::Decision-grade evidence confirmed a frontmatter performance regression."
              exit "$FRONTMATTER_COMPARISON_EXIT"
              ;;
            2)
              echo "::error::The frontmatter performance comparison evidence contract failed."
              exit "$FRONTMATTER_COMPARISON_EXIT"
              ;;
            3)
              echo "::error::The frontmatter performance comparison was statistically inconclusive."
              exit "$FRONTMATTER_COMPARISON_EXIT"
              ;;
            *)
              echo "::error::Unexpected frontmatter performance comparison exit code: $FRONTMATTER_COMPARISON_EXIT"
              exit 2
              ;;
          esac

  frontmatter-comment:
    name: perf-frontmatter-comment
    runs-on: ubuntu-24.04
    needs:
      - frontmatter
    if: ${{ always() && github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'perf-frontmatter') }}
    permissions:
      contents: read
      issues: write
    steps:
      - name: Download frontmatter artifacts
        uses: actions/download-artifact@v7
        with:
          name: perf-frontmatter
          path: perf-frontmatter

      - name: Write frontmatter job summary
        run: |
          set -euo pipefail
          body_file="perf-frontmatter/frontmatter_pr_comment.md"
          if [ -s "$body_file" ]; then
            cat "$body_file" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Merman Frontmatter Performance Regression"
              echo
              echo "The frontmatter performance comment body was not generated. Check the perf-frontmatter artifact."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Comment frontmatter summary
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          marker="<!-- merman-perf-frontmatter -->"
          body_file="perf-frontmatter/frontmatter_pr_comment.md"
          if [ ! -s "$body_file" ]; then
            echo "::warning title=Frontmatter performance comment unavailable::Frontmatter performance comment body is missing; see the job summary and uploaded artifacts."
            exit 0
          fi
          if ! comment_ids="$(
            gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
              --jq ".[] | select(.body | contains(\"$marker\")) | .id"
          )"; then
            echo "::warning title=Frontmatter performance comment unavailable::Could not read existing PR comments; see the job summary and perf-frontmatter artifact."
            exit 0
          fi
          comment_id="$(printf '%s\n' "$comment_ids" | sed -n '1p')"
          python3 - "$body_file" <<'PY' > comment_payload.json
          import json
          import sys

          body_path = sys.argv[1]
          body = open(body_path, encoding="utf-8").read()
          print(json.dumps({"body": body}))
          PY
          if [ -n "$comment_id" ]; then
            if ! gh api --silent --method PATCH "repos/$REPO/issues/comments/$comment_id" --input comment_payload.json; then
              echo "::warning title=Frontmatter performance comment unavailable::Could not update the PR frontmatter performance comment; see the job summary and perf-frontmatter artifact."
            fi
          else
            if ! gh api --silent --method POST "repos/$REPO/issues/$PR_NUMBER/comments" --input comment_payload.json; then
              echo "::warning title=Frontmatter performance comment unavailable::Could not create the PR frontmatter performance comment; see the job summary and perf-frontmatter artifact."
            fi
          fi

  reference:
    name: perf-reference
    runs-on: ubuntu-24.04
    if: github.event_name == 'schedule' || inputs.run == 'reference' || inputs.run == 'full'
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Checkout head
        uses: actions/checkout@v6
        with:
          path: head
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.head_ref || github.sha }}
          repository: ${{ github.event_name == 'workflow_dispatch' && inputs.head_repository || github.repository }}

      - name: Checkout mermaid-rs-renderer
        uses: actions/checkout@v6
        with:
          repository: 1jehuang/mermaid-rs-renderer
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.mmdr_ref || '7ff1196ed297c32a65a6b3cdc28f3ca3787fb65e' }}
          path: head/repo-ref/mermaid-rs-renderer
          fetch-depth: 1
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Install mermaid-rs-renderer toolchain
        shell: bash
        env:
          MMDR_TOOLCHAIN: ${{ github.event_name == 'workflow_dispatch' && inputs.mmdr_toolchain || '1.92.0' }}
        run: |
          set -euo pipefail

          if [[ ! "$MMDR_TOOLCHAIN" =~ ^([0-9]+(\.[0-9]+){0,2}|stable|beta|nightly)(-[0-9]{4}-[0-9]{2}-[0-9]{2})?$ ]]; then
            echo "::error::mmdr_toolchain must be a Rust release number, stable, beta, nightly, or a dated channel."
            exit 1
          fi

          rustup toolchain install "$MMDR_TOOLCHAIN" --profile minimal

      - name: Setup Node for Mermaid JS
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_mermaid_js }}
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: head/tools/mermaid-cli/package-lock.json

      - name: Install Mermaid JS toolchain
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_mermaid_js }}
        working-directory: head/tools/mermaid-cli
        run: npm ci

      - name: Run cross-repo comparison
        working-directory: head
        env:
          INCLUDE_MERMAID_JS: ${{ github.event_name == 'workflow_dispatch' && inputs.include_mermaid_js || false }}
          MMDR_TOOLCHAIN: ${{ github.event_name == 'workflow_dispatch' && inputs.mmdr_toolchain || '1.92.0' }}
          PRESET: ${{ github.event_name == 'workflow_dispatch' && inputs.preset || 'long' }}
          SUITE: ${{ github.event_name == 'workflow_dispatch' && inputs.suite || 'canary' }}
        run: |
          set -euo pipefail

          case "$PRESET" in
            quick|long) ;;
            *)
              echo "::error::preset must be quick or long."
              exit 1
              ;;
          esac

          case "$SUITE" in
            canary|standard|cross_family|full) ;;
            *)
              echo "::error::suite must be canary, standard, cross_family, or full."
              exit 1
              ;;
          esac

          if [[ ! "$MMDR_TOOLCHAIN" =~ ^([0-9]+(\.[0-9]+){0,2}|stable|beta|nightly)(-[0-9]{4}-[0-9]{2}-[0-9]{2})?$ ]]; then
            echo "::error::mmdr_toolchain must be a Rust release number, stable, beta, nightly, or a dated channel."
            exit 1
          fi

          args=(
            --preset "$PRESET"
            --suite "$SUITE"
            --mmdr-dir repo-ref/mermaid-rs-renderer
            --mmdr-toolchain "$MMDR_TOOLCHAIN"
            --expected-merman-rev "$(git rev-parse HEAD)"
            --expected-mmdr-rev "$(git -C repo-ref/mermaid-rs-renderer rev-parse HEAD)"
            --out target/performance/reference_comparison.md
            --json-out target/performance/reference_comparison.json
          )
          if [ "$INCLUDE_MERMAID_JS" = "true" ]; then
            echo "Mermaid JS comparison enabled."
          else
            args+=(--skip-mermaid-js)
          fi
          python3 tools/bench/compare_mermaid_renderers.py "${args[@]}"

      - name: Upload reference artifacts
        uses: actions/upload-artifact@v6
        with:
          name: perf-reference
          path: |
            head/target/performance/reference_comparison.md
            head/target/performance/reference_comparison.json
