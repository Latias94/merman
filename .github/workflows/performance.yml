name: Performance

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled
    paths:
      - ".github/workflows/performance.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "docs/performance/**"
      - "tools/bench/**"
      - "tools/mermaid-cli/**"
      - "crates/merman/**"
      - "crates/merman-bindings-core/**"
      - "crates/merman-core/**"
      - "crates/merman-render/**"
      - "crates/roughr/**"
      - "crates/manatee/**"
      - "crates/dugong/**"
      - "crates/dugong-graphlib/**"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      run:
        description: "Which performance lane to run"
        type: choice
        default: regression
        options:
          - contracts
          - frontmatter
          - regression
          - reference
          - full
      preset:
        description: "Benchmark preset"
        type: choice
        default: long
        options:
          - quick
          - long
      suite:
        description: "Corpus suite"
        type: choice
        default: canary
        options:
          - canary
          - standard
          - cross_family
          - full
      base_ref:
        description: "Base ref for regression comparisons"
        required: false
        default: main
      base_repository:
        description: "Base repository for manual regression comparisons"
        required: false
        default: ""
      head_ref:
        description: "Head ref for manual runs; set this when head_repository differs"
        required: false
        default: ""
      head_repository:
        description: "Head repository for manual runs"
        required: false
        default: ""
      relative_threshold_percent:
        description: "Relative regression threshold percentage"
        required: false
        default: "10"
      evidence_mode:
        description: "Evidence quality for self comparisons"
        type: choice
        default: confirmation
        options:
          - diagnostic
          - confirmation
      absolute_threshold_ns:
        description: "Absolute regression threshold in nanoseconds (50000 = 50 us)"
        required: false
        default: "50000"
      include_mermaid_js:
        description: "Also run Mermaid JS comparison"
        type: boolean
        default: false
      mmdr_ref:
        description: "Pinned mermaid-rs-renderer ref"
        required: false
        default: "7ff1196ed297c32a65a6b3cdc28f3ca3787fb65e"
      mmdr_toolchain:
        description: "Rust toolchain for mermaid-rs-renderer"
        required: false
        default: "1.92.0"

permissions:
  contents: read

concurrency:
  group: performance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: perf-contracts
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'perf')
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout head
        uses: actions/checkout@v7.0.1
        with:
          path: head
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.head_ref || github.sha }}
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || inputs.head_repository || github.repository }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.100.0

      - name: Check Python performance scripts
        if: github.event_name != 'pull_request'
        working-directory: head
        run: |
          python3 -m py_compile \
            tools/bench/compare_mermaid_renderers.py \
            tools/bench/compare_self.py \
            tools/bench/corpus_utils.py \
            tools/bench/freeze_perf_baseline.py \
            tools/bench/native_memory.py \
            tools/bench/perf_runner.py \
            tools/bench/render_perf_comment.py \
            tools/bench/run_layout_work_calibration.py \
            tools/bench/run_native_memory.py \
            tools/bench/stage_spotcheck.py \
            tools/bench/test_layout_work_calibration.py \
            tools/bench/test_perf_baseline_manifest.py \
            tools/bench/test_native_memory_contracts.py \
            tools/bench/test_native_memory_driver_contracts.py \
            tools/bench/test_perf_contracts.py \
            tools/bench/verify_pipeline_bench_list.py

      - name: Check performance helper contracts
        if: github.event_name != 'pull_request'
        working-directory: head
        run: |
          python3 tools/bench/test_perf_baseline_manifest.py
          python3 -m unittest tools.bench.test_layout_work_calibration
          python3 tools/bench/test_native_memory_contracts.py
          python3 tools/bench/test_native_memory_driver_contracts.py
          python3 tools/bench/test_perf_contracts.py

      - name: Verify compiled pipeline benchmark list
        if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'perf')
        working-directory: head
        run: python3 tools/bench/verify_pipeline_bench_list.py --features svg,layout-cytoscape,layout-elk,math

      - name: Build native memory probe contract
        if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'perf')
        working-directory: head
        run: |
          cargo test --locked -p merman --test native_memory_allocator
          python3 tools/bench/run_native_memory.py --smoke \
            --build-timeout-seconds 900 \
            --json-out target/bench/native_memory_smoke.json
          python3 tools/bench/test_native_memory_driver_contracts.py \
            --verify-smoke-report target/bench/native_memory_smoke.json

  measurement-plan:
    name: perf-measurement-plan
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'perf') || contains(github.event.pull_request.labels.*.name, 'perf-frontmatter')
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      selected: ${{ steps.plan.outputs.selected }}
    steps:
      - name: Select performance descriptors
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_RUN: ${{ inputs.run }}
          HAS_REGRESSION_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'perf') }}
          HAS_FRONTMATTER_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'perf-frontmatter') }}
        run: |
          set -euo pipefail
          lanes=()
          case "$EVENT_NAME" in
            pull_request)
              [[ "$HAS_REGRESSION_LABEL" == "true" ]] && lanes+=(regression)
              [[ "$HAS_FRONTMATTER_LABEL" == "true" ]] && lanes+=(frontmatter)
              ;;
            schedule)
              lanes=(regression frontmatter)
              ;;
            workflow_dispatch)
              case "$DISPATCH_RUN" in
                regression) lanes=(regression) ;;
                frontmatter) lanes=(frontmatter) ;;
                full) lanes=(regression frontmatter) ;;
                contracts|reference) lanes=() ;;
                *)
                  echo "unsupported performance lane: $DISPATCH_RUN" >&2
                  exit 1
                  ;;
              esac
              ;;
            *)
              echo "unsupported performance event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

          matrix='{"include":['
          separator=''
          for lane in "${lanes[@]}"; do
            case "$lane" in
              regression)
                descriptor='{"id":"regression","suite":"canary","group":"","artifact":"perf-regression","title":"Merman Performance Regression","marker":"<!-- merman-perf -->"}'
                ;;
              frontmatter)
                descriptor='{"id":"frontmatter","suite":"frontmatter","group":"frontmatter_preprocess","artifact":"perf-frontmatter","title":"Merman Frontmatter Performance Regression","marker":"<!-- merman-perf-frontmatter -->"}'
                ;;
              *)
                echo "unsupported selected performance lane: $lane" >&2
                exit 1
                ;;
            esac
            matrix+="$separator$descriptor"
            separator=','
          done
          matrix+=']}'
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
          if [[ ${#lanes[@]} -gt 0 ]]; then
            echo 'selected=true' >> "$GITHUB_OUTPUT"
          else
            echo 'selected=false' >> "$GITHUB_OUTPUT"
          fi

  measurement:
    name: perf-${{ matrix.id }}
    needs: measurement-plan
    if: needs.measurement-plan.outputs.selected == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.measurement-plan.outputs.matrix) }}
    steps:
      - name: Checkout head
        uses: actions/checkout@v7.0.1
        with:
          path: head
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.head_ref || github.sha }}
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || inputs.head_repository || github.repository }}

      - name: Checkout base
        uses: actions/checkout@v7.0.1
        with:
          path: base
          fetch-depth: ${{ github.event_name == 'schedule' && 2 || 1 }}
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'schedule' && github.sha || inputs.base_ref || 'main' }}
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.repo.full_name || inputs.base_repository || github.repository }}

      - name: Select previous main revision for scheduled comparison
        if: github.event_name == 'schedule'
        working-directory: base
        run: git checkout --detach HEAD^

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.100.0

      - name: Measure descriptor and write receipt
        id: comparison
        working-directory: head
        env:
          PRESET: ${{ github.event_name == 'pull_request' && 'quick' || inputs.preset || 'long' }}
          SUITE: ${{ github.event_name == 'workflow_dispatch' && matrix.id == 'regression' && inputs.suite || matrix.suite }}
          GROUP: ${{ matrix.group }}
          EVIDENCE_MODE: ${{ github.event_name == 'pull_request' && 'diagnostic' || inputs.evidence_mode || 'confirmation' }}
          RELATIVE_THRESHOLD_PERCENT: ${{ inputs.relative_threshold_percent || '10' }}
          ABSOLUTE_THRESHOLD_NS: ${{ inputs.absolute_threshold_ns || '50000' }}
          BASE_LABEL: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.repo.full_name || inputs.base_repository || github.repository }}@${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.event_name == 'schedule' && 'main~1' || inputs.base_ref || 'main' }}
          HEAD_LABEL: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || inputs.head_repository || github.repository }}@${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || inputs.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          args=(
            --base-dir ../base
            --head-dir .
            --base-target-dir target/performance/base
            --head-target-dir target/performance/head
            --base-features svg
            --head-features svg
            --base-label "$BASE_LABEL"
            --head-label "$HEAD_LABEL"
            --preset "$PRESET"
            --suite "$SUITE"
            --evidence-mode "$EVIDENCE_MODE"
            --relative-threshold-percent "$RELATIVE_THRESHOLD_PERCENT"
            --absolute-threshold-ns "$ABSOLUTE_THRESHOLD_NS"
            --out target/performance/comparison.md
            --json-out target/performance/comparison.json
          )
          if [[ -n "$GROUP" ]]; then
            args+=(--group "$GROUP")
          fi
          set +e
          python3 tools/bench/compare_self.py "${args[@]}"
          comparison_exit=$?
          set -e
          echo "comparison_exit=$comparison_exit" >> "$GITHUB_OUTPUT"

      - name: Render receipt summary
        id: render
        if: ${{ always() }}
        working-directory: head
        run: |
          set -euo pipefail
          set +e
          python3 tools/bench/render_perf_comment.py \
            --json target/performance/comparison.json \
            --out target/performance/summary.md \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --artifact "${{ matrix.artifact }}" \
            --marker "${{ matrix.marker }}" \
            --title "${{ matrix.title }}" \
            --process-exit-code "${{ steps.comparison.outputs.comparison_exit || '2' }}"
          render_exit=$?
          set -e
          echo "render_exit=$render_exit" >> "$GITHUB_OUTPUT"

      - name: Upload measurement receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: |
            head/target/performance/comparison.md
            head/target/performance/comparison.json
            head/target/performance/summary.md

      - name: Write pull-request job summary
        if: ${{ always() && github.event_name == 'pull_request' }}
        working-directory: head
        env:
          TITLE: ${{ matrix.title }}
        run: |
          set -euo pipefail
          if [[ -s target/performance/summary.md ]]; then
            cat target/performance/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            printf '## %s\n\nThe performance summary was not generated. Check the job logs and retained artifact.\n' \
              "$TITLE" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Enforce measurement result
        if: ${{ always() }}
        env:
          COMPARISON_EXIT: ${{ steps.comparison.outputs.comparison_exit || '2' }}
          RENDER_EXIT: ${{ steps.render.outputs.render_exit || '2' }}
        run: |
          set -euo pipefail
          if [[ "$RENDER_EXIT" -ne 0 ]]; then
            echo "::error::The performance report consumer rejected the evidence contract."
            exit 2
          fi
          case "$COMPARISON_EXIT" in
            0) exit 0 ;;
            1)
              echo "::error::Decision-grade evidence confirmed a performance regression."
              exit 1
              ;;
            2)
              echo "::error::The performance comparison evidence contract failed."
              exit 2
              ;;
            3)
              echo "::error::The performance comparison was statistically inconclusive."
              exit 3
              ;;
            *)
              echo "::error::Unexpected performance comparison exit code: $COMPARISON_EXIT"
              exit 2
              ;;
          esac

  reference:
    name: perf-reference
    runs-on: ubuntu-24.04
    if: github.event_name == 'schedule' || inputs.run == 'reference' || inputs.run == 'full'
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Checkout head
        uses: actions/checkout@v7.0.1
        with:
          path: head
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.head_ref || github.sha }}
          repository: ${{ github.event_name == 'workflow_dispatch' && inputs.head_repository || github.repository }}

      - name: Checkout mermaid-rs-renderer
        uses: actions/checkout@v7.0.1
        with:
          repository: 1jehuang/mermaid-rs-renderer
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.mmdr_ref || '7ff1196ed297c32a65a6b3cdc28f3ca3787fb65e' }}
          path: head/repo-ref/mermaid-rs-renderer
          fetch-depth: 1
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.100.0

      - name: Install mermaid-rs-renderer toolchain
        shell: bash
        env:
          MMDR_TOOLCHAIN: ${{ github.event_name == 'workflow_dispatch' && inputs.mmdr_toolchain || '1.92.0' }}
        run: |
          set -euo pipefail

          if [[ ! "$MMDR_TOOLCHAIN" =~ ^([0-9]+(\.[0-9]+){0,2}|stable|beta|nightly)(-[0-9]{4}-[0-9]{2}-[0-9]{2})?$ ]]; then
            echo "::error::mmdr_toolchain must be a Rust release number, stable, beta, nightly, or a dated channel."
            exit 1
          fi

          rustup toolchain install "$MMDR_TOOLCHAIN" --profile minimal

      - name: Setup Node for Mermaid JS
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_mermaid_js }}
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: head/tools/mermaid-cli/package-lock.json

      - name: Install Mermaid JS toolchain
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.include_mermaid_js }}
        working-directory: head/tools/mermaid-cli
        run: npm ci

      - name: Run cross-repo comparison
        working-directory: head
        env:
          INCLUDE_MERMAID_JS: ${{ github.event_name == 'workflow_dispatch' && inputs.include_mermaid_js || false }}
          MMDR_TOOLCHAIN: ${{ github.event_name == 'workflow_dispatch' && inputs.mmdr_toolchain || '1.92.0' }}
          PRESET: ${{ github.event_name == 'workflow_dispatch' && inputs.preset || 'long' }}
          SUITE: ${{ github.event_name == 'workflow_dispatch' && inputs.suite || 'canary' }}
        run: |
          set -euo pipefail

          case "$PRESET" in
            quick|long) ;;
            *)
              echo "::error::preset must be quick or long."
              exit 1
              ;;
          esac

          case "$SUITE" in
            canary|standard|cross_family|full) ;;
            *)
              echo "::error::suite must be canary, standard, cross_family, or full."
              exit 1
              ;;
          esac

          if [[ ! "$MMDR_TOOLCHAIN" =~ ^([0-9]+(\.[0-9]+){0,2}|stable|beta|nightly)(-[0-9]{4}-[0-9]{2}-[0-9]{2})?$ ]]; then
            echo "::error::mmdr_toolchain must be a Rust release number, stable, beta, nightly, or a dated channel."
            exit 1
          fi

          args=(
            --preset "$PRESET"
            --suite "$SUITE"
            --mmdr-dir repo-ref/mermaid-rs-renderer
            --mmdr-toolchain "$MMDR_TOOLCHAIN"
            --expected-merman-rev "$(git rev-parse HEAD)"
            --expected-mmdr-rev "$(git -C repo-ref/mermaid-rs-renderer rev-parse HEAD)"
            --out target/performance/reference_comparison.md
            --json-out target/performance/reference_comparison.json
          )
          if [ "$INCLUDE_MERMAID_JS" = "true" ]; then
            echo "Mermaid JS comparison enabled."
          else
            args+=(--skip-mermaid-js)
          fi
          python3 tools/bench/compare_mermaid_renderers.py "${args[@]}"

      - name: Upload reference artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: perf-reference
          path: |
            head/target/performance/reference_comparison.md
            head/target/performance/reference_comparison.json
