name: Homebrew

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Optional stable formula version to require
        required: false
        type: string
  schedule:
    - cron: "23 9 * * 1"

permissions:
  contents: read

jobs:
  formula-health:
    name: formula-health
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      SUPPORT_ASSETS_SINCE: "0.8.0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
          - os: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Homebrew test environment
        uses: Homebrew/actions/setup-homebrew@2026.08.31.1
        with:
          core: true
          setup-sandbox: true

      - name: Update Homebrew metadata
        shell: bash
        run: brew update

      - name: Check Homebrew formula metadata
        id: metadata
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        shell: bash
        run: |
          set -euo pipefail
          formula_json="$(brew info --json=v2 merman-cli)"
          version="$(jq -r '.formulae[0].versions.stable' <<<"$formula_json")"
          homepage="$(jq -r '.formulae[0].homepage' <<<"$formula_json")"
          desc="$(jq -r '.formulae[0].desc' <<<"$formula_json")"

          test "$version" != "null"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Homebrew returned a non-stable version: $version" >&2
            exit 1
          fi
          if [[ -n "$EXPECTED_VERSION" && "$version" != "$EXPECTED_VERSION" ]]; then
            echo "::error::Homebrew stable version $version does not match expected $EXPECTED_VERSION." >&2
            exit 1
          fi
          test "$homepage" = "https://frankorz.com/merman/"
          test "$desc" = "Mermaid.js, but headless, in Rust"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Homebrew merman-cli stable version: $version"
          echo "Homebrew homepage: $homepage"

      - name: Check Homebrew livecheck
        shell: bash
        run: brew livecheck merman-cli --json

      - name: Check out formula release contract
        uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/v${{ steps.metadata.outputs.version }}
          path: formula-contract
          persist-credentials: false

      - name: Install merman-cli from Homebrew
        shell: bash
        run: brew install merman-cli

      - name: Smoke installed merman-cli
        env:
          FORMULA_VERSION: ${{ steps.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          installed_version="$(merman-cli --version)"
          test "$installed_version" = "merman-cli $FORMULA_VERSION"
          printf 'flowchart TD\nA[Homebrew] --> B[merman-cli]\n' > homebrew-smoke.mmd
          merman-cli render homebrew-smoke.mmd --output homebrew-smoke.svg
          grep -q '<svg' homebrew-smoke.svg
          grep -q 'Homebrew' homebrew-smoke.svg

      - name: Verify version-gated support assets
        env:
          FORMULA_VERSION: ${{ steps.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          formula_prefix="$(brew --prefix merman-cli)"
          contract_root="$GITHUB_WORKSPACE/formula-contract"
          contract_verifier="$(
            python3 scripts/verify_homebrew_install.py \
              --formula-version "$FORMULA_VERSION" \
              --support-assets-since "$SUPPORT_ASSETS_SINCE" \
              --contract-root "$contract_root" \
              --select-version-verifier
          )"
          python3 "$contract_verifier" \
            --formula-version "$FORMULA_VERSION" \
            --support-assets-since "$SUPPORT_ASSETS_SINCE" \
            --prefix "$formula_prefix" \
            --contract-root "$contract_root"

      - name: Audit installed formula
        shell: bash
        run: brew linkage --test merman-cli

      - name: Run formula test
        shell: bash
        run: brew test merman-cli
