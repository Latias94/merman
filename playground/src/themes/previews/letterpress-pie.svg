<svg id="letterpress-pie" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 592.08 450" style="max-width: 592.08px;" role="graphics-document document" aria-roledescription="pie"><rect class="merman-theme-canvas-base" data-merman-theme-canvas="base" aria-hidden="true" pointer-events="none" x="0" y="0" width="592.08" height="450" fill="#F7F2E8"/><style>#letterpress-pie{font-family:Georgia, "Times New Roman", "Noto Serif CJK SC", serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#letterpress-pie .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#letterpress-pie .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#letterpress-pie .error-icon{fill:#552222;}#letterpress-pie .error-text{fill:#552222;stroke:#552222;}#letterpress-pie .edge-thickness-normal{stroke-width:1px;}#letterpress-pie .edge-thickness-thick{stroke-width:3.5px;}#letterpress-pie .edge-pattern-solid{stroke-dasharray:0;}#letterpress-pie .edge-thickness-invisible{stroke-width:0;fill:none;}#letterpress-pie .edge-pattern-dashed{stroke-dasharray:3;}#letterpress-pie .edge-pattern-dotted{stroke-dasharray:2;}#letterpress-pie .marker{fill:#333333;stroke:#333333;}#letterpress-pie .marker.cross{stroke:#333333;}#letterpress-pie svg{font-family:Georgia, "Times New Roman", "Noto Serif CJK SC", serif;font-size:16px;}#letterpress-pie p{margin:0;}#letterpress-pie .pieCircle{stroke:#87786A;stroke-width:2px;opacity:0.7;}#letterpress-pie .pieCircle.highlighted{scale:1.05;opacity:1;}#letterpress-pie .pieCircle.highlightedOnHover:hover{transition-duration:250ms;scale:1.05;opacity:1;}#letterpress-pie .pieOuterCircle{stroke:#87786A;stroke-width:2px;fill:none;}#letterpress-pie .pieTitleText{text-anchor:middle;font-size:24px;fill:#9A3D2C;font-family:Georgia, "Times New Roman", "Noto Serif CJK SC", serif;font-weight:600;}#letterpress-pie .slice{font-family:Georgia, "Times New Roman", "Noto Serif CJK SC", serif;fill:#312C2A;font-size:16px;font-weight:600;}#letterpress-pie .legend text{fill:#75685D;font-family:Georgia, "Times New Roman", "Noto Serif CJK SC", serif;font-size:14px;}#letterpress-pie .node .neo-node{stroke:#9370DB;}#letterpress-pie [data-look="neo"].node rect,#letterpress-pie [data-look="neo"].cluster rect,#letterpress-pie [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#letterpress-pie [data-look="neo"].swimlane.cluster rect{filter:none;}#letterpress-pie [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#letterpress-pie [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#letterpress-pie [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#letterpress-pie [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#letterpress-pie [data-look="neo"].node circle .state-start{fill:#000000;}#letterpress-pie [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#letterpress-pie [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#letterpress-pie :root{--mermaid-font-family:Georgia, "Times New Roman", "Noto Serif CJK SC", serif;}</style><g/><g transform="translate(225,225)"><g><circle cx="0" cy="0" r="186" class="pieOuterCircle"/><path d="M0,-185A185,185,0,0,1,23.187,183.541L0,0Z" fill="#E7C5B8" class="pieCircle"/><path d="M23.187,183.541A185,185,0,0,1,-184.635,-11.616L0,0Z" fill="#CBDCE0" class="pieCircle"/><path d="M-184.635,-11.616A185,185,0,0,1,-68.103,-172.009L0,0Z" fill="#DCD8BD" class="pieCircle"/><path d="M-68.103,-172.009A185,185,0,0,1,0,-185L0,0Z" fill="#DDD0E3" class="pieCircle"/><text transform="translate(129.24446133146117,-8.131372279046102)" class="slice" style="text-anchor: middle;">48%</text><text transform="translate(-88.64885021776514,94.40143725107284)" class="slice" style="text-anchor: middle;">28%</text><text transform="translate(-104.76770077155571,-76.11819017187524)" class="slice" style="text-anchor: middle;">18%</text><text transform="translate(-24.265880238851462,-127.20619896936516)" class="slice" style="text-anchor: middle;">6%</text></g><text x="0" y="-200" class="pieTitleText">Work by stage</text><g class="legend" transform="translate(216,-44)"><rect width="18" height="18" style="fill: rgb(231, 197, 184); stroke: rgb(231, 197, 184);"/><text x="22" y="14">Research [48]</text></g><g class="legend" transform="translate(216,-22)"><rect width="18" height="18" style="fill: rgb(203, 220, 224); stroke: rgb(203, 220, 224);"/><text x="22" y="14">Drafting [28]</text></g><g class="legend" transform="translate(216,0)"><rect width="18" height="18" style="fill: rgb(220, 216, 189); stroke: rgb(220, 216, 189);"/><text x="22" y="14">Review [18]</text></g><g class="legend" transform="translate(216,22)"><rect width="18" height="18" style="fill: rgb(221, 208, 227); stroke: rgb(221, 208, 227);"/><text x="22" y="14">Release [6]</text></g></g></svg>
