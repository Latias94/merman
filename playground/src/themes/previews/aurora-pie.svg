cle{stroke:#83CCDA;stroke-width:2px;fill:none;}#theme-aurora-pie .pieTitleText{text-anchor:middle;font-size:23px;fill:#EBF5FF;font-family:Avenir, "Segoe UI", Arial, "Noto Sans CJK SC", sans-serif;font-weight:500;}#theme-aurora-pie .slice{font-family:Avenir, "Segoe UI", Arial, "Noto Sans CJK SC", sans-serif;fill:#EBF5FF;font-size:16px;font-weight:500;}#theme-aurora-pie .legend text{fill:#B4C8DE;font-family:Avenir, "Segoe UI", Arial, "Noto Sans CJK SC", sans-serif;font-size:14px;}#theme-aurora-pie .node .neo-node{stroke:#9370DB;}#theme-aurora-pie [data-look="neo"].node rect,#theme-aurora-pie [data-look="neo"].cluster rect,#theme-aurora-pie [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#theme-aurora-pie [data-look="neo"].swimlane.cluster rect{filter:none;}#theme-aurora-pie [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#theme-aurora-pie [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#theme-aurora-pie [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#theme-aurora-pie [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#theme-aurora-pie [data-look="neo"].node circle .state-start{fill:#000000;}#theme-aurora-pie [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#theme-aurora-pie [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#theme-aurora-pie :root{--mermaid-font-family:Avenir, "Segoe UI", Arial, "Noto Sans CJK SC", sans-serif;}</style><g/><g transform="translate(225,225)"><g><circle cx="0" cy="0" r="186" class="pieOuterCircle"/><path d="M0,-185A185,185,0,0,1,23.18664820939634,183.54121974317837L0,0Z" fill="#215760" class="pieCircle"/><path d="M23.18664820939634,183.54121974317837A185,185,0,0,1,-184.63494475923025,-11.616246112922875L0,0Z" fill="#4B3C79" class="pieCircle"/><path d="M-184.63494475923025,-11.616246112922875A185,185,0,0,1,-68.10304224666555,-172.00864988932645L0,0Z" fill="#215C4C" class="pieCircle"/><path d="M-68.10304224666555,-172.00864988932645A185,185,0,0,1,0,-185L0,0Z" fill="#563D6B" class="pieCircle"/><text transform="translate(129.24446133146117,-8.131372279046102)" class="slice" style="text-anchor: middle;">48%</text><text transform="translate(-88.64885021776514,94.40143725107284)" class="slice" style="text-anchor: middle;">28%</text><text transform="translate(-104.76770077155571,-76.11819017187524)" class="slice" style="text-anchor: middle;">18%</text><text transform="translate(-24.265880238851462,-127.20619896936516)" class="slice" style="text-anchor: middle;">6%</text></g><text x="0" y="-200" class="pieTitleText">Work by stage</text><g class="legend" transform="translate(216,-44)"><rect width="18" height="18" style="fill: rgb(33, 87, 96); stroke: rgb(33, 87, 96);"/><text x="22" y="14">Research [48]</text></g><g class="legend" transform="translate(216,-22)"><rect width="18" height="18" style="fill: rgb(75, 60, 121); stroke: rgb(75, 60, 121);"/><text x="22" y="14">Drafting [28]</text></g><g class="legend" transform="translate(216,0)"><rect width="18" height="18" style="fill: rgb(33, 92, 76); stroke: rgb(33, 92, 76);"/><text x="22" y="14">Review [18]</text></g><g class="legend" transform="translate(216,22)"><rect width="18" height="18" style="fill: rgb(86, 61, 107); stroke: rgb(86, 61, 107);"/><text x="22" y="14">Release [6]</text></g></g></svg>
