<svg id="quadrantchart" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 640 560" style="max-width: 640px;" role="graphics-document document" aria-roledescription="quadrantChart"><rect class="merman-theme-canvas-base" data-merman-theme-canvas="base" aria-hidden="true" pointer-events="none" x="0" y="0" width="640" height="560" fill="#171F2D"/><style>#quadrantchart{font-family:"Segoe UI", Arial, "Liberation Sans", sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#quadrantchart .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#quadrantchart .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#quadrantchart .error-icon{fill:#552222;}#quadrantchart .error-text{fill:#552222;stroke:#552222;}#quadrantchart .edge-thickness-normal{stroke-width:1px;}#quadrantchart .edge-thickness-thick{stroke-width:3.5px;}#quadrantchart .edge-pattern-solid{stroke-dasharray:0;}#quadrantchart .edge-thickness-invisible{stroke-width:0;fill:none;}#quadrantchart .edge-pattern-dashed{stroke-dasharray:3;}#quadrantchart .edge-pattern-dotted{stroke-dasharray:2;}#quadrantchart .marker{fill:#333333;stroke:#333333;}#quadrantchart .marker.cross{stroke:#333333;}#quadrantchart svg{font-family:"Segoe UI", Arial, "Liberation Sans", sans-serif;font-size:16px;}#quadrantchart p{margin:0;}#quadrantchart .node .neo-node{stroke:#9370DB;}#quadrantchart [data-look="neo"].node rect,#quadrantchart [data-look="neo"].cluster rect,#quadrantchart [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#quadrantchart [data-look="neo"].swimlane.cluster rect{filter:none;}#quadrantchart [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#quadrantchart [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#quadrantchart [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#quadrantchart [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#quadrantchart [data-look="neo"].node circle .state-start{fill:#000000;}#quadrantchart [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#quadrantchart [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#quadrantchart :root{--mermaid-font-family:"Segoe UI", Arial, "Liberation Sans", sans-serif;}</style><g/><g class="main"><g class="quadrants"><g class="quadrant"><rect x="333" y="45" width="302" height="242" fill="#1C332F"/><text x="0" y="0" fill="#AFBED3" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(484, 50) rotate(0)">Plan next</text></g><g class="quadrant"><rect x="31" y="45" width="302" height="242" fill="#22324B"/><text x="0" y="0" fill="#AFBED3" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(182, 50) rotate(0)">Start here</text></g><g class="quadrant"><rect x="31" y="287" width="302" height="242" fill="#2E2940"/><text x="0" y="0" fill="#AFBED3" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(182, 292) rotate(0)">Small wins</text></g><g class="quadrant"><rect x="333" y="287" width="302" height="242" fill="#392F25"/><text x="0" y="0" fill="#AFBED3" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(484, 292) rotate(0)">Reconsider</text></g></g><g class="border"><line x1="30" y1="45" x2="636" y2="45" style="stroke: #A3B5CD; stroke-width: 2;"/><line x1="635" y1="46" x2="635" y2="528" style="stroke: #A3B5CD; stroke-width: 2;"/><line x1="30" y1="529" x2="636" y2="529" style="stroke: #A3B5CD; stroke-width: 2;"/><line x1="31" y1="46" x2="31" y2="528" style="stroke: #A3B5CD; stroke-width: 2;"/><line x1="333" y1="46" x2="333" y2="528" style="stroke: #A3B5CD; stroke-width: 1;"/><line x1="32" y1="287" x2="634" y2="287" style="stroke: #A3B5CD; stroke-width: 1;"/></g><g class="data-points"><g class="data-point"><circle cx="381.32" cy="432.2" r="5" fill="#77ABFF" stroke="hsl(169.5652173913, 29.1139240506%, NaN%)" stroke-width="0px"/><text x="0" y="0" fill="#EAF0F8" font-size="12" dominant-baseline="hanging" text-anchor="middle" transform="translate(381.32, 437.2) rotate(0)">Preferences</text></g><g class="data-point"><circle cx="169.92000000000002" cy="383.8" r="5" fill="#77ABFF" stroke="hsl(169.5652173913, 29.1139240506%, NaN%)" stroke-width="0px"/><text x="0" y="0" fill="#EAF0F8" font-size="12" dominant-baseline="hanging" text-anchor="middle" transform="translate(169.92000000000002, 388.8) rotate(0)">Notifications</text></g><g class="data-point"><circle cx="490.04" cy="325.72" r="5" fill="#77ABFF" stroke="hsl(169.5652173913, 29.1139240506%, NaN%)" stroke-width="0px"/><text x="0" y="0" fill="#EAF0F8" font-size="12" dominant-baseline="hanging" text-anchor="middle" transform="translate(490.04, 330.72) rotate(0)">Reports</text></g><g class="data-point"><circle cx="260.52" cy="243.44" r="5" fill="#77ABFF" stroke="hsl(169.5652173913, 29.1139240506%, NaN%)" stroke-width="0px"/><text x="0" y="0" fill="#EAF0F8" font-size="12" dominant-baseline="hanging" text-anchor="middle" transform="translate(260.52, 248.44) rotate(0)">Export</text></g><g class="data-point"><circle cx="435.68" cy="141.79999999999995" r="5" fill="#77ABFF" stroke="hsl(169.5652173913, 29.1139240506%, NaN%)" stroke-width="0px"/><text x="0" y="0" fill="#EAF0F8" font-size="12" dominant-baseline="hanging" text-anchor="middle" transform="translate(435.68, 146.79999999999995) rotate(0)">Onboarding</text></g><g class="data-point"><circle cx="163.88" cy="170.84000000000003" r="5" fill="#77ABFF" stroke="hsl(169.5652173913, 29.1139240506%, NaN%)" stroke-width="0px"/><text x="0" y="0" fill="#EAF0F8" font-size="12" dominant-baseline="hanging" text-anchor="middle" transform="translate(163.88, 175.84000000000003) rotate(0)">Search</text></g></g><g class="labels"><g class="label"><text x="0" y="0" fill="#AFBED3" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(182, 539) rotate(0)">Low effort</text></g><g class="label"><text x="0" y="0" fill="#AFBED3" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(484, 539) rotate(0)">High effort</text></g><g class="label"><text x="0" y="0" fill="#AFBED3" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(5, 408) rotate(-90)">Low impact</text></g><g class="label"><text x="0" y="0" fill="#AFBED3" font-size="16" dominant-baseline="hanging" text-anchor="middle" transform="translate(5, 166) rotate(-90)">High impact</text></g></g><g class="title"><text x="0" y="0" fill="#EAF0F8" font-size="20" dominant-baseline="hanging" text-anchor="middle" transform="translate(320, 10) rotate(0)">Improvement opportunities</text></g></g></svg>
