<svg id="atlas-pie" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 586.36 450" style="max-width: 586.36px;" role="graphics-document document" aria-roledescription="pie"><rect class="merman-theme-canvas-base" data-merman-theme-canvas="base" aria-hidden="true" pointer-events="none" x="0" y="0" width="586.36" height="450" fill="#F8FAFD"/><style>#atlas-pie{font-family:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#atlas-pie .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#atlas-pie .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#atlas-pie .error-icon{fill:#552222;}#atlas-pie .error-text{fill:#552222;stroke:#552222;}#atlas-pie .edge-thickness-normal{stroke-width:1px;}#atlas-pie .edge-thickness-thick{stroke-width:3.5px;}#atlas-pie .edge-pattern-solid{stroke-dasharray:0;}#atlas-pie .edge-thickness-invisible{stroke-width:0;fill:none;}#atlas-pie .edge-pattern-dashed{stroke-dasharray:3;}#atlas-pie .edge-pattern-dotted{stroke-dasharray:2;}#atlas-pie .marker{fill:#333333;stroke:#333333;}#atlas-pie .marker.cross{stroke:#333333;}#atlas-pie svg{font-family:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", sans-serif;font-size:16px;}#atlas-pie p{margin:0;}#atlas-pie .pieCircle{stroke:#70849A;stroke-width:2px;opacity:0.7;}#atlas-pie .pieCircle.highlighted{scale:1.05;opacity:1;}#atlas-pie .pieCircle.highlightedOnHover:hover{transition-duration:250ms;scale:1.05;opacity:1;}#atlas-pie .pieOuterCircle{stroke:#70849A;stroke-width:2px;fill:none;}#atlas-pie .pieTitleText{text-anchor:middle;font-size:21px;fill:#1F2A3D;font-family:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", sans-serif;font-weight:600;}#atlas-pie .slice{font-family:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", sans-serif;fill:#1F2A3D;font-size:15px;font-weight:600;}#atlas-pie .legend text{fill:#53667C;font-family:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", sans-serif;font-size:13px;}#atlas-pie .node .neo-node{stroke:#9370DB;}#atlas-pie [data-look="neo"].node rect,#atlas-pie [data-look="neo"].cluster rect,#atlas-pie [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#atlas-pie [data-look="neo"].swimlane.cluster rect{filter:none;}#atlas-pie [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#atlas-pie [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#atlas-pie [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#atlas-pie [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#atlas-pie [data-look="neo"].node circle .state-start{fill:#000000;}#atlas-pie [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#atlas-pie [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#atlas-pie :root{--mermaid-font-family:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", sans-serif;}</style><g/><g transform="translate(225,225)"><g><circle cx="0" cy="0" r="186" class="pieOuterCircle"/><path d="M0,-185A185,185,0,0,1,23.187,183.541L0,0Z" fill="#C9DCEF" class="pieCircle"/><path d="M23.187,183.541A185,185,0,0,1,-184.635,-11.616L0,0Z" fill="#CBE3DE" class="pieCircle"/><path d="M-184.635,-11.616A185,185,0,0,1,-68.103,-172.009L0,0Z" fill="#EADABA" class="pieCircle"/><path d="M-68.103,-172.009A185,185,0,0,1,0,-185L0,0Z" fill="#DDD2EB" class="pieCircle"/><text transform="translate(129.24446133146117,-8.131372279046102)" class="slice" style="text-anchor: middle;">48%</text><text transform="translate(-88.64885021776514,94.40143725107284)" class="slice" style="text-anchor: middle;">28%</text><text transform="translate(-104.76770077155571,-76.11819017187524)" class="slice" style="text-anchor: middle;">18%</text><text transform="translate(-24.265880238851462,-127.20619896936516)" class="slice" style="text-anchor: middle;">6%</text></g><text x="0" y="-200" class="pieTitleText">Work by stage</text><g class="legend" transform="translate(216,-44)"><rect width="18" height="18" style="fill: rgb(201, 220, 239); stroke: rgb(201, 220, 239);"/><text x="22" y="14">Research [48]</text></g><g class="legend" transform="translate(216,-22)"><rect width="18" height="18" style="fill: rgb(203, 227, 222); stroke: rgb(203, 227, 222);"/><text x="22" y="14">Drafting [28]</text></g><g class="legend" transform="translate(216,0)"><rect width="18" height="18" style="fill: rgb(234, 218, 186); stroke: rgb(234, 218, 186);"/><text x="22" y="14">Review [18]</text></g><g class="legend" transform="translate(216,22)"><rect width="18" height="18" style="fill: rgb(221, 210, 235); stroke: rgb(221, 210, 235);"/><text x="22" y="14">Release [6]</text></g></g></svg>
