<svg id="theme-riso-pie" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 592.08 450" style="max-width: 592.08px;" role="graphics-document document" aria-roledescription="pie"><rect class="merman-theme-canvas-base" data-merman-theme-canvas="base" aria-hidden="true" pointer-events="none" x="0" y="0" width="592.08" height="450" fill="#F6F0E4"/><style>#theme-riso-pie{font-family:"Avenir Next Condensed", "Arial Narrow", "Helvetica Neue", Arial, "Noto Sans CJK SC", sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#theme-riso-pie .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#theme-riso-pie .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#theme-riso-pie .error-icon{fill:#552222;}#theme-riso-pie .error-text{fill:#552222;stroke:#552222;}#theme-riso-pie .edge-thickness-normal{stroke-width:1px;}#theme-riso-pie .edge-thickness-thick{stroke-width:3.5px;}#theme-riso-pie .edge-pattern-solid{stroke-dasharray:0;}#theme-riso-pie .edge-thickness-invisible{stroke-width:0;fill:none;}#theme-riso-pie .edge-pattern-dashed{stroke-dasharray:3;}#theme-riso-pie .edge-pattern-dotted{stroke-dasharray:2;}#theme-riso-pie .marker{fill:#333333;stroke:#333333;}#theme-riso-pie .marker.cross{stroke:#333333;}#theme-riso-pie svg{font-family:"Avenir Next Condensed", "Arial Narrow", "Helvetica Neue", Arial, "Noto Sans CJK SC", sans-serif;font-size:16px;}#theme-riso-pie p{margin:0;}#theme-riso-pie .pieCircle{stroke:#233F78;stroke-width:2px;opacity:0.7;}#theme-riso-pie .pieCircle.highlighted{scale:1.05;opacity:1;}#theme-riso-pie .pieCircle.highlightedOnHover:hover{transition-duration:250ms;scale:1.05;opacity:1;}#theme-riso-pie .pieOuterCircle{stroke:#233F78;stroke-width:2px;fill:none;}#theme-riso-pie .pieTitleText{text-anchor:middle;font-size:23px;fill:#C64037;font-family:"Avenir Next Condensed", "Arial Narrow", "Helvetica Neue", Arial, "Noto Sans CJK SC", sans-serif;font-weight:700;}#theme-riso-pie .slice{font-family:"Avenir Next Condensed", "Arial Narrow", "Helvetica Neue", Arial, "Noto Sans CJK SC", sans-serif;fill:#233F78;font-size:16px;font-weight:600;}#theme-riso-pie .legend text{fill:#233F78;font-family:"Avenir Next Condensed", "Arial Narrow", "Helvetica Neue", Arial, "Noto Sans CJK SC", sans-serif;font-size:14px;}#theme-riso-pie .node .neo-node{stroke:#9370DB;}#theme-riso-pie [data-look="neo"].node rect,#theme-riso-pie [data-look="neo"].cluster rect,#theme-riso-pie [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#theme-riso-pie [data-look="neo"].swimlane.cluster rect{filter:none;}#theme-riso-pie [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#theme-riso-pie [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#theme-riso-pie [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#theme-riso-pie [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#theme-riso-pie [data-look="neo"].node circle .state-start{fill:#000000;}#theme-riso-pie [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#theme-riso-pie [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#theme-riso-pie :root{--mermaid-font-family:"Avenir Next Condensed", "Arial Narrow", "Helvetica Neue", Arial, "Noto Sans CJK SC", sans-serif;}</style><g/><g transform="translate(225,225)"><g><circle cx="0" cy="0" r="186" class="pieOuterCircle"/><path d="M0,-185A185,185,0,0,1,23.187,183.541L0,0Z" fill="#C8D4E8" class="pieCircle"/><path d="M23.187,183.541A185,185,0,0,1,-184.635,-11.616L0,0Z" fill="#EBBFB5" class="pieCircle"/><path d="M-184.635,-11.616A185,185,0,0,1,-68.103,-172.009L0,0Z" fill="#A5BBDC" class="pieCircle"/><path d="M-68.103,-172.009A185,185,0,0,1,0,-185L0,0Z" fill="#DEA49A" class="pieCircle"/><text transform="translate(129.24446133146117,-8.131372279046102)" class="slice" style="text-anchor: middle;">48%</text><text transform="translate(-88.64885021776514,94.40143725107284)" class="slice" style="text-anchor: middle;">28%</text><text transform="translate(-104.76770077155571,-76.11819017187524)" class="slice" style="text-anchor: middle;">18%</text><text transform="translate(-24.265880238851462,-127.20619896936516)" class="slice" style="text-anchor: middle;">6%</text></g><text x="0" y="-200" class="pieTitleText">Work by stage</text><g class="legend" transform="translate(216,-44)"><rect width="18" height="18" style="fill: rgb(200, 212, 232); stroke: rgb(200, 212, 232);"/><text x="22" y="14">Research [48]</text></g><g class="legend" transform="translate(216,-22)"><rect width="18" height="18" style="fill: rgb(235, 191, 181); stroke: rgb(235, 191, 181);"/><text x="22" y="14">Drafting [28]</text></g><g class="legend" transform="translate(216,0)"><rect width="18" height="18" style="fill: rgb(165, 187, 220); stroke: rgb(165, 187, 220);"/><text x="22" y="14">Review [18]</text></g><g class="legend" transform="translate(216,22)"><rect width="18" height="18" style="fill: rgb(222, 164, 154); stroke: rgb(222, 164, 154);"/><text x="22" y="14">Release [6]</text></g></g></svg>
