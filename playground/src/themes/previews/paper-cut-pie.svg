eme-paper-cut-pie .pieCircle.highlightedOnHover:hover{transition-duration:250ms;scale:1.05;opacity:1;}#theme-paper-cut-pie .pieOuterCircle{stroke:#FBF8F0;stroke-width:2px;fill:none;}#theme-paper-cut-pie .pieTitleText{text-anchor:middle;font-size:23px;fill:#243E4A;font-family:Avenir, "Segoe UI", Calibri, Arial, "Noto Sans CJK SC", sans-serif;font-weight:600;}#theme-paper-cut-pie .slice{font-family:Avenir, "Segoe UI", Calibri, Arial, "Noto Sans CJK SC", sans-serif;fill:#243E4A;font-size:16px;font-weight:600;}#theme-paper-cut-pie .legend text{fill:#536B6F;font-family:Avenir, "Segoe UI", Calibri, Arial, "Noto Sans CJK SC", sans-serif;font-size:14px;}#theme-paper-cut-pie .node .neo-node{stroke:#9370DB;}#theme-paper-cut-pie [data-look="neo"].node rect,#theme-paper-cut-pie [data-look="neo"].cluster rect,#theme-paper-cut-pie [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#theme-paper-cut-pie [data-look="neo"].swimlane.cluster rect{filter:none;}#theme-paper-cut-pie [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#theme-paper-cut-pie [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#theme-paper-cut-pie [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#theme-paper-cut-pie [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#theme-paper-cut-pie [data-look="neo"].node circle .state-start{fill:#000000;}#theme-paper-cut-pie [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#theme-paper-cut-pie [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#theme-paper-cut-pie :root{--mermaid-font-family:Avenir, "Segoe UI", Calibri, Arial, "Noto Sans CJK SC", sans-serif;}</style><g/><g transform="translate(225,225)"><g><circle cx="0" cy="0" r="186" class="pieOuterCircle"/><path d="M0,-185A185,185,0,0,1,23