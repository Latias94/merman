<svg id="merman" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 592.759765625 450" style="max-width: 592.76px;" role="graphics-document document" aria-roledescription="pie"><rect class="merman-theme-canvas-base" data-merman-theme-canvas="base" aria-hidden="true" pointer-events="none" x="0" y="0" width="592.759765625" height="450" fill="#F4F1E9"/><style>#merman{font-family:Georgia, "Liberation Serif", serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#merman .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#merman .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#merman .error-icon{fill:#552222;}#merman .error-text{fill:#552222;stroke:#552222;}#merman .edge-thickness-normal{stroke-width:1px;}#merman .edge-thickness-thick{stroke-width:3.5px;}#merman .edge-pattern-solid{stroke-dasharray:0;}#merman .edge-thickness-invisible{stroke-width:0;fill:none;}#merman .edge-pattern-dashed{stroke-dasharray:3;}#merman .edge-pattern-dotted{stroke-dasharray:2;}#merman .marker{fill:#333333;stroke:#333333;}#merman .marker.cross{stroke:#333333;}#merman svg{font-family:Georgia, "Liberation Serif", serif;font-size:16px;}#merman p{margin:0;}#merman .pieCircle{stroke:#2E5185;stroke-width:2px;opacity:0.7;}#merman .pieCircle.highlighted{scale:1.05;opacity:1;}#merman .pieCircle.highlightedOnHover:hover{transition-duration:250ms;scale:1.05;opacity:1;}#merman .pieOuterCircle{stroke:#2E5185;stroke-width:2px;fill:none;}#merman .pieTitleText{text-anchor:middle;font-size:22px;fill:#2E5185;font-family:Georgia, "Liberation Serif", serif;font-weight:400;}#merman .slice{font-family:Georgia, "Liberation Serif", serif;fill:#27374B;font-size:15px;font-weight:600;}#merman .legend text{fill:#27374B;font-family:Georgia, "Liberation Serif", serif;font-size:13px;}#merman .node .neo-node{stroke:#9370DB;}#merman [data-look="neo"].node rect,#merman [data-look="neo"].cluster rect,#merman [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#merman [data-look="neo"].swimlane.cluster rect{filter:none;}#merman [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#merman [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#merman [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#merman [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#merman [data-look="neo"].node circle .state-start{fill:#000000;}#merman [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#merman [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#merman :root{--mermaid-font-family:Georgia, "Liberation Serif", serif;}</style><g/><g transform="translate(225,225)"><g><circle cx="0" cy="0" r="186" class="pieOuterCircle"/><path d="M0,-185A185,185,0,0,1,23.187,183.541L0,0Z" fill="#D0DEEF" class="pieCircle"/><path d="M23.187,183.541A185,185,0,0,1,-184.635,-11.616L0,0Z" fill="#E9C7B6" class="pieCircle"/><path d="M-184.635,-11.616A185,185,0,0,1,-68.103,-172.009L0,0Z" fill="#C7DED5" class="pieCircle"/><path d="M-68.103,-172.009A185,185,0,0,1,0,-185L0,0Z" fill="#E8DDB9" class="pieCircle"/><text transform="translate(129.24446133146117,-8.131372279046102)" class="slice" style="text-anchor: middle;">48%</text><text transform="translate(-88.64885021776514,94.40143725107284)" class="slice" style="text-anchor: middle;">28%</text><text transform="translate(-104.76770077155571,-76.11819017187524)" class="slice" style="text-anchor: middle;">18%</text><text transform="translate(-24.265880238851462,-127.20619896936516)" class="slice" style="text-anchor: middle;