<svg id="grove-pie" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 586.36 450" style="max-width: 586.36px;" role="graphics-document document" aria-roledescription="pie"><rect class="merman-theme-canvas-base" data-merman-theme-canvas="base" aria-hidden="true" pointer-events="none" x="0" y="0" width="586.36" height="450" fill="#F5F4EA"/><style>#grove-pie{font-family:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#grove-pie .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#grove-pie .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#grove-pie .error-icon{fill:#552222;}#grove-pie .error-text{fill:#552222;stroke:#552222;}#grove-pie .edge-thickness-normal{stroke-width:1px;}#grove-pie .edge-thickness-thick{stroke-width:3.5px;}#grove-pie .edge-pattern-solid{stroke-dasharray:0;}#grove-pie .edge-thickness-invisible{stroke-width:0;fill:none;}#grove-pie .edge-pattern-dashed{stroke-dasharray:3;}#grove-pie .edge-pattern-dotted{stroke-dasharray:2;}#grove-pie .marker{fill:#333333;stroke:#333333;}#grove-pie .marker.cross{stroke:#333333;}#grove-pie svg{font-family:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", sans-serif;font-size:16px;}#grove-pie p{margin:0;}#grove-pie .pieCircle{stroke:#6C7C66;stroke-width:2px;opacity:0.7;}#grove-pie .pieCircle.highlighted{scale:1.05;opacity:1;}#grove-pie .pieCircle.highlightedOnHover:hover{transition-duration:250ms;scale:1.05;opacity:1;}#grove-pie .pieOuterCircle{stroke:#6C7C66;stroke-width:2px;fill:none;}#grove-pie .pieTitleText{text-anchor:middle;font-size:21px;fill:#46735C;font-family:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", sans-serif;font-weight:600;}#grove-pie .slice{font-family:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", sans-serif;fill:#26392F;font-size:15px;font-weight:600;}#grove-pie .legend text{fill:#5A6A5E;font-family:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", sans-serif;font-size:13px;}#grove-pie .node .neo-node{stroke:#9370DB;}#grove-pie [data-look="neo"].node rect,#grove-pie [data-look="neo"].cluster rect,#grove-pie [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#grove-pie [data-look="neo"].swimlane.cluster rect{filter:none;}#grove-pie [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#grove-pie [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#grove-pie [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#grove-pie [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#grove-pie [data-look="neo"].node circle .state-start{fill:#000000;}#grove-pie [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#grove-pie [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#grove-pie :root{--mermaid-font-family:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", sans-serif;}</style><g/><g transform="translate(225,225)"><g><circle cx="0" cy="0" r="186" class="pieOuterCircle"/><path d="M0,-185A185,185,0,0,1,23.187,183.541L0,0Z" fill="#D8E4CF" class="pieCircle"/><path d="M23.187,183.541A185,185,0,0,1,-184.635,-11.616L0,0Z" fill="#E9D9B9" class="pieCircle"/><path d="M-184.635,-11.616A185,185,0,0,1,-68.103,-172.009L0,0Z" fill="#D2E1DD" class="pieCircle"/><path d="M-68.103,-172.009A185,185,0,0,1,0,-185L0,0Z" fill="#E5C9B9" class="pieCircle"/><text transform="translate(129.24446133146117,-8.131