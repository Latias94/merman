idth:3.5px;}#ghibli-pie .edge-pattern-solid{stroke-dasharray:0;}#ghibli-pie .edge-thickness-invisible{stroke-width:0;fill:none;}#ghibli-pie .edge-pattern-dashed{stroke-dasharray:3;}#ghibli-pie .edge-pattern-dotted{stroke-dasharray:2;}#ghibli-pie .marker{fill:#333333;stroke:#333333;}#ghibli-pie .marker.cross{stroke:#333333;}#ghibli-pie svg{font-family:"Open Sans", "Noto Sans SC", sans-serif;font-size:16px;}#ghibli-pie p{margin:0;}#ghibli-pie .pieCircle{stroke:#314A3E;stroke-width:2px;opacity:0.7;}#ghibli-pie .pieCircle.highlighted{scale:1.05;opacity:1;}#ghibli-pie .pieCircle.highlightedOnHover:hover{transition-duration:250ms;scale:1.05;opacity:1;}#ghibli-pie .pieOuterCircle{stroke:#314A3E;stroke-width:2px;fill:none;}#ghibli-pie .pieTitleText{text-anchor:middle;font-size:25px;fill:#314A3E;font-family:"Open Sans", "Noto Sans SC", sans-serif;}#ghibli-pie .slice{font-family:"Open Sans", "Noto Sans SC", sans-serif;fill:#314A3E;font-size:17px;}#ghibli-pie .legend text{fill:#637261;font-family:"Open Sans", "Noto Sans SC", sans-serif;font-size:12px;}#ghibli-pie .node .neo-node{stroke:#9370DB;}#ghibli-pie [data-look="neo"].node rect,#ghibli-pie [data-look="neo"].cluster rect,#ghibli-pie [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#ghibli-pie [data-look="neo"].swimlane.cluster rect{filter:none;}#ghibli-pie [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#ghibli-pie [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#ghibli-pie [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#ghibli-pie [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#ghibli-pie [data-look="neo"].node circle .state-start{fill:#000000;}#ghibli-pie [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#ghibli-pie [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#ghibli-pie :root{--mermaid-font-family:"Open Sans", "Noto Sans SC", sans-serif;}</style><g/><g transform="translate(225,225)"><g><circle cx="0" cy="0" r="186" class="pieOuterCircle"/><path d="M0,-185A185,185,0,0,1,23.187,183.541L0,0Z" fill="#9bc5a1" class="pieCircle"/><path d="M23.187,183.541A185,185,0,0,1,-184.635,-11.616L0,0Z" fill="#efbc88" class="pieCircle"/><path d="M-184.635,-11.616A185,185,0,0,1,-68.103,-172.009L0,0Z" fill="#a9bfdf" class="pieCircle"/><path d="M-68.103,-172.009A185,185,0,0,1,0,-185L0,0Z" fill="#e2a5b1" class="pieCircle"/><text transform="translate(129.24446133146117,-8.131372279046102)" class="slice" style="text-anchor: middle;">48%</text><text transform="translate(-88.64885021776514,94.40143725107284)" class="slice" style="text-anchor: middle;">28%</text><text transform="translate(-104.76770077155571,-76.11819017187524)" class="slice" style="text-anchor: middle;">18%</text><text transform="translate(-24.265880238851462,-127.20619896936516)" class="slice" style="text-anchor: middle;">6%</text></g><text x="0" y="-200" class="pieTitleText">Work by stage</text><g class="legend" transform="translate(216,-44)"><rect width="18" height="18" style="fill: rgb(155, 197, 161); stroke: rgb(155, 197, 161);"/><text x="22" y="14">Research [48]</text></g><g class="legend" transform="translate(216,-22)"><rect width="18" height="18" style="fill: rgb(239, 188, 136); stroke: rgb(239, 188, 136);"/><text x="22" y="14">Drafting [28]</text></g><g class="legend" transform="translate(216,0)"><rect width="18" height="18" style="fill: rgb(169, 191, 223); stroke: rgb(169, 191, 223);"/><text x="22" y="14">Review [18]</text></g><g class="legend" transform="translate(216,22)"><rect width="18" height="18" style="fill: rgb(226, 165, 177); stroke: rgb(226, 165, 177);"/><text x="22" y="14">Release [6]</text></g></g></svg>
