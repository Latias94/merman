t:600;}#merman .slice{font-family:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", sans-serif;fill:#E7ECF4;font-size:15px;font-weight:600;}#merman .legend text{fill:#ADBACD;font-family:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", sans-serif;font-size:13px;}#merman .node .neo-node{stroke:#9370DB;}#merman [data-look="neo"].node rect,#merman [data-look="neo"].cluster rect,#merman [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#merman [data-look="neo"].swimlane.cluster rect{filter:none;}#merman [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#merman [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#merman [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#merman [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#merman [data-look="neo"].node circle .state-start{fill:#000000;}#merman [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#merman [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#merman :root{--mermaid-font-family:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", sans-serif;}</style><g/><g transform="translate(225,225)"><g><circle cx="0" cy="0" r="186" class="pieOuterCircle"/><path d="M0,-185A185,185,0,0,1,23.187,183.541L0,0Z" fill="#3D5B78" class="pieCircle"/><path d="M23.187,183.541A185,185,0,0,1,-184.635,-11.616L0,0Z" fill="#1F7054" class="pieCircle"/><path d="M-184.635,-11.616A185,185,0,0,1,-68.103,-172.009L0,0Z" fill="#826022" class="pieCircle"/><path d="M-68.103,-172.009A185,185,0,0,1,0,-185L0,0Z" fill="#62418B" class="pieCircle"/><text transform="translate(129.24446133146117,-8.131372279046102)" class="slice" style="text-anchor: middle;">48%</text><text transform="translate(