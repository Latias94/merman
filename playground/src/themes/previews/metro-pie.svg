<svg id="theme-metro-pie" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 597.8 450" style="max-width: 597.8px;" role="graphics-document document" aria-roledescription="pie"><rect class="merman-theme-canvas-base" data-merman-theme-canvas="base" aria-hidden="true" pointer-events="none" x="0" y="0" width="597.8" height="450" fill="#071B2C"/><style>#theme-metro-pie{font-family:"Avenir Next Condensed", "Arial Narrow", "Helvetica Neue", Arial, "Noto Sans CJK SC", sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#theme-metro-pie .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#theme-metro-pie .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#theme-metro-pie .error-icon{fill:#552222;}#theme-metro-pie .error-text{fill:#552222;stroke:#552222;}#theme-metro-pie .edge-thickness-normal{stroke-width:1px;}#theme-metro-pie .edge-thickness-thick{stroke-width:3.5px;}#theme-metro-pie .edge-pattern-solid{stroke-dasharray:0;}#theme-metro-pie .edge-thickness-invisible{stroke-width:0;fill:none;}#theme-metro-pie .edge-pattern-dashed{stroke-dasharray:3;}#theme-metro-pie .edge-pattern-dotted{stroke-dasharray:2;}#theme-metro-pie .marker{fill:#333333;stroke:#333333;}#theme-metro-pie .marker.cross{stroke:#333333;}#theme-metro-pie svg{font-family:"Avenir Next Condensed", "Arial Narrow", "Helvetica Neue", Arial, "Noto Sans CJK SC", sans-serif;font-size:16px;}#theme-metro-pie p{margin:0;}#theme-metro-pie .pieCircle{stroke:#071B2C;stroke-width:2px;opacity:0.7;}#theme-metro-pie .pieCircle.highlighted{scale:1.05;opacity:1;}#theme-metro-pie .pieCircle.highlightedOnHover:hover{transition-duration:250ms;scale:1.05;opacity:1;}#theme-metro-pie .pieOuterCircle{stroke:#071B2C;stroke-width:2px;fill:none;}#theme-metro-pie .pieTitleText{text-anchor:middle;font-size:24px;fill:#FFE347;font-family:"Avenir Next Condensed", "Arial Narrow", "Helvetica Neue", Arial, "Noto Sans CJK SC", sans-serif;font-weight:700;}#theme-metro-pie .slice{font-family:"Avenir Next Condensed", "Arial Narrow", "Helvetica Neue", Arial, "Noto Sans CJK SC", sans-serif;fill:#071B2C;font-size:17px;font-weight:700;}#theme-metro-pie .legend text{fill:#F4F3E9;font-family:"Avenir Next Condensed", "Arial Narrow", "Helvetica Neue", Arial, "Noto Sans CJK SC", sans-serif;font-size:15px;font-weight:600;}#theme-metro-pie .node .neo-node{stroke:#9370DB;}#theme-metro-pie [data-look="neo"].node rect,#theme-metro-pie [data-look="neo"].cluster rect,#theme-metro-pie [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#theme-metro-pie [data-look="neo"].swimlane.cluster rect{filter:none;}#theme-metro-pie [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#theme-metro-pie [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#theme-metro-pie [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#theme-metro-pie [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#theme-metro-pie [data-look="neo"].node circle .state-start{fill:#000000;}#theme-metro-pie [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#theme-metro-pie [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#theme-metro-pie :root{--mermaid-font-family:"Avenir Next Condensed", "Arial Narrow", "Helvetica Neue", Arial, "Noto Sans CJK SC", sans-serif;}</style><g/><g transform="translate(225,225)"><g><circle cx="0" cy="0" r="186" class="pieOuterCircle"/><path d="M0,-185A185,185,0,0,1,23.18664820939634,183.54121974317837L0,0Z" fill="#FFE347" class="pieCircle"/><path d="M23.18664820939634,183.54121974317837A185,185,0,0,1,-184.63494475923025,-11.616246112922875L0,0Z" fill="#63DCE5" class="pieCircle"/><path d="M-184.63494475923025,-11.616246112922875A185,185,0,0,1,-68.10304224666555,-172.00864988932645L0,0Z" fill="#F4F3E9" class="pieCircle"/><path d="M-68.10304224666555,-172.00864988932645A185,185,0,0,1,0,-185L0,0Z" fill="#FFAB64" class="pieCircle"/><text transform="translate(129.24446133146117,-8.131372279046102)" class="slice" style="text-anchor: middle;">48%</text><text transform="translate(-88.64885021776514,94.40143725107284)" class="slice" style="text-anchor: middle;">28%</text><text transform="translate(-104.76770077155571,-76.11819017187524)" class="slice" style="text-anchor: middle;">18%</text><text transform="translate(-24.265880238851462,-127.20619896936516)" class="slice" style="text-anchor: middle;">6%</text></g><text x="0" y="-200" class="pieTitleText">Work by stage</text><g class="legend" transform="translate(216,-44)"><rect width="18" height="18" style="fill: rgb(255, 227, 71); stroke: rgb(255, 227, 71);"/><text x="22" y="14">Research [48]</text></g><g class="legend" transform="translate(216,-22)"><rect width="18" height="18" style="fill: rgb(99, 220, 229); stroke: rgb(99, 220, 229);"/><text x="22" y="14">Drafting [28]</text></g><g class="legend" transform="translate(216,0)"><rect width="18" height="18" style="fill: rgb(244, 243, 233); stroke: rgb(244, 243, 233);"/><text x="22" y="14">Review [18]</text></g><g class="legend" transform="translate(216,22)"><rect width="18" height="18" style="fill: rgb(255, 171, 100); stroke: rgb(255, 171, 100);"/><text x="22" y="14">Release [6]</text></g></g></svg>
