[package]
name = "tree-sitter-mermaid"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license = "MIT"
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Tolerant Tree-sitter grammar and editor queries for Mermaid"
keywords = ["incremental", "mermaid", "parser", "tree-sitter"]
categories = ["parsing", "text-editors"]
publish = false
build = "bindings/rust/build.rs"
include = [
    "/binding.gyp",
    "/bindings/**",
    "/grammar.js",
    "/grammar/**",
    "/metadata/**",
    "/queries/**",
    "/src/**",
    "/test/**",
    "/tests/**",
    "/scripts/*.js",
    "/scripts/*.py",
    "/scripts/header-oracle/package.json",
    "/scripts/header-oracle/package-lock.json",
    "/wasm/**",
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/THIRD_PARTY_LICENSES/**",
    "/THIRD_PARTY_NOTICES.md",
    "/package.json",
    "/package-lock.json",
    "/tree-sitter.json",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "=0.1.7"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tree-sitter = "=0.26.12"

[package.metadata.tree-sitter-mermaid]
language-abi = 14
node-schema-version = 1
query-schema-version = 1
release-state = "dry-run-only"

[package.metadata.merman-legal]
third-party-bundle = true
